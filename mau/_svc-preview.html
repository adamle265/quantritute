<!doctype html><meta charset=utf-8><style>:root{
  /* đèn bật (sáng) */
  --bg:#ECE7DF; --card:#F8F5EF; --ink:#231E19; --ink-2:#6A6157; --line:#D9D1C4;
  --accent:#B06A22; --accent-soft:#F3E3CC; --ok:#3D7F58; --ok-soft:#DFEDE3; --risk:#B44A35; --risk-soft:#F5DFD9; --paid:#8A6A12; --paid-soft:#F2E9C9;
  --wall:#8F8A82; --photo-wall:#3A3631; --wall-text:#2A231B; --nav-ink:#2A231B; --nav-dim:#4E453B;
  --desk-top:#6E5038; --desk-edge:#3E2D20; --desk-leg:#2A1F16; --shadow-obj:rgba(40,25,10,.28);
  --lap-body:#C7CACD; --lap-dark:#8E9296; --screen:#1F252D; --screen-line:#7FA9E8;
  --book1:#8E3B2F; --book2:#2F4F6B; --book3:#C9A15A; --mug:#EDE8DE; --leaf:#4E7A55; --pot:#B49F84;
  --paper:#F4EFE5; --paper-line:#C2B8A7; --frame:#3B3632; --frame-in:#D7C7AC; --label:#2A231B;
  --glow-o:1; --lamp-strip:#FFE2A6;
  --f-wall:"Lexend","Be Vietnam Pro",system-ui,sans-serif; --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 0 rgba(35,30,25,.05),0 10px 24px -16px rgba(35,30,25,.45);
  color-scheme:light; --fade:4.5s; --ease:cubic-bezier(.45,0,.25,1);
}body{margin:0;background:var(--bg);font-family:sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.vd-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.vd-card{border:1px solid var(--line);border-radius:16px;background:var(--card);grid-column:span 2}.vd-card:nth-child(n+4){grid-column:span 3}/* Về Đốm: thẻ dịch vụ = hình minh họa + tên */
.vd-card{padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
.vd-sv{height:clamp(130px,15vw,170px);border-radius:12px;background:linear-gradient(160deg,var(--accent-soft),transparent 85%);display:grid;place-items:center;color:var(--accent);overflow:hidden}
.vd-sv svg{height:88%;width:auto;max-width:90%}
.vd-card:hover .vd-sv svg{height:88%;width:auto;max-width:90%}
.vd-card h3{margin:0;padding:0 6px;font-size:18px;line-height:1.4}
.svc-spin{transform-box:fill-box;transform-origin:center;animation:svc-spin 14s linear infinite}
.svc-tw{transform-box:fill-box;transform-origin:center;animation:svc-tw 2.4s ease-in-out infinite}
@keyframes svc-spin{to{transform:rotate(360deg)}}
@keyframes svc-tw{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@media(prefers-reduced-motion:reduce){.svc-spin,.svc-tw{animation:none}}
