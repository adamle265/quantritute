<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Khảo sát thị trường & đối thủ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4EFE5; --surface:#FBF8F2; --surface-2:#F7F2E8; --surface-3:#EFE7D8;
  --border:#E3DACB; --border-strong:#D3C7B4;
  --text:#231E19; --text-muted:#6B6259; --text-faint:#988D80;
  --accent:#2F7D4F; --accent-strong:#245F3D; --accent-soft:#E3F1E8; --accent-soft-strong:#CDE6D6;
  --paid:#9A5A16; --paid-soft:#F6E7D3; --info:#2F5F8F; --info-soft:#E2ECF5;
  --danger:#A63A2B; --danger-soft:#F8E3DE; --lamp:#E8B06A; --glow:rgba(232,176,106,.30);
  --g1:#2F7D4F; --g2:#B06A22; --g3:#A63A2B; --g4:#2F5F8F;
  --g1s:#E3F1E8; --g2s:#F6E7D3; --g3s:#F8E3DE; --g4s:#E2ECF5;
  --shadow-md:0 1px 2px rgba(35,30,25,.06),0 12px 30px -14px rgba(35,30,25,.28);
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --paid:#E8B06A; --paid-soft:#3A2C1C; --info:#8DB6E0; --info-soft:#1B2633; --danger:#E58B7C; --danger-soft:#3A1F1A; --glow:rgba(232,176,106,.18);
  --g1:#6CC08C; --g2:#E8B06A; --g3:#E58B7C; --g4:#8DB6E0;
  --g1s:#1C2E23; --g2s:#3A2C1C; --g3s:#3A1F1A; --g4s:#1B2633;
  --shadow-md:0 1px 2px rgba(0,0,0,.4),0 14px 32px -14px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --paid:#E8B06A; --paid-soft:#3A2C1C; --info:#8DB6E0; --info-soft:#1B2633; --danger:#E58B7C; --danger-soft:#3A1F1A; --glow:rgba(232,176,106,.18);
  --g1:#6CC08C; --g2:#E8B06A; --g3:#E58B7C; --g4:#8DB6E0;
  --g1s:#1C2E23; --g2s:#3A2C1C; --g3s:#3A1F1A; --g4s:#1B2633;
  --shadow-md:0 1px 2px rgba(0,0,0,.4),0 14px 32px -14px rgba(0,0,0,.75); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0}
.brand img{width:34px;height:34px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.brand span{color:var(--text-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.opt-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px dashed var(--border-strong);border-radius:999px;padding:3px 10px;color:var(--text-muted);white-space:nowrap}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.demo-bar{background:var(--paid-soft);color:var(--paid);border-bottom:1px solid var(--border)}
.demo-bar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px;font-size:14px}
.demo-bar button{margin-left:auto;border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 12px;font-size:13px}
.price{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.price.free{background:var(--accent-soft);color:var(--accent-strong)}
.price.paid{background:var(--paid-soft);color:var(--paid)}
.ico{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;flex:none}
.ico svg{width:21px;height:21px}
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:40;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-md);width:min(620px,100%);max-height:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;gap:12px;align-items:flex-start}
.dlg-head h2{font-size:20px;font-weight:600;line-height:1.25}
.dlg-head .mono{color:var(--text-faint);display:block;margin-bottom:4px}
.dlg-head .icon-btn{margin-left:auto}
.dlg p{margin:0;color:var(--text-muted)}
.tiers{display:flex;gap:8px;flex-wrap:wrap}
.tier{border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;background:var(--surface-2)}
.tier b{display:block;font-family:var(--f-display);font-size:14px}
.tier.free b{color:var(--accent-strong)} .tier.paid b{color:var(--paid)}
.feat{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.feat li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14px}
.feat li svg{width:16px;height:16px;color:var(--accent);margin-top:3px}
.building{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--r-sm);padding:12px}
.building img{width:64px;height:64px;flex:none}
.building p{font-size:14px;flex:1}
.building.ready{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.field small a{color:var(--accent-strong)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--text-muted);font-weight:500}
.field input,.field select{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--r-sm);padding:9px 11px;width:100%}
.field small{color:var(--text-faint);font-size:12px}
.field .err{color:var(--danger)}
.dlg-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.note{font-size:13px;color:var(--text-faint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;box-shadow:var(--shadow-md)}
@media (max-width:620px){.brand span,.opt-tag,.btn .lbl{display:none}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* Công cụ 3 – Khảo sát thị trường & đối thủ (bản 0.1, 04/11/2026). Nội dung: KHAO-SAT-THI-TRUONG.md */
:root{--t1:#E7F2EA;--t2:#F6ECDD;--t3:#E4EDF6;--t4:#F3E4E9;--t1b:#2F7D4F;--t2b:#9A5A16;--t3b:#2F5F8F;--t4b:#9B3D5A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t1:#18271E;--t2:#2C2318;--t3:#18222D;--t4:#2B1A20;--t1b:#6CC08C;--t2b:#E8B06A;--t3b:#8DB6E0;--t4b:#E39AB2}}
:root[data-theme="dark"]{--t1:#18271E;--t2:#2C2318;--t3:#18222D;--t4:#2B1A20;--t1b:#6CC08C;--t2b:#E8B06A;--t3b:#8DB6E0;--t4b:#E39AB2}
.crumb{padding-block:18px 0}
.crumb a{color:var(--text-muted);text-decoration:none;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.crumb svg{width:16px;height:16px}
.ttl{padding-block:8px 6px}
.ttl h1{font-size:clamp(24px,3vw,34px);font-weight:600;line-height:1.15}
.ttl p{margin:6px 0 0;color:var(--text-muted);max-width:72ch;text-align:justify}
.zone{padding-block:12px 110px}
.col{max-width:980px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;min-width:0}
.jt{text-align:justify;hyphens:none}
.guide{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.guide img{width:56px;height:56px}
.guide p{margin:0;font-size:14px;text-align:justify}
.guide .gacts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.guide .gacts .btn{padding:6px 12px;font-size:13px}
/* bố cục một trang */
.one{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:start}
.rail{position:sticky;top:calc(var(--hdr,60px) + 16px);display:flex;flex-direction:column;gap:6px}
.rail button{border:0;text-align:left;border-radius:12px;padding:10px 12px;font:600 13.5px var(--f-display);color:var(--text-muted);background:transparent;display:flex;flex-direction:column;gap:2px;border-left:4px solid transparent}
.rail button small{font:500 11.5px var(--f-ui);color:var(--text-faint)}
.rail button.on{color:var(--text)}
.rail .b1.on{background:var(--t1);border-left-color:var(--t1b)} .rail .b2.on{background:var(--t2);border-left-color:var(--t2b)} .rail .b3.on{background:var(--t3);border-left-color:var(--t3b)} .rail .b4.on{background:var(--t4);border-left-color:var(--t4b)}
.sec{border-radius:20px;padding:16px;margin-bottom:16px;scroll-margin-top:calc(var(--hdr,60px) + 12px)}
.sec>h2{font-size:20px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec>h2 .mono{color:var(--text-faint)}
.sec>h2 .opt{font:500 12px var(--f-ui);color:var(--text-muted);background:var(--surface);border-radius:999px;padding:2px 10px}
.sec>p{margin:4px 0 10px;color:var(--text-muted);font-size:13.5px;text-align:justify}
.bg1{background:var(--t1)} .bg2{background:var(--t2)} .bg3{background:var(--t3)} .bg4{background:var(--t4)}
/* thẻ câu hỏi */
.crit{background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:16px;margin-top:10px}
.crit.on{border-color:var(--accent)} .crit.vu{border-color:var(--text-faint);border-style:dashed}
.ch{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.ch .no{font:600 13px var(--f-mono);color:var(--text-faint);flex:none}
.ch h3{font-size:16px;font-weight:600;flex:1 1 180px;min-width:0}
.std{font-size:13.5px;color:var(--text-muted);margin-top:4px;text-align:justify}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opts.row .op{flex:1 1 150px}
.op{display:block;text-align:left;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.35;min-height:46px}
.op[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
.op.unk{border-style:dashed;color:var(--text-muted);font-size:13.5px;min-height:38px}
.op.unk[aria-pressed="true"]{background:var(--surface-3);border-color:var(--text-faint);color:var(--text)}
.op small{display:block;font-size:12.5px;color:var(--text-muted);font-weight:400;margin-top:2px}
.tip{font-size:13px;background:var(--surface-2);border-left:3px solid var(--info);border-radius:8px;padding:8px 10px;margin-top:10px;color:var(--text-muted);text-align:justify}
.tip b{color:var(--text)}
.unit{display:flex;align-items:center;border:1.5px solid var(--accent);border-radius:12px;background:#fff;overflow:hidden;width:240px;max-width:100%;margin-left:auto;flex:none}
:root[data-theme="dark"] .unit{background:var(--surface-3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .unit{background:var(--surface-3)}}
.unit input{border:0;background:transparent;color:var(--text);padding:10px 12px;width:100%;min-width:0;font-size:16px;font-variant-numeric:tabular-nums}
.unit span{padding:0 6px;color:var(--text-muted);font-size:13px;white-space:nowrap}
.unit input:focus{outline:none}
.unit:focus-within{box-shadow:0 0 0 3px var(--accent-soft)}
.unit.sm{width:170px}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--text-muted);display:grid;place-items:center;padding:0;flex:none}
.ib:hover{background:var(--surface-3);color:var(--text)}
.ib svg{width:16px;height:16px}
.ib.ok{background:var(--accent);color:var(--surface);margin:3px;opacity:.45}
.unit.dirty .ib.ok{opacity:1}
.tin{border:1.5px solid var(--border-strong);background:#fff;color:var(--text);border-radius:12px;padding:10px 12px;width:100%;font-size:16px}
:root[data-theme="dark"] .tin{background:var(--surface-3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tin{background:var(--surface-3)}}
.tin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.val{font:600 14px var(--f-display);color:var(--accent-strong);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* đối thủ */
.comp{background:var(--surface);border-radius:18px;padding:16px;margin-top:12px;border:1.5px solid var(--border)}
.comp.bad{opacity:.75;border-style:dashed}
.comp-h{display:flex;gap:10px;align-items:center}
.comp-h .idx{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--f-display);color:#fff;flex:none}
.comp-h .tin{flex:1;font:600 16px var(--f-display)}
.sub{font:600 13.5px var(--f-display);margin:14px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub .sp{flex:1}
.sub .hint{font:400 12.5px var(--f-ui);color:var(--text-faint)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row2 .lb{flex:1 1 180px;font-size:14px}
.addc{width:100%;margin-top:12px;border:1.5px dashed var(--border-strong);background:var(--surface);color:var(--accent-strong);border-radius:16px;padding:14px;font:600 15px var(--f-display);display:flex;gap:8px;justify-content:center;align-items:center}
.addc svg{width:18px;height:18px}
.mini{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);border-radius:999px;padding:5px 11px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.mini svg{width:14px;height:14px}
.mini.dng{color:var(--danger);border-color:var(--danger)}
.pick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.pk{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center;max-width:240px}
.pk i{width:10px;height:10px;border-radius:50%;flex:none}
.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk small{font:600 11px var(--f-mono);color:var(--text-faint)}
.pk[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.pk[aria-selected="true"] small{color:var(--bg);opacity:.75}
.grp{font:600 15px var(--f-display);margin:18px 0 2px;display:flex;gap:8px;align-items:center}
.grp .stars{font-size:14px}
.empty{background:var(--surface);border-radius:16px;padding:18px;text-align:center;color:var(--text-muted);font-size:14px}
.dv{border:1px dashed var(--border-strong);border-radius:12px;padding:10px;margin-top:10px}
.calc{margin-top:10px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.ctq{border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}
.ctq h4{font:600 14.5px var(--f-display);margin:0;flex:1 1 160px;min-width:0}
a.nbtn,a.mini{text-decoration:none}
/* giả định */
details.gd{background:var(--surface);border-radius:16px;padding:12px 16px;margin-top:12px}
details.gd summary{cursor:pointer;font:600 14px var(--f-display);color:var(--text-muted)}
.gdrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--border)}
.gdrow .lb{flex:1 1 220px;font-size:13.5px}
.gdrow .lb small{display:block;color:var(--text-faint);font-size:12px}
/* ghi chú */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px}
.nbtn svg{width:16px;height:16px}
.notes{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.nt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:2px 2px 2px 12px;font-size:13px}
.nt p{margin:0;overflow-wrap:anywhere;font-weight:600;font-style:italic;color:var(--accent-strong)}
.nin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border:1.5px solid var(--accent);border-radius:10px;background:var(--surface);padding:3px 3px 3px 10px}
.nin textarea{border:0;background:transparent;color:var(--text);font:15px var(--f-ui);padding:6px 0;min-width:0;width:100%;outline:none;resize:vertical;min-height:38px}
.nin .ib.ok{opacity:1}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .cnt{flex:1;font-size:13px;color:var(--text-muted)}
.dock .cnt b{color:var(--text);font-variant-numeric:tabular-nums}
.dock .btn{padding:10px 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* kết quả */
.rep h2{font-size:22px;font-weight:700}
.rep h3{font-size:17px;font-weight:600;margin:22px 0 8px}
.rhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rhead img{width:64px;height:64px}
.rhead .meta{flex:1;min-width:200px}
.rhead .meta p{margin:2px 0 0;font-size:13.5px;color:var(--text-muted)}
.ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.verdict{border-radius:16px;padding:14px 16px;margin-top:14px;border-left:5px solid var(--accent);background:var(--accent-soft);font-size:15px;text-align:justify}
.verdict.w{border-left-color:var(--paid);background:var(--paid-soft)}
.verdict.d{border-left-color:var(--danger);background:var(--danger-soft)}
.verdict b{font-family:var(--f-display)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--surface-2);min-width:0}
.kpi small{display:block;font-size:12.5px;color:var(--text-muted)}
.kpi b{display:block;font:600 24px/1.2 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi span{font-size:12px;color:var(--text-faint)}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}
.tblwrap{overflow-x:auto}
.ctbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.ctbl th,.ctbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.ctbl th{font:600 13px var(--f-display);color:var(--text-muted)}
.ctbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.ctbl tr.lead td{background:var(--accent-soft)}
.stars{letter-spacing:1px;white-space:nowrap;font-size:15px;background:linear-gradient(90deg,var(--lamp) var(--p),var(--border-strong) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.radar{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:center}
.radar svg{width:100%;height:auto}
.leg{display:flex;gap:8px;flex-direction:column;font-size:13px}
.leg span{display:inline-flex;gap:8px;align-items:center}
.leg i{width:16px;height:4px;border-radius:2px;display:inline-block;flex:none}
.olist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.olist li{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--surface);text-align:justify}
.olist li.w{border-left-color:var(--info)}
.olist li b{font-family:var(--f-display);font-weight:600}
.olist li p{margin:2px 0 0;font-size:13px;color:var(--text-muted)}
.flag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--border);border-left:4px solid var(--paid);border-radius:12px;padding:10px 12px;margin-top:6px;background:var(--surface)}
.flag p{margin:2px 0 0;font-size:13px;color:var(--text-muted)}
.note-s{font-size:12.5px;color:var(--text-faint);margin-top:10px;text-align:justify}
.qf .op{min-height:40px;font-size:13.5px;padding:8px 10px}
.dacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.dng{color:var(--danger);border-color:var(--danger)}
@media (max-width:760px){
  .one{grid-template-columns:76px minmax(0,1fr);gap:10px}
  .rail button{padding:8px 6px;font-size:11.5px;text-align:center;border-left-width:3px}
  .rail button small{display:none}
  .sec{padding:12px 10px}
  .radar{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .comp-h{flex-wrap:wrap}.comp-h .tin{flex:1 1 100%;order:3}.comp-h .mini{margin-left:auto}
  .unit{width:100%;margin-left:0}
  .unit.sm{width:calc(50% - 5px)}
}
@media (max-width:620px){.grid2{grid-template-columns:1fr}.kpi b{font-size:20px}.dock .cnt{font-size:12px}}
@media print{
  .top,.demo-bar,.dock,.crumb,.ractions,.noprint{display:none!important}
  body{background:#fff} .card{border:0;padding:0} .zone{padding:0}
}
</style>

function syncImgs(){ const dk = isDark(); document.querySelectorAll("img[data-light]").forEach(i => i.src = dk ? i.dataset.dark : i.dataset.light); }
try { const t = localStorage.getItem("qtt-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch(e) {}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { syncImgs(); redraw(); });

function redraw(){ const b = $("#demoBar"); if (b) b.hidden = !demo; if (window.renderPage) renderPage(); }
document.addEventListener("click", e => {
  const s = $("#scrim");
  if (!s.hidden && (e.target === s || e.target.closest("[data-close]"))) return closeDlg();
  const a = e.target.closest("[data-act]");
  if (a){ const k = a.dataset.act;
    if (k === "profile") openProfile(); else if (k === "demo") startDemo(); else if (k === "demooff") stopDemo();
    else if (k === "theme"){ const n = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("qtt-theme", n); } catch(e) {} syncImgs(); redraw(); }
    return; }
  const m = e.target.closest("[data-mod]"); if (m) return openModule(m.dataset.mod);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#scrim").hidden) closeDlg(); });

    const m = {}; MAT.forEach(mt => { const sc = mt.c.map(cr => c.tn[cr.id]).map((v,i) => v == null || v === "u" ? null : mt.c[i].o[v][1]).filter(v => v != null); m[mt.k] = sc.length ? sc.reduce((a,b)=>a+b,0)/sc.length : null; });
    const vs = Object.values(m).filter(v => v != null);
    return {c, m, tong: vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null, n: ALLC.filter(cr => c.tn[cr.id] != null && c.tn[cr.id] !== "u").length};
  });
  const daTN = exp.filter(e => e.n > 0);
  const yeu = [], manh = [];
  ALLC.forEach(cr => { const a = daTN.map(e => e.c.tn[cr.id]).filter(v => v != null && v !== "u"); if (a.length < 2) return; const ok = a.filter(v => v === 0).length; if (ok * 2 < a.length) yeu.push({cr, ok, n:a.length}); else if (ok === a.length) manh.push({cr, n:a.length}); });
  yeu.sort((a,b) => (a.ok/a.n) - (b.ok/b.n));
  return {matdo, danR, rkm, thieuDT, vt, dtT, mc, mucIdx, rate, rateTam, luuTru, dp, du, cau, capMax, capNow, occAvg, gLo, gHi, gTb, giaTri, gap, target, fit, goiy, diaBan, tt, live, exp, daTN, yeu, manh};
}

  if (st.kv.dlc === 1 && st.kv.kinp === "u") out.push({k:"kinp", nm:"Khu vực", ten:"Khách sạn, homestay thường", o:KINP});
  st.ds.forEach((c,i) => {

    if (c.loai == null) out.push({k:"loai", c, nm, ten:"Loại đối thủ", o:LOAI_DT.map(x => x[0])});
    if (c.loai === 3) return;

  });
  return out;
}

/* ===== Báo cáo kết quả ===== */
function radarSVG(list){
  const W = 300, cx = 150, cy = 150, R = 105, ax = MAT.map((m,i) => { const a = -Math.PI/2 + i * 2*Math.PI/MAT.length; return {m, x:Math.cos(a), y:Math.sin(a)}; });
  const ring = f => ax.map(a => `${cx + a.x*R*f},${cy + a.y*R*f}`).join(" ");
  let s = `<svg viewBox="-60 -10 ${W+120} ${W+20}" role="img" aria-label="Biểu đồ so sánh đối thủ theo 4 mặt">`;
  [.25,.5,.75,1].forEach(f => s += `<polygon points="${ring(f)}" fill="none" stroke="var(--border-strong)" stroke-width="1"/>`);
  ax.forEach(a => s += `<line x1="${cx}" y1="${cy}" x2="${cx+a.x*R}" y2="${cy+a.y*R}" stroke="var(--border)"/>`);
  list.forEach(e => { const i = S().ds.indexOf(e.c), col = COLORS[i % COLORS.length]; const pts = ax.map(a => { const v = (e.m[a.m.k] ?? 0)/10; return `${cx + a.x*R*v},${cy + a.y*R*v}`; }).join(" "); s += `<polygon points="${pts}" fill="${col}" fill-opacity=".10" stroke="${col}" stroke-width="2"/>`; });
  const lab = ["Giá","Phục vụ","Chuyên môn","Tầm nhìn chủ"];
  ax.forEach((a,i) => { const x = cx + a.x*(R+20), y = cy + a.y*(R+20) + 4; s += `<text x="${x}" y="${y}" text-anchor="${Math.abs(a.x)<.2?"middle":(a.x>0?"start":"end")}" font-size="12" fill="var(--text-muted)" font-family="var(--f-ui)">${lab[i]}</text>`; });
  return s + "</svg>";
}

function recs(st, r){
  const out = [];
  if (r.tt.length < 5) out.push(["Số đối thủ đã khảo sát", `Mới có ${r.tt.length} đối thủ trực tiếp. Nên khảo sát đủ 5–7 cơ sở cùng quy mô để kết quả đáng tin.`]);
  if (r.cau == null) out.push(["Chưa có số liệu dân số", "Chưa tính được quy mô thị trường và khoảng trống. Mở bản đồ hành chính ở mục 1.3, điền dân số và diện tích xã, phường nơi định mở."]);
  if (r.cau != null && r.mc.muc == null) out.push(["Mức chi tiêu của khu vực", "Chưa đủ 3 câu quan sát nên công cụ tạm tính theo mức Trung bình. Trả lời thêm ở mục 1.4 để kết quả sát hơn."]);
  if (r.cau != null && r.rateTam && r.mc.muc != null) out.push(["Tỷ lệ khách có khả năng chi trả", `Khu vực có mức chi tiêu ${MUC[r.mc.muc]}, nhưng tỷ lệ cho mức này chưa có số chính thức – đang tạm dùng tỷ lệ mức Trung bình. Có số liệu riêng thì sửa ở mục Điều chỉnh giả định.`]);
  if (r.thieuDT) out.push(["Dân số theo bán kính", `Các xã, phường đã nhập chưa phủ hết vòng tròn bán kính ${r.rkm} km – quy mô thị trường đang tính thấp hơn thực tế. Thêm xã, phường giáp ranh ở mục 1.3.`]);
  if (r.gap != null && r.gap <= 0) out.push(["Khoảng trống thị trường", "Theo số liệu, năng lực của đối thủ đã đủ phục vụ nhu cầu. Cân nhắc vị trí khác, hoặc chỉ mở khi có khác biệt rõ ràng (xem mục Cơ hội khác biệt)."]);
  if (r.goiy && real.hoso && real.hoso.quymo) { const f = r.fit.find(x => x.qm === real.hoso.quymo); if (f && f.pct < 100) out.push(["Quy mô trong hồ sơ cơ sở", `Hồ sơ đang chọn ${f.ten.toLowerCase()} (${f.qm}), khoảng trống chỉ lấp được khoảng ${fmtN(f.pct)}% công suất. Nên xem lại quy mô ở công cụ Chọn mô hình phù hợp.`]); }
  if (r.occAvg != null && r.occAvg >= 65 && r.cau != null && r.gap <= 0) out.push(["Đối thủ đông khách nhưng số liệu báo bão hòa", "Hai tín hiệu ngược nhau: có thể giả định về tần suất dùng dịch vụ đang thấp so với thực tế khu vực. Kiểm tra lại mục Điều chỉnh giả định."]);
  if (r.daTN.length < r.live.length) out.push(["Phiếu trải nghiệm", `Còn ${r.live.length - r.daTN.length} đối thủ chưa trải nghiệm. Trải nghiệm trực tiếp là cách duy nhất biết chất lượng thật của đối thủ.`]);
  if (r.gLo != null) out.push(["Định giá dịch vụ", `Tầm giá phổ biến khu vực ${fmtN(r.gLo)}–${fmtN(r.gHi)} nghìn đ cho dịch vụ chính. Đặt giá cao hơn phải có lý do khách nhìn thấy được (chuyên môn, không gian, cam kết không tip). Tính lãi từng dịch vụ ở công cụ Thiết kế menu – thẻ – combo.`]);
  if (st.ds.some(c => c.loai === 3)) out.push(["Cơ sở không lành mạnh trong khu vực", "Tránh mặt bằng sát cạnh các cơ sở này, ghi rõ định vị trị liệu, lành mạnh trên biển hiệu và kênh truyền thông để khách không nhầm lẫn."]);
  if (!out.length) out.push(["Bước tiếp theo", "Dùng kết quả này để chọn mô hình và lập dự toán vốn – dòng tiền – hòa vốn."]);
  return out;
}

function getObj(path){ const p = path.split("."), st = S(); if (p[0] === "kv") { if (p[1] === "dvs") return [st.kv.dvs[+p[2]], p[3]]; if (p[1] === "ct") return [st.kv.ct, p[2]]; return [st.kv, p[1]]; } if (p[0] === "gd") return [st.gd, p[1]]; if (p[0] === "ds") { const c = st.ds.find(x => x.id === p[1]); if (!c) return [null]; if (p[2] === "tn") return [c.tn, p[3]]; return [c, p[2]]; } return [null]; }
function setVal(path, v){ const [o,k] = getObj(path); if (!o) return; o[k] = v; if (/^kv\.dvs\.\d+\.(ds|dt)$/.test(path) && v) S().kv.danNA = false; keep(); }
const parseNum = s => { let t = String(s).trim(); t = /^\d+\.\d{1,2}$/.test(t) ? t : t.replace(/\./g, "").replace(",", "."); if (t === "") return null; const n = parseFloat(t); return isNaN(n) ? null : n; };
function commitNum(path){
  const el = document.querySelector(`[data-num="${path}"]`); if (!el) return;
  let v = parseNum(el.value);
  if (path.startsWith("gd.")) { const k = path.slice(3), def = GD.find(x => x.k === k).v; if (v == null || v === def) delete S().gd[k]; else S().gd[k] = v; keep(); gdOpen = true; keepScroll(render); toast("Đã cập nhật giả định"); return; }
  if (path.startsWith("gd.") === false && v != null && v < 0) v = null;
  setVal(path, v); keepScroll(render);
}

  const fl = t.closest("[data-flag]"); if (fl){ st.kv.danNA = !st.kv.danNA; if (st.kv.danNA) st.kv.dvs = [{ten:st.kv.dvs[0].ten, ds:null, dt:null}]; keep(); keepScroll(render); return; }
  if (t.closest("[data-adddv]")){ st.kv.dvs.push({ten:"", ds:null, dt:null}); keep(); keepScroll(render); return; }
  const ddv = t.closest("[data-deldv]"); if (ddv){ st.kv.dvs.splice(+ddv.dataset.deldv, 1); keep(); keepScroll(render); return; }
  const ok = t.closest("[data-numok]"); if (ok) return commitNum(ok.dataset.numok);
  const gr = t.closest("[data-gdreset]"); if (gr){ e.preventDefault(); delete st.gd[gr.dataset.gdreset]; gdOpen = true; keep(); keepScroll(render); return; }
  if (t.closest("[data-addc]")){ const c = newComp(); st.ds.push(c); keep(); keepScroll(render); const el = document.querySelector(`#cp-${c.id} .tin`); if (el){ el.scrollIntoView({block:"center"}); el.focus(); } return; }
  const dc = t.closest("[data-delc]"); if (dc){ const c = st.ds.find(x => x.id === dc.dataset.delc);
    openDlg(`<div class="dlg-head"><div><span class="mono">Xóa đối thủ</span><h2>Xóa “${esc(c.ten || "đối thủ này")}”?</h2></div>${closeBtn}</div><p>Toàn bộ thông tin, phiếu trải nghiệm và ghi chú của cơ sở này sẽ bị xóa.</p><div class="dacts"><button class="btn" type="button" data-close>Hủy</button><button class="btn dng" type="button" id="cfDel">Xóa</button></div>`);
    $("#cfDel").addEventListener("click", () => { st.ds = st.ds.filter(x => x !== c); Object.keys(st.notes).forEach(k => { if (k.includes(c.id)) delete st.notes[k]; }); keep(); closeDlg(); keepScroll(render); toast("Đã xóa đối thủ"); }); return; }
  const cu = t.closest("[data-cur]"); if (cu){ st.cur = cu.dataset.cur; keep(); keepScroll(render); if (cu.dataset.top){ document.getElementById("s3").scrollIntoView({behavior:"smooth"}); } return; }
  const go = t.closest("[data-go]"); if (go){ document.getElementById(go.dataset.go).scrollIntoView({behavior:"smooth"}); return; }
  const rs = t.closest("[data-res]"); if (rs){ if (rs.disabled) return; if (!calc(st).tt.length){ toast("Cần ít nhất 1 đối thủ trực tiếp"); return; } st.view = "ketqua"; render(); scrollTo(0,0); return; }
  if (t.closest("[data-edit]")){ st.view = "nhap"; render(); scrollTo(0,0); return; }
  if (t.closest("[data-print]")) return print();
  if (t.closest("[data-savehs]")){
    if (demo && DEMO3) return toast("Đang xem số liệu giả định – không lưu vào hồ sơ");
    const r = calc(st);
    real.hoso = {...(real.hoso||{}), thitruong:{ngay:fmtD(new Date()), khuvuc:tenKV(st.kv), tinh:st.kv.tinh==null?null:TINH[st.kv.tinh], mucChiTieu:r.mc.muc==null?null:MUC[r.mc.muc], quymoTT:r.cau==null?null:Math.round(r.cau), khoangtrong:r.gap==null?null:Math.round(Math.max(0,r.gap)), deXuat:r.target==null?null:Math.round(r.target), giaTu:r.gLo, giaDen:r.gHi, moHinh:r.goiy?r.goiy.qm:null, doiThu:r.tt.length}};
    save(); if (!real.steps.includes(1)) real.steps.push(1); save(); toast("Đã lưu kết quả vào hồ sơ cơ sở"); return; }
  const qf = t.closest("[data-qf]"); if (qf) return quickFill(pending(st)[+qf.dataset.qf]);
  const na = t.closest("[data-nadd]"); if (na){ noteEdit = {key:na.dataset.nadd, i:-1}; keepScroll(render); const ta = document.querySelector("[data-ntext]"); if (ta) ta.focus(); return; }
  const ned = t.closest("[data-nedit]"); if (ned){ noteEdit = {key:ned.dataset.nedit, i:+ned.dataset.i}; keepScroll(render); const ta = document.querySelector("[data-ntext]"); if (ta) ta.focus(); return; }
  const nd = t.closest("[data-ndel]"); if (nd){ st.notes[nd.dataset.ndel].splice(+nd.dataset.i, 1); if (!st.notes[nd.dataset.ndel].length) delete st.notes[nd.dataset.ndel]; noteEdit = null; keep(); keepScroll(render); toast("Đã xóa ghi chú"); return; }
  const ns = t.closest("[data-nsave]"); if (ns){ const key = ns.dataset.nsave, ta = document.querySelector("[data-ntext]"), v = ta ? ta.value.trim() : ""; const arr = st.notes[key] || (st.notes[key] = []); if (noteEdit.i === -1) { if (v) arr.push(v); } else if (v) arr[noteEdit.i] = v; else arr.splice(noteEdit.i, 1); if (!arr.length) delete st.notes[key]; noteEdit = null; keep(); keepScroll(render); return; }
});
document.addEventListener("input", e => {
  const n = e.target.closest("[data-num]"); if (n){ n.value = n.value.replace(/[^\d.,]/g, ""); n.closest(".unit").classList.add("dirty"); return; }
});
document.addEventListener("keydown", e => { const n = e.target.closest && e.target.closest("[data-num]"); if (n && e.key === "Enter"){ e.preventDefault(); commitNum(n.dataset.num); } });
/* Tên, chữ: lưu khi rời ô (không vẽ lại để cú bấm tiếp theo không bị mất) */
document.addEventListener("change", e => { const tx = e.target.closest("[data-text]"); if (tx){ setVal(tx.dataset.text, tx.value.trim()); return; } const sl = e.target.closest("[data-sel]"); if (sl){ setVal(sl.dataset.sel, sl.value === "" ? null : +sl.value); keepScroll(render); } });
/* Ô số: rời ô mà chưa bấm ✓ vẫn giữ số đã gõ */
document.addEventListener("focusout", e => { const n = e.target.closest && e.target.closest("[data-num]"); if (!n || !n.closest(".unit").classList.contains("dirty")) return; const v = parseNum(n.value), p = n.dataset.num;
  if (p.startsWith("gd.")) { const k = p.slice(3), def = GD.find(x => x.k === k).v; if (v == null || v === def) delete S().gd[k]; else S().gd[k] = v; keep(); } else setVal(p, v != null && v < 0 ? null : v); });
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-gd]")) gdOpen = e.target.open; }, true);
addEventListener("resize", setHdr);
syncImgs(); setHdr(); render();
</script>

</body>
