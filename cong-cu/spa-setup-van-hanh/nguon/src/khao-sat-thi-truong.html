const GD = [
  {k:"tuoi", ten:"Tỷ lệ dân số trong độ tuổi khách mục tiêu (35–55 tuổi)", v:26, u:"%", g:"Khách địa phương"},

function calc(st){
  const g = k => { const o = st.gd[k]; return o != null ? o : GD.find(x => x.k === k).v; };
  const kv = st.kv;
  const dsT = kv.dvs.reduce((a,d) => a + (d.ds||0), 0), dtT = kv.dvs.reduce((a,d) => a + (d.ds && d.dt ? d.dt : 0), 0);
  const matdo = dsT && dtT ? kv.dvs.filter(d => d.ds && d.dt).reduce((a,d) => a + d.ds, 0) / dtT : null;
  const rkm = BKKM[kv.bk == null ? 0 : kv.bk];
  const vt = Math.PI * rkm * rkm, dsCo = kv.dvs.filter(d => d.ds && d.dt).reduce((a,d) => a + d.ds, 0);
  /* Thận trọng: không suy rộng ra ngoài các xã, phường đã nhập */
  const danR = matdo ? Math.min(matdo * vt, dsCo) : null, thieuDT = !!matdo && dtT < vt;
  const mc = mucCT(kv), mucIdx = mc.muc == null ? 1 : mc.muc;
  let rate = g(MUCK[mucIdx]), rateTam = false; if (rate == null) { rate = g("ctTB"); rateTam = true; }
  const dp = danR ? danR * g("tuoi")/100 * rate/100 * g("tsuat") : null;
  const occK = kv.kinp == null || kv.kinp === "u" ? g("ou") : g("o" + kv.kinp);
  const luuTru = kv.dlc === 1 && kv.phong ? kv.phong * occK/100 * g("ngay") * g("kpp") / g("dem") : null;
  const du = kv.dlc === 0 ? 0 : (luuTru != null ? luuTru * g("dldv")/100 : null);
  const cau = dp == null ? null : dp + (du || 0);
  const live = st.ds.filter(c => c.loai !== 3);
  const tt = st.ds.filter(c => c.loai === 0);
  const occ = c => c.dong == null ? g("ou") : g("o" + c.dong);
  const capOf = c => ((c.gtl||0) + (c.ggoi||0)) * g("cs") * g("ngay");
  const capMax = tt.reduce((a,c) => a + capOf(c), 0);
  const capNow = tt.reduce((a,c) => a + capOf(c) * occ(c)/100, 0);
  const occAvg = capMax ? capNow / capMax * 100 : null;
  const prices = tt.filter(c => c.gmin || c.gmax).map(c => [c.gmin || c.gmax, c.gmax || c.gmin]);
  const med = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = Math.floor(s.length/2); return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };
  const gLo = med(prices.map(p => p[0])), gHi = med(prices.map(p => p[1]));
  const gTb = prices.length ? med(prices.map(p => (p[0]+p[1])/2)) : null;
  const giaTri = cau != null && gTb ? cau * gTb * 1000 : null;
  const gap = cau != null && tt.length ? cau - capMax : null;
  const target = gap != null ? Math.max(0, gap) * g("kt")/100 : null;
  const fit = target != null ? MOHINH.map(m => ({...m, thang:m.ngay*30, pct: target / (m.ngay*30) * 100})) : null;
  let goiy = null; if (fit) { const ok = fit.filter(f => f.pct >= 100); goiy = ok.length ? ok[ok.length-1] : null; }
  const kh = tt.filter(c => c.khach != null);
  const diaBan = kh.length ? kh.filter(c => c.khach === 0).length / kh.length * 100 : null;
  /* trải nghiệm */
  const exp = live.map(c => {
    const m = {}; MAT.forEach(mt => { const sc = mt.c.map(cr => c.tn[cr.id]).map((v,i) => v == null || v === "u" ? null : mt.c[i].o[v][1]).filter(v => v != null); m[mt.k] = sc.length ? sc.reduce((a,b)=>a+b,0)/sc.length : null; });
    const vs = Object.values(m).filter(v => v != null);
    return {c, m, tong: vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null, n: ALLC.filter(cr => c.tn[cr.id] != null && c.tn[cr.id] !== "u").length};
  });
  const daTN = exp.filter(e => e.n > 0);
  const yeu = [], manh = [];
  ALLC.forEach(cr => { const a = daTN.map(e => e.c.tn[cr.id]).filter(v => v != null && v !== "u"); if (a.length < 2) return; const ok = a.filter(v => v === 0).length; if (ok * 2 < a.length) yeu.push({cr, ok, n:a.length}); else if (ok === a.length) manh.push({cr, n:a.length}); });
  yeu.sort((a,b) => (a.ok/a.n) - (b.ok/b.n));
  return {matdo, danR, rkm, thieuDT, vt, dtT, mc, mucIdx, rate, rateTam, luuTru, dp, du, cau, capMax, capNow, occAvg, gLo, gHi, gTb, giaTri, gap, target, fit, goiy, diaBan, tt, live, exp, daTN, yeu, manh};
}

  const out = [];
  CT.forEach(c => { if (st.kv.ct[c.id] === "u") out.push({k:"ct", cr:c, nm:"Khu vực", ten:c.ten, o:c.o.map(x => x[0])}); });
  if (st.kv.dlc === "u") out.push({k:"dlc", nm:"Khu vực", ten:"Khách du lịch, khách lưu trú", o:DL.map(x => x[0])});
  if (st.kv.dlc === 1 && st.kv.kinp === "u") out.push({k:"kinp", nm:"Khu vực", ten:"Khách sạn, homestay thường", o:KINP});
  st.ds.forEach((c,i) => {
    const nm = c.ten || "Đối thủ " + (i+1);
    if (c.loai == null) out.push({k:"loai", c, nm, ten:"Loại đối thủ", o:LOAI_DT.map(x => x[0])});
    if (c.loai === 3) return;
    if (c.dong === "u") out.push({k:"dong", c, nm, ten:"Mức đông khách khi quan sát", o:DONG});
    if (c.khach === "u") out.push({k:"khach", c, nm, ten:"Nhóm khách chủ yếu", o:KHACH});
    ALLC.forEach(cr => { if (c.tn[cr.id] === "u") out.push({k:"tn", cr, c, nm, ten:cr.ten, o:cr.o.map(x => x[0])}); });
  });
  return out;
}

        <div class="row2" style="margin-top:6px"><span class="lb">Diện tích</span>${numBox("kv.dvs."+i+".dt", d.dt, "km²", true)}</div></div>`).join("")}

      ${r.danR ? `<div class="calc">${nb(`Mật độ khoảng ${fmtN(r.matdo)} người/km² → trong bán kính ${r.rkm} km có khoảng`)} <b>${fmtN(r.danR)} người</b>${r.thieuDT ? `<br><small>${nb(`Vòng tròn bán kính ${r.rkm} km rộng khoảng ${fmtN(r.vt)} km², các xã, phường đã nhập mới có ${fmtP(Math.round(r.dtT*10)/10)} km² – công cụ chỉ tính số dân đã nhập. Thêm xã, phường giáp ranh để tính đủ.`)}</small>` : ""}</div>` : ""}
      <div class="opts" style="margin-top:8px"><button type="button" class="op unk" data-flag="danNA" aria-pressed="${!!kv.danNA}">Chưa có số liệu – bỏ qua phần tính quy mô thị trường</button></div></div>

    ${groups.map(gp => `<div class="sub">${gp}</div>` + GD.filter(x => x.g === gp).map(x => `<div class="gdrow"><div class="lb">${nb(x.ten)}${x.v==null&&st.gd[x.k]==null?`<small style="color:var(--paid)">Chưa có số chính thức – đang tạm dùng tỷ lệ mức Trung bình</small>`:""}${st.gd[x.k]!=null?`<small>Mặc định: ${x.v==null?"chưa có":fmtP(x.v)+" "+x.u} · <button type="button" class="linkbtn" data-gdreset="${x.k}" style="border:0;background:none;padding:0;color:var(--accent-strong);text-decoration:underline;font-size:12px">dùng lại mặc định</button></small>`:""}</div>${numBox("gd."+x.k, GDV(x.k), x.u, true)}</div>`).join("")).join("")}
  </details>`;
}

function secTraiNghiem(st){
  const live = st.ds.filter(c => c.loai !== 3);
  if (!live.length) return `<section class="sec bg3" id="s3"><h2><span class="mono">03</span>Phiếu đi trải nghiệm như khách</h2><div class="empty">${nb("Thêm đối thủ ở hạng mục 2 trước, sau đó chấm từng cơ sở tại đây.")}</div></section>`;
  if (!live.find(c => c.id === st.cur)) st.cur = live[0].id;
  const c = live.find(x => x.id === st.cur), idx = st.ds.indexOf(c);
  const P = "ds." + c.id + ".tn.";
  const ex = calc(st).exp.find(e => e.c.id === c.id);
  return `<section class="sec bg3" id="s3"><h2><span class="mono">03</span>Phiếu đi trải nghiệm như khách</h2>
    <p>${nb("Đặt lịch và dùng thử dịch vụ phổ biến nhất với tư cách một khách hàng. Chấm ngay sau buổi trải nghiệm khi còn nhớ rõ.")}</p>

function radarSVG(list){
  const W = 300, cx = 150, cy = 150, R = 105, ax = MAT.map((m,i) => { const a = -Math.PI/2 + i * 2*Math.PI/MAT.length; return {m, x:Math.cos(a), y:Math.sin(a)}; });
  const ring = f => ax.map(a => `${cx + a.x*R*f},${cy + a.y*R*f}`).join(" ");
  let s = `<svg viewBox="-60 -10 ${W+120} ${W+20}" role="img" aria-label="Biểu đồ so sánh đối thủ theo 4 mặt">`;
  [.25,.5,.75,1].forEach(f => s += `<polygon points="${ring(f)}" fill="none" stroke="var(--border-strong)" stroke-width="1"/>`);
  ax.forEach(a => s += `<line x1="${cx}" y1="${cy}" x2="${cx+a.x*R}" y2="${cy+a.y*R}" stroke="var(--border)"/>`);
  list.forEach(e => { const i = S().ds.indexOf(e.c), col = COLORS[i % COLORS.length]; const pts = ax.map(a => { const v = (e.m[a.m.k] ?? 0)/10; return `${cx + a.x*R*v},${cy + a.y*R*v}`; }).join(" "); s += `<polygon points="${pts}" fill="${col}" fill-opacity=".10" stroke="${col}" stroke-width="2"/>`; });
  const lab = ["Giá","Phục vụ","Chuyên môn","Tầm nhìn chủ"];
  ax.forEach((a,i) => { const x = cx + a.x*(R+20), y = cy + a.y*(R+20) + 4; s += `<text x="${x}" y="${y}" text-anchor="${Math.abs(a.x)<.2?"middle":(a.x>0?"start":"end")}" font-size="12" fill="var(--text-muted)" font-family="var(--f-ui)">${lab[i]}</text>`; });
  return s + "</svg>";
}

function recs(st, r){
  const out = [];
  if (r.tt.length < 5) out.push(["Số đối thủ đã khảo sát", `Mới có ${r.tt.length} đối thủ trực tiếp. Nên khảo sát đủ 5–7 cơ sở cùng quy mô để kết quả đáng tin.`]);
  if (r.cau == null) out.push(["Chưa có số liệu dân số", "Chưa tính được quy mô thị trường và khoảng trống. Mở bản đồ hành chính ở mục 1.3, điền dân số và diện tích xã, phường nơi định mở."]);
  if (r.cau != null && r.mc.muc == null) out.push(["Mức chi tiêu của khu vực", "Chưa đủ 3 câu quan sát nên công cụ tạm tính theo mức Trung bình. Trả lời thêm ở mục 1.4 để kết quả sát hơn."]);
  if (r.cau != null && r.rateTam && r.mc.muc != null) out.push(["Tỷ lệ khách có khả năng chi trả", `Khu vực có mức chi tiêu ${MUC[r.mc.muc]}, nhưng tỷ lệ cho mức này chưa có số chính thức – đang tạm dùng tỷ lệ mức Trung bình. Có số liệu riêng thì sửa ở mục Điều chỉnh giả định.`]);
  if (r.thieuDT) out.push(["Dân số theo bán kính", `Các xã, phường đã nhập chưa phủ hết vòng tròn bán kính ${r.rkm} km – quy mô thị trường đang tính thấp hơn thực tế. Thêm xã, phường giáp ranh ở mục 1.3.`]);
  if (r.gap != null && r.gap <= 0) out.push(["Khoảng trống thị trường", "Theo số liệu, năng lực của đối thủ đã đủ phục vụ nhu cầu. Cân nhắc vị trí khác, hoặc chỉ mở khi có khác biệt rõ ràng (xem mục Cơ hội khác biệt)."]);
  if (r.goiy && real.hoso && real.hoso.quymo) { const f = r.fit.find(x => x.qm === real.hoso.quymo); if (f && f.pct < 100) out.push(["Quy mô trong hồ sơ cơ sở", `Hồ sơ đang chọn ${f.ten.toLowerCase()} (${f.qm}), khoảng trống chỉ lấp được khoảng ${fmtN(f.pct)}% công suất. Nên xem lại quy mô ở công cụ Chọn mô hình phù hợp.`]); }
  if (r.occAvg != null && r.occAvg >= 65 && r.cau != null && r.gap <= 0) out.push(["Đối thủ đông khách nhưng số liệu báo bão hòa", "Hai tín hiệu ngược nhau: có thể giả định về tần suất dùng dịch vụ đang thấp so với thực tế khu vực. Kiểm tra lại mục Điều chỉnh giả định."]);
  if (r.daTN.length < r.live.length) out.push(["Phiếu trải nghiệm", `Còn ${r.live.length - r.daTN.length} đối thủ chưa trải nghiệm. Trải nghiệm trực tiếp là cách duy nhất biết chất lượng thật của đối thủ.`]);
  if (r.gLo != null) out.push(["Định giá dịch vụ", `Tầm giá phổ biến khu vực ${fmtN(r.gLo)}–${fmtN(r.gHi)} nghìn đ cho dịch vụ chính. Đặt giá cao hơn phải có lý do khách nhìn thấy được (chuyên môn, không gian, cam kết không tip). Tính lãi từng dịch vụ ở công cụ Thiết kế menu – thẻ – combo.`]);
  if (st.ds.some(c => c.loai === 3)) out.push(["Cơ sở không lành mạnh trong khu vực", "Tránh mặt bằng sát cạnh các cơ sở này, ghi rõ định vị trị liệu, lành mạnh trên biển hiệu và kênh truyền thông để khách không nhầm lẫn."]);
  if (!out.length) out.push(["Bước tiếp theo", "Dùng kết quả này để chọn mô hình và lập dự toán vốn – dòng tiền – hòa vốn."]);
  return out;
}

/* ===== Số liệu giả định ===== */
function sample(){
  const st = blank(); st.kv = {tinh:0, bk:0, dvs:[{ten:"Phường mẫu A", ds:98000, dt:6.2},{ten:"Phường mẫu B", ds:76000, dt:7.5}], danNA:false, ct:{ttm:1, rap:0, fnb:0, nha:1, oto:1, csbt:0}, dlc:1, phong:300, kinp:1};
  const mk = (ten, loai, gtl, ggoi, gmin, gmax, dong, khach, kc, noibat, tn) => { const c = newComp(); Object.assign(c, {ten, loai, gtl, ggoi, gmin, gmax, dong, khach, kc, noibat}); const ids = ALLC.map(x => x.id); if (tn) tn.split("").forEach((v,i) => { if (v !== "-") c.tn[ids[i]] = v === "u" ? "u" : +v; }); return c; };
  st.ds = [
    mk("Cơ sở mẫu A", 0, 3, 1, 250, 400, 1, 0, 0, "Massage cổ vai gáy, gội đầu dưỡng sinh", "01101001101111010210"),
    mk("Cơ sở mẫu B", 0, 2, 1, 200, 300, 2, 0, 1, "Gội đầu dưỡng sinh, ngâm chân thảo dược", "1221211u211221212011"),
    mk("Cơ sở mẫu C", 0, 5, 2, 350, 650, 0, 1, 1, "Xông ngâm lá thuốc, massage đá nóng", "00010000001000000000"),
    mk("Cơ sở mẫu D", 1, 3, 0, 300, 800, 2, 0, 0, "Chăm sóc da mặt, triệt lông", ""),
    mk("Cơ sở mẫu E", 3, null, null, null, null, null, null, null, "", "")
  ];
  st.cur = st.ds[0].id;
  st.notes["c:"+st.ds[2].id] = ["Thứ 7 ghé 2 lần đều phải chờ khoảng 20 phút"];
  return st;
}
function startSample(){ DEMO3 = sample(); demo = {hoso:{...(real.hoso||{})}, steps:[...(real.steps||[])]}; window.scrollTo(0,0); redraw(); toast("Đang xem số liệu giả định"); }

/* ===== Ghi dữ liệu ===== */
function getObj(path){ const p = path.split("."), st = S(); if (p[0] === "kv") { if (p[1] === "dvs") return [st.kv.dvs[+p[2]], p[3]]; if (p[1] === "ct") return [st.kv.ct, p[2]]; return [st.kv, p[1]]; } if (p[0] === "gd") return [st.gd, p[1]]; if (p[0] === "ds") { const c = st.ds.find(x => x.id === p[1]); if (!c) return [null]; if (p[2] === "tn") return [c.tn, p[3]]; return [c, p[2]]; } return [null]; }
function setVal(path, v){ const [o,k] = getObj(path); if (!o) return; o[k] = v; if (/^kv\.dvs\.\d+\.(ds|dt)$/.test(path) && v) S().kv.danNA = false; keep(); }
const parseNum = s => { let t = String(s).trim(); t = /^\d+\.\d{1,2}$/.test(t) ? t : t.replace(/\./g, "").replace(",", "."); if (t === "") return null; const n = parseFloat(t); return isNaN(n) ? null : n; };
function commitNum(path){
  const el = document.querySelector(`[data-num="${path}"]`); if (!el) return;
  let v = parseNum(el.value);
  if (path.startsWith("gd.")) { const k = path.slice(3), def = GD.find(x => x.k === k).v; if (v == null || v === def) delete S().gd[k]; else S().gd[k] = v; keep(); gdOpen = true; keepScroll(render); toast("Đã cập nhật giả định"); return; }
  if (path.startsWith("gd.") === false && v != null && v < 0) v = null;
  setVal(path, v); keepScroll(render);
}

/* ===== Hiển thị ===== */
function render(){ vIntro(); if (S().view === "ketqua") renderResult(); else renderInput(); }
window.renderPage = render;
function setHdr(){ const h = document.querySelector(".top"); if (h) document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px"); }
function keepScroll(f){ const y = scrollY; f(); scrollTo(0, y); }
function spy(){ const secs = ["s1","s2","s3"].map(id => document.getElementById(id)).filter(Boolean); const rb = document.querySelectorAll(".rail [data-go]"); const f = () => { let on = 0; secs.forEach((s,i) => { if (s.getBoundingClientRect().top < innerHeight * .4) on = i; }); rb.forEach((b,i) => b.classList.toggle("on", i === on)); }; f(); removeEventListener("scroll", spy.f); spy.f = f; addEventListener("scroll", f, {passive:true}); }

function quickFill(p){
  openDlg(`<div class="dlg-head"><div><span class="mono">Bổ sung nhanh</span><h2>${esc(p.nm)} · ${nb(p.ten)}</h2></div>${closeBtn}</div>
    <div class="qf"><div class="opts">${p.o.map((o,i) => `<button type="button" class="op" data-qset="${i}">${nb(o)}</button>`).join("")}</div></div>
    <div class="dacts"><button class="btn" type="button" data-close>Để sau</button></div>`);
  $("#scrim").querySelectorAll("[data-qset]").forEach(b => b.addEventListener("click", () => { const v = +b.dataset.qset; if (p.k === "tn") p.c.tn[p.cr.id] = v; else if (p.k === "ct") S().kv.ct[p.cr.id] = v; else if (p.k === "dlc" || p.k === "kinp") S().kv[p.k] = v; else p.c[p.k] = v; keep(); closeDlg(); keepScroll(render); toast("Đã bổ sung"); }));
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#scrim")) return;
  const st = S();
  if (t.closest("[data-m3demo]")) return startSample();
  const sv = t.closest("[data-set]"); if (sv){ const raw = sv.dataset.v, v = raw === "u" ? "u" : +raw; const [o,k] = getObj(sv.dataset.set); if (o) { o[k] = o[k] === v ? null : v; keep(); keepScroll(render); } return; }
  const fl = t.closest("[data-flag]"); if (fl){ st.kv.danNA = !st.kv.danNA; if (st.kv.danNA) st.kv.dvs = [{ten:st.kv.dvs[0].ten, ds:null, dt:null}]; keep(); keepScroll(render); return; }
  if (t.closest("[data-adddv]")){ st.kv.dvs.push({ten:"", ds:null, dt:null}); keep(); keepScroll(render); return; }
  const ddv = t.closest("[data-deldv]"); if (ddv){ st.kv.dvs.splice(+ddv.dataset.deldv, 1); keep(); keepScroll(render); return; }
  const ok = t.closest("[data-numok]"); if (ok) return commitNum(ok.dataset.numok);
  const gr = t.closest("[data-gdreset]"); if (gr){ e.preventDefault(); delete st.gd[gr.dataset.gdreset]; gdOpen = true; keep(); keepScroll(render); return; }
  if (t.closest("[data-addc]")){ const c = newComp(); st.ds.push(c); keep(); keepScroll(render); const el = document.querySelector(`#cp-${c.id} .tin`); if (el){ el.scrollIntoView({block:"center"}); el.focus(); } return; }
  const dc = t.closest("[data-delc]"); if (dc){ const c = st.ds.find(x => x.id === dc.dataset.delc);
    openDlg(`<div class="dlg-head"><div><span class="mono">Xóa đối thủ</span><h2>Xóa “${esc(c.ten || "đối thủ này")}”?</h2></div>${closeBtn}</div><p>Toàn bộ thông tin, phiếu trải nghiệm và ghi chú của cơ sở này sẽ bị xóa.</p><div class="dacts"><button class="btn" type="button" data-close>Hủy</button><button class="btn dng" type="button" id="cfDel">Xóa</button></div>`);
    $("#cfDel").addEventListener("click", () => { st.ds = st.ds.filter(x => x !== c); Object.keys(st.notes).forEach(k => { if (k.includes(c.id)) delete st.notes[k]; }); keep(); closeDlg(); keepScroll(render); toast("Đã xóa đối thủ"); }); return; }
  const cu = t.closest("[data-cur]"); if (cu){ st.cur = cu.dataset.cur; keep(); keepScroll(render); if (cu.dataset.top){ document.getElementById("s3").scrollIntoView({behavior:"smooth"}); } return; }
  const go = t.closest("[data-go]"); if (go){ document.getElementById(go.dataset.go).scrollIntoView({behavior:"smooth"}); return; }
  const rs = t.closest("[data-res]"); if (rs){ if (rs.disabled) return; if (!calc(st).tt.length){ toast("Cần ít nhất 1 đối thủ trực tiếp"); return; } st.view = "ketqua"; render(); scrollTo(0,0); return; }
  if (t.closest("[data-edit]")){ st.view = "nhap"; render(); scrollTo(0,0); return; }
  if (t.closest("[data-print]")) return print();
  if (t.closest("[data-savehs]")){
    if (demo && DEMO3) return toast("Đang xem số liệu giả định – không lưu vào hồ sơ");
    const r = calc(st);
    real.hoso = {...(real.hoso||{}), thitruong:{ngay:fmtD(new Date()), khuvuc:tenKV(st.kv), tinh:st.kv.tinh==null?null:TINH[st.kv.tinh], mucChiTieu:r.mc.muc==null?null:MUC[r.mc.muc], quymoTT:r.cau==null?null:Math.round(r.cau), khoangtrong:r.gap==null?null:Math.round(Math.max(0,r.gap)), deXuat:r.target==null?null:Math.round(r.target), giaTu:r.gLo, giaDen:r.gHi, moHinh:r.goiy?r.goiy.qm:null, doiThu:r.tt.length}};
    save(); if (!real.steps.includes(1)) real.steps.push(1); save(); toast("Đã lưu kết quả vào hồ sơ cơ sở"); return; }
  const qf = t.closest("[data-qf]"); if (qf) return quickFill(pending(st)[+qf.dataset.qf]);
  const na = t.closest("[data-nadd]"); if (na){ noteEdit = {key:na.dataset.nadd, i:-1}; keepScroll(render); const ta = document.querySelector("[data-ntext]"); if (ta) ta.focus(); return; }
  const ned = t.closest("[data-nedit]"); if (ned){ noteEdit = {key:ned.dataset.nedit, i:+ned.dataset.i}; keepScroll(render); const ta = document.querySelector("[data-ntext]"); if (ta) ta.focus(); return; }
  const nd = t.closest("[data-ndel]"); if (nd){ st.notes[nd.dataset.ndel].splice(+nd.dataset.i, 1); if (!st.notes[nd.dataset.ndel].length) delete st.notes[nd.dataset.ndel]; noteEdit = null; keep(); keepScroll(render); toast("Đã xóa ghi chú"); return; }
  const ns = t.closest("[data-nsave]"); if (ns){ const key = ns.dataset.nsave, ta = document.querySelector("[data-ntext]"), v = ta ? ta.value.trim() : ""; const arr = st.notes[key] || (st.notes[key] = []); if (noteEdit.i === -1) { if (v) arr.push(v); } else if (v) arr[noteEdit.i] = v; else arr.splice(noteEdit.i, 1); if (!arr.length) delete st.notes[key]; noteEdit = null; keep(); keepScroll(render); return; }
});
document.addEventListener("input", e => {
  const n = e.target.closest("[data-num]"); if (n){ n.value = n.value.replace(/[^\d.,]/g, ""); n.closest(".unit").classList.add("dirty"); return; }
});
document.addEventListener("keydown", e => { const n = e.target.closest && e.target.closest("[data-num]"); if (n && e.key === "Enter"){ e.preventDefault(); commitNum(n.dataset.num); } });
/* Tên, chữ: lưu khi rời ô (không vẽ lại để cú bấm tiếp theo không bị mất) */
document.addEventListener("change", e => { const tx = e.target.closest("[data-text]"); if (tx){ setVal(tx.dataset.text, tx.value.trim()); return; } const sl = e.target.closest("[data-sel]"); if (sl){ setVal(sl.dataset.sel, sl.value === "" ? null : +sl.value); keepScroll(render); } });
/* Ô số: rời ô mà chưa bấm ✓ vẫn giữ số đã gõ */
document.addEventListener("focusout", e => { const n = e.target.closest && e.target.closest("[data-num]"); if (!n || !n.closest(".unit").classList.contains("dirty")) return; const v = parseNum(n.value), p = n.dataset.num;
  if (p.startsWith("gd.")) { const k = p.slice(3), def = GD.find(x => x.k === k).v; if (v == null || v === def) delete S().gd[k]; else S().gd[k] = v; keep(); } else setVal(p, v != null && v < 0 ? null : v); });
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-gd]")) gdOpen = e.target.open; }, true);
addEventListener("resize", setHdr);
syncImgs(); setHdr(); render();
</script>
