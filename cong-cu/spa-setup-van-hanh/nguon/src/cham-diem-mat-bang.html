  {id:"hoanthien",kn:"Nứt kết cấu, thấm dột nặng là rủi ro an toàn. Chỉ thuê khi chủ nhà sửa xong và có đánh giá của người có chuyên môn.",t:2,ten:"Hiện trạng trần, sàn, tường",w:3,loai:L3,o:[["Có trần (cao không quá 3,5 m), sàn gỗ hoặc gạch tốt, tường khô, dùng được ngay",10],["Chỉ cần sơn sửa nhẹ",7],["Phải làm lại trần hoặc sàn",4],["Thấm dột nặng, nứt kết cấu",0]],nego:"Đề nghị chủ nhà sửa trần, sàn, chống thấm trước khi bàn giao, hoặc trừ chi phí vào tiền thuê."},
  {id:"dien",kn:"Trung tâm lớn không có điện 3 pha thì không vận hành được. Không thuê nếu không kéo được điện 3 pha.",t:2,ten:"Điện",w:3,loai:LL,o:s=>s===0?[["Điện 1 pha, công tơ riêng, đủ công suất",10],["Phải nâng công suất hoặc lắp công tơ riêng, chủ nhà đồng ý",7],["Dây điện cũ, phải đi lại toàn bộ",4],["Không đủ công suất và không được nâng",0]]:[["Đã có điện 3 pha, công tơ riêng",10],["Chưa có nhưng kéo được 3 pha, chủ nhà đồng ý",7],["Chỉ có 1 pha; muốn kéo 3 pha phải chờ điện lực khảo sát, chưa chắc làm được",4],["Không kéo được điện 3 pha",0]],std:s=>s===0?"Đủ cho điều hòa, nồi xông, máy giặt sấy.":"Quy mô này cần điện 3 pha mới đạt chuẩn.",ask:"Có công tơ riêng chưa? Có cho nâng công suất, kéo điện 3 pha không?",nego:"Đề nghị chủ nhà nâng cấp đường điện, lắp công tơ riêng, hỗ trợ thủ tục kéo điện 3 pha."},
  {id:"nuoc",kn:"Thiếu nước hoặc không thoát được nước khu tắm thì không làm được dịch vụ trị liệu. Không nên thuê.",t:2,ten:"Nước, thoát nước",w:3,loai:L3,o:[["Nước máy đủ áp, đồng hồ riêng, thoát nước tốt",10],["Nước yếu, phải lắp bơm tăng áp hoặc bồn chứa",7],["Nước giếng phải lọc, hoặc thoát nước kém",4],["Không có nguồn nước ổn định, hoặc không làm được thoát nước cho khu tắm, ngâm chân",0]],nego:"Đề nghị chủ nhà đấu nối nước máy, lắp đồng hồ riêng, thông lại đường thoát nước."},

  /* Tab 4 – Hỏi chủ nhà (26%) */
  {id:"thue",t:3,ten:"Giá thuê",w:5,num:{k:"thue",u:"triệu/tháng",ph:"Giá thuê mỗi tháng"},o:s=>{const a=TRAN[s];return [[`Không quá ${a} triệu/tháng`,10],[`Trên ${a} đến ${n(a*1.2)} triệu (vượt đến 20%)`,7],[`Trên ${n(a*1.2)} đến ${n(a*1.5)} triệu (vượt 20–50%)`,4],[`Trên ${n(a*1.5)} triệu (vượt trên 50%)`,0]];},grade:(x,s)=>{const a=TRAN[s];return x<=a?0:x<=a*1.2?1:x<=a*1.5?2:3;},ask:"Giá đã gồm thuế, phí chưa? Bao lâu tăng giá một lần, tăng bao nhiêu?",nego:"Giá thuê cao hơn mức phù hợp: thương lượng giảm giá, giãn lộ trình tăng giá."},
  {id:"giayto",kn:"Rủi ro mất tiền cọc và chi phí cải tạo. Không đặt cọc, không ký khi chưa xem được giấy tờ hợp lệ.",t:3,ten:"Giấy tờ nhà, người cho thuê",w:5,loai:L3,o:[["Chủ sở hữu trực tiếp ký, có sổ đỏ hoặc sổ hồng; nhà đồng sở hữu thì các đồng sở hữu đều đồng ý",10],["Người cho thuê là người đi thuê lại, có văn bản chủ nhà gốc đồng ý cho thuê lại",7],["Giấy tờ đang chờ cấp, nhà thừa kế chưa chia, hoặc chỉ một đồng sở hữu ký",4],["Không xuất trình được giấy tờ, hoặc nhà đang tranh chấp",0]],ask:"Cho xem sổ đỏ, sổ hồng? Nhà có đồng sở hữu, đang thế chấp không? Nếu là thuê lại thì có văn bản đồng ý của chủ nhà gốc không?"},
  {id:"dkkd",kn:"Không đăng ký kinh doanh được hoặc không đạt PCCC thì không hoạt động hợp pháp. Không thuê.",t:3,ten:"Đăng ký kinh doanh và PCCC",w:5,loai:L3,o:[["Đăng ký kinh doanh được tại địa chỉ, chủ nhà đồng ý; đạt PCCC nếu thuộc diện quản lý",10],["Đăng ký được, nhưng phải cải tạo thêm mới đạt PCCC",7],["Cải tạo PCCC tốn kém, chủ nhà không hỗ trợ",4],["Không đăng ký kinh doanh được (căn hộ chung cư, mục đích sử dụng không cho phép, chủ nhà không đồng ý); hoặc thuộc diện PCCC mà không thể đạt",0]],
    tip:s=>`<b>Kiểm tra mục đích sử dụng ghi trên sổ.</b> Căn hộ chung cư không được dùng vào mục đích không phải để ở (điểm c khoản 8 Điều 3 Luật Nhà ở 2023), nên không đăng ký kinh doanh được; ki-ốt thuộc khối thương mại của tòa nhà thì xem giấy tờ của phần diện tích đó.<br><b>PCCC</b> (Phụ lục I, II Nghị định 105/2025/NĐ-CP; Nghị định 347/2026/NĐ-CP không đổi các phụ lục này): `+[
      "nhà ở kết hợp kinh doanh dưới 50 m² diện tích kinh doanh, hoặc mặt bằng dịch vụ dưới 100 m², không thuộc diện quản lý PCCC; từ các ngưỡng đó trở lên thì thuộc diện. Chủ hộ, người thuê nhà ở kết hợp kinh doanh tự kiểm tra PCCC thường xuyên; vẫn nên trang bị bình chữa cháy, giữ lối thoát.",
      "cơ sở dịch vụ từ 100 m² diện tích kinh doanh thuộc diện quản lý PCCC. Từ 300 m² sàn trở lên là cơ sở có nguy hiểm về cháy, nổ (nhóm 2).",
      "từ 300 m² sàn là cơ sở có nguy hiểm về cháy, nổ nhóm 2, được kiểm tra định kỳ 2 năm một lần. Spa đến 1.000 m² không thuộc danh mục phải thẩm định thiết kế PCCC khi cải tạo, trừ khi nằm trong tòa nhà thuộc diện."][s],
    ask:"Mục đích sử dụng đất trên sổ là gì, đã có ai đăng ký kinh doanh tại địa chỉ này chưa? Chủ nhà có hỗ trợ hồ sơ đăng ký kinh doanh, PCCC không?"},
  {id:"thoihan",t:3,ten:"Thời hạn hợp đồng, lộ trình tăng giá",w:3,o:[["Hạn từ 3 năm; giá cố định hoặc lộ trình tăng ghi rõ trong hợp đồng",10],["Hạn 2 đến dưới 3 năm, hoặc lộ trình tăng giá chưa rõ",7],["Ký từng năm một",4],["Dưới 1 năm, hoặc chủ nhà được lấy lại nhà bất kỳ lúc nào",0]],ask:"Hợp đồng ký được tối đa bao lâu? Lộ trình tăng giá ghi thế nào?",nego:"Đề nghị hợp đồng từ 3 năm để thu hồi chi phí cải tạo, ghi rõ lộ trình tăng giá."},
  {id:"caitao",t:3,ten:"Cải tạo, hoàn trả",w:2,o:[["Cho cải tạo trần, sàn, vách; hết hạn không bắt hoàn trả nguyên trạng",10],["Cho cải tạo, nhưng phải hoàn trả nguyên trạng",7],["Chỉ cho sửa nhẹ như sơn, rèm",4],["Không cho cải tạo",0]],ask:"Có cho cải tạo trần, sàn, vách ngăn không? Hết hạn có bắt hoàn trả nguyên trạng không?",nego:"Thống nhất giữ hiện trạng sau cải tạo khi hết hạn; nếu phải hoàn trả thì thời gian hoàn trả không tính tiền thuê."},
  {id:"quyhoach",kn:"Có thể bị giải tỏa trước khi thu hồi vốn. Không thuê, hoặc chỉ thuê ngắn hạn với chi phí cải tạo thấp.",t:3,ten:"Quy hoạch, mở rộng đường",w:2,loai:L3,o:[["Không nằm trong quy hoạch giải tỏa",10],["Có quy hoạch nhưng chưa có kế hoạch thực hiện trong thời hạn thuê",7],["Có kế hoạch giải tỏa hoặc mở rộng đường trong thời hạn thuê",0]],ask:"Khu này có quy hoạch mở đường, giải tỏa không?",tip:()=>"Hỏi thêm UBND phường, xã hoặc tra cứu trên cổng thông tin quy hoạch của địa phương; đừng chỉ nghe chủ nhà."},
  {id:"coc",t:3,ten:"Đặt cọc, miễn tiền thuê khi thi công",w:2,o:[["Cọc không quá 3 tháng và được miễn tiền thuê trong thời gian thi công",10],["Đạt một trong hai điều kiện trên",7],["Cọc trên 3 tháng và không được miễn",4]],ask:"Đặt cọc mấy tháng? Có miễn tiền thuê trong thời gian xin phép, thi công không?",nego:"Xin miễn tiền thuê trong thời gian xin phép và thi công; cọc không quá 3 tháng."},
  {id:"phi",t:3,ten:"Giá điện, nước, phí khác",w:2,o:[["Điện nước tính theo công tơ riêng, giá điện lực; các khoản phí khác rõ ràng",10],["Chủ nhà thu giá điện nước cố định, cao hơn giá điện lực nhưng ghi rõ",7],["Chưa thống nhất, nhiều khoản phát sinh",4]],ask:"Giá điện, nước tính thế nào? Có phí dịch vụ, vệ sinh, gửi xe nào khác không?",nego:"Đề nghị tính điện nước theo công tơ riêng, giá điện lực; liệt kê đủ các khoản phí trong hợp đồng."},

const RANKS = [[8,"Rất phù hợp","r4"],[6.5,"Phù hợp","r3"],[5,"Cân nhắc kỹ","r2"],[0,"Không nên thuê","r1"]];

const KEY2 = "qtt-spa-m2v2";
let D = {scale:null, sites:[], cur:0, bocuc:"one"};
try { const v = JSON.parse(localStorage.getItem(KEY2) || "null"); if (v && Array.isArray(v.sites)) D = Object.assign(D, v); } catch(e) {}

const keep = () => { if (sampleMode) return; try { localStorage.setItem(KEY2, JSON.stringify(D)); } catch(e) { toast("Bộ nhớ trình duyệt đầy, ảnh mới có thể không được lưu"); } };
const scaleFromProfile = () => { const i = SC.findIndex(s => s.ten === ((real && real.hoso) || {}).quymo); return i >= 0 ? i : null; };
const newSite = (ten, dc) => ({ten: ten || `Mặt bằng ${D.sites.length+1}`, dc:dc||"", mt:"", dt:"", thue:"", duong:"", marks:{}, notes:{}, photos:{}});
function fixSite(s){ ["marks","notes","photos"].forEach(k => s[k] = s[k] || {}); Object.keys(s.notes).forEach(k => { if (!Array.isArray(s.notes[k])) s.notes[k] = s.notes[k] ? [String(s.notes[k])] : []; }); return s; }
D.sites.forEach(fixSite);
const num = v => { const x = parseFloat(String(v ?? "").replace(/\s/g,"").replace(",", ".")); return x > 0 ? x : null; };
const optsOf = c => typeof c.o === "function" ? c.o(D.scale) : c.o;
const stdOf = c => c.std ? c.std(D.scale) : "";
const isLoai = c => !!(c.loai && c.loai[D.scale]);
/* mark: số = chỉ số lựa chọn, "u" = chưa xác định, không có = chưa chấm. Điểm, tỷ trọng chỉ dùng ngầm để tính kết quả tổng. */
function markOf(site, c){
  const m = site.marks[c.id];
  if (m === "u") return {u:true};
  if (m != null) return {i:m, auto:false};
  if (c.num){ const x = num(site[c.num.k]); if (x != null) return {i:c.grade(x, D.scale), auto:true}; }
  return null;
}
const ptsOf = (c, m) => m && m.i != null ? optsOf(c)[m.i][1] : null;
const f1 = x => (Math.round(x*10)/10).toFixed(1).replace(".", ",");
function evaluate(site){
  let sw = 0, ss = 0; const tabs = TABS.map(() => ({sw:0, ss:0, n:0, done:0}));
  const unk = [], open = [], kills = [], low = [], weak = [];
  CRIT.forEach(c => { const m = markOf(site, c), T = tabs[c.t]; T.n++;
    if (!m){ open.push(c); return; }
    if (m.u){ unk.push(c); return; }
    T.done++; const p = ptsOf(c, m); sw += c.w; ss += c.w*p; T.sw += c.w; T.ss += c.w*p;
    if (p === 0 && isLoai(c)) kills.push(c); else if (p === 0) weak.push(c); else if (p <= 4) low.push(c); });
  const score = sw ? ss/sw : null;
  let rank = null;
  if (score != null) rank = kills.length ? [0,"Không nên thuê","rx"] : RANKS.find(r => score >= r[0]);
  return {score, sw, tabs, unk, open, kills, weak, low, rank, done: CRIT.length - open.length - unk.length};
}
const tabScore = T => T.sw ? T.ss/T.sw : null;
const answered = (site, c) => { const m = markOf(site, c); return !!m && !m.u; };

function sampleBar(){ return sampleMode ? `<div class="guide" style="background:var(--paid-soft)"><img alt="" src="${domImg()}"><div><p><b>Đang xem số liệu giả định.</b> Không phải dữ liệu của anh/chị.</p><div class="gacts"><button class="btn" type="button" data-undo>Hoàn tác</button></div></div></div>` : ""; }

function numBox(site, c, attr){

}
function critCard(site, c, idx){
  const m = markOf(site, c), ph = site.photos[c.id] || [], notes = site.notes[c.id] || [];
  const cls = !m ? "" : m.u ? "vu" : "on", std = stdOf(c), tip = c.tip ? c.tip(D.scale) : "";

  return `<div class="crit ${cls}" id="cr-${c.id}">
    <div class="ch"><span class="no">${idx}</span><h3>${esc(c.ten)}</h3>${c.num?numBox(site, c, "data-q"):""}</div>
    ${std?`<div class="std">${esc(std)}</div>`:""}
    ${m&&m.auto?`<div><span class="tg auto">Đã tự chọn theo số anh/chị nhập</span></div>`:""}
    <div class="opts">${optsOf(c).map(([l],k) => `<button type="button" class="op" data-mark="${c.id}" data-v="${k}" aria-pressed="${!!m && m.i===k}">${esc(l)}</button>`).join("")}
      <button type="button" class="op unk" data-mark="${c.id}" data-v="u" aria-pressed="${!!(m&&m.u)}">Chưa xác định – bổ sung sau</button></div>
    ${tip?`<div class="tip">${tip}</div>`:""}
    <div class="tools"><label class="cam">${IC2.cam}Chụp ảnh<input type="file" accept="image/*" capture="environment" data-photo="${c.id}"></label>
      <button type="button" class="nbtn" data-nadd="${c.id}">${IC2.note}Ghi chú</button>
      <span class="photos">${ph.map((u,i) => `<span><img alt="Ảnh ${esc(c.ten)}" src="${u}"><button type="button" data-delph="${c.id}" data-i="${i}" aria-label="Xóa ảnh">×</button></span>`).join("")}</span></div>
    ${notes.length||ne?`<div class="notes">${notes.map((t,i) => ne && ne.i === i ? noteInput(c.id, t) : `<div class="nt"><p>${esc(t)}</p><button type="button" class="ib" data-nedit="${c.id}" data-i="${i}" aria-label="Sửa ghi chú">${IC2.edit}</button><button type="button" class="ib" data-ndel="${c.id}" data-i="${i}" aria-label="Xóa ghi chú">${IC2.del}</button></div>`).join("")}${ne && ne.i === -1 ? noteInput(c.id, "") : ""}</div>`:""}</div>`;
}
const noteInput = (id, v) => `<div class="nin"><input data-nin="${id}" maxlength="300" value="${esc(v)}" aria-label="Nội dung ghi chú"><button type="button" class="ib ok" data-nsave="${id}" aria-label="Lưu ghi chú">${IC2.ok}</button></div>`;
function dockHTML(site, prev, next, nextLabel){

  return `<div class="in">${prev!=null?`<button class="btn" type="button" data-stage="${prev}" ${prev<0?"disabled":""}>← Trước</button>`:""}<span class="cnt">Đã chấm <b>${e.done}/${CRIT.length}</b>${e.unk.length?` · ${e.unk.length} chưa xác định`:""}</span><button class="btn pri" type="button" data-stage="${next}">${nextLabel}</button></div>`;
}
const idxOf = c => { const same = CRIT.filter(x => x.t === c.t); return `${c.t+1}.${same.indexOf(c)+1}`; };

    <button type="button" role="tab" aria-selected="${stage===5}" class="sp-i ${stage===5?"cur":""}" data-stage="5"><b>Kết quả</b><small>Điểm tổng thể</small></button></div>`;
}
function stepFocus(){ const c = document.querySelector(".stepper .sp-i.cur"); if (c){ const p = c.parentElement; p.scrollLeft = c.offsetLeft - p.offsetLeft - 16; }

  if (!spyOn){ spyOn = true; addEventListener("scroll", () => { if (D.bocuc === "one" && typeof stage === "number" && stage < 5) spy(); }, {passive:true}); }

function spy(){
  const secs = [...document.querySelectorAll("[data-sec]")]; if (!secs.length) return;
  let on = 0; secs.forEach((s,i) => { if (s.getBoundingClientRect().top <= innerHeight*0.35) on = i; });
  document.querySelectorAll(".rail button").forEach((b,i) => b.classList.toggle("on", i === on));
}

function commitNum(site, k, fromDialog){
  const el = document.querySelector(`[${fromDialog?"data-qq":"data-q"}="${k}"]`); const v = el ? el.value.trim() : (draft[k] ?? "");
  site[k] = v; delete draft[k];
  const c = CRIT.find(x => x.num && x.num.k === k); if (c) delete site.marks[c.id];
  keep(); if (fromDialog){ render(); openQuick(quickSite); } else keepScroll(render);
  toast(num(v) != null ? "Đã chọn theo số anh/chị nhập" : "Đã xóa số đã nhập");
}
function bindCards(site){
  document.querySelectorAll("[data-q]").forEach(el => { el.addEventListener("input", () => { el.value = el.value.replace(/[^\d.,]/g,""); draft[el.dataset.q] = el.value; el.closest(".unit").classList.toggle("dirty", el.value !== (site[el.dataset.q] ?? "")); });
    el.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); commitNum(site, el.dataset.q); } }); });
  document.querySelectorAll("[data-nin]").forEach(el => { el.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); saveNote(site, el.dataset.nin); } if (ev.key === "Escape"){ noteEdit = null; keepScroll(render); } }); });
  document.querySelectorAll("[data-photo]").forEach(el => el.addEventListener("change", () => { const f = el.files && el.files[0]; if (!f) return; shrink(f, url => { const id = el.dataset.photo; site.photos[id] = (site.photos[id] || []).concat(url).slice(-3); keep(); keepScroll(render); toast("Đã lưu ảnh"); }); }));
  const ni = document.querySelector("[data-nin]"); if (ni){ ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); }
}
function saveNote(site, id){
  const el = document.querySelector(`[data-nin="${id}"]`); if (!el) return; const v = el.value.trim();
  const arr = site.notes[id] = site.notes[id] || [];
  if (noteEdit.i === -1){ if (v) arr.push(v); } else { if (v) arr[noteEdit.i] = v; else arr.splice(noteEdit.i, 1); }
  noteEdit = null; keep(); keepScroll(render); if (v) toast("Đã lưu ghi chú");
}
function shrink(file, cb){
  const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 480/Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); cb(cv.toDataURL("image/jpeg", .6)); }; img.onerror = () => toast("Không đọc được ảnh này"); img.src = fr.result; }; fr.readAsDataURL(file);
}

/* ===== Kết quả ===== */
function radarSVG(list){
  /* chỉ thể hiện hình dạng mạnh/yếu theo hạng mục, không ghi số */
  const cx = 190, cy = 170, R = 115, N = TABS.length, ang = i => -Math.PI/2 + i*2*Math.PI/N;
  const P = (i, r) => [cx + Math.cos(ang(i))*r, cy + Math.sin(ang(i))*r];
  let s = [2.5,5,7.5,10].map(v => `<polygon points="${TABS.map((_,i)=>P(i,R*v/10).join(",")).join(" ")}" fill="none" stroke="var(--border)" stroke-width="1"/>`).join("");
  s += TABS.map((_,i) => { const [x,y] = P(i,R), [lx,ly] = P(i,R+24); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text)">${TABSHORT[i]}</text>`; }).join("");
  list.forEach(([site,ci]) => { const e = evaluate(site); const pts = e.tabs.map((T,j) => P(j, R*(tabScore(T)||0)/10));
    s += `<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="${SCOL[ci]}" fill-opacity=".16" stroke="${SCOL[ci]}" stroke-width="2.5"/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${SCOL[ci]}"/>`).join(""); });
  return `<svg viewBox="0 0 380 340" role="img" aria-label="Hình dạng mạnh, yếu theo 5 hạng mục">${s}</svg>`;
}
function scoreBox(e){
  if (e.score == null) return `<div class="score"><div class="big">–</div><div><h3>Chưa chấm</h3><p>Chấm các tiêu chí ở 5 hạng mục để có kết quả.</p></div></div>`;
  const part = Math.round(e.sw), msg = e.kills.length ? `Vướng ${e.kills.length} tiêu chí loại, xem bảng khuyến nghị bên dưới.` : ({r4:"Mặt bằng đáp ứng rất tốt các tiêu chí.",r3:"Đáp ứng tốt; xem các điểm cần lưu ý bên dưới khi đàm phán.",r2:"Còn nhiều điểm yếu; chỉ thuê khi đàm phán được các điều kiện bên dưới.",r1:"Quá nhiều điểm yếu so với chuẩn."})[e.rank[2]];
  return `<div class="score ${e.rank[2]}"><div class="big">${f1(e.score)}<small>/10</small></div><div><h3>${e.rank[1]}</h3><p>${msg}</p>${part<100?`<p style="color:var(--text-muted)">Kết quả tạm tính, còn tiêu chí chưa có điểm.</p>`:""}</div></div>`;
}

      <div class="dacts"><button class="btn dng" type="button" data-idel style="margin-right:auto">Xóa mặt bằng</button><button class="btn" type="button" data-close>Hủy</button><button class="btn pri" type="button" data-isave>Lưu</button></div>`
    :`<dl class="dl"><dt>Tên gọi</dt><dd>${esc(site.ten)}</dd><dt>Địa chỉ</dt><dd>${site.dc?esc(site.dc):'<span style="color:var(--text-faint)">Chưa nhập</span>'}</dd><dt>Quy mô</dt><dd>${SC[D.scale].ten} · ${SC[D.scale].ngan}</dd>
        ${site.duong?`<dt>Đường trước mặt</dt><dd>${esc(site.duong)} m</dd>`:""}${site.mt?`<dt>Mặt tiền</dt><dd>${esc(site.mt)} m</dd>`:""}${site.dt?`<dt>Diện tích</dt><dd>${esc(site.dt)} m²</dd>`:""}${site.thue?`<dt>Giá thuê</dt><dd>${esc(site.thue)} triệu/tháng</dd>`:""}
        <dt>Đã chấm</dt><dd>${e.done}/${CRIT.length} tiêu chí${e.unk.length?` (${e.unk.length} chưa xác định)`:""}</dd></dl>
      <div class="dacts">${confirmDel?`<span style="flex:1;font-size:14px;color:var(--danger)">Xóa hẳn mặt bằng này và mọi lựa chọn, ảnh, ghi chú?</span><button class="btn" type="button" data-close>Không</button><button class="btn dng" type="button" data-idel2>Xóa</button>`
        :`<button class="btn pri" type="button" data-iedit>Sửa thông tin</button>`}</div>`}`);
  if (edit){ editScale = D.scale; const t = $("#e-ten"); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
}
let editScale = null, quickSite = null;
function openQuick(si){
  quickSite = si; const site = D.sites[si], e = evaluate(site), list = e.unk.concat(e.open);
  if (!list.length){ closeDlg(); toast("Đã đủ kết quả mọi tiêu chí"); return; }
  const qf = c => { const m = markOf(site, c); return `<div class="qf"><div class="ch"><h4 style="flex:1 1 160px">${idxOf(c)} ${esc(c.ten)}</h4>${c.num?numBox(site, c, "data-qq"):""}</div>
    <div class="opts">${optsOf(c).map(([l],k) => `<button type="button" class="op" data-qmark="${c.id}" data-v="${k}" aria-pressed="${!!m && m.i===k}">${esc(l)}</button>`).join("")}</div></div>`; };
  openDlg(`<div class="dlg-head"><div style="flex:1"><span class="mono" style="color:var(--text-faint)">Bổ sung nhanh · ${esc(site.ten)}</span><h2 style="font-size:20px;font-weight:600">Còn ${list.length} tiêu chí chưa có kết quả</h2></div>${closeBtn}</div>
    ${e.unk.length?`<div><span class="flabel" style="margin-top:0">Chưa xác định</span>${e.unk.map(qf).join("")}</div>`:""}
    ${e.open.length?`<div><span class="flabel">Chưa chấm</span>${e.open.map(qf).join("")}</div>`:""}
    <div class="dacts"><button class="btn pri" type="button" data-close>Xong</button></div>`);
  document.querySelectorAll("[data-qq]").forEach(el => { el.addEventListener("input", () => { el.value = el.value.replace(/[^\d.,]/g,""); draft[el.dataset.qq] = el.value; el.closest(".unit").classList.add("dirty"); });
    el.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); commitNum(site, el.dataset.qq, true); } }); });
}

/* ===== Số liệu giả định ===== */
function sampleData(){
  const mk = a => Object.fromEntries(CRIT.map((c,i) => [c.id, a[i]]).filter(([,v]) => v != null));
  return {scale:1, cur:0, bocuc:D.bocuc, sites:[
    fixSite({ten:"Nhà phố đường Hoa Sữa (mẫu)", dc:"", mt:"6", dt:"190", thue:"22", notes:{bien:["Chủ nhà đồng ý biển 6 m, chưa ghi vào hợp đồng"]}, photos:{},
      marks:mk([1,0,1,0,0,0,1,0,0,0, null,0,1,1, null,1,0,0,1,0,1, null,0,0,1,1,0,1,2, 1,1,0])}),
    fixSite({ten:"Tầng 1 tòa văn phòng (mẫu)", dc:"", mt:"4", dt:"150", thue:"28", notes:{}, photos:{},
      marks:mk([1,1,1,2,2,1,1,1,0,1, null,1,2,2, null,0,1,1,1,1,1, null,1,"u",1,2,"u",1,2, 1,2,1])})]};
}
function startSample(){ backup = JSON.parse(JSON.stringify(D)); sampleMode = true; D = sampleData(); stage = 5; render(); toast("Đang xem số liệu giả định"); }
function undoSample(){ D = backup; backup = null; sampleMode = false; stage = 0; render(); toast("Đã hoàn tác"); }

/* ===== Điều phối ===== */
let rendering = false;
function setHdr(){ const h = document.querySelector(".top"); if (h) document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px"); }
function render(){ if (rendering) return; rendering = true;
  try { const ae = document.activeElement; if (ae && ae.blur && ae !== document.body && !ae.closest(".dlg")) ae.blur();
    if (stage === "std") renderStd();
    else if (!D.sites.length || D.scale == null){ if (stage === "hd") renderHD(); else renderStart(); }
    else { if (!D.sites[D.cur]) D.cur = 0;
      if (stage === "hd") renderHD(); else if (stage === "cmp") renderCompare(); else if (stage === 5) renderReport(); else if (D.bocuc === "one") renderOne(); else renderTab(); stepFocus(); } } finally { rendering = false; } }
function renderPage(){ render(); }
function keepScroll(f){ const y = scrollY; f(); scrollTo(0, y); }
document.addEventListener("click", e => {
  const t = e.target;
  const sc = t.closest("[data-sc]"); if (sc){ startScale = +sc.dataset.sc; renderStart(); return; }
  if (t.closest("[data-undo]")){ undoSample(); return; }
  const vw = t.closest("[data-view]"); if (vw){ if (stage !== "std" && stage !== "hd") prevStage = stage; stage = vw.dataset.view; render(); scrollTo({top:0}); return; }
  if (t.closest("[data-back]")){ stage = prevStage; render(); scrollTo({top:0}); return; }
  if (t.closest("[data-copyhd]")){ navigator.clipboard.writeText(HD.map(([h,l]) => h.toUpperCase()+"\n"+l.map(x=>"- "+x).join("\n")).join("\n\n")).then(() => toast("Đã sao chép"), () => toast("Trình duyệt chặn sao chép")); return; }
  const ly = t.closest("[data-layout]"); if (ly){ D.bocuc = ly.dataset.layout; if (typeof stage !== "number" || stage > 4) stage = 0; keep(); render(); scrollTo({top:0}); return; }
  const go = t.closest("[data-go]"); if (go){ const s = $("#sec-"+go.dataset.go); if (s) s.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const sg = t.closest("[data-stage]"); if (sg && !sg.disabled){ const v = +sg.dataset.stage; stage = Math.max(0, Math.min(5, v)); if (stage < 5 && D.bocuc === "one") stage = 0; render(); scrollTo({top:0}); return; }
  if (t.closest("[data-pen]")){ const si = t.closest("[data-site]"); if (si) D.cur = +si.dataset.site; openInfo(true); return; }
  const si = t.closest("[data-site]"); if (si){ const i = +si.dataset.site; if (i === D.cur && typeof stage === "number"){ openInfo(false); return; } D.cur = i; if (typeof stage !== "number") stage = 5; noteEdit = null; keep(); render(); return; }
  if (t.closest("[data-cmp]")){ stage = "cmp"; render(); return; }
  if (t.closest("[data-addsite]")){ D.sites.push(newSite("","")); D.cur = D.sites.length-1; stage = 0; keep(); render(); scrollTo({top:0}); openInfo(true); return; }
  if (t.closest("[data-iedit]")){ openInfo(true); return; }
  if (t.closest("[data-idel]")){ openInfo(false, true); return; }
  if (t.closest("[data-idel2]")){ D.sites.splice(D.cur, 1); D.cur = Math.max(0, D.cur-1); if (D.sites.length < 2 && stage === "cmp") stage = 5; keep(); closeDlg(); render(); toast("Đã xóa mặt bằng"); return; }
  const es = t.closest("[data-esc]"); if (es){ editScale = +es.dataset.esc; document.querySelectorAll("[data-esc]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.esc === editScale))); return; }
  if (t.closest("[data-isave]")){ const site = D.sites[D.cur]; site.ten = $("#e-ten").value.trim() || site.ten; site.dc = $("#e-dc").value.trim(); if (editScale != null) D.scale = editScale; keep(); closeDlg(); render(); toast("Đã lưu thông tin"); return; }
  const qk = t.closest("[data-quick]"); if (qk){ openQuick(+qk.dataset.quick); return; }
  const nok = t.closest("[data-numok]"); if (nok){ const inDlg = !!nok.closest(".dlg"); commitNum(D.sites[inDlg ? quickSite : D.cur], nok.dataset.numok, inDlg); return; }
  const qm = t.closest("[data-qmark]"); if (qm){ const site = D.sites[quickSite], id = qm.dataset.qmark; site.marks[id] = +qm.dataset.v; keep(); render(); document.querySelectorAll(`[data-qmark="${id}"]`).forEach(b => b.setAttribute("aria-pressed", String(b === qm))); const card = qm.closest(".qf"); if (card) card.style.borderColor = "var(--accent)"; return; }
  if (t.closest("[data-copy]")){ copyReport(); return; }
  const site = D.sites[D.cur]; if (!site) return;
  if (t.closest("[data-pick]")){ if (demo) demo = null; real.hoso = {...(real.hoso||{}), matbang:site.ten, quymo:(real.hoso||{}).quymo || SC[D.scale].ten}; save(); toast(`Đã ghi "${site.ten}" vào hồ sơ cơ sở`); return; }
  const mk = t.closest("[data-mark]"); if (mk){ const id = mk.dataset.mark, v = mk.dataset.v === "u" ? "u" : +mk.dataset.v; const c = CRIT.find(x => x.id === id), cur = markOf(site, c);
    const same = v === "u" ? !!(cur && cur.u) : (cur && cur.i === v && !cur.auto); if (same) delete site.marks[id]; else site.marks[id] = v; keep(); keepScroll(render); return; }
  const dp = t.closest("[data-delph]"); if (dp){ site.photos[dp.dataset.delph].splice(+dp.dataset.i, 1); keep(); keepScroll(render); return; }
  const na = t.closest("[data-nadd]"); if (na){ noteEdit = {id:na.dataset.nadd, i:-1}; keepScroll(render); return; }
  const ned = t.closest("[data-nedit]"); if (ned){ noteEdit = {id:ned.dataset.nedit, i:+ned.dataset.i}; keepScroll(render); return; }
  const nd = t.closest("[data-ndel]"); if (nd){ site.notes[nd.dataset.ndel].splice(+nd.dataset.i, 1); noteEdit = null; keep(); keepScroll(render); toast("Đã xóa ghi chú"); return; }
  const ns = t.closest("[data-nsave]"); if (ns){ saveNote(site, ns.dataset.nsave); return; }
});
addEventListener("resize", setHdr);
syncImgs(); setHdr(); render();
</script>
