<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghép &amp; đối chiếu 2 file Excel</title>
<meta name="description" content="Ghép 2 file Excel theo cột khóa chung, đối chiếu số tiền từng dòng, tìm dòng thiếu, dòng lệch. Xử lý ngay trên trình duyệt, file không rời khỏi máy.">
<link rel="icon" href="{{DOM}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4EFE5; --surface:#FBF8F2; --surface-2:#F7F2E8; --surface-3:#EFE7D8;
  --border:#E3DACB; --border-strong:#D3C7B4;
  --text:#231E19; --text-muted:#6B6259; --text-faint:#988D80;
  --accent:#2F7D4F; --accent-2:#3E9A63; --accent-strong:#245F3D; --accent-soft:#E3F1E8; --accent-soft-strong:#CDE6D6;
  --info:#2F5F8F; --info-soft:#E2ECF5;
  --warn:#9A5A16; --warn-soft:#F6E7D3;
  --danger:#A63A2B; --danger-soft:#F8E3DE;
  --amb:#B06A22;
  --shadow-sm:0 1px 2px rgba(35,30,25,.06);
  --shadow-md:0 1px 2px rgba(35,30,25,.06),0 10px 28px -12px rgba(35,30,25,.22);
  --f-wall:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:14px; --radius-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-2:#58B07C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --info:#8DB6E0; --info-soft:#1B2633; --warn:#E8B06A; --warn-soft:#3A2C1C; --danger:#E58B7C; --danger-soft:#3A1F1A; --amb:#E8B06A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-2:#58B07C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --info:#8DB6E0; --info-soft:#1B2633; --warn:#E8B06A; --warn-soft:#3A2C1C; --danger:#E58B7C; --danger-soft:#3A1F1A; --amb:#E8B06A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.45}
h1,h2,h3,h4{font-family:var(--f-wall);margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
::selection{background:var(--accent-soft-strong)}
[hidden]{display:none!important}
.app{min-height:100vh;display:flex;flex-direction:column}

/* Thanh trên cùng */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px 18px}
.tb-row1 .topbar-inner{padding-top:8px;padding-bottom:8px;transition:padding .2s}
.tb-row2{border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.tb-row2 .topbar-inner{padding-top:5px;padding-bottom:5px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none}
.brand img{width:48px;height:48px;object-fit:contain;flex-shrink:0;transition:width .2s,height .2s;filter:drop-shadow(0 2px 3px rgba(35,30,25,.15))}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt b{font-family:var(--f-wall);font-weight:600;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);font-weight:400;letter-spacing:.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.tb-tools{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.tb-tools .btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--text)}
.tb-tools .btn-ghost:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.btn-ghost svg{flex-shrink:0}
body.scrolled .tb-row1 .topbar-inner{padding-top:5px;padding-bottom:5px}
body.scrolled .brand img{width:36px;height:36px}
body.scrolled .brand small{display:none}
.stepper{display:flex;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.step-item{display:flex;align-items:center;gap:8px;background:none;border:none;padding:6px 10px;border-radius:99px;color:var(--text-faint);font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.step-item .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:99px;background:var(--surface-2);border:1.5px solid var(--border-strong);font-size:11px;font-family:var(--font-mono);color:var(--text-muted);flex-shrink:0}
.step-item.active{color:var(--text);background:var(--accent-soft)}
.step-item.active .num{background:var(--accent);border-color:var(--accent);color:#fff}
.step-item.done{color:var(--accent-strong);cursor:pointer}
.step-item.done .num{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.step-item.done:hover{background:var(--accent-soft)}
.step-item.locked{cursor:not-allowed;opacity:.55}
.step-sep{width:14px;height:1.5px;background:var(--border-strong);flex-shrink:0;margin:0 2px}
.topnav{display:flex;gap:8px;margin-left:auto}

.container{max-width:1280px;width:100%;margin:0 auto;padding:24px 20px 40px;flex:1}
.step-panel{display:flex;flex-direction:column;gap:18px}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:21px}
.panel-head p{color:var(--text-muted);font-size:14px;margin-top:3px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:18px 20px}
.card h3{font-size:15px}
.grid-2{display:flex;flex-direction:column;gap:16px}

/* Ô tải file */
.fileslot{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.fileslot-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;font-family:var(--f-wall)}
.tag{font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.tag.b{background:var(--info-soft);color:var(--info)}
.dropzone{border:2px dashed var(--border-strong);border-radius:var(--radius-sm);padding:24px 16px;text-align:center;background:var(--surface-2);transition:.15s;cursor:pointer}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.dz-icon{width:34px;height:34px;margin:0 auto 6px;color:var(--accent)}
.dz-main{font-weight:600;font-size:14px}
.dz-sub{color:var(--text-muted);font-size:12.5px;margin-top:3px}
.file-loaded{display:flex;flex-direction:column;gap:10px}
.file-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.file-name{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;flex:1 1 280px;min-width:0}
.file-name b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:12px;color:var(--text-muted);font-family:var(--font-mono);white-space:nowrap}
.btn-tiny{font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);font-weight:600;white-space:nowrap}
.btn-tiny:hover{background:var(--surface-3);color:var(--text)}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px}
.field label{font-size:12px;font-weight:600;color:var(--text-muted)}
select,.input{padding:7px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13.5px;min-height:34px}
select:focus,.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--text-faint)}
.auto-note{font-size:12px;color:var(--accent-strong);background:var(--accent-soft);padding:5px 9px;border-radius:7px;display:inline-flex;gap:6px;align-items:center;width:fit-content}
.inline-check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);cursor:pointer}
.inline-check input{accent-color:var(--accent);width:15px;height:15px}
.removed-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:8px 10px;line-height:1.5}
.removed-note svg{flex:none;margin-top:2px}

.swap-row{display:flex;align-items:center;gap:12px;margin:-4px 0}
.swap-line{flex:1;height:1px;background:var(--border-strong)}
.swap-btn{border-radius:99px}
.pick-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.pick-off{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--danger)}
.pick-wrap{max-height:340px}
th.pick-c,td.pick-c{width:1%;text-align:center;padding-left:8px;padding-right:4px}
.pick-c input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
tr.pick-x td{color:var(--text-faint);text-decoration:line-through;background:var(--surface-2)}
tr.pick-x td.pick-c,tr.pick-x td.rn{text-decoration:none}
tr.pick-gap td{text-align:center;color:var(--text-muted);font-size:12.5px;background:var(--surface-2)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);max-height:250px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
thead th{position:sticky;top:0;background:var(--surface-3);color:var(--text);text-align:left;padding:7px 10px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--border-strong);z-index:1}
tbody td{padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums;max-width:420px;overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.num{text-align:right}
th.rn,td.rn{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;text-align:right;width:1%}
tr.st-0 td{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
tr.st-3 td{background:var(--warn-soft)}
tr.st-1 td{background:var(--danger-soft)}
tr.st-2 td{background:var(--info-soft)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.s0{background:var(--accent-soft-strong);color:var(--accent-strong)} .badge.s3{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)} .badge.s1{background:var(--danger-soft);color:var(--danger)} .badge.s2{background:var(--info-soft);color:var(--info)}

/* Nút */
.btn{border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:.15s;line-height:1.2;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .btn-primary{color:#10170f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#10170f}}
.btn-primary:hover{background:var(--accent-strong);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-primary:disabled{background:var(--border-strong);color:var(--text-faint);cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-3);border-color:var(--accent)}
.btn-secondary:disabled{opacity:.5;cursor:not-allowed}
.btn-lg{padding:12px 24px;font-size:15px;border-radius:12px}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}
.nav-row-right{display:flex;gap:10px;flex-wrap:wrap}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;min-width:300px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 11px;font-size:13.5px}
.menu button:hover{background:var(--surface-2)}
.menu button small{display:block;color:var(--text-muted);font-size:12px;margin-top:2px}

.banner{border-radius:var(--radius-sm);padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.banner svg{flex:none;margin-top:2px}
.banner-warn{background:var(--danger-soft);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.banner-info{background:var(--info-soft);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.banner-ok{background:var(--accent-soft);color:var(--accent-strong);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.banner b{font-weight:700}

/* Bước 2 */
.step2-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.step2-grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.keypair-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.keypair-row select{flex:1;min-width:140px}
.keypair-eq{font-family:var(--font-mono);font-weight:700;color:var(--text-faint)}
.keypair-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 6px}
.grp-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grp-sub{font-size:12.5px;color:var(--text-muted)}
.grp-sep{border-top:1px dashed var(--border-strong);margin:14px 0 12px}
.and-tag,.or-tag{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;min-width:44px;text-align:center}
.and-tag{background:var(--accent-soft);color:var(--accent-strong)}
.or-tag{background:var(--warn-soft);color:var(--warn)}
.rule-sum{margin-top:10px;font-size:12.8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;line-height:1.55}
.link-btn{background:none;border:none;color:var(--accent-strong);font-weight:600;font-size:13px;padding:4px 2px}
.link-btn:hover{text-decoration:underline}
.remove-x{color:var(--danger);font-weight:800;background:none;border:none;font-size:16px;padding:2px 6px;line-height:1}
.checkopt{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.checkopt input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.checkopt .lbl{font-size:13.5px;font-weight:600}
.checkopt .desc{font-size:12px;color:var(--danger);margin-top:2px}
.checkopt .note{font-size:12px;color:var(--text-muted);margin-top:2px}
.radiopt{display:flex;gap:9px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:13.5px}
.radiopt input{margin-top:3px;accent-color:var(--accent)}
.suggest-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.suggest-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;font-size:13px;flex-wrap:wrap}
.suggest-item b{font-weight:600;background:var(--surface-3);padding:1px 6px;border-radius:5px}
.suggest-pct{font-weight:700;color:var(--accent-strong);font-family:var(--font-mono)}
.health-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.health-grid{grid-template-columns:1fr}}
.health-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface-2)}
.health-card h4{font-size:13.5px;margin-bottom:8px}
.health-stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border)}
.health-stat:last-of-type{border-bottom:none}
.health-stat b{font-variant-numeric:tabular-nums}
.dup-example{font-size:11.5px;color:var(--text-muted);background:var(--surface);padding:3px 7px;border-radius:6px;margin-top:4px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Bước 3 */
.join-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.join-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.join-grid{grid-template-columns:minmax(0,1fr)}}
.join-card{position:relative;border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface);display:flex;align-items:center;gap:12px;text-align:left;transition:.15s}
.join-card:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.join-card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-md)}
.join-card.featured{grid-column:1/-1}
.join-card .venn{width:70px;height:auto;flex:none}
.jc-title{font-weight:600;font-size:13.8px;display:block}
.jc-example{font-size:12px;color:var(--text-muted);line-height:1.4;margin-top:2px}
.jc-ribbon{position:absolute;top:-9px;right:12px;background:var(--amb);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.venn-a{fill:var(--accent)} .venn-b{fill:var(--info)} .venn-erase{fill:var(--surface)}
.join-card.selected .venn-erase{fill:var(--accent-soft)}
.venn-outline{fill:none;stroke:var(--border-strong);stroke-width:2.2}
.colsel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.colsel-grid{grid-template-columns:1fr}}
.colsel-box{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.colsel-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-weight:600;font-size:13px;gap:8px}
.colsel-body{max-height:220px;overflow-y:auto;padding:6px 4px;columns:2;column-gap:4px}
@media (max-width:500px){.colsel-body{columns:1}}
.colsel-item{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:13px;border-radius:7px;break-inside:avoid;cursor:pointer}
.colsel-item:hover{background:var(--surface-2)}
.colsel-item input{accent-color:var(--accent);width:15px;height:15px}
.cmp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.comparepair-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--border)}
.comparepair-row:last-child{border-bottom:none}
.comparepair-row select{flex:1;min-width:130px}
.comparepair-row .tol{width:150px}
.adv-toggle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:none;border:0;border-top:1px dashed var(--border-strong);margin-top:10px;padding:12px 0 4px;width:100%;text-align:left;font-size:13.5px}
.adv-toggle .chev{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;background:var(--surface-3);font-size:11px}

<script>
(function(){
'use strict';
var VER = '{{VER}}';
var ICON_WARN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/></svg>';
var ICON_OK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
var ICON_TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
var ICON_SWAPFILE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M14 3v5h5"/><path d="M15 16h6m0 0-2.5-2.5M21 16l-2.5 2.5"/></svg>';
var ICON_INFO = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11v5"/></svg>';

/* ========================= TIỆN ÍCH ========================= */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '';
  var neg=n<0; n=Math.abs(n); var isInt=Math.abs(n-Math.round(n))<1e-9;
  var s=isInt?String(Math.round(n)):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
  var p=s.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'')+p[0]+(p[1]?','+p[1]:'');
}
function fmtPct(x){ return (Math.round(x*1000)/10).toString().replace('.',',')+'%'; }
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function p2(n){ return n<10?'0'+n:''+n; }

/* ========================= ENGINE (Web Worker) =========================
   Giao diện chỉ làm việc với dữ liệu qua các hàm engine.* (bất đồng bộ). */
var engine = (function(){
  var src = document.getElementById('engine-src').textContent;
  var listeners = [], worker = null, seq = 0, pending = {}, mainMode = false;
  function emit(ev){ listeners.forEach(function(f){ try{ f(ev); }catch(e){} }); }
  function sheetjsUrls(){
    var u = [];
    if(/^https?:/.test(location.protocol)) u.push(new URL('xlsx.full.min.js', location.href).href);
    u.push('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    return u;
  }
  function start(){
    try{
      var url = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
      worker = new Worker(url);
      worker.onmessage = function(e){
        var m = e.data, p = pending[m.id]; if(!p) return;
        if(m.progress){ emit(m.progress); return; }
        delete pending[m.id];
        if(m.ok) p.resolve(m.result); else p.reject(new Error(m.error));
      };
      worker.onerror = function(e){
        if(e && e.preventDefault) e.preventDefault();
        var msg = 'Trình duyệt không đủ bộ nhớ để xử lý tiếp (file quá lớn). Vui lòng đóng bớt tab, tải lại trang và thử lại; với file rất lớn hãy dùng bản chạy bằng Python.';
        Object.keys(pending).forEach(function(k){ pending[k].reject(new Error(msg)); delete pending[k]; });
        try{ worker.terminate(); }catch(_){}
        worker = null; start(); if(window.__gdcReset) window.__gdcReset();
      };
      worker.postMessage({id:0, fn:'init', args:[sheetjsUrls()]});
    }catch(err){
      // Không tạo được Worker (một số trình duyệt khi mở file trực tiếp): chạy ngay trên trang
      mainMode = true;
      (0,eval)(src);
      self.GDC.setSheetJS(sheetjsUrls());
    }
  }
  function call(fn, args){
    if(mainMode){
      return new Promise(function(resolve, reject){
        self.GDC.setProgress(function(msg,pct){ emit({message:msg, percent:pct}); });
        setTimeout(function(){
          var go = fn==='loadFile' ? args[1].arrayBuffer().then(function(b){ return self.GDC.loadFileBuffer(args[0], args[1].name, b); }) : Promise.resolve().then(function(){ return self.GDC[fn].apply(null, args); });
          go.then(resolve, function(e){ reject(new Error(e && e.friendly ? e.message : self.GDC_friendly(e))); });
        }, 30);
      });
    }
    return new Promise(function(resolve, reject){
      var id = ++seq; pending[id] = {resolve:resolve, reject:reject};
      worker.postMessage({id:id, fn:fn, args:args});
    });
  }
  start();
  return {
    onProgress: function(f){ listeners.push(f); },

function colBox(side){ return $('#step-'+ui.step+' .colsel-body[data-side="'+side+'"]'); }
function collectCols(side){
  var box=colBox(side); if(!box) return ui[side==='A'?'colsA':'colsB'];
  var all=$all('input[data-role="colsel"]',box), on=all.filter(function(b){return b.checked;});
  if(on.length===all.length) return 'ALL';
  return on.map(function(b){return b.dataset.col;});
}
function handleSuggestCmp(auto){
  if(!hasKeys()) return;
  runWithProgress('Đang dò các cột có cùng giá trị...', function(){ return engine.suggestComparePairs(keyCfg()); }).then(function(r){
    ui.cmpSuggested=true;
    if(!r.length){ if(!auto) toast('Chưa tìm được cặp cột nào có giá trị giống nhau. Bạn chọn tay nhé.','info'); return; }
    var old={}; ui.comparePairs.forEach(function(p){ if(p.aCol&&p.bCol) old[p.aCol+'|'+p.bCol]=p.tolerance; });
    ui.comparePairs=r.map(function(p){ return {aCol:p.aCol,bCol:p.bCol,tolerance:old[p.aCol+'|'+p.bCol]||'',matchRate:p.matchRate}; });
    renderStep3(); toast('Đã gợi ý '+r.length+' cặp cột so sánh. Kiểm tra lại trước khi chạy.','ok');
  }, function(){});
}
function handleRunMerge(){
  if(!ui.joinType){ toast('Vui lòng chọn kiểu ghép.','err'); return; }
  var pairs=validKeyPairs(); if(!hasKeys()){ toast('Vui lòng quay lại Bước 2 để chọn cột khóa.','err'); return; }
  if(ui.step===3||ui.step===4){ ui.colsA=collectCols('A'); ui.colsB=collectCols('B'); }
  var cfg={keyPairs:pairs, orPairs:validOrPairs(), clean:cleanOpts(), amountTol:tolOpts(), duplicateHandling:ui.duplicateHandling, joinType:ui.joinType, colsA:ui.colsA, colsB:ui.colsB,
    dateWarn: ui.joinType===7 ? {on:!!ui.dateWarn.on, days:parseInt(ui.dateWarn.days,10)||3} : null,
    sumWarn: ui.joinType===7 ? {on:!!ui.sumWarn.on} : null,
    comparePairs: ui.joinType===7 ? ui.comparePairs.filter(function(p){ return p.aCol&&p.bCol; }).map(function(p){ return {aCol:p.aCol,bCol:p.bCol,tolerance:p.tolerance}; }) : []};
  runWithProgress('Đang ghép dữ liệu...', function(){ return engine.runMerge(cfg); }).then(function(res){
    ui.result=res; ui.page=res.page; ui.statusFilter='ALL'; ui.search=''; ui.pageNo=1;
    gotoStep(4);
    toast('Đã ghép xong '+fmtNum(res.stats.totalRows)+' dòng trong '+(res.stats.elapsedMs/1000).toFixed(2).replace('.',',')+' giây.','ok');
  }, function(){});
}
function handleSwapAB(){
  if(ui.step===3||ui.step===4){ ui.colsA=collectCols('A'); ui.colsB=collectCols('B'); }
  runWithProgress('Đang đổi chỗ 2 file...', function(){ return engine.swapAB(); }).then(function(res){
    ui.fileInfo.A=res.A; ui.fileInfo.B=res.B;
    var T={1:2,2:1,3:3,4:4,5:6,6:5,7:7};
    ui.keyPairs=ui.keyPairs.map(function(p){ return {a:p.b,b:p.a}; });
    ui.orPairs=ui.orPairs.map(function(p){ return {a:p.b,b:p.a}; });
    ui.comparePairs=ui.comparePairs.map(function(p){ return {aCol:p.bCol,bCol:p.aCol,tolerance:p.tolerance,matchRate:p.matchRate}; });
    var t=ui.colsA; ui.colsA=ui.colsB; ui.colsB=t;
    if(ui.joinType) ui.joinType=T[ui.joinType];
    ui.checkResult=null; ui.sug={and:null,or:null}; ui.result=null; ui.cmpSuggested=false;
    if(ui.step===1) renderStep1(); else renderStep3();
    renderStepper();
    toast('Đã đổi chỗ File A và File B.','info');
  }, function(){});
}

  res.totals.forEach(function(t){ h+='<tr><td>'+escapeHtml(t.label)+'</td>'+n(t.sumA)+n(t.sumB)+'<td class="'+(t.diff<0?'neg':'')+'"><b>'+fmtNum(Math.round(t.diff*100)/100)+'</b></td>'+n(t.diffMatched)+n(t.onlyA)+n(t.onlyB)+'<td>'+fmtNum(t.mismatch)+'</td></tr>'; });

function renderResultTable(){
  var res=ui.result, pg=ui.page; if(!res||!pg) return;
  var showChips = res.statusIncluded || [1,2,4].indexOf(res.joinType)>=0;
  var chips='';

    var list=['ALL'].concat(res.statusIncluded&&res.stats.hasCompare?STATUS:STATUS.filter(function(x){ return x!=='Lệch giá trị'; }));
    if(res.dateWarn&&!res.dateWarn.error) list.splice(list.indexOf('Chỉ có ở A'),0,'Lệch ngày');
    if(res.sumWarn&&!res.sumWarn.error) list.splice(list.indexOf('Chỉ có ở A'),0,'Khớp tổng');
    chips=list.filter(function(x){ return x==='ALL'||pg.counts[x]>0||x===ui.statusFilter; }).map(function(x){ return '<button type="button" class="chip'+(ui.statusFilter===x?' active':'')+'" data-action="filter-status" data-status="'+escapeHtml(x)+'">'+(x==='ALL'?'Tất cả':(x==='Lệch ngày'||x==='Khớp tổng'?'⚠ '+x:escapeHtml(x)))+'<span class="cnt">'+fmtNum(x==='Lệch ngày'?pg.counts[x]/2:pg.counts[x])+(x==='Lệch ngày'?' cặp':(x==='Khớp tổng'?' nhóm':''))+'</span></button>'; }).join('');

function loadConfigFile(file){
  var r=new FileReader();
  r.onload=function(){
    var data; try{ data=JSON.parse(r.result); }catch(e){ toast('File thiết lập không đọc được.','err'); return; }
    if(!data||data.app!=='ghep-doi-chieu'){ toast('Đây không phải file thiết lập của công cụ Ghép & đối chiếu.','err'); return; }
    ui.pendingCfg={name:file.name, data:data};
    if(ui.fileInfo.A&&ui.fileInfo.B){
      // file đang mở khác sheet/dòng tiêu đề đã lưu → đọc lại theo thiết lập
      var jobs=[];
      ['A','B'].forEach(function(s){ var f=data.files&&data.files[s], cur=ui.fileInfo[s]; if(f&&cur&&cur.sheetNames.indexOf(f.sheetName)>=0&&(f.sheetName!==cur.sheetName||f.headerRow!==cur.headerRow||f.skipFooter!==cur.skipFooter||JSON.stringify(f.groupBy||[])!==JSON.stringify(cur.groupBy||[]))) jobs.push([s,f]); });
      var chain=Promise.resolve();
      jobs.forEach(function(j){ chain=chain.then(function(){ return engine.loadSheet(j[0], j[1].sheetName, j[1].headerRow, {skipFooter:j[1].skipFooter!==false, groupBy:j[1].groupBy||[]}).then(function(rec){ ui.fileInfo[j[0]]=rec; }); }); });
      runWithProgress('Đang áp dụng thiết lập...', function(){ return chain; }).then(function(){ afterFilesChanged(); tryApplyPending(); }, function(){});
    } else { renderStep1(); toast('Đã nạp thiết lập. Tải đủ 2 file để áp dụng.','info'); }
  };

}
function tryApplyPending(){
  var pc=ui.pendingCfg; if(!pc||!ui.fileInfo.A||!ui.fileInfo.B) return;
  var d=pc.data, ca=ui.fileInfo.A.columns, cb=ui.fileInfo.B.columns, missing=[];
  function hasA(c){ if(ca.indexOf(c)<0){ missing.push('A: '+c); return false; } return true; }
  function hasB(c){ if(cb.indexOf(c)<0){ missing.push('B: '+c); return false; } return true; }
  var kp=(d.keyPairs||[]).filter(function(p){ var x=hasA(p.a), y=hasB(p.b); return x&&y; });
  if(kp.length) ui.keyPairs=kp.map(function(p){ return {a:p.a,b:p.b}; });
  var op=(d.orPairs||[]).filter(function(p){ var x=hasA(p.a), y=hasB(p.b); return x&&y; });
  ui.orPairs=op.map(function(p){ return {a:p.a,b:p.b}; });
  if(!kp.length && op.length) ui.keyPairs=[{a:'',b:''}];
  if(d.clean) ui.clean=Object.assign({}, ui.clean, d.clean);
  if(d.duplicateHandling) ui.duplicateHandling=d.duplicateHandling;
  if(d.dateWarn) ui.dateWarn={on:!!d.dateWarn.on, days:parseInt(d.dateWarn.days,10)||3};
  if(d.sumWarn) ui.sumWarn={on:!!d.sumWarn.on};
  if(d.amountTol) ui.amountTol={abs:d.amountTol.abs||'', pct:d.amountTol.pct||''};
  if(d.joinType) ui.joinType=+d.joinType;
  ui.colsA = d.colsA==='ALL'||!d.colsA ? 'ALL' : d.colsA.filter(function(c){ return ca.indexOf(c)>=0; });
  ui.colsB = d.colsB==='ALL'||!d.colsB ? 'ALL' : d.colsB.filter(function(c){ return cb.indexOf(c)>=0; });
  var cp=(d.comparePairs||[]).filter(function(p){ var x=hasA(p.aCol), y=hasB(p.bCol); return x&&y; });
  ui.comparePairs = cp.length ? cp.map(function(p){ return {aCol:p.aCol,bCol:p.bCol,tolerance:p.tolerance||''}; }) : [{aCol:'',bCol:'',tolerance:''}];
  ui.cmpSuggested = cp.length>0;
  ui.pendingCfg=null; ui.checkResult=null;
  if(missing.length) toast('Đã áp dụng thiết lập, nhưng không thấy các cột: '+missing.slice(0,4).join(', ')+(missing.length>4?'…':'')+'. Kiểm tra lại các bước.','err');
  else toast('Đã áp dụng thiết lập "'+pc.name+'". Kiểm tra nhanh rồi bấm Chạy.','ok');
  gotoStep(ui.joinType&&(kp.length||op.length)?3:2);
}

var OK_EXT=/\.(xlsx|xlsm|xls|xlsb|csv)$/i;
function handleHomeFiles(list, slot){
  var files=Array.prototype.slice.call(list||[]).filter(function(f){ return OK_EXT.test(f.name); });
  if(!files.length){ toast('Chỉ nhận file .xlsx, .xls, .csv.','err'); return; }
  if(files.length>2) toast('Đã lấy 2 file đầu tiên.','info');
  var slots = files.length>=2 ? ['A','B'] : [slot || (ui.fileInfo.A&&!ui.fileInfo.B?'B':'A')];
  handleFilePicked(slots[0], files[0]).then(function(){ return files[1] ? handleFilePicked(slots[1], files[1]) : null; })
    .then(function(){
      var A=ui.fileInfo.A, B=ui.fileInfo.B;
      if(A||B){ ui.step=1; gotoStep(1); }
    });
}
function clearFiles(){
  if(!confirm('Gỡ cả File A và File B đã tải? Các cặp cột và kết quả đang có sẽ bị xoá.')) return;
  engine.clearFiles().then(function(){
    ui.fileInfo={A:null,B:null}; ui.pendingCfg=null; ui.grpOpen={}; afterFilesChanged(); ui.page=null;
    for(var i=2;i<=4;i++) $('#step-'+i).innerHTML='';
    renderStep1(); toast('Đã gỡ toàn bộ file.','info');
  });
}

function sendFeedback(){
  var content=$('#fbContent').value.trim(), name=$('#fbName').value.trim(), phone=$('#fbPhone').value.trim();
  if(content.length<5){ fbMsg('Vui lòng nhập nội dung góp ý (ít nhất 5 ký tự).','err'); $('#fbContent').focus(); return; }
  if(name.length<2){ fbMsg('Vui lòng nhập họ tên để Đốm tiện phản hồi.','err'); $('#fbName').focus(); return; }
  if(phone && !/^[0-9 +().-]{8,20}$/.test(phone)){ fbMsg('Số điện thoại chưa đúng (có thể để trống).','err'); return; }
  var head='['+fb.type+']'+(fb.stars?' · Đánh giá: '+fb.stars+'/5 ★':'');
  var body={tool:TOOL_SLUG, name:name, phone:phone, content:head+'\n'+content, page:'Ghép & đối chiếu · Bước '+ui.step+' · bản '+VER, website:$('#fbHp').value};
  var btn=$('#fbSend'); btn.disabled=true; fbMsg('Đang gửi…');
  var online=/^https?:$/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname);
  var req = online
    ? fetch('/api/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error||'Chưa gửi được, vui lòng thử lại.'); return j.message; }); })

    function(e){ btn.disabled=false; fbMsg(e&&e.message&&!/fetch|network/i.test(e.message)?e.message:'Chưa gửi được (kiểm tra kết nối mạng) – vui lòng thử lại.','err'); });
}
