:"Đốm kể","body":"Anh Tùng bán đồ gỗ, muốn quay video kể vì sao bỏ việc văn phòng về làm xưởng. Anh viết kín một trang kịch bản, học thuộc cả tối.\n\nBấm quay, anh nói trôi chảy. Xem lại, anh thấy mình như đang đọc bản tin: mắt đảo lên như đang nhớ chữ, giọng đều đều.\n\nLần sau anh bỏ kịch bản. Anh rũ vai, thở vài hơi, rồi nhắm mắt. Anh nhớ lại sáng đầu tiên ở xưởng: mùi gỗ, tiếng máy bào, câu bác thợ cả nói. Anh vấp hai chỗ, nhưng vợ anh xem xong bảo: *\"Giờ mới đúng là anh.\"*"},{"type":"idea","title":"Ý chính","body":"Trước camera, nhiều người mất giọng thật vì hai lẽ: cơ thể còn căng, và đầu óc đang bận nhớ chữ.\n\n**Khởi động** gỡ cái thứ nhất. Chỉ vài phút để cơ thể và giọng nói vào trạng thái sẵn sàng.\n\n**Sống lại cảnh** gỡ cái thứ hai. Thay vì nhớ câu chữ, bạn quay về khoảnh khắc đó: thấy gì, nghe gì, nghĩ gì. Bạn kể điều mình đang \"nhìn thấy\", nên lời tự nhiên như trò chuyện."},{"type":"how","title":"Cách làm: 3 phút trước khi bấm quay","body":"1. **Rũ người (30 giây)**: lắc nhẹ hai tay, xoay vai, thả lỏng hàm.\n2. **Thở bụng (30 giây)**: hít vào bằng mũi cho bụng phồng ra, thở ra chậm bằng miệng. Làm 3–4 hơi.\n3. **Mở giọng (30 giây)**: ngân \"ừm\" từ thấp lên cao, rồi đọc rõ \"ba – bà – bá – bả – bã – bạ\".\n4. **Sống lại cảnh (1 phút)**: nhắm mắt, quay về đúng khoảnh khắc chính của chuyện. Mình đang ở đâu, thấy gì, nghe ai nói gì, trong đầu nghĩ gì?\n5. **Mở mắt và kể ngay**: nhìn camera, kể những gì vừa thấy. Chỉ cần nhớ câu mở và câu chốt, phần giữa để tự chảy.\n\nBạn đã tập khởi động ở ngày 20. Hôm nay thêm bước sống lại cảnh, phần quan trọng nhất."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Đọc thuộc lòng","strongLabel":"Kể từ cảnh đang sống lại","rows":[{"branch":null,"weak":"(Video kể chuyện nghề) \"Năm đó, tôi đã quyết định nghỉ việc để theo đuổi đam mê làm đồ gỗ của mình.\"","strong":"(Video kể chuyện nghề) \"Sáng hôm đó xưởng còn lạnh. Bác thợ cả đưa mình cái bào, bảo: 'Cầm thử xem có hợp tay không.' Mình cầm lên và nghĩ: 'Chết, nặng hơn mình tưởng.'\""},{"branch":null,"weak":"(Video giới thiệu bản thân) \"Tôi là người yêu thích chăm sóc khách hàng và luôn tận tâm với công việc.\"","strong":"(Video giới thiệu bản thân) \"9 giờ tối, một bác khách gọi, giọng cuống lên vì quà sinh nhật cho cháu ngày mai chưa tới. Mình đứng dậy, cầm áo khoác, nghĩ: 'Để mình chạy qua kho.'\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Đừng học thuộc lời. Hãy sống lại cảnh, lời sẽ tự đến."}],"quiz":{"kind":"choice","question":"Còn 3 phút nữa là bạn bấm quay video kể chuyện. Việc nào giúp bạn kể tự nhiên nhất?","options":[{"text":"Đọc lại kịch bản thêm 3 lần cho chắc.","correct":false,"feedback":"Đọc lại làm đầu óc bận nhớ chữ. Lúc quay, mắt bạn dễ đảo đi tìm câu tiếp theo."},{"text":"Rũ người, thở vài hơi, rồi nhắm mắt sống lại khoảnh khắc chính 1 phút.","correct":true,"feedback":"Đúng rồi! Cơ thể thả lỏng, đầu óc đang ở trong cảnh. Bạn kể điều mình thấy, không phải điều mình học thuộc."},{"text":"Xem lại video của một người dẫn nổi tiếng để bắt chước giọng.","correct":false,"feedback":"Bắt chước giọng người khác càng làm bạn giống đang diễn. Người xem cần giọng thật của bạn."}]},"practice":{"intro":"Khởi động, sống lại một khoảnh khắc trong kho chuyện, rồi kể 60 giây trước camera.","steps":["Mở Kho chuyện, chọn 1 chuyện bạn muốn kể trong video ngày 28.","Khởi động 90 giây: rũ người, thở bụng, mở giọng như thẻ Cách làm.","Nhắm mắt 1 phút, sống lại khoảnh khắc chính. Mở mắt, ghi nhanh 3 ô bên dưới, mỗi ô một dòng.","Dựng điện thoại, bấm đồng hồ 60 giây, kể những gì bạn vừa thấy. Không nhìn ghi chú."],"pickStory":true,"fields":[{"label":"Mình đang ở đâu, thấy gì?","placeholder":"Ví dụ: xưởng còn lạnh, mùn gỗ dưới chân"},{"label":"Mình nghe thấy gì, ai nói câu gì?","placeholder":"Ví dụ: Bác thợ cả: \"Cầm thử xem…\""},{"label":"Trong đầu mình nghĩ gì, nguyên văn?","placeholder":"Ví dụ: \"Chết, nặng hơn mình tưởng.\""}],"saveAs":"storyNote","widget":null,"timer":60,"record":true},"review":["Mình khởi động đủ các bước trước khi bấm quay.","Mình kể từ cảnh đang thấy, không đọc lại câu đã thuộc.","Có ít nhất 1 chi tiết mình chỉ nhớ ra khi nhắm mắt sống lại."],"done":"Bạn vừa kể bằng giọng thật của mình. Mai mình học cách xem lại bản quay, để biết nên sửa đúng chỗ nào nhé!","videos":["PH-020","PH-042"]},{"id":"d26C","day":26,"stage":4,"branch":"C","milestone":false,"title":"Kết bài: Tóm lại – Hành động – Câu chốt","hook":"Người nghe quên slide, nhưng nhớ câu cuối. Đừng để bài kết bằng \"dạ, vậy thôi ạ\".","cards":[{"type":"story","title":"Đốm kể","body":"Cuối buổi hướng dẫn an toàn kho, Phúc nói: *\"Dạ, phần của em đến đây là hết. Mọi người có câu hỏi gì không ạ?\"* Có một câu hỏi về chỗ để xe. Phúc trả lời. Rồi mọi người đứng dậy về.\n\nBuổi sau, Phúc mời hỏi đáp trước. Rồi mới kết: *\"Tóm lại, ba điều: đi giày bảo hộ, không xếp quá vạch đỏ, thấy lạ thì báo ngay. Trước khi về hôm nay, mỗi người nhìn một kệ gần chỗ mình nhất. Hàng đổ thì xếp lại được. Người ngã thì không.\"*\n\nPhúc dừng ba giây, rồi mới cảm ơn.\n\nChiều hôm đó, tổ kho báo lên hai kệ xếp quá vạch."},{"type":"idea","title":"Ý chính","body":"Bài nói giống một chuyến bay. Cất cánh ổn, bay ổn, nhưng nhiều người **hạ cánh vội**. Mà phần kết lại là thứ người nghe mang về.\n\nKhung **RAP (Tóm lại – Hành động – Câu chốt)** giúp bạn hạ cánh chắc. Tóm 1–3 ý, không thêm thông tin mới. Giao **một** việc nhỏ làm được ngay hôm nay. Rồi nói một câu chốt ngắn và im.\n\nMột mẹo: đừng kết bằng hỏi đáp. Mời hỏi trước, rồi mới RAP. Câu cuối người nghe nghe thấy sẽ là câu của bạn."},{"type":"how","title":"Cách làm: kết 30 giây theo RAP","body":"| Bước | Mẫu câu | Lưu ý |\n| --- | --- | --- |\n| Tóm lại | \"Tóm lại, anh chị nhớ giúp em ba điều: …\" | 1–3 ý, khớp với lộ trình đầu bài |\n| Hành động | \"Trước khi về hôm nay, anh chị thử…\" | Một việc, nhỏ, làm được trong một giờ |\n| Câu chốt | Một câu ngắn nói trái tim của bài | Dùng đối lập (\"Không phải… mà là…\") hoặc nhắc lại lời hứa đầu bài |\n| Dừng | Im 2–3 giây, nhìn người nghe | Sau đó mới \"Em cảm ơn anh chị\" |\n\nViết câu chốt ra giấy và học thuộc. Đây là câu duy nhất trong bài nên thuộc từng chữ."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Kết nhạt","strongLabel":"Kết theo RAP","rows":[{"branch":null,"weak":"\"Dạ, đề xuất của em đại khái là vậy, anh chị xem rồi góp ý thêm giúp em nhé, em cảm ơn.\"","strong":"\"Tóm lại: đổi giờ giao ban giúp mình bớt họp trùng và gọi lại khách sớm hơn. Em xin một việc: tuần sau thử một lần. Mình không cần họp nhiều hơn, mình cần họp đúng lúc hơn. *(dừng)* Em cảm ơn.\""},{"branch":null,"weak":"\"Phần hướng dẫn của em hết rồi. À, còn một tính năng nữa em quên nói…\"","strong":"\"Ba điều: tạo việc, gắn hạn, xem ai đang chậm. Ngay sau buổi này, mỗi anh chị tạo một việc thật cho tuần tới. Giao việc là để khỏi phải nhắc nhau. *(dừng)*\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Tóm một câu, giao một việc, chốt một câu, rồi im."}],"quiz":{"kind":"order","question":"Sắp xếp phần cuối bài trình bày theo đúng thứ tự:","items":["Mời hỏi đáp","Tóm lại ba điều chính","Giao một việc làm được ngay hôm nay","Nói câu chốt, dừng 2–3 giây, rồi cảm ơn"],"feedback":"Hỏi đáp đặt trước, để câu cuối người nghe mang về là câu chốt của bạn, không phải câu hỏi về chỗ để xe."},"practice":{"intro":"Viết và nói phần kết 30 giây cho bài 3 phút của bạn.","steps":["Nhìn lại lời hứa và ba điều đã viết ở ngày 23.","Điền 3 ô RAP bên dưới. Câu chốt nên ngắn, dưới 15 chữ.","Đọc to câu chốt 3 lần cho thuộc.","Bấm đồng hồ 30 giây. Nói trọn phần kết, dừng 3 giây sau câu chốt rồi mới \"em cảm ơn\"."],"topics":["Giới thiệu quy trình duyệt chi mới cho cả phòng","Đề xuất đổi giờ họp giao ban sang đầu giờ chiều","Hướng dẫn nhân viên mới cách trả lời tin nhắn khách trên Zalo"],"pickStory":false,"fields":[{"label":"Tóm lại","placeholder":"Tóm lại, anh chị nhớ giúp em ba điều: …"},{"label":"Hành động","placeholder":"Trước khi về hôm nay, anh chị thử…"},{"label":"Câu chốt","placeholder":"Ví dụ: \"Không phải… mà là…\""}],"saveAs":null,"widget":null,"timer":30,"record":true},"review":["Phần tóm lại của mình không thêm thông tin mới.","Việc mình giao là một việc nhỏ, làm được ngay trong hôm nay.","Mình dừng sau câu chốt rồi mới cảm ơn."],"done":"Bài 3 phút của bạn đã đủ mở, thân, kết. Mai mình tập dượt, xem lại, và chỉ sửa đúng 1 điểm thôi.","videos":["PH-034","PH-007"]},{"id":"d27A","day":27,"stage":4,"branch":"A","milestone":false,"title":"Tự nghe lại, sửa 1 điểm","hook":"Sửa mọi thứ cùng lúc thì chẳng sửa được gì. Mỗi lần, chỉ một điểm.","cards":[{"type":"story","title":"Đốm kể","body":"Quân ghi âm chuyện của mình rồi nghe lại. Nghe xong, Quân liệt kê: nói nhanh, nhiều \"kiểu là\", mở bài dài, câu chốt nhạt, giọng đều. Năm lỗi.\n\nHôm sau Quân kể lại, cố sửa cả năm. Kết quả: Quân vấp nhiều hơn hôm trước.\n\nTuần sau, Quân đổi cách. Nghe lại, Quân ghi 3 điều làm tốt trước. Rồi chỉ chọn một điểm: bỏ câu dẫn dài ở đầu. Kể lại ba lần, chỉ để ý điểm đó. Lần thứ ba, chuyện vào thẳng cảnh, gọn hẳn.\n\nQuân không giỏi lên gấp năm. Quân chỉ thôi ôm năm việc một lúc."},{"type":"idea","title":"Ý chính","body":"Nghe lại giọng mình thường hơi khó chịu. Ai cũng vậy. Nhưng đó là cách nhanh nhất để biết người nghe đang nghe thấy gì.\n\nCái bẫy là nghe xong muốn sửa hết. Khi đang nói, đầu ta chỉ để ý được một thứ. Sửa một điểm đến khi thành thói quen, rồi mới sang điểm tiếp theo.\n\nVà luôn ghi điều làm tốt trước, như bạn đã gặp ở ngày 20. Không phải để tự an ủi: đó là những thứ bạn cần giữ lại khi sửa điểm khác."},{"type":"how","title":"Cách làm: nghe 2 lượt, chọn 1 điểm","body":"| Bước | Làm gì | Hỏi mình |\n| --- | --- | --- |\n| 1. Ghi âm | Kể 1 chuyện như đang kể cho một người cụ thể | – |\n| 2. Lượt nghe 1 | Nghe nội dung, như một người lạ | \"Mình có hiểu ngay chuyện gì không? Chỗ nào muốn tua qua?\" |\n| 3. Lượt nghe 2 | Chỉ nghe cách nói | \"Nhanh hay chậm? Từ đệm nào lặp lại? Có khoảng lặng không?\" |\n| 4. Ghi và chọn | Ghi 3 điều tốt, rồi chọn 1 điểm | \"Sửa đúng một thứ thì thứ nào làm chuyện hay lên nhiều nhất?\" |\n| 5. Kể lại | Chỉ để ý đúng điểm đó | – |\n\nNhững điểm hay gặp: mở bài vòng vo, từ đệm (\"kiểu là\", \"thì là\", \"ờ\"), nói nhanh đúng chỗ quan trọng, kết bằng \"thế thôi\". Giữ điểm đã chọn trong 1–2 tuần, lần kể nào cũng để ý nó."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Tự nhận xét chung chung","strongLabel":"Chọn 1 điểm cụ thể","rows":[{"branch":null,"weak":"*(Sau khi kể chuyện trong buổi cà phê với khách)* \"Mình kể dở quá, lần sau phải hay hơn.\"","strong":"\"Mình giữ được câu chốt tốt. Lần sau chỉ sửa một điểm: vào thẳng cảnh, bỏ câu 'chuyện là thế này ạ'.\""},{"branch":null,"weak":"*(Nghe lại bản ghi chuyện kể cho bạn)* \"Nói nhanh, nhiều từ thừa, giọng đều, mở dài, kết nhạt. Phải sửa hết.\"","strong":"\"Ba điều tốt: có lời thoại, có suy nghĩ thật, gọn trong 60 giây. Điểm sửa: nói chậm lại ở đoạn khách đặt hồ sơ xuống bàn.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Ghi điều làm tốt trước, rồi mỗi lần chỉ sửa một điểm."}],"quiz":{"kind":"choice","question":"Nghe lại bản ghi, bạn thấy 4 điểm chưa ổn. Bước tiếp theo nên là gì?","options":[{"text":"Kể lại ngay, cố sửa cả 4 điểm một lượt.","correct":false,"feedback":"Khi đang nói, đầu ta chỉ để ý được một thứ. Sửa cả 4, bạn dễ vấp hơn và nản."},{"text":"Ghi lại điều làm tốt, rồi chọn 1 điểm để sửa trong lần kể tới.","correct":true,"feedback":"Chuẩn! Giữ cái tốt, sửa một điểm. Chậm mà chắc."},{"text":"Thôi không nghe lại nữa, vì nghe giọng mình khó chịu.","correct":false,"feedback":"Ai cũng thấy lạ khi nghe giọng mình. Nghe vài lần sẽ quen, và đó là cách tiến bộ nhanh nhất."}]},"practice":{"intro":"Ghi âm một chuyện, nghe 2 lượt, sửa đúng 1 điểm.","steps":["Chọn 1 chuyện trong kho, tốt nhất là chuyện bạn định kể ở ngày mốc ngày mai.","Bấm đồng hồ 60 giây, kể và ghi âm.","Nghe 2 lượt: lượt 1 nghe nội dung, lượt 2 nghe cách nói. Điền 2 ô đầu.","Ghi âm lại một lần, chỉ để ý đúng điểm đã chọn. Điền ô cuối."],"pickStory":true,"fields":[{"label":"3 điều mình làm tốt","placeholder":"Ví dụ: có lời thoại, có suy nghĩ thật, đúng giờ"},{"label":"1 điểm mình chọn sửa","placeholder":"Ví dụ: bỏ câu dẫn 'chuyện là thế này' ở đầu"},{"label":"Lần kể lại khác thế nào?","placeholder":"Ví dụ: vào thẳng cảnh, gọn hơn hẳn"}],"saveAs":"storyNote","timer":60,"record":true},"review":["Mình nghe lại đủ 2 lượt: nội dung và cách nói.","Mình ghi 3 điều làm tốt trước khi chọn điểm sửa.","Lần kể lại, mình chỉ tập trung vào đúng 1 điểm."],"done":"Chuyện của bạn vừa gọn thêm một nấc. Mai là ngày mốc cuối: kể chuyện này cho một người thật. Chọn sẵn người bạn muốn kể nhé!","videos":["PH-043"]},{"id":"d27B","day":27,"stage":4,"branch":"B","milestone":false,"title":"Tự xem lại theo 5 bước","hook":"Xem lại video của mình không phải để chê. Là để chọn đúng một điểm cần sửa.","cards":[{"type":"story","title":"Đốm kể","body":"Mai bán quần áo online, mỗi tuần quay video thử đồ. Lần đầu xem lại, Mai ghi cả một danh sách lỗi: nói nhanh, hay \"ờ\", tay vung nhiều, mắt lung tung, cười gượng, giọng nhỏ.\n\nTuần sau Mai cố sửa cả sáu điều cùng lúc. Quay xong, Mai thấy mình cứng đờ như tượng, còn kém hơn trước.\n\nLần này Mai đổi cách: xem lại từng phần, rồi chỉ chọn một điều là \"mắt nhìn vào camera\". Hai tuần sau, chỉ riêng điều đó đã làm video khác hẳn."},{"type":"idea","title":"Ý chính","body":"Xem lại video của chính mình là cách tiến bộ nhanh nhất. Nhưng vừa nghe vừa nhìn cùng lúc thì dễ ngợp, và chỉ thấy toàn lỗi.\n\nCách khôn ngoan là **tách tiếng và hình** ra xem riêng. Mỗi lượt chỉ chú ý một thứ, bạn sẽ thấy rõ hơn nhiều.\n\nRồi **chỉ chọn một điểm** để sửa. Sửa từng điểm một nhanh hơn cố sửa tất cả cùng lúc."},{"type":"how","title":"Cách làm: 5 bước tự xem lại","body":"| Bước | Làm gì | Chú ý điều gì |\n| --- | --- | --- |\n| 1. Quay | Nhìn thẳng camera, nói 1–2 phút về một chuyện hoặc một đề bất kỳ | Quay một mạch, không dừng lại sửa |\n| 2. Nghe, không nhìn | Úp điện thoại xuống, chỉ nghe | Tốc độ, giọng đều hay có lên xuống, có khoảng lặng không |\n| 3. Nhìn, không nghe | Tắt tiếng, chỉ xem | Mắt có nhìn camera không, tư thế, tay, nét mặt |\n| 4. Chọn 1 điểm | Chọn điều **làm người xem phân tâm nhất** | Vài tiếng \"ờ\" chưa sao. \"Ờ\" sau mỗi câu mới cần sửa |\n| 5. Luyện 2 tuần | Mỗi lần quay, nhắc mình đúng điểm đó. Hết 2 tuần, quay lại và so sánh | Ổn rồi thì chọn điểm mới |\n\nTrước khi ghi điểm cần sửa, hãy ghi **1 điều mình làm tốt**. Bạn cần biết mình đang có gì để giữ, không chỉ biết mình thiếu gì."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Xem lại kiểu tự chê","strongLabel":"Xem lại theo 5 bước","rows":[{"branch":null,"weak":"\"Trời ơi, giọng mình nghe kỳ quá, mặt thì cứng, tay thì thừa. Thôi không quay nữa.\"","strong":"\"Nghe không nhìn: đoạn giữa mình nói nhanh. Nhìn không nghe: mắt ổn. Điểm duy nhất 2 tuần tới: dừng một nhịp sau mỗi ý.\""},{"branch":null,"weak":"\"Lần sau mình sửa hết: bớt 'ờ', nói chậm, cười nhiều, đứng thẳng, nhìn camera.\"","strong":"\"Mình làm tốt: câu mở rõ. Điều làm người xem phân tâm nhất: mình liếc ra ngoài khi đang nghĩ. Hai tuần tới mình chỉ tập giữ mắt ở camera.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Xem lại để chọn một điểm, không phải để chê mình."}],"quiz":{"kind":"order","question":"Sắp xếp 5 bước tự xem lại video.","items":["Quay 1–2 phút, nhìn thẳng camera","Úp điện thoại, chỉ nghe tiếng","Tắt tiếng, chỉ xem hình","Chọn 1 điểm làm người xem phân tâm nhất","Luyện điểm đó 2 tuần rồi quay lại so sánh"],"feedback":"Tách tiếng và hình giúp bạn thấy rõ từng thứ. Chọn một điểm rồi mới luyện, vì sửa từng điểm một nhanh hơn sửa tất cả cùng lúc."},"practice":{"intro":"Xem lại một bản quay của bạn theo 5 bước và chọn đúng 1 điểm để sửa.","steps":["Mở lại video bạn quay hôm qua. Chưa có? Bấm đồng hồ, quay mới 60 giây bằng camera điện thoại, kể một chuyện trong kho.","Úp điện thoại, chỉ nghe một lượt. Ghi điều bạn nghe thấy.","Tắt tiếng, chỉ xem một lượt. Ghi điều bạn nhìn thấy.","Ghi 1 điều làm tốt trước, rồi mới chọn đúng 1 điểm để luyện trong 2 tuần tới."],"pickStory":false,"fields":[{"label":"Nghe không nhìn: mình nghe thấy gì?","placeholder":"Ví dụ: đoạn giữa nói nhanh, giọng đều đều"},{"label":"Nhìn không nghe: mình thấy gì?","placeholder":"Ví dụ: hay liếc ra ngoài khi đang nghĩ"},{"label":"Một điều mình làm tốt","placeholder":"Ví dụ: câu mở rõ, có dừng sau câu chốt"},{"label":"Điểm duy nhất mình luyện trong 2 tuần","placeholder":"Ví dụ: giữ mắt ở camera"}],"saveAs":null,"widget":null,"timer":60,"record":true},"review":["Mình đã xem riêng tiếng và riêng hình, mỗi thứ một lượt.","Mình ghi 1 điều làm tốt trước khi ghi điểm cần sửa.","Mình chỉ chọn đúng 1 điểm, không phải cả một danh sách."],"done":"Bạn đã có điểm để luyện. Mai là ngày qua màn cuối cùng: chọn sẵn chuyện bạn muốn kể trong video 2 phút nhé!","videos":["PH-043"]},{"id":"d27C","day":27,"stage":4,"branch":"C","milestone":false,"title":"Tập dượt, quay thử, xem lại","hook":"Xem lại chính mình hơi ngượng. Nhưng đó là cách nhanh nhất để thấy điều người nghe đã thấy.","cards":[{"type":"story","title":"Đốm kể","body":"Trang chuẩn bị trình bày với một khách hàng mới. Trang lướt slide trong đầu ba lần, thấy ổn. Hôm đó, Trang nói nhanh đến mức khách phải hỏi lại tên sản phẩm hai lần.\n\nLần sau, Trang dựng điện thoại lên chồng sách, quay một lượt. Xem lại, Trang muốn tắt ngay ở giây thứ mười.\n\nRồi Trang úp điện thoại xuống, chỉ nghe tiếng. Giọng mình như đang chạy theo xe buýt.\n\nTrang không sửa mười thứ. Trang chỉ sửa một: **nói chậm lại ở tên sản phẩm**. Buổi sau, khách nhắc đúng tên ngay lần đầu."},{"type":"idea","title":"Ý chính","body":"Tập trong đầu khác hẳn nói thành tiếng. Chỉ khi nghe lại, bạn mới biết mình nhanh, đều đều, hay chèn nhiều \"ờ\".\n\nNhưng xem lại cũng dễ thành tự chê. Thấy mười lỗi, định sửa cả mười, thì đầu bận nhớ lỗi và nói còn cứng hơn. **Chọn đúng một điểm**, luyện nó cho đến lần quay sau.\n\nTrước khi bấm quay, nhắm mắt vài giây, sống lại khoảnh khắc trong câu chuyện minh họa. Kể từ cảnh đang thấy, giọng sẽ tự nhiên hơn đọc thuộc."},{"type":"how","title":"Cách làm: xem lại theo 5 bước","body":"1. **Quay:** dựng điện thoại ngang tầm mắt, nói nhìn vào ống kính.\n2. **Chỉ nghe:** úp điện thoại xuống. Nghe tốc độ, giọng lên xuống, khoảng lặng.\n3. **Chỉ xem:** tắt tiếng. Nhìn ánh mắt, dáng đứng, đôi tay.\n4. **Chọn 1 điểm:** sửa điểm nào thì người nghe được lợi nhiều nhất?\n5. **Luyện điểm đó** trong những lần nói tới, khoảng hai tuần, rồi quay lại để so.\n\nGhi thêm 1 điều mình làm tốt. Xem lại là để biết giữ gì, không chỉ để biết sửa gì."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Xem lại kiểu tự chê","strongLabel":"Xem lại kiểu chọn 1 điểm","rows":[{"branch":null,"weak":"\"Trời ơi, giọng mình dở quá, tay thừa, mắt nhìn lung tung, toàn 'ờ'. Chắc mình không hợp thuyết trình.\"","strong":"\"Câu mở mình làm tốt. Điểm cần sửa: sau con số quan trọng, mình chưa dừng. Hai tuần tới, mỗi lần báo cáo mình tập dừng 2 giây.\""},{"branch":null,"weak":"\"Lần tới mình sẽ sửa hết: nói chậm, bớt 'ờ', đứng thẳng, nhìn người nghe, cười nhiều hơn.\"","strong":"\"Nghe tiếng thì thấy mình nói nhanh nhất ở phần kết. Lần tới mình chỉ làm một việc: nói câu chốt thật chậm.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Thấy mười lỗi, chọn một. Sửa xong một, giữ được mãi."}],"quiz":{"kind":"choice","question":"Xem lại video, Hoa thấy mình nói nhanh, hay \"ờ\", và ít nhìn người nghe. Hoa nên làm gì tiếp?","options":[{"text":"Sửa cả ba ngay trong buổi họp tuần sau.","correct":false,"feedback":"Ôm cả ba thì đầu bận nhớ lỗi, nói càng gượng. Chọn một thôi."},{"text":"Chọn một điểm, ví dụ nói chậm lại, luyện trong hai tuần rồi quay lại để so.","correct":true,"feedback":"Đúng rồi! Sửa một điểm mỗi lần tiến nhanh hơn cố sửa tất cả cùng lúc."},{"text":"Thôi không quay nữa cho đỡ nản.","correct":false,"feedback":"Ngượng là bình thường, ai xem lại mình cũng ngượng. Bỏ quay là bỏ công cụ tự sửa tốt nhất."}]},"practice":{"intro":"Quay 60 giây đầu bài 3 phút, xem lại theo 5 bước và chọn 1 điểm.","steps":["Bấm ghi âm (hoặc quay bằng camera điện thoại nếu muốn xem cả hình). Nói 60 giây đầu bài: câu mở, lời hứa, ba điều.","Nghe lại một lượt, không nhìn màn hình. Ghi 1 điều về giọng.","Nếu có quay hình, xem một lượt tắt tiếng. Ghi 1 điều về mắt, dáng, tay.","Ghi 1 điều làm tốt và 1 điểm sẽ sửa. Nói lại 60 giây, chỉ tập trung vào điểm đó."],"pickStory":false,"fields":[{"label":"Nghe tiếng: mình thấy…","placeholder":"Ví dụ: nói nhanh ở phần lời hứa"},{"label":"Xem hình: mình thấy…","placeholder":"Ví dụ: mắt nhìn xuống giấy nhiều"},{"label":"1 điều mình làm tốt","placeholder":"Ví dụ: câu mở rõ, có dừng"},{"label":"1 điểm mình sẽ sửa","placeholder":"Ví dụ: nói chậm lại ở ba điều"}],"saveAs":null,"widget":null,"timer":60,"record":true},"review":["Mình nghe lại bản ghi đến hết, không tắt giữa chừng.","Mình chọn đúng 1 điểm để sửa, không phải cả danh sách.","Lần nói thứ hai, mình làm điểm đó tốt hơn một chút."],"done":"Bạn vừa làm điều nhiều người né cả đời: tự xem lại mình. Mai là ngày mốc: trình bày trọn 3 phút.","videos":["PH-042","PH-043"]},{"id":"d28A","day":28,"stage":4,"branch":"A","milestone":true,"title":"Mốc: kể 1 chuyện 2 phút cho người thật","hook":"Bạn đã luyện một mình suốt 27 ngày. Hôm nay có người ngồi nghe.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Bạn đã nhặt chuyện, dựng chuyện, tập nói rõ, và học cách chạm người nghe. Hôm nay chỉ còn một việc: kể cho một người thật.\n\nNgười đó có thể là đồng nghiệp ngồi cạnh, một người bạn, người trong nhà, hoặc ai đó qua một cuộc gọi. Không cần sân khấu. Một bữa trưa, một cốc trà là đủ.\n\nĐốm không chấm hay dở. Hãy để ý người nghe: chỗ nào họ cười, chỗ nào họ nghiêng người tới. Đó là phần thưởng thật của người kể."},{"type":"idea","title":"Ôn nhanh chặng 4","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 22 | Chào cho đủ lễ, rồi mở bằng một chuyện nhỏ và một câu hỏi |\n| 23 | Kể lần mình từng vấp trước, rồi mới nói điều mình học được |\n| 24 | Một câu, một điều thật, rồi dừng |\n| 25 | Kể vết sẹo, không kể vết thương |\n| 26 | Đừng nhớ lời, hãy quay lại cảnh |\n| 27 | Ghi điều làm tốt trước, rồi mỗi lần chỉ sửa một điểm |"},{"type":"how","title":"Chuẩn bị (2 phút)","body":"1. **Chọn 1 chuyện** trong kho, chuyện bạn tập hôm qua là tốt nhất. Chọn chuyện hợp người nghe: đồng nghiệp thì chuyện công việc, bạn bè thì chuyện đời thường.\n2. **Ghi 3 dòng nhắc**: câu mở – khoảnh khắc chính – câu chốt. Không viết cả bài.\n3. **Nhắm mắt 30 giây**, sống lại khoảnh khắc chính.\n4. **Mở lời tự nhiên**: \"Cho mình kể chuyện này, chừng 2 phút thôi.\" Muốn ghi âm thì hỏi trước: \"Mình ghi âm để tự nghe lại, được không?\"\n\nLúc này không có ai bên cạnh? Gọi điện cho một người. Hoặc ghi âm như đang kể cho một người cụ thể, rồi kể cho người thật trong 2 ngày tới."}],"quiz":null,"practice":{"intro":"Kể 1 chuyện 2 phút cho một người thật, ghi âm nếu người nghe đồng ý.","steps":["Chọn chuyện và điền 3 dòng nhắc bên dưới.","Bấm đồng hồ **2 phút** và kể. Nhìn người nghe, không nhìn ghi chú.","Kể xong, hỏi người nghe: \"Đoạn nào bạn nhớ nhất?\" Ghi câu trả lời vào ô cuối.","Nghe lại bản ghi (nếu có), lưu làm **\"Bản ghi ngày 28\"**. Bấm \"Đã kể cho người thật\" trên thẻ chuyện."],"pickStory":true,"fields":[{"label":"Câu mở","placeholder":"Ví dụ: 8 giờ sáng thứ Hai, điện thoại rung…"},{"label":"Khoảnh khắc chính","placeholder":"Ví dụ: khách nhắn 'Sao đơn của chị chưa tới?'"},{"label":"Câu chốt","placeholder":"Ví dụ: Mình tưởng… Hóa ra…"},{"label":"Người nghe nhớ nhất đoạn…","placeholder":"Ví dụ: đoạn mình đứng đọc tờ biên lai ba lần"}],"saveAs":"storyNote","timer":120,"record":true},"review":["Mình kể cho một người thật, trực tiếp hoặc qua cuộc gọi.","Mình mở bằng một khoảnh khắc, không vòng vo.","Có ít nhất một cảnh mình sống lại được: nơi chốn, lời thoại hoặc suy nghĩ.","Mình kết bằng một câu chốt rồi dừng.","Mình kể trong khoảng 2 phút và để ý phản ứng của người nghe."],"done":"Chúc mừng bạn đã đi trọn 28 ngày! Từ chỗ nghĩ mình không có gì để kể, hôm nay bạn đã kể một chuyện 2 phút cho người thật. Ngày 29 Về đích, mình nghe lại bản ghi ngày 7 cạnh bản hôm nay, và bạn nhận danh hiệu cuối cùng: Người kể truyền cảm hứng.","videos":[]},{"id":"d28B","day":28,"stage":4,"branch":"B","milestone":true,"title":"Mốc: video 2 phút kể chuyện của mình","hook":"Mọi điều bạn tập trong 27 ngày, gói vào một video 2 phút.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Bốn tuần trước, bạn kể một chuyện 30 giây và nghe lại giọng mình lần đầu. Hôm nay bạn quay một video 2 phút: có câu mở giữ chân, có lời hứa, có gia vị, có phần kết đọng lại.\n\nĐốm không chấm hay dở. Video này là bằng chứng bạn đã đi xa thế nào. Ngày mai, bạn sẽ xem nó cạnh bản ghi ngày 7.\n\nVấp cũng không sao. Thở một hơi, rồi nói tiếp. Người xem thích một người thật hơn một người hoàn hảo."},{"type":"idea","title":"Ôn nhanh chặng 4","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 22 | 20 giây đầu là một lời hứa: hứa điều có thật, rồi trả đủ |\n| 23 | Hứa một điều, báo trước đường đi, rồi đi đúng đường đó |\n| 24 | Câu mở kéo người xem vào, mỗi phút một gia vị giữ họ ở lại |\n| 25 | Kết như hạ cánh: tóm lại, giao một việc, chốt một câu, rồi im |\n| 26 | Đừng học thuộc lời, hãy sống lại cảnh |\n| 27 | Xem lại để chọn một điểm, không phải để chê mình |"},{"type":"how","title":"Chuẩn bị (2 phút)","body":"1. Chọn 1 chuyện trong kho, tốt nhất là chuyện bạn đã sống lại ở ngày 26.\n2. Ghi 3 dòng nhắc bài. **Mở 20 giây**: câu mở và lời hứa. **Khoảnh khắc chính**: cảnh sẽ sống lại và 1 gia vị. **Kết RAP**: điều rút ra, 1 việc người xem làm được, câu chốt.\n3. Khởi động 1 phút: rũ người, thở bụng, mở giọng. Rồi nhắm mắt sống lại cảnh.\n4. Nhắc mình điểm đã chọn ở ngày 27. Trong lúc quay, chỉ để ý đúng điểm đó.\n\nKhung thời gian gợi ý: **20 giây mở · 80 giây chuyện · 20 giây kết**. Không viết cả bài, chỉ nói từ 3 dòng nhắc."}],"quiz":null,"practice":{"intro":"Quay một video 2 phút kể một chuyện của bạn, xem lại và tự chấm.","steps":["Chọn chuyện trong kho và điền 3 dòng nhắc bài bên dưới.","Dựng điện thoại ngang tầm mắt, khởi động, sống lại cảnh. Bấm quay bằng camera điện thoại (hoặc nút ghi âm trên trang) và bấm đồng hồ 2 phút. Kể một mạch, không dừng lại sửa.","Xem lại nhanh: nghe không nhìn một lượt, rồi nhìn không nghe một lượt.","Còn thời gian thì quay lại thêm 1 lần. Chọn bản bạn thích hơn làm **\"Bản ghi ngày 28\"**."],"pickStory":true,"fields":[{"label":"Mở 20 giây: câu mở + lời hứa","placeholder":"Ví dụ: \"Sáng hôm đó xưởng còn lạnh…\" – Hết video, bạn sẽ…"},{"label":"Khoảnh khắc chính + 1 gia vị","placeholder":"Ví dụ: cảnh bác thợ cả đưa cái bào; gia vị: hỏi người xem"},{"label":"Kết RAP: tóm lại – 1 việc – câu chốt","placeholder":"Ví dụ: … Tuần này, thử … Câu chốt: …"}],"saveAs":"storyNote","widget":null,"timer":120,"record":true},"review":["Trong 20 giây đầu mình có câu mở và lời hứa, không mở bằng tên hay lời chào.","Lời hứa của mình là có thật, và video đã trả đủ.","Mình kể từ một khoảnh khắc đang sống lại, có nơi chốn, lời thoại hoặc suy nghĩ.","Giữa video có ít nhất 1 gia vị.","Mình kết theo RAP và im 2–3 giây sau câu chốt."],"done":"Chúc mừng bạn đã đi trọn hành trình 28 ngày, từ chuyện 30 giây ngày 7 đến video 2 phút hôm nay! Ngày mai là ngày 29 Về đích: mình đặt hai bản ghi cạnh nhau để nhìn lại bạn đã đi xa thế nào nhé.","videos":[]},{"id":"d28C","day":28,"stage":4,"branch":"C","milestone":true,"title":"Mốc: Thuyết trình 3 phút, quay lại","hook":"Ghép mọi mảnh của chặng 4 thành một bài 3 phút trọn vẹn. Nói một lần, ghi lại, tự chấm.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Hôm nay không có bài mới. Bạn đã có đủ mảnh: câu mở không cần chức danh, lời hứa, ba điều, một câu chuyện, gia vị, khoảng lặng, và phần kết RAP.\n\n3 phút nghe thì ngắn. Nói một mình trước điện thoại thì thấy dài. Có thể bạn sẽ vấp. Không sao, vấp rồi đi tiếp cũng là kỹ năng.\n\nNhớ lại ngày 7: bạn kể 30 giây và có lẽ đã nghĩ \"mình nói chẳng ra sao\". Hôm nay, bạn đứng nói trọn một bài có đầu có cuối. Cứ nói hết, rồi mình cùng nghe lại."},{"type":"idea","title":"Ôn nhanh: 6 điều mang theo","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 22 | Câu đầu tiên là để người nghe muốn nghe, không phải để đọc danh thiếp. |\n| 23 | Hứa điều người nghe được, báo trước có mấy điều, rồi giữ đúng lời hứa. |\n| 24 | Ý chính để người nghe hiểu. Câu chuyện để người nghe nhớ. |\n| 25 | Mỗi phút một gia vị, mỗi ý quan trọng một khoảng lặng. |\n| 26 | Tóm một câu, giao một việc, chốt một câu, rồi im. |\n| 27 | Thấy mười lỗi, chọn một. Sửa xong một, giữ được mãi. |"},{"type":"how","title":"Cách làm: chuẩn bị 2 phút","body":"1. **Dàn ý trên một tờ giấy nhỏ**, chỉ ghi từ khóa: câu mở → lời hứa → ba điều (đánh dấu chỗ kể chuyện) → RAP.\n2. **Đọc to câu mở và câu chốt**, mỗi câu một lần. Hai câu này nên thuộc.\n3. **Nhắm mắt vài giây**, sống lại khoảnh khắc trong câu chuyện minh họa.\n4. **Nghĩ đến một người cụ thể** sẽ nghe bài này: sếp, khách, hay đồng nghiệp mới. Nhắc mình: *\"Mình nói để giúp họ.\"*\n5. **Dựng điện thoại ngang tầm mắt**, đứng dậy nếu được, hít một hơi rồi bấm.\n\nHôm nay bỏ qua phần hỏi đáp. Vấp ở đâu thì nói tiếp từ đó, không quay lại từ đầu."}],"quiz":null,"practice":{"intro":"Trình bày trọn bài 3 phút bạn đã xây suốt chặng 4, ghi lại và tự chấm.","steps":["Chuẩn bị 2 phút theo thẻ \"Cách làm\". Điền nhanh dàn ý vào các ô bên dưới (chỉ từ khóa). Chưa có bài? Chọn một đề có sẵn.","Chọn câu chuyện minh họa trong Kho chuyện để có sẵn trước mắt.","Bấm đồng hồ 3 phút và ghi âm. Nói trọn bài một lần, vấp thì đi tiếp.","Nghe lại đến hết, tự chấm theo 5 tiêu chí. Giữ bản ghi này cho ngày 29."],"topics":["Giới thiệu quy trình duyệt chi mới cho cả phòng","Đề xuất đổi giờ họp giao ban sang đầu giờ chiều","Hướng dẫn nhân viên mới cách trả lời tin nhắn khách trên Zalo"],"pickStory":true,"fields":[{"label":"Câu mở","placeholder":"Câu hỏi, sự thật bất ngờ, hoặc \"Hãy hình dung…\""},{"label":"Lời hứa","placeholder":"Sau 3 phút này, anh chị sẽ…"},{"label":"Ba điều","placeholder":"Một… Hai… Ba…"},{"label":"Chuyện minh họa đặt ở đâu?","placeholder":"Ví dụ: sau điều thứ hai"},{"label":"Câu chốt","placeholder":"Một câu ngắn, rồi dừng"}],"saveAs":null,"widget":null,"timer":180,"record":true},"review":["Câu đầu tiên khiến người nghe muốn nghe, không phải tên và chức danh.","Mình nói lời hứa và báo trước ba điều.","Có một câu chuyện ngắn, nối rõ vào ý chính.","Có ít nhất một gia vị và một khoảng lặng đúng chỗ.","Mình kết bằng Tóm lại – Hành động – Câu chốt, và dừng trước khi cảm ơn."],"done":"Chúc mừng bạn đã đi trọn 28 ngày! Từ người nghe chuyện, bạn vừa đứng nói trọn một bài 3 phút có mở, có chuyện, có kết. Ngày 29 Về đích đang chờ: mình sẽ nghe lại bản ghi ngày 7 cạnh bản hôm nay nhé.","videos":[]},{"id":"d29","day":29,"stage":5,"branch":null,"milestone":false,"title":"Về đích: chọn 1 điều để luyện tiếp","hook":"28 ngày đã xong. Giờ chọn đúng một điều, và làm nó mỗi ngày.","cards":[{"type":"story","title":"Đốm kể","body":"Chúc mừng bạn! 28 ngày trước, có thể bạn còn nghĩ mình \"chẳng có gì để kể\". Hôm nay kho của bạn đã có những chuyện có tên, có khoảnh khắc, có câu chốt.\n\nBạn đã nhặt chuyện, rồi dựng chuyện. Bạn đã tập nói rõ, nói vững, và chạm tới người nghe theo đúng mục đích mình chọn.\n\nĐốm biết một bạn tên Hà, học xong khóa nào cũng ghi 10 điều muốn sửa. Một tháng sau, Hà không nhớ mình đã sửa được điều nào. Hôm nay mình làm khác Hà: chỉ chọn **một điều**."},{"type":"idea","title":"Ý chính","body":"Sau 28 ngày, bạn sẽ thấy mình còn nhiều thứ muốn sửa: nói nhanh, hay \"à, ờ\", mở bài còn vòng vo. Sửa hết cùng lúc thì lúc đứng nói, bạn không nhớ nổi điều nào.\n\nChọn **một điều** thì khác. Mỗi lần nói, bạn chỉ cần nhắc mình đúng một việc. Làm đủ nhiều lần, nó thành thói quen, không cần nghĩ nữa.\n\n**7 ngày** đủ ngắn để bạn không bỏ cuộc, đủ dài để thấy mình khác đi. Và lời hứa có giờ, có chỗ thì dễ giữ hơn lời hứa \"sẽ cố\"."},{"type":"how","title":"Cách làm: chọn 1 điều trong 4 bước","body":"1. **Nghe lại 2 bản ghi cạnh nhau.** Bản ngày 7 trước, bản ngày 28 sau. Nghe tiếng là chính: tốc độ, giọng, khoảng lặng. Nếu là video, xem thêm một lần tắt tiếng để nhìn ánh mắt, dáng ngồi.\n2. **Ghi 3 điều đã tiến bộ.** Viết cụ thể như \"mở bài vào thẳng khoảnh khắc\", không chung chung như \"nói hay hơn\".\n3. **Chọn 1 điều khó chịu nhất mà có ích nhất.** Hỏi mình: chỗ nào làm người nghe xao nhãng nhất? Trong đó, điều nào mình ngại sửa nhất? Thường đó là điều đáng luyện.\n4. **Cam kết cụ thể.** Viết đủ 3 phần: làm gì – lúc nào – ở đâu. Gắn vào một việc bạn vẫn làm mỗi ngày.\n\nSau 7 ngày, ghi âm lại và nghe. Ổn rồi thì chọn điều mới. Chưa ổn thì luyện thêm 7 ngày, không sao cả."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Cam kết mơ hồ","strongLabel":"Cam kết cụ thể","rows":[{"branch":null,"weak":"\"Mình sẽ cố kể chuyện nhiều hơn.\"","strong":"\"7 ngày tới, mỗi lần có người hỏi 'Dạo này thế nào?' ở công ty, mình trả lời bằng một chuyện nhỏ và hỏi lại một câu cụ thể.\""},{"branch":null,"weak":"\"Mình sẽ bớt 'à, ờ' khi quay video.\"","strong":"\"Mỗi tối 9 giờ, ở góc bàn học, mình quay 1 video 60 giây. Chỗ nào định 'à, ờ' thì mình im lặng một nhịp.\""},{"branch":null,"weak":"\"Mình sẽ thuyết trình tự tin hơn.\"","strong":"\"Mỗi sáng trước khi mở email, ở bàn làm việc, mình nói to câu kết luận của việc cần báo cáo hôm đó, rồi dừng 2 giây.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Chọn một điều. Làm mỗi ngày. Rồi mới chọn điều tiếp theo."}],"quiz":{"kind":"choice","question":"Lời cam kết nào dễ giữ nhất?","options":[{"text":"\"Mình sẽ luyện nói tốt hơn mỗi ngày.\"","correct":false,"feedback":"Mục tiêu tốt, nhưng chưa rõ làm gì, lúc nào. Rất dễ trôi qua 7 ngày mà chưa làm lần nào."},{"text":"\"Mỗi tối sau bữa cơm, ở phòng khách, mình kể 1 chuyện 60 giây và ghi âm lại.\"","correct":true,"feedback":"Chuẩn! Có việc cụ thể, có giờ, có chỗ. Đến lúc là biết ngay phải làm gì."},{"text":"\"Tuần tới mình sẽ sửa tốc độ nói, từ đệm và cách mở bài.\"","correct":false,"feedback":"Ba điều cùng lúc thì lúc nói bạn không nhớ nổi điều nào. Chọn một thôi."}]},"practice":{"intro":"Nghe lại hành trình của mình, chọn 1 điều và cam kết luyện trong 7 ngày tới.","steps":["Nghe bản ghi ngày 7, rồi bản ghi ngày 28, mỗi bản một lần. Vừa nghe vừa để ý: chỗ nào đã khác đi?","Ghi **3 điều** mình đã tiến bộ.","Chọn **1 điều** khó chịu nhất mà có ích nhất để luyện 7 ngày tới.","Viết cam kết: làm vào lúc nào, ở đâu. Càng cụ thể càng dễ giữ."],"pickStory":false,"fields":[{"label":"3 điều mình đã tiến bộ","placeholder":"Ví dụ: mở bài vào thẳng khoảnh khắc; nói chậm hơn; có câu hỏi lại"},{"label":"1 điều mình chọn luyện 7 ngày tới","placeholder":"Ví dụ: dừng 2 giây sau câu đầu tiên"},{"label":"Mình sẽ làm vào lúc… ở…","placeholder":"Ví dụ: mỗi sáng trước khi mở email, ở bàn làm việc"}],"saveAs":null,"widget":"compare7","timer":null,"record":false},"review":["Mình đã nghe lại cả bản ghi ngày 7 và ngày 28.","Mình ghi được 3 điều tiến bộ, cụ thể chứ không chung chung.","Cam kết của mình có đủ: làm gì, lúc nào, ở đâu."],"done":"Chúc mừng bạn đã về đích, danh hiệu Người kể truyền cảm hứng là của bạn! Muốn đi tiếp, hãy thử một nhánh khác (chỉ học lại ngày 15–28) hoặc vào Phòng tập cấp Nâng cao.","videos":["PH-026","PH-043"]}];
var VIDEOS=[{"ma":"PH-001","id":"hNuAv-42jzY","vi":"Kể chuyện hay hơn trong 9 phút","sum":"Chuyện hay không kể tóm tắt từ trên cao mà đưa người nghe vào đúng một khoảnh khắc. Video chỉ ra năm thứ giúp làm điều đó: nơi chốn, hành động, suy nghĩ, cảm xúc qua cơ thể và lời thoại.","tags":["Kể chuyện"],"level":"Cơ bản","min":9.0},{"ma":"PH-002","id":"9HJ0AHfx7BE","vi":"Mở đầu bài nói khiến người nghe chú ý ngay","sum":"Mở bằng tên, chức danh hay bối cảnh là cách dễ mất người nghe nhất. Video gợi ý năm kiểu mở thay thế: câu hỏi, câu nói bất ngờ, câu chuyện, lời hứa lợi ích và một hành động gây chú ý. Kèm cách nói con số cho thấm: nói số, dừng, rồi nói trọn câu.","tags":["Mở bài"],"level":"Cơ bản","min":6.2},{"ma":"PH-003","id":"hAOp4K3Yys0","vi":"Mở bài bất ngờ và tránh lỗi thường gặp","sum":"Thay vì giới thiệu bản thân, hãy mở bằng điều người nghe không ngờ tới. Video đi qua năm kỹ thuật mở bài, mỗi kỹ thuật kèm lỗi hay gặp và cách sửa: dừng đúng lúc, chờ phản hồi, vẽ hình ảnh rõ.","tags":["Mở bài"],"level":"Cơ bản","min":4.9},{"ma":"PH-004","id":"YtkrIaONxu0","vi":"Gợi cảm xúc mà không cần gọi tên cảm xúc","sum":"Điểm chung của chuyện hay là xuống tận khoảnh khắc thay vì nhìn từ trên cao. Khung PAST (Nơi chốn – Hành động – Lời thoại – Suy nghĩ) giúp biến một lúc bình thường thành cảnh người nghe như đang đứng trong đó. Cảm xúc hiện ra qua suy nghĩ và cơ thể, không cần nói 'tôi rất lo'.","tags":["Kể chuyện"],"level":"Cơ bản","min":18.6},{"ma":"PH-005","id":"9JAAtcduks0","vi":"5 lỗi khiến bài nói khó hiểu","sum":"Nói rõ là kỹ năng tập được, không phải năng khiếu. Video chỉ ra năm lỗi hay gặp: nói lan man, nghĩ gì nói nấy không có khung, dùng khái niệm trừu tượng, cố tỏ ra giỏi và kết thúc nhạt. Mỗi lỗi có cách sửa đơn giản.","tags":["Nói rõ"],"level":"Cơ bản","min":7.5},{"ma":"PH-006","id":"OEx8yRbNw9o","vi":"3 kỹ thuật nhỏ cho câu chuyện khó quên","sum":"Ba thay đổi nhỏ làm câu chuyện khác hẳn: vào thẳng hành động, cho người nghe thấy cảm xúc thay vì gọi tên, và dùng lời thoại trực tiếp. Video ngắn, xem xong là áp dụng được ngay.","tags":["Kể chuyện","Mở bài"],"level":"Cơ bản","min":3.7},{"ma":"PH-007","id":"UNKSfU3vu2U","vi":"5 thói quen nói chuyện ai cũng học được","sum":"Giao tiếp tốt đến từ thói quen chứ không phải bẩm sinh. Năm thói quen: khen cụ thể, tự trêu mình nhẹ nhàng, báo trước có mấy ý, dùng hình ảnh so sánh và kể một khoảnh khắc nhỏ thay cho một nhận định.","tags":["Nói rõ","Kể chuyện"],"level":"Cơ bản","min":8.8},{"ma":"PH-008","id":"lQzXngGTMqs","vi":"Zoom vào khoảnh khắc với khung PAST","sum":"Mọi mẹo kể chuyện quy về một việc: dừng lại ở một khoảnh khắc. Khung PAST (Nơi chốn – Hành động – Lời thoại – Suy nghĩ) là cách làm cụ thể. Chỉ cần ba trong bốn yếu tố là chuyện đã sống động.","tags":["Kể chuyện"],"level":"Cơ bản","min":7.4},{"ma":"PH-009","id":"55nHL8y-UWg","vi":"5 bước để kể chuyện hay hơn","sum":"Kể chuyện là một hệ thống luyện được qua năm bước: có khung chuyện, thêm kỹ thuật, tìm chuyện từ chính đời mình, tập có phản hồi và kể chuyện nhỏ hằng ngày. Video đi qua từng bước kèm bài tập.","tags":["Kể chuyện"],"level":"Cơ bản","min":22.1},{"ma":"PH-010","id":"Hqdd2t_CWs8","vi":"Khung 3 bước cho câu chuyện cuốn hút","sum":"Một câu chuyện đáng nhớ đi qua ba bước: bối cảnh (nhân vật muốn gì), thử thách (phần dài và quan trọng nhất) và giải quyết (nhân vật thay đổi ra sao). Video giải thích vì sao phần thử thách cần được kể kỹ nhất.","tags":["Kể chuyện"],"level":"Cơ bản","min":6.6},{"ma":"PH-011","id":"gQ0scsHZy94","vi":"25 điều về kể chuyện nên biết sớm","sum":"Một loạt mẹo ngắn gọn về kể chuyện: phóng to khoảnh khắc, có xung đột và sự thay đổi, nói như đang trò chuyện. Video cũng nhấn mạnh việc tích lũy dần một kho chuyện của riêng mình.","tags":["Kể chuyện"],"level":"Cơ bản","min":18.6},{"ma":"PH-012","id":"CqDItsy4JVY","vi":"Tổng hợp lời khuyên kể chuyện sau nhiều năm luyện tập","sum":"Ai cũng có hàng trăm chuyện đáng kể nằm trong những khoảnh khắc nhỏ. Video tổng hợp cách mở chuyện mạnh, khung Bối cảnh – Trở ngại – Giải quyết – Điều rút ra, cách cho thấy thay vì kể lể và cách xây kho chuyện. Dài, nên xem từng phần.","tags":["Kể chuyện","Mở bài"],"level":"Nâng cao","min":54.7},{"ma":"PH-013","id":"cwXMVbo7IAI","vi":"Mở bài thuyết trình khiến người nghe không rời mắt","sum":"Mở bằng tên và chức danh làm người nghe nghĩ 'biết rồi' và thả trôi. Video gợi ý năm cách mở bất ngờ, trong đó câu chuyện ngắn được dùng nhiều nhất. Lời hứa đầu bài nên nói từ góc người nghe: họ được gì.","tags":["Mở bài"],"level":"Cơ bản","min":14.7},{"ma":"PH-014","id":"Fx7diwJaWW8","vi":"Sức hút đến từ đâu khi giao tiếp","sum":"Sức hút không nằm ở ngoại hình hay cố gây ấn tượng. Video nói về ba trụ: có mặt trọn vẹn với người đối diện, ấm áp và biết cho đi có giới hạn, bớt bận tâm người khác nghĩ gì về mình.","tags":["Tự tin"],"level":"Cơ bản","min":8.0},{"ma":"PH-015","id":"kPlzq2y72UI","vi":"Cách nhanh nhất để luyện kể chuyện mỗi ngày","sum":"Kể chuyện dở thường vì tập quá ít lần. Mỗi lần được hỏi 'dạo này thế nào' là một cơ hội kể một chuyện tí hon, rồi hỏi lại để người kia kể chuyện của họ.","tags":["Kể chuyện"],"level":"Cơ bản","min":3.6},{"ma":"PH-016","id":"FzNsuosjODY","vi":"Sắp xếp ý để nói mạch lạc","sum":"Nói mạch lạc không phải do thông minh hơn mà do có sẵn khung xếp ý. Ba khung đủ dùng cho hầu hết câu hỏi: PREP (Ý kiến – Lý do – Ví dụ – Nhắc lại), Việc gì – Vì sao quan trọng – Làm gì tiếp, và Quá khứ – Hiện tại – Tương lai.","tags":["Nói rõ"],"level":"Cơ bản","min":4.5},{"ma":"PH-017","id":"lSwkMutBsGk","vi":"Kỹ thuật kể chuyện của người kể giỏi","sum":"Người kể giỏi dựa vào kỹ thuật hơn là năng khiếu. Video đi qua các bước: vào thẳng hành động, nói rõ nhân vật muốn gì, hé lộ điều mình đoán trong đầu, dùng lời thoại và kết bằng đúng một điều rút ra.","tags":["Kể chuyện","Kết bài"],"level":"Cơ bản","min":10.8},{"ma":"PH-018","id":"8Htsjz3uqnk","vi":"Giữ bình tĩnh khi bị góp ý trước mọi người","sum":"Khi bị chê giữa đám đông, đừng đứng hình cũng đừng cãi lại. Hãy cảm ơn, hỏi thêm để hiểu đúng, rồi nhắc lại điều mình nghe được để người kia thấy được lắng nghe.","tags":["Tự tin","Nói rõ"],"level":"Cơ bản","min":3.8},{"ma":"PH-019","id":"e208WjrgJGM","vi":"3 bài học lớn về kể chuyện","sum":"Ba điều tách chuyện thường khỏi chuyện hay: nhân vật có nét riêng, có một chi tiết bất ngờ và cho thấy sự thay đổi. Video gợi ý cách kiểm tra chuyện của mình theo ba điều này.","tags":["Kể chuyện"],"level":"Cơ bản","min":7.0},{"ma":"PH-020","id":"epKEXCHjp4M","vi":"Kể chuyện để người xem ở lại đến cuối video","sum":"Một khóa đầy đủ về giữ chân người xem bằng kể chuyện thay vì dựng cầu kỳ. Nội dung gồm chọn khung chuyện theo độ dài video, phóng to khoảnh khắc, dùng 'nhưng / vì vậy' thay cho 'và rồi', liên tục gợi câu hỏi. Rất dài, phù hợp khi đã quen cơ bản.","tags":["Kể chuyện","Trước camera"],"level":"Nâng cao","min":88.2},{"ma":"PH-021","id":"3FqBFO0NPuE","vi":"Công thức kể chuyện cho video ngắn","sum":"Video ngắn hay không nằm ở nói nhanh mà ở ít nhịp, mở bằng hình ảnh gây chú ý, gợi một câu hỏi khiến người xem muốn biết và trả lời gọn ở cuối. Ý tưởng nên xoay quanh người xem trước, chuyện của mình sau. Dạng phỏng vấn dài.","tags":["Trước camera","Kể chuyện","Mở bài"],"level":"Nâng cao","min":46.2},{"ma":"PH-022","id":"qkRruZWJAdU","vi":"Nói rõ ràng và có sức nặng","sum":"Người nói có sức nặng không mở bằng thủ tục mà bằng lợi ích cho người nghe. Họ nói kết luận trước, dám dừng lại im lặng, giữ một ý chính và bước lên với tâm thế giúp người nghe.","tags":["Nói rõ","Tự tin"],"level":"Cơ bản","min":7.0},{"ma":"PH-024","id":"f8yoh1rk_6I","vi":"3 kỹ thuật làm khoảnh khắc thường thành đáng nhớ","sum":"Ba kỹ thuật: nhập vai nhân vật khi kể (giọng, dáng, lời thoại), gài những cái móc khiến người nghe chờ đợi, và dựng điều mình tưởng rồi lật ngược bằng điều thật sự xảy ra.","tags":["Kể chuyện"],"level":"Nâng cao","min":8.5},{"ma":"PH-025","id":"qLdwSFgjZpQ","vi":"5 kỹ thuật nói để người nghe nhớ lâu","sum":"Năm kỹ thuật dùng được ngay: đảo ngược điều người nghe chờ đợi, kể một khoảnh khắc nhỏ, lặp lại đầu câu, đặt hai ý đối lập và so sánh cái mới với điều đã quen.","tags":["Nói rõ"],"level":"Cơ bản","min":6.8},{"ma":"PH-026","id":"Wly7WWkWQ1Q","vi":"Học kể chuyện qua 5 bước","sum":"Lộ trình tự học: kể chuyện tí hon mỗi ngày, tìm chuyện trong đời thường, xem người kể giỏi và tự hỏi họ dùng kỹ thuật gì, tìm bạn tập cùng, và đặt một mục tiêu đủ thử thách.","tags":["Kể chuyện"],"level":"Cơ bản","min":11.1},{"ma":"PH-027","id":"tY_Gq9lJLUQ","vi":"Xây kho chuyện và luyện kể đều đặn","sum":"Vài bài tập ngắn mỗi ngày, tổng chưa tới 10 phút: ghi một khoảnh khắc đáng kể, nói ứng khẩu thành một chuyện nhỏ và lưu lại vào kho chuyện. Làm đều sẽ không bao giờ thiếu chuyện để kể.","tags":["Kể chuyện"],"level":"Cơ bản","min":8.3},{"ma":"PH-028","id":"DZKFPqeuXRU","vi":"5 cách mở đầu một câu chuyện","sum":"Đừng mở bằng câu 'để mình kể bạn nghe'. Hãy vào ngay hành động, một câu thoại, một câu hỏi, một nét về nhân vật hoặc đúng lúc căng thẳng nhất. Video rất ngắn.","tags":["Mở bài","Kể chuyện"],"level":"Cơ bản","min":2.4},{"ma":"PH-029","id":"EZ8vu8CVnXc","vi":"Nói bằng hình ảnh để người nghe hiểu ngay","sum":"Ý trừu tượng dễ trôi qua tai. Ba công cụ giúp người nghe 'thấy' ý của bạn: so sánh với điều quen thuộc, mời họ tưởng tượng một tình huống có chính họ trong đó, hoặc kể lúc bạn nhận ra điều ấy.","tags":["Nói rõ"],"level":"Cơ bản","min":5.3},{"ma":"PH-030","id":"5OPZov6p3ng","vi":"Bớt sợ camera nhờ luyện mỗi ngày","sum":"Sự tự tin trước ống kính đến từ số lần làm, chấp nhận hơi khó chịu và chuyển sự chú ý từ bản thân sang người xem. Video gợi ý cách đặt thử thách quay hằng ngày với luật đơn giản và khởi động trước khi nói.","tags":["Trước camera","Tự tin"],"level":"Cơ bản","min":11.2},{"ma":"PH-031","id":"Xia31fE-01o","vi":"Tin rằng mình xử lý được mọi tình huống khi nói","sum":"Điều kìm người nói nhiều nhất là nỗi sợ có gì trục trặc. Niềm tin 'mình xoay xở được' luyện được qua tập ứng khẩu, tập trong nhóm an toàn và dần quen với cảm giác hơi ngượng.","tags":["Tự tin"],"level":"Cơ bản","min":6.5},{"ma":"PH-032","id":"eBYselqd5y8","vi":"Đi sâu vào khó khăn để câu chuyện có chiều sâu","sum":"Chuyện hay nằm ở độ sâu của khó khăn, nhất là lúc nhân vật nghi ngờ bản thân nhất. Video bàn về nỗi ngại kể mặt chưa đẹp của mình, cách dùng 'nhưng / vì vậy', vào muộn ra sớm. Dài, nhiều ý, hợp khi đã có vài chuyện trong kho.","tags":["Kể chuyện"],"level":"Nâng cao","min":49.0},{"ma":"PH-033","id":"ZFKHTFYXppw","vi":"5 thói quen của người nói chuyện cuốn hút","sum":"Năm thói quen luyện được: thoải mái với khoảng lặng, báo trước lộ trình ý, nói bằng hình ảnh, dùng giọng lên xuống đa dạng và lắng nghe để hiểu chứ không để chờ đến lượt.","tags":["Nói rõ","Tự tin"],"level":"Cơ bản","min":12.6},{"ma":"PH-034","id":"4aLEICaDCqI","vi":"Kết bài để người nghe nhớ mãi","sum":"Phần kết là điều người nghe mang về. Kết mạnh theo ba bước: tóm lại ý chính, nêu một hành động cụ thể, chốt bằng một câu đáng nhớ rồi dừng hẳn.","tags":["Kết bài"],"level":"Cơ bản","min":2.4},{"ma":"PH-035","id":"gxlnhR-_HdE","vi":"Kể chuyện theo 6 bước cho người làm nội dung","sum":"Khung sáu bước cho video kể chuyện: mục tiêu, bối cảnh, kế hoạch, diễn biến lên xuống, cao trào và điều chiêm nghiệm. Video chỉ cách giữ tò mò bằng các trở ngại lớn dần.","tags":["Kể chuyện","Trước camera"],"level":"Nâng cao","min":8.2},{"ma":"PH-036","id":"h1U88aYxUpI","vi":"Luyện phản xạ nói nhanh mà vẫn bình tĩnh","sum":"Phản ứng nhanh không tùy vào độ thông minh mà vào khả năng giữ bình tĩnh khi bị bất ngờ. Video gợi ý ba bài tập tự làm để quen với áp lực và biết thở một nhịp trước khi trả lời.","tags":["Tự tin"],"level":"Cơ bản","min":6.5},{"ma":"PH-037","id":"VtuBgUt94nA","vi":"7 lỗi khiến kênh video chậm phát triển","sum":"Kênh lớn lên khi người ta bấm vào và xem tiếp. Video chỉ ra bảy lỗi hay gặp khi làm kênh và cách sửa, trong đó kể chuyện là điểm mấu chốt. Hợp với ai đang làm kênh nội dung.","tags":["Trước camera"],"level":"Nâng cao","min":8.6},{"ma":"PH-038","id":"swU_BuUfdLM","vi":"Thêm từng lớp kỹ thuật vào một câu chuyện","sum":"Lấy một chuyện bình thường rồi lần lượt thêm năm lớp: gợi câu hỏi, nói rõ được mất, lời thoại, suy nghĩ trong đầu và cảm xúc qua cơ thể. Thấy rõ mỗi lớp làm chuyện khác đi thế nào.","tags":["Kể chuyện"],"level":"Nâng cao","min":8.9},{"ma":"PH-039","id":"8PhOt6LAAB0","vi":"7 kỹ thuật làm câu chuyện hay hơn","sum":"Bảy kỹ thuật: gợi người nghe muốn nghe trước khi kể, nêu mục tiêu, đặt trở ngại, cho thấy cảm xúc, chia sẻ suy nghĩ, thêm áp lực thời gian và dùng lời thoại.","tags":["Kể chuyện"],"level":"Nâng cao","min":6.1},{"ma":"PH-040","id":"Dg00hYIsi_M","vi":"Biến chuyện thường ngày thành chuyện đáng kể","sum":"Câu chuyện làm mọi thứ có thêm giá trị, và ai cũng kể giỏi được nhờ bốn thói quen: để ý khoảnh khắc, ứng khẩu thành chuyện, kể một chuyện nhỏ khi được hỏi thăm và lưu lại vào kho chuyện.","tags":["Kể chuyện"],"level":"Cơ bản","min":10.8},{"ma":"PH-041","id":"3klCR9IS--s","vi":"5 kỹ thuật cho một câu chuyện ngắn cuốn hút","sum":"Một câu chuyện ngắn cuốn hút nhờ năm kỹ thuật: câu mở gây tò mò, vào thẳng hành động, một chi tiết bất ngờ, lời thoại nguyên văn và điều rút ra dành cho người nghe.","tags":["Kể chuyện","Mở bài"],"level":"Cơ bản","min":5.6},{"ma":"PH-042","id":"Xa282PF7_wA","vi":"Sống lại khoảnh khắc khi kể chuyện","sum":"Điều quan trọng nhất là dừng ở một khoảnh khắc cụ thể. Trước khi kể, hãy nhắm mắt quay lại lúc đó: mình thấy gì, nghe gì, nghĩ gì. Rồi kể theo khung PAST để người nghe như đang đứng cạnh mình.","tags":["Kể chuyện"],"level":"Cơ bản","min":22.8},{"ma":"PH-043","id":"0Tt18BxkGlk","vi":"Lộ trình để nói trước đám đông tốt hơn","sum":"Đừng bắt đầu bằng mẹo cử chỉ hay bỏ từ đệm. Hãy bớt bận tâm người khác nghĩ gì, luyện ứng khẩu, tự quay rồi xem lại để sửa từng điểm một, và biến mọi dịp nói hằng ngày thành buổi tập.","tags":["Tự tin","Nói rõ"],"level":"Nâng cao","min":21.1},{"ma":"PH-044","id":"_CnXi51MTLQ","vi":"7 cách mở đầu bài nói đơn giản","sum":"Bảy cách mở để giữ sự chú ý: câu nói bất ngờ, hỏi người nghe giơ tay, một câu trích, mời tưởng tượng, im lặng, câu hỏi và câu chuyện. Câu chuyện thường là cách hiệu quả nhất.","tags":["Mở bài"],"level":"Cơ bản","min":2.8},{"ma":"PH-046","id":"H9rTYIlkEXU","vi":"Để ý khoảnh khắc nhỏ – kỹ năng ít ai dạy","sum":"Kể chuyện giỏi không cần cuộc đời thú vị hơn. Cần ba thói quen: để ý những khoảnh khắc nhỏ, sống lại câu chuyện thay vì học thuộc, và kể chuyện nhỏ mỗi ngày.","tags":["Kể chuyện"],"level":"Cơ bản","min":6.5},{"ma":"PH-048","id":"VoaGniZSFGw","vi":"2 bài tập cho bạn hàng trăm ý tưởng chuyện","sum":"Hai bài tập đơn giản: mỗi tối ghi lại một khoảnh khắc đáng kể trong ngày, và đào ký ức theo bốn câu Lần đầu – Gần nhất – Tốt nhất – Tệ nhất. Làm đều, kho chuyện sẽ đầy lên rất nhanh.","tags":["Kể chuyện"],"level":"Cơ bản","min":6.9},{"ma":"PH-049","id":"MTTJUOFDK0A","vi":"Những điều rút ra sau nhiều khóa học kể chuyện","sum":"Ba bài học đáng giá: đưa cảm xúc vào bằng suy nghĩ thật trong đầu, đưa người nghe vào một cảnh cụ thể, và tin rằng mình đã có sẵn chuyện hay, chỉ cần đào lên.","tags":["Kể chuyện"],"level":"Cơ bản","min":7.0},{"ma":"PH-050","id":"OahwQSlPG0I","vi":"Xây sự tự tin ngay cả khi đang run","sum":"Tự tin không phải tính cách bẩm sinh mà là một vòng lặp xây được: gom bằng chứng mình từng làm được, luyện tập, khởi động trước khi nói, nhớ mục đích và tự ghi nhận sau mỗi lần nói.","tags":["Tự tin"],"level":"Cơ bản","min":10.0}];

<script>

   Dữ liệu người học lưu trên trình duyệt (localStorage + IndexedDB cho bản ghi). */

$all('img.dom-img').forEach(function(im){ im.src=DOM_SRC; });

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return (n<10?'0':'')+n; }
function dkey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return dkey(); }
function parseD(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(k,n){ var d=parseD(k); d.setDate(d.getDate()+n); return dkey(d); }
function vnDate(k){ var p=k.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(); }
var PREVIEW=/[?&]xem-truoc=1/.test(location.search); try{ if(localStorage.getItem('qtt-st-preview')==='1') PREVIEW=true; }catch(e){}

/* ---------- Dữ liệu tĩnh ---------- */
var BY={}; LESSONS.forEach(function(L){ BY[L.id]=L; });

  C:{name:'Thuyết trình trong công việc',short:'Thuyết trình',desc:'Báo cáo, đề xuất, trình bày rõ ràng trước sếp và đồng nghiệp.',pick:'Thuyết trình, báo cáo rõ ràng trước sếp và đồng nghiệp',who:'Nhân viên, trưởng nhóm phải báo cáo, đề xuất, trình bày trong họp',color:'var(--s4)'}
};
var STAGES=[null,
  {n:1,name:'Thấy chuyện',desc:'Tin rằng mình có chuyện để kể, tập thói quen nhặt chuyện mỗi ngày.',c:'--s1'},
  {n:2,name:'Dựng chuyện',desc:'Biến một kỷ niệm thành câu chuyện có cảnh, có căng thẳng, có điều rút ra.',c:'--s2'},
  {n:3,name:'Nói rõ, nói vững',desc:'Nói có khung, rõ ràng và bình tĩnh trước câu hỏi bất ngờ.',c:'--s3'},
  {n:4,name:'Chạm người nghe',desc:'Mở bài cuốn, kết bài đọng lại, kể bằng cả cảm xúc thật.',c:'--s4'},
  {n:5,name:'Về đích',desc:'Nhìn lại chặng đường và chọn 1 điều để luyện tiếp.',c:'--s5'}];
var LEVELS=['','Người nghe chuyện','Người nhặt chuyện','Người kể tập sự','Người kể vững vàng','Người kể truyền cảm hứng'];
var BADGES=[
  {id:'first',ic:'🌱',name:'Bước đầu tiên',how:'Xong ngày 1'},
  {id:'streak7',ic:'🔥',name:'Giữ lửa 7 ngày',how:'Chuỗi 7 ngày liên tục'},
  {id:'voice',ic:'🎙️',name:'Dám nói thành tiếng',how:'Lần đầu ghi âm và nghe lại'},
  {id:'kho10',ic:'📚',name:'Kho 10 chuyện',how:'Có 10 chuyện trong kho'},
  {id:'told',ic:'🤝',name:'Kể cho người thật',how:'Đã kể một chuyện cho người khác'},
  {id:'finish',ic:'🏁',name:'Về đích',how:'Xong 28 ngày'}];
var USES=['Trò chuyện','Phỏng vấn','Họp','Đào tạo','Video','Thuyết trình','Bán hàng'];
var BOOK_COL=['--s1','--s2','--s3','--s4','--s5'];

/* ---------- Trạng thái ---------- */
var S;
function blank(){ return {v:1,branch:null,created:today(),done:{},act:{},stories:[],badges:{},rec:{},pt:{},lastNew:null}; }
function load(){ try{ S=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ S=null; } if(!S||S.v!==1) S=blank(); ['done','act','badges','rec','pt'].forEach(function(k){ S[k]=S[k]||{}; }); S.stories=S.stories||[]; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('Trình duyệt không cho lưu dữ liệu. Hãy tắt chế độ ẩn danh.'); } }
load();

function path(b){ var p=[]; for(var i=1;i<=14;i++) p.push('d'+pad(i)); b=b||S.branch||'A'; for(i=15;i<=28;i++) p.push('d'+i+b); p.push('d29'); return p.filter(function(id){ return BY[id]; }); }
function nextId(){ var p=path(); for(var i=0;i<p.length;i++) if(!S.done[p[i]]) return p[i]; return null; }
function canStart(id){ if(PREVIEW) return true; if(S.done[id]) return true; if(id!==nextId()) return false; return S.lastNew!==today(); }
function isOpen(id){ if(PREVIEW||S.done[id]) return true; return id===nextId(); }
function totalXP(){ var x=0; for(var k in S.done) x+=S.done[k].xp||0; for(k in S.pt) x+=(S.pt[k].xp||0); return x; }
function level(){ var b=S.branch||'A', l=1; if(S.done.d07) l=2; if(S.done.d14) l=3; if(S.done['d21'+b]) l=4; if(S.done.d29) l=5; return l; }
function stageOf(L){ return STAGES[L.stage]||STAGES[1]; }
function markAct(){ var t=today(); S.act[t]=(S.act[t]||0)+1; }
function weekKey(k){ var d=parseD(k); var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return dkey(d); }
function streakInfo(){
  var keys=Object.keys(S.act).sort(); if(!keys.length) return {n:0,rest:{}};
  var first=keys[0], d=today(), n=0, used={}, rest={};
  for(var i=0;i<500;i++){
    if(d<first) break;
    if(S.act[d]) n++;
    else if(d===today()){}
    else { var w=weekKey(d); if(!used[w]){ used[w]=1; rest[d]=1; } else break; }
    d=addDays(d,-1);
  }
  return {n:n,rest:rest};
}
function storiesAll(){ return S.stories; }
function storyCount(){ return S.stories.length; }
function checkBadges(){
  var nw=[], b=S.badges, br=S.branch||'A';
  function give(id){ if(!b[id]){ b[id]=today(); nw.push(id); } }
  if(S.done.d01) give('first');
  if(streakInfo().n>=7) give('streak7');
  if(Object.keys(S.rec).length) give('voice');
  if(storyCount()>=10) give('kho10');
  if(S.stories.some(function(s){ return s.told; })) give('told');
  if(S.done['d28'+br]) give('finish');
  return nw;
}

/* ---------- IndexedDB cho bản ghi ---------- */
var idb=null;
function db(){ if(idb) return idb; idb=new Promise(function(res,rej){ if(!window.indexedDB) return rej(new Error('no idb')); var r=indexedDB.open('qtt-storytelling',1); r.onupgradeneeded=function(){ r.result.createObjectStore('rec'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); return idb; }
function recPut(k,v){ return db().then(function(d){ return new Promise(function(res,rej){ var t=d.transaction('rec','readwrite'); t.objectStore('rec').put(v,k); t.oncomplete=function(){ res(); }; t.onerror=function(){ rej(t.error); }; }); }); }
function recGet(k){ return db().then(function(d){ return new Promise(function(res){ var t=d.transaction('rec','readonly'); var r=t.objectStore('rec').get(k); r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ res(null); }; }); }).catch(function(){ return null; }); }
function recClear(){ return db().then(function(d){ return new Promise(function(res){ var t=d.transaction('rec','readwrite'); t.objectStore('rec').clear(); t.oncomplete=function(){ res(); }; }); }).catch(function(){}); }

/* ---------- Markdown nhỏ ---------- */
function inl(s){
  s=esc(s).replace(/\\([_\[\]*\\#.()\-!])/g,'$1');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<i>$2</i>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  if(!src) return '';
  var lines=String(src).replace(/\r/g,'').split('\n'), out='', i=0;
  while(i<lines.length){
    var ln=lines[i];
    if(!ln.trim()){ i++; continue; }
    if(/^\s*\|/.test(ln)){
      var rows=[]; while(i<lines.length&&/^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      var cells=function(r){ return r.trim().replace(/^\||\|$/g,'').split('|').map(function(c){ return c.trim(); }); };
      var h=cells(rows[0]), body=rows.slice(1).filter(function(r){ return !/^\s*\|?\s*:?-{2,}/.test(r); });
      out+='<div class="tbl-wrap"><table><thead><tr>'+h.map(function(c){ return '<th>'+inl(c)+'</th>'; }).join('')+'</tr></thead><tbody>'+body.map(function(r){ return '<tr>'+cells(r).map(function(c){ return '<td>'+inl(c)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>';
      continue;
    }
    if(/^\s*>/.test(ln)){ var q=[]; while(i<lines.length&&/^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; } out+='<blockquote>'+inl(q.join(' '))+'</blockquote>'; continue; }
    if(/^\s*(?:[-*]|\d+\.)\s+/.test(ln)){
      var ord=/^\s*\d+\./.test(ln), items=[];
      while(i<lines.length&&(/^\s*(?:[-*]|\d+\.)\s+/.test(lines[i])||(/^\s{2,}\S/.test(lines[i])&&items.length))){
        var l2=lines[i];
        if(/^\s{2,}(?:[-*]|\d+\.)\s+/.test(l2)&&items.length){ items[items.length-1].sub.push(l2.replace(/^\s*(?:[-*]|\d+\.)\s+/,'')); }
        else if(/^\s*(?:[-*]|\d+\.)\s+/.test(l2)){ items.push({t:l2.replace(/^\s*(?:[-*]|\d+\.)\s+(\[[ x]\]\s*)?/,''),sub:[]}); }
        else items[items.length-1].t+=' '+l2.trim();
        i++;
      }
      out+='<'+(ord?'ol':'ul')+'>'+items.map(function(it){ return '<li>'+inl(it.t)+(it.sub.length?'<ul>'+it.sub.map(function(s){ return '<li>'+inl(s)+'</li>'; }).join('')+'</ul>':'')+'</li>'; }).join('')+'</'+(ord?'ol':'ul')+'>';
      continue;
    }
    var p=[]; while(i<lines.length&&lines[i].trim()&&!/^\s*(\||>|[-*]\s|\d+\.\s)/.test(lines[i])){ p.push(lines[i].trim()); i++; }
    out+='<p>'+inl(p.join(' '))+'</p>';
  }
  return out;
}
function plain(s){ return String(s||'').replace(/\*\*|\*|\\/g,''); }

  return '<div class="pick-st">'+S.stories.slice().reverse().map(function(s){ return '<label class="'+(sel===s.id?'on':'')+'"><input type="radio" name="pst" value="'+s.id+'"'+(sel===s.id?' checked':'')+' data-act="pick-st"><span>'+(s.seed?'🌱 ':'📗 ')+esc(storyLabel(s))+'</span></label>'; }).join('')+'</div>';
}

function collectPractice(){

function savePracticeData(L){
  var p=L.practice||{}, vals=(p.fields||[]).map(function(f,i){ return {label:f.label,val:(LP.f[i]||'').trim()}; }).filter(function(x){ return x.val; });
  var t=today(), n=0;
  if(p.saveAs==='seeds') vals.forEach(function(v){ S.stories.push({id:uid(),seed:true,text:v.val,tag:v.label,from:L.id,created:t}); n++; });
  if(p.saveAs==='storyNote'&&vals.length){
    var s=S.stories.filter(function(x){ return x.id===LP.picked; })[0];
    if(s){ s.notes=s.notes||[]; s.notes.push({day:L.day,lid:L.id,title:L.title,items:vals,at:t}); if(!s.seed&&(s.stars||1)<2) s.stars=2; }
    else { S.stories.push({id:uid(),seed:true,text:vals.map(function(v){ return v.val; }).join(' · '),tag:L.title,from:L.id,created:t}); n++; }
  }
  if(p.widget&&WIDGET_SAVE[p.widget]) n+=WIDGET_SAVE[p.widget](L)||0;
  return n;
}
function finishLesson(){
  var L=BY[LP.id], good=($('#rvGood')||{}).value||LP.good, nx=($('#rvNext')||{}).value||LP.next;

  var lvBefore=level(), xp=L.milestone?100:50;
  S.done[LP.id]={at:today(),xp:xp,review:L.review.map(function(_,i){ return !!LP.rv[i]; }),good:good,next:nx,fields:LP.f,branch:L.branch||null};
  S.lastNew=today(); markAct();
  var seeds=LP.savedN||0;
  var nb=checkBadges(); save();
  var lvAfter=level(), nid=nextId();
  var h='<div class="celebrate" style="'+stVars(L)+'">'+domImg()+'<h1>'+(L.milestone?'Qua màn rồi!':'Xong Ngày '+L.day+'!')+'</h1><div class="bubble" style="text-align:left;margin-top:10px"><b>Đốm:</b> '+inl(L.done)+'</div><div class="xp-pop">+'+xp+' XP</div>';

  if(nb.length) h+='<p class="small muted">Huy hiệu mới</p><div class="badges-new">'+nb.map(function(id){ var b=BADGES.filter(function(x){ return x.id===id; })[0]; return '<div class="bdg"><i>'+b.ic+'</i><b>'+b.name+'</b></div>'; }).join('')+'</div>';
  if(seeds) h+='<p class="small muted">Đã thêm '+seeds+' mục vào Kho chuyện.</p>';
  if(L.milestone&&L.day===7) h+='<div class="lock-note" style="margin-top:14px;text-align:left">'+domImg()+'<div class="small"><b>Nhớ sao lưu tiến độ.</b> Tiến độ lưu trên trình duyệt này. Muốn chuyển máy hoặc phòng khi xóa dữ liệu trình duyệt, vào <a href="#/ve-cong-cu">Về công cụ</a> → Sao lưu.</div></div>';
  h+='<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px"><a class="btn btn-primary btn-lg" href="#/">Về trang Hôm nay</a><a class="btn btn-secondary" href="#/ban-do">Xem bản đồ</a></div>';
  if(nid) h+='<p class="small muted" style="margin-top:12px">Bài tiếp theo: <b>Ngày '+BY[nid].day+' – '+esc(BY[nid].title)+'</b> mở vào ngày mai.</p>';
  h+=moreVideos(L)+'</div>';
  LP=null; view.innerHTML=h; scrollTop(); confetti();

function moreVideos(L){
  var vs=(L.videos||[]).map(function(m){ return VBY[m]; }).filter(Boolean);

}

/* ---------- Đồng hồ ---------- */
var media={stream:null,rec:null,timer:null};
function stopMedia(){ if(media.timer){ clearInterval(media.timer); media.timer=null; } try{ if(media.rec&&media.rec.state!=='inactive') media.rec.stop(); }catch(e){} if(media.stream){ media.stream.getTracks().forEach(function(t){ t.stop(); }); media.stream=null; } stopSpeech(); }
function beep(){ try{ var C=window.AudioContext||window.webkitAudioContext; var c=new C(), o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(c.destination); o.start(); setTimeout(function(){ o.stop(); c.close(); },350); }catch(e){} if(navigator.vibrate) navigator.vibrate(200); }
function mountTimer(box,sec){
  var left=sec, run=false, R=66, C=2*Math.PI*R;
  box.innerHTML='<div class="timer"><div class="t-ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="'+R+'"/><circle class="fg" cx="75" cy="75" r="'+R+'" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg><b>0:00</b></div><div class="t-act"><button class="btn btn-primary btn-sm" data-t="go">▶ Bắt đầu</button><button class="btn btn-secondary btn-sm" data-t="reset">↺ Làm lại</button></div></div>';
  var ring=$('.t-ring',box), fg=$('.fg',box), lbl=$('b',ring), btn=$('[data-t="go"]',box);
  function draw(){ lbl.textContent=Math.floor(left/60)+':'+pad(left%60); fg.setAttribute('stroke-dashoffset',String(C*(1-left/sec))); ring.classList.toggle('warn',left<=5&&left>0); }
  function tick(){ left--; if(left<=0){ left=0; stop(); beep(); toast('Hết giờ! Nói nốt câu đang dở rồi dừng nhé.'); } draw(); }
  function stop(){ run=false; clearInterval(media.timer); media.timer=null; btn.textContent='▶ Tiếp tục'; }
  btn.onclick=function(){ if(run){ stop(); return; } if(left<=0) left=sec; run=true; btn.textContent='⏸ Tạm dừng'; clearInterval(media.timer); media.timer=setInterval(tick,1000); };
  $('[data-t="reset"]',box).onclick=function(){ stop(); left=sec; btn.textContent='▶ Bắt đầu'; draw(); };
  draw();
}

/* ---------- Ghi âm / quay ---------- */
function mountRecorder(box,key,mode){
  var can=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  if(!can){ box.innerHTML='<p class="small muted">Trình duyệt này chưa hỗ trợ ghi âm. Bạn dùng ứng dụng ghi âm của điện thoại rồi nghe lại nhé.</p>'; return; }
  var chunks=[], url=null;
  function ui(state,blob){
    var h='<div class="rec"><div class="rec-row"><span class="rec-mode"><button data-m="audio" class="'+(mode==='audio'?'on':'')+'">🎙️ Ghi âm</button><button data-m="video" class="'+(mode==='video'?'on':'')+'">🎥 Quay video</button></span>';
    if(state==='rec') h+='<span class="rec-dot"></span><b>Đang ghi…</b><button class="btn btn-primary btn-sm" data-r="stop">■ Dừng</button>';
    else h+='<button class="btn btn-primary btn-sm" data-r="start">● '+(blob?'Ghi lại lần nữa':'Bắt đầu ghi')+'</button>';
    h+='</div>';
    if(state==='rec'&&mode==='video') h+='<video id="recLive" autoplay muted playsinline></video>';
    if(blob&&state!=='rec'){ if(url) URL.revokeObjectURL(url); url=URL.createObjectURL(blob.blob||blob); h+=(/video/.test((blob.blob||blob).type)?'<video controls playsinline src="'+url+'"></video>':'<audio controls src="'+url+'"></audio>')+'<p class="small faint">Bản ghi lưu trên máy bạn'+(blob.at?' · '+vnDate(blob.at):'')+'. Không gửi đi đâu.</p>'; }
    box.innerHTML=h+'</div>';
    $all('[data-m]',box).forEach(function(b){ b.onclick=function(){ if(state==='rec') return; mode=b.getAttribute('data-m'); ui(state,blob); }; });
    var st=$('[data-r="start"]',box); if(st) st.onclick=start;
    var sp=$('[data-r="stop"]',box); if(sp) sp.onclick=function(){ try{ media.rec.stop(); }catch(e){} };
  }
  function start(){
    navigator.mediaDevices.getUserMedia(mode==='video'?{audio:true,video:{facingMode:'user',width:{ideal:720}}}:{audio:true}).then(function(stream){
      media.stream=stream; chunks=[];
      var r; try{ r=new MediaRecorder(stream); }catch(e){ toast('Không ghi được trên trình duyệt này.'); return; }
      media.rec=r;
      r.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
      r.onstop=function(){ stream.getTracks().forEach(function(t){ t.stop(); }); media.stream=null; var b=new Blob(chunks,{type:r.mimeType||(mode==='video'?'video/webm':'audio/webm')}); var rec={blob:b,at:today()};
        recPut(key,rec).then(function(){ var first=!Object.keys(S.rec).length; S.rec[key]=today(); markAct(); var nb=checkBadges(); save(); if(nb.indexOf('voice')>=0) toast('🎙️ Huy hiệu mới: Dám nói thành tiếng!'); else if(first) toast('Đã lưu bản ghi.'); }).catch(function(){ toast('Không lưu được bản ghi trên máy này, nhưng bạn vẫn nghe lại được ngay.'); });
        ui('idle',rec); };
      r.start(); ui('rec');
      if(mode==='video'){ var v=$('#recLive',box); if(v) v.srcObject=stream; }
    }).catch(function(){ toast('Bạn cần cho phép dùng micro'+(mode==='video'?'/camera':'')+' để ghi.'); });
  }
  ui('idle',null);
  recGet(key).then(function(b){ if(b&&!media.rec) ui('idle',b); });
}
