<style>
:root{
  --bg:#F4EFE5; --surface:#FBF8F2; --surface-2:#F7F2E8; --surface-3:#EFE7D8;
  --border:#E3DACB; --border-strong:#D3C7B4;
  --text:#231E19; --text-muted:#6B6259; --text-faint:#988D80;
  --accent:#2F7D4F; --accent-2:#3E9A63; --accent-strong:#245F3D; --accent-soft:#E3F1E8; --accent-soft-strong:#CDE6D6;
  --gold:#B7791F; --gold-soft:#F7EBD4;
  --info:#2F5F8F; --info-soft:#E2ECF5;
  --danger:#A63A2B; --danger-soft:#F8E3DE;
  --s1:#C0763A; --s1-soft:#F6E6D6;
  --s2:#2F7D4F; --s2-soft:#E3F1E8;
  --s3:#3A6E9C; --s3-soft:#E2ECF5;
  --s4:#7A4E9C; --s4-soft:#EEE5F5;
  --s5:#B7791F; --s5-soft:#F7EBD4;
  --shadow-sm:0 1px 2px rgba(35,30,25,.06);
  --shadow-md:0 1px 2px rgba(35,30,25,.06),0 10px 28px -12px rgba(35,30,25,.22);
  --f-wall:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-ui:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --radius:16px; --radius-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-2:#58B07C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --gold:#E8B06A; --gold-soft:#3A2C1C; --info:#8DB6E0; --info-soft:#1B2633; --danger:#E58B7C; --danger-soft:#3A1F1A;
  --s1:#E39A5F; --s1-soft:#3A2A1D; --s2:#6CC08C; --s2-soft:#1C2E23; --s3:#86B2DE; --s3-soft:#1B2633; --s4:#B992DA; --s4-soft:#2B2133; --s5:#E8B06A; --s5-soft:#3A2C1C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-2:#58B07C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --gold:#E8B06A; --gold-soft:#3A2C1C; --info:#8DB6E0; --info-soft:#1B2633; --danger:#E58B7C; --danger-soft:#3A1F1A;
  --s1:#E39A5F; --s1-soft:#3A2A1D; --s2:#6CC08C; --s2-soft:#1C2E23; --s3:#86B2DE; --s3-soft:#1B2633; --s4:#B992DA; --s4-soft:#2B2133; --s5:#E8B06A; --s5-soft:#3A2C1C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;-webkit-font-smoothing:antialiased;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-wall);margin:0;font-weight:600;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
a{color:var(--accent-strong)}
[hidden]{display:none!important}
::selection{background:var(--accent-soft-strong)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Khung */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.tb{max-width:1080px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0;background:none;border:none;padding:0;text-align:left}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{display:block;font-family:var(--f-wall);font-size:15px;font-weight:600;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--text-muted)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;text-decoration:none;color:var(--text-muted);font-weight:500;font-size:14px;white-space:nowrap}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent-strong)}
.nav svg{width:18px;height:18px}
.tb-stats{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--surface-3);font-size:13px;font-weight:600;white-space:nowrap}
.pill.fire{background:var(--s1-soft);color:var(--s1)}
.pill.xp{background:var(--gold-soft);color:var(--gold)}
.main{max-width:1080px;margin:0 auto;padding:24px 20px 120px}
.foot{border-top:1px solid var(--border);color:var(--text-muted);font-size:13px}
.foot-in{max-width:1080px;margin:0 auto;padding:18px 20px 28px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.foot a{color:var(--text-muted)}
.bnav{display:none}
@media (max-width:820px){
  .nav{display:none}
  .tb{padding:8px 14px}
  .tb-stats{margin-left:auto}
  .brand small{display:none}
  .main{padding:16px 14px 120px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--text-muted);text-decoration:none;border-radius:10px}
  .bnav a.on{color:var(--accent-strong);background:var(--accent-soft)}
  .bnav svg{width:22px;height:22px}
  .foot-in{padding-bottom:90px}
}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:600;font-size:15px;text-decoration:none;line-height:1.2;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#10180f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#10180f}}
.btn-primary:hover{background:var(--accent-strong)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--surface-3)}
.btn-ghost{background:none;color:var(--text-muted)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-lg{padding:14px 24px;font-size:16px;border-radius:14px}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);font-size:13.5px;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.pad{padding:20px}
.muted{color:var(--text-muted)}
.faint{color:var(--text-faint)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-h h2{font-size:20px}
.page-h{margin-bottom:18px}
.page-h h1{font-size:26px}
.page-h p{color:var(--text-muted);margin-top:4px}

/* Markdown */
.md p{margin:0 0 .75em}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 .75em;padding-left:1.3em}
.md li{margin:.2em 0}
.md blockquote{margin:0 0 .75em;padding:12px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-family:var(--f-wall);font-weight:500}
.md table{border-collapse:collapse;width:100%;margin:0 0 .75em;font-size:14px}
.md th,.md td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface-3);font-weight:600}
.tbl-wrap{overflow-x:auto;margin:0 0 .75em}
.tbl-wrap table{margin:0}

/* Onboarding */
.onb{max-width:760px;margin:20px auto}
.onb-hero{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.onb-hero img{width:92px;height:92px;flex:none;animation:bob 3s ease-in-out infinite}
.onb-hero h1{font-size:28px}
.onb-hero p{color:var(--text-muted);margin-top:6px;font-size:16px}
.bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.br-opts{display:grid;gap:12px;margin:16px 0 20px}
.br-opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px;transition:border-color .15s,transform .1s}
.br-opt:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.br-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.br-ic{width:46px;height:46px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--f-wall);font-weight:700;font-size:18px;color:#fff}
.br-opt .br-ic{display:flex;color:#fff;margin:0;font-size:18px}
.br-opt b{display:block;font-size:16px;font-family:var(--f-wall);font-weight:600}
.br-opt span:not(.br-ic){display:block;color:var(--text-muted);font-size:14px;margin-top:2px}
.onb-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.onb-facts div{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--text-muted)}
.onb-facts b{display:block;font-family:var(--f-wall);font-size:20px;color:var(--text)}
@media (max-width:640px){.onb-facts{grid-template-columns:1fr}.onb-hero img{width:70px;height:70px}.onb-hero h1{font-size:22px}}

/* Hôm nay */
.hello{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.hello img{width:56px;height:56px}
.hello h1{font-size:24px}
.hello p{color:var(--text-muted)}
.today{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media (max-width:820px){.today{grid-template-columns:1fr}}
.lesson-hero{position:relative;overflow:hidden;border-radius:20px;padding:24px;color:var(--text);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.lesson-hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--stc)}
.lh-tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--stc);background:var(--stc-soft);padding:4px 10px;border-radius:99px}
.lesson-hero h2{font-size:26px;margin:12px 0 6px}
.lesson-hero .hook{color:var(--text-muted);font-size:16px}
.lh-steps{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}
.lh-steps span{font-size:12.5px;background:var(--surface-3);border-radius:99px;padding:4px 10px;color:var(--text-muted)}
.lh-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lh-wait{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:14px;padding:14px;margin-top:14px}
.lh-wait img{width:40px;height:40px}
.stat-card{padding:18px}
.lvl{display:flex;gap:12px;align-items:center}
.lvl-badge{width:52px;height:52px;flex:none;border-radius:16px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-wall);font-weight:700;font-size:22px}
.lvl b{font-family:var(--f-wall);font-size:16px}
.bar{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .6s}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-family:var(--f-wall);font-size:20px}
.kpi span{font-size:12px;color:var(--text-muted)}
.week{display:flex;gap:6px;margin-top:14px;justify-content:space-between}
.week div{flex:1;text-align:center;font-size:11px;color:var(--text-faint)}
.week i{display:block;margin:0 auto 4px;width:26px;height:26px;border-radius:50%;background:var(--surface-3);border:2px solid transparent}
.week i.ok{background:var(--accent);border-color:var(--accent)}
.week i.rest{background:var(--gold-soft);border-color:var(--gold)}
.week i.today{border-color:var(--accent)}
.moment{display:flex;gap:10px;align-items:stretch}
.moment textarea{flex:1}
.inp,textarea.inp,select.inp{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:11px;background:var(--surface);resize:vertical;min-width:0}
.inp:focus{outline:2px solid var(--accent-soft-strong);border-color:var(--accent)}
label.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.fld .inp{font-weight:400}

/* Bản đồ */
.map{display:flex;flex-direction:column;gap:18px}
.region{position:relative;border-radius:22px;padding:20px;background:var(--rs);border:1px solid color-mix(in srgb,var(--rc) 25%,var(--border))}
.region.locked{filter:grayscale(.6);opacity:.75}
.rg-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rg-n{width:44px;height:44px;border-radius:14px;background:var(--rc);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-wall);font-weight:700;font-size:18px}
.rg-h h3{font-size:19px}
.rg-h p{color:var(--text-muted);font-size:14px}
.rg-prog{margin-left:auto;font-size:13px;font-weight:600;color:var(--rc)}
.path{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px;padding:6px 0}
.path::before{content:"";position:absolute;left:7%;right:7%;top:34px;border-top:3px dashed color-mix(in srgb,var(--rc) 45%,transparent)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;text-align:center}
.node:nth-child(even){margin-top:22px}
.node .dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-wall);font-weight:700;font-size:18px;background:var(--surface);border:3px solid color-mix(in srgb,var(--rc) 40%,var(--border));color:var(--text-muted);position:relative;z-index:1;transition:transform .12s}
.node:not([disabled]):hover .dot{transform:scale(1.06)}
.node.done .dot{background:var(--rc);border-color:var(--rc);color:#fff}
.node.cur .dot{border-color:var(--rc);color:var(--rc);box-shadow:0 0 0 6px color-mix(in srgb,var(--rc) 22%,transparent);animation:pulse 2s infinite}
.node.ms .dot{border-radius:16px;transform:rotate(45deg)}
.node.ms .dot span{transform:rotate(-45deg)}
.node.ms.done .dot{background:var(--gold);border-color:var(--gold)}
.node[disabled]{cursor:default}
.node[disabled] .dot{opacity:.55}
.node small{font-size:11.5px;line-height:1.3;color:var(--text-muted);max-width:110px}
.node.cur small{color:var(--text);font-weight:600}
@media (max-width:640px){
  .path{grid-template-columns:repeat(4,1fr);row-gap:16px}
  .path::before{display:none}
  .node:nth-child(even){margin-top:0}
  .node .dot{width:50px;height:50px}
  .node small{font-size:11px}
}
.finish{display:flex;gap:16px;align-items:center}
.finish img{width:64px;height:64px}

/* Bài học */
.ls-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ls-top .back{background:none;border:1px solid var(--border-strong);border-radius:10px;padding:6px 10px;font-size:14px}
.ls-meta{font-size:13px;color:var(--text-muted)}
.ls-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 20px}
.ls-step{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-faint);font-weight:600}
.ls-step i{display:block;height:6px;border-radius:99px;background:var(--surface-3)}
.ls-step.on{color:var(--stc)}
.ls-step.on i{background:var(--stc)}
.ls-step.ok{color:var(--text-muted)}
.ls-step.ok i{background:color-mix(in srgb,var(--stc) 55%,transparent)}
.ls-wrap{max-width:740px;margin:0 auto}
.ls-title{font-size:13px;color:var(--stc);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.ls-hook{font-size:24px;margin:6px 0 16px}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow-md);min-height:240px;animation:rise .25s ease}
.rc-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rc-h h3{font-size:18px}
.rc-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--stc-soft);color:var(--stc);font-weight:700}
.tag-ill{margin-left:auto;font-size:12px;color:var(--text-faint);font-style:italic}
.rcard.takeaway{background:var(--stc-soft);border-color:color-mix(in srgb,var(--stc) 30%,transparent);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.rcard.takeaway .big{font-family:var(--f-wall);font-size:24px;font-weight:600;line-height:1.35;max-width:560px}
.rcard.takeaway img{width:64px;height:64px;margin-bottom:10px}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--border-strong);transition:width .2s}
.dots i.on{width:22px;background:var(--stc)}
.ls-nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-row>div{border-radius:14px;padding:12px 14px;font-size:14.5px}
.cmp-w{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted)}
.cmp-s{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.cmp-row b{display:block;font-size:12px;letter-spacing:.02em;margin-bottom:4px}
.cmp-w b{color:var(--text-faint)}
.cmp-s b{color:var(--accent-strong)}
.cmp-br{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:-6px}
@media (max-width:640px){.cmp-row{grid-template-columns:1fr}.rcard{padding:18px}.ls-hook{font-size:20px}.rcard.takeaway .big{font-size:20px}}
.q-opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.q-opt{text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px 16px;font-size:15px;display:flex;gap:12px;align-items:flex-start}
.q-opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.q-opt:hover{border-color:var(--border-strong)}
.q-opt.right{border-color:var(--accent);background:var(--accent-soft)}
.q-opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.q-fb{margin-top:14px;padding:14px 16px;border-radius:14px;display:flex;gap:12px;align-items:flex-start;animation:rise .2s}
.q-fb img{width:40px;height:40px;flex:none}
.q-fb.ok{background:var(--accent-soft)}
.q-fb.no{background:var(--danger-soft)}
.ord-pool,.ord-pick{display:flex;flex-direction:column;gap:8px;min-height:40px}
.ord-pick{margin-top:14px;padding:10px;border:2px dashed var(--border-strong);border-radius:14px}
.ord-pick:empty::before{content:"Bấm lần lượt các câu bên dưới theo đúng thứ tự";color:var(--text-faint);font-size:13.5px;padding:6px}
.ord-it{text-align:left;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:10px 14px;font-size:14.5px;display:flex;gap:10px}
.ord-it .n{font-weight:700;color:var(--stc)}
.ord-pool{margin-top:12px}
.pr-steps{counter-reset:s;list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:10px}
.pr-steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.pr-steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--stc-soft);color:var(--stc);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pr-box{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.pr-box h4{font-size:14px;color:var(--text-muted)}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.t-ring{position:relative;width:150px;height:150px}
.t-ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.t-ring circle{fill:none;stroke-width:10}
.t-ring .bg{stroke:var(--surface-3)}
.t-ring .fg{stroke:var(--stc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.t-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-wall);font-size:32px}
.t-ring.warn .fg{stroke:var(--danger)}
.t-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rec{display:flex;flex-direction:column;gap:10px}
.rec-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
.rec video,.rec audio{width:100%;border-radius:12px;background:#000}
.rec video{max-height:320px}
.rec-mode{display:inline-flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden}
.rec-mode button{border:none;background:var(--surface);padding:6px 12px;font-size:13px}
.rec-mode button.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.imp{background:var(--surface);border:2px solid var(--stc);border-radius:16px;padding:18px;text-align:center}
.imp small{display:block;font-size:12px;color:var(--stc);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.imp b{display:block;font-family:var(--f-wall);font-size:20px;margin:8px 0 12px}
.rv-list{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}
.rv{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);text-align:left;font-size:15px}
.rv .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin-top:1px}
.rv.on{border-color:var(--accent);background:var(--accent-soft)}
.rv.on .box{background:var(--accent);border-color:var(--accent)}
.more-v{margin-top:22px;padding-top:16px;border-top:1px dashed var(--border-strong)}
.more-v h4{font-size:14px;color:var(--text-muted);margin-bottom:8px}

/* Hoàn thành */
.celebrate{text-align:center;max-width:560px;margin:10px auto}
.celebrate img{width:110px;height:110px;animation:jump 1s ease}
.celebrate h1{font-size:28px;margin:10px 0 6px}
.xp-pop{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-wall);font-size:22px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:8px 18px;margin:12px 0}
.lvup{margin:12px 0;padding:16px;border-radius:18px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.lvup b{display:block;font-family:var(--f-wall);font-size:20px;color:var(--gold)}
.badges-new{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;width:120px;text-align:center;font-size:12.5px}
.bdg i{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px;background:var(--gold-soft);border:3px solid var(--gold)}
.bdg.off i{background:var(--surface-3);border-color:var(--border-strong);filter:grayscale(1);opacity:.5}
.bdg b{font-size:13px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}

/* Phòng tập */
.lv-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.lv-tab{border:1px solid var(--border-strong);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.lv-tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.lv-tab[disabled]{opacity:.55}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ex{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;transition:transform .1s,border-color .15s}
.ex:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.ex b{font-family:var(--f-wall);font-size:16px;font-weight:600}
.ex span{color:var(--text-muted);font-size:14px}
.ex .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.ex .meta em{font-style:normal;font-size:12px;background:var(--surface-3);border-radius:99px;padding:2px 8px;color:var(--text-muted)}
.lock-note{display:flex;gap:12px;align-items:center;padding:16px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--border-strong)}
.lock-note img{width:44px;height:44px}

/* Kho chuyện */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.book{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;border:none;border-radius:6px 16px 16px 6px;padding:18px 16px 14px 22px;min-height:190px;color:var(--text);background:var(--bk);box-shadow:var(--shadow-md);transition:transform .12s}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:6px 0 0 6px;background:var(--bkc)}
.book:hover{transform:translateY(-3px) rotate(-.4deg)}
.book b{font-family:var(--f-wall);font-size:17px;line-height:1.3}
.book .op{font-size:13.5px;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-muted)}
.stars{color:var(--gold);letter-spacing:1px}
.told{font-size:11px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);border-radius:99px;padding:2px 8px}
.seeds{display:flex;flex-direction:column;gap:8px}
.seed{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14px}
.seed .s-ic{flex:none;width:28px;height:28px;border-radius:50%;background:var(--s1-soft);color:var(--s1);display:flex;align-items:center;justify-content:center;font-size:14px}
.seed .s-tx{flex:1;min-width:0}
.seed .s-tx small{display:block;color:var(--text-faint);font-size:12px}
.empty{text-align:center;padding:32px 16px;color:var(--text-muted)}
.empty img{width:72px;height:72px;margin-bottom:8px;opacity:.9}
.wiz{max-width:620px;margin:0 auto}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{display:flex;gap:10px;align-items:flex-end;animation:rise .2s}
.msg img{width:36px;height:36px;flex:none}
.msg .b{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:85%}
.msg.me{justify-content:flex-end}
.msg.me .b{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent);border-radius:16px 16px 4px 16px}
.msg .b small{display:block;color:var(--text-faint);font-size:12px;margin-top:3px}
.ans{display:flex;gap:8px;align-items:flex-end}
.ans textarea{flex:1}
.mic{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center}
.mic.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.st-view .compose{font-size:16px;line-height:1.7;background:var(--surface-2);border-radius:14px;padding:16px;white-space:pre-wrap}
.note-list{display:flex;flex-direction:column;gap:8px}
.note-it{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.note-it small{display:block;color:var(--text-faint);font-size:12px;margin-bottom:4px}

/* Video */
.vf{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.vf .inp{max-width:280px}
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.vcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;text-align:left;padding:0}
.vthumb{position:relative;aspect-ratio:16/9;background:var(--surface-3) center/cover no-repeat}
.vthumb::after{content:"▶";position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.vthumb em{position:absolute;right:8px;bottom:8px;font-style:normal;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:2px 6px;border-radius:6px}
.vbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.vbody b{font-family:var(--f-wall);font-size:15.5px;line-height:1.35}
.vbody p{font-size:13.5px;color:var(--text-muted)}
.vtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.vtags em{font-style:normal;font-size:11.5px;border-radius:99px;padding:2px 8px;background:var(--surface-3);color:var(--text-muted)}
.vtags em.lv{background:var(--info-soft);color:var(--info)}
.vtags em.use{background:var(--accent-soft);color:var(--accent-strong)}
.v-en{font-size:12px;color:var(--text-faint)}
.video-wrap{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;text-align:left;font-size:14px;width:100%}
.vlink + .vlink{margin-top:8px}
.vlink i{font-style:normal;width:32px;height:32px;flex:none;border-radius:9px;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center}
.vlink small{display:block;color:var(--text-faint);font-size:12px}

/* Modal, toast, Đốm */
.modal-ov{position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .15s ease}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md);width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal-box.sm{width:min(520px,100%)}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head img{width:40px;height:40px;object-fit:contain}
.modal-head h3{font-size:17px}
.modal-head p{font-size:12.5px;color:var(--text-muted)}
.modal-x{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;color:var(--text-muted);padding:4px 8px;border-radius:8px}
.modal-x:hover{background:var(--surface-3)}
.modal-body{padding:16px 18px 20px;overflow:auto}
.fb-form{display:flex;flex-direction:column;gap:12px}
.fb-lbl{font-size:13px;font-weight:600;margin-bottom:6px}
.fb-stars{display:flex;gap:4px}
.fb-stars button{background:none;border:none;font-size:28px;color:var(--border-strong);padding:0 2px}
.fb-stars button.on{color:var(--gold)}
.fb-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb-msg{font-size:13px;min-height:18px}
.fb-msg.err{color:var(--danger)}
.fb-msg.ok{color:var(--accent-strong)}
.fb-act{display:flex;gap:8px;justify-content:flex-end}
.hp{position:absolute;left:-9999px}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:210;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-md);animation:rise .2s}
.dom-fab{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;align-items:center;background:none;border:none;padding:0}
.dom-fab .fab-bubble{background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-md);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;margin-right:-10px;white-space:nowrap}
.dom-fab .fab-img{width:60px;height:60px;border-radius:99px;background:var(--surface);border:2px solid var(--accent);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center}
.dom-fab .fab-img img{width:46px;height:46px;object-fit:contain}
.dom-fab:hover .fab-img{transform:rotate(-6deg)}
@media (max-width:820px){.dom-fab{bottom:76px;right:12px}.dom-fab .fab-bubble{display:none}.dom-fab .fab-img{width:50px;height:50px}.dom-fab .fab-img img{width:38px;height:38px}.fb-row2{grid-template-columns:1fr}.toast-wrap{bottom:84px}}
body.in-lesson .dom-fab{display:none}

.about{max-width:760px}
.about h2{font-size:19px;margin:24px 0 8px}
.about p,.about li{color:var(--text-muted)}
.credit{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
.credit img{width:48px;height:48px}
.ver{font-size:12px;color:var(--text-faint)}
.hl{display:flex;flex-direction:column;gap:6px}
.hl-row{display:grid;grid-template-columns:28px 1fr 130px;gap:8px;align-items:center}
.hl-row span{font-size:12px;color:var(--text-faint);text-align:center}
.hl-row input[type=range]{width:100%;accent-color:var(--accent)}
.hl-svg{width:100%;height:140px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
@media (max-width:640px){.hl-row{grid-template-columns:24px 1fr}.hl-row input[type=range]{grid-column:2}}
.flbw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.flbw{grid-template-columns:1fr}}
.pick-st{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.pick-st label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-size:14px}
.pick-st label.on{border-color:var(--accent);background:var(--accent-soft)}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 22%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--rc) 10%,transparent)}}
@keyframes blink{50%{opacity:.25}}
@keyframes jump{0%{transform:scale(.6)}50%{transform:scale(1.1) rotate(-6deg)}100%{transform:none}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
var VER='1.0.0';
var LESSONS=[{"id":"d01","day":1,"stage":1,"branch":null,"milestone":false,"title":"Bạn có nhiều chuyện hơn bạn nghĩ","hook":"Chuyện hay không nằm ở cuộc đời đặc biệt. Nó nằm ở con mắt biết để ý.","cards":[{"type":"story","title":"Đốm kể","body":"Trong buổi họp đầu năm, chị trưởng phòng hỏi: \"Mỗi bạn kể một chuyện đáng nhớ năm qua.\" Minh nghĩ ngay: \"Năm nay mình có gì đâu. Đi làm, về nhà, cuối tuần ngủ.\"\n\nBạn ngồi cạnh kể về lần đầu tự chạy máy photocopy bị kẹt giấy đúng lúc sếp cần tài liệu gấp. Cả phòng cười, rồi gật gù: ai cũng từng như vậy.\n\nMinh cũng từng như vậy. Chỉ là Minh chưa bao giờ coi đó là \"chuyện\"."},{"type":"idea","title":"Ý chính","body":"Phần lớn chúng ta không thiếu chuyện. Chúng ta thiếu **thói quen để ý**.\n\nMột câu chuyện hay thường chỉ là một khoảnh khắc nhỏ mà sau đó bạn thấy, nghĩ hoặc làm khác đi một chút. Không cần leo núi, không cần thành công lớn. Người nghe thích những chuyện họ thấy mình trong đó.\n\nKỹ năng đầu tiên của người kể chuyện không phải là nói, mà là **nhặt**."},{"type":"how","title":"Cách làm: 3 dấu hiệu của một khoảnh khắc đáng kể","body":"| Dấu hiệu | Hỏi mình | Ví dụ |\n| --- | --- | --- |\n| Có điều bất ngờ | \"Điều gì xảy ra khác với mình tưởng?\" | Khách khó tính nhất lại nhắn cảm ơn |\n| Có cảm xúc rõ | \"Lúc nào tim mình đập nhanh, mặt nóng, hoặc bật cười?\" | Bị gọi tên phát biểu khi chưa chuẩn bị |\n| Có một thay đổi nhỏ | \"Sau lúc đó, mình hiểu ra hoặc làm khác điều gì?\" | Từ hôm đó luôn gửi lại tin nhắn xác nhận |\n\nChỉ cần 1 trong 3 dấu hiệu là đã đáng ghi lại."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"\"Không có gì để kể\"","strongLabel":"Khoảnh khắc nhặt được","rows":[{"branch":"A","weak":"\"Tuần này bình thường thôi.\"","strong":"\"Sáng thứ Năm, chú bảo vệ gọi mình lại đưa hộp xôi, bảo: 'Thấy cháu tuần nào cũng đi sớm nhất.'\""},{"branch":"B","weak":"\"Mình không biết quay video nói gì.\"","strong":"\"Lần đầu livestream bán hàng, mình nói 10 phút mới phát hiện quên bật micro.\""},{"branch":"C","weak":"\"Báo cáo thì có gì mà kể.\"","strong":"\"Slide cuối của mình viết sai tên khách hàng. Anh giám đốc chỉ vào, không nói gì, rồi cười.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Bạn không thiếu chuyện. Bạn chỉ chưa nhặt chúng lên."}],"quiz":{"kind":"choice","question":"Khoảnh khắc nào đáng ghi lại?","options":[{"text":"\"Hôm nay mình đi làm, họp hai cuộc, về nhà.\"","correct":false,"feedback":"Đây là lịch trình, chưa phải khoảnh khắc. Nhưng trong hai cuộc họp đó biết đâu có một khoảnh khắc như câu về bạn thực tập!"},{"text":"\"Trong cuộc họp, bạn thực tập xin nói ý kiến. Cả phòng im lặng, và ý đó đúng.\"","correct":true,"feedback":"Chuẩn! Có bất ngờ và có cảm xúc: cả phòng im lặng."},{"text":"Cả hai đều đáng ghi.","correct":false,"feedback":"Câu \"đi làm, họp hai cuộc, về nhà\" là lịch trình, chưa phải khoảnh khắc. Nhưng trong hai cuộc họp đó biết đâu có một khoảnh khắc như câu về bạn thực tập!"}]},"practice":{"intro":"Nhặt 3 hạt giống chuyện đầu tiên từ tuần vừa qua.","steps":["Nhìn lại **7 ngày qua**: công việc, đường đi làm, bữa ăn, tin nhắn.","Ghi **3 khoảnh khắc nhỏ**, mỗi cái 1 dòng. Không cần hay, không cần đầy đủ.","Với mỗi khoảnh khắc, đánh dấu nó có dấu hiệu nào: bất ngờ / cảm xúc / thay đổi."],"pickStory":false,"fields":[{"label":"Khoảnh khắc 1","placeholder":"Lần gần nhất bạn bật cười ở chỗ làm là khi nào?"},{"label":"Khoảnh khắc 2","placeholder":"Tin nhắn nào tuần này làm bạn đọc hai lần?"},{"label":"Khoảnh khắc 3","placeholder":"Điều gì tuần này xảy ra khác với bạn tưởng?"}],"saveAs":"seeds","widget":null,"timer":null,"record":false},"review":["Mình đã ghi được 3 khoảnh khắc.","Ít nhất 1 khoảnh khắc mình từng nghĩ \"cái này chẳng có gì\".","Mình thấy nhặt chuyện dễ hơn mình tưởng."],"done":"Ba hạt giống đầu tiên đã vào kho. Tối mai Đốm chỉ bạn cách nhặt thêm mỗi ngày một hạt, chỉ mất 2 phút!","videos":["PH-009","PH-046"]},{"id":"d02","day":2,"stage":1,"branch":null,"milestone":false,"title":"Câu hỏi 2 phút mỗi tối","hook":"Mỗi tối hỏi mình một câu. Sau một tháng, bạn có 30 chuyện.","cards":[{"type":"story","title":"Đốm kể","body":"Hoa làm nhân sự. Cuối năm, sếp nhờ Hoa kể một chuyện về văn hóa công ty trong buổi tiệc. Hoa biết chắc năm nay có nhiều khoảnh khắc đẹp, nhưng ngồi cả buổi tối vẫn không nhớ nổi một chuyện cụ thể.\n\nKhông phải Hoa kém trí nhớ. Chỉ là khoảnh khắc nào không được ghi lại thì vài tuần sau sẽ mờ đi."},{"type":"idea","title":"Ý chính","body":"Trí nhớ không phải kho chứa chuyện. Nó giống một cái rây: chỉ giữ lại những thứ rất lớn.\n\nMuốn có chuyện để kể, hãy **ghi lại trước khi quên**. Mỗi tối dành 2 phút, trả lời một câu hỏi duy nhất:\n\n> Nếu hôm nay phải kể một khoảnh khắc, mình sẽ kể khoảnh khắc nào?\n\nBài tập này dựa trên phương pháp \"Homework for Life\" của người kể chuyện Matthew Dicks, được Philipp Humm giới thiệu nhiều lần trên kênh."},{"type":"how","title":"Cách làm: 3 dòng, 2 phút","body":"1. **Ngày**: ghi ngày tháng.\n2. **Khoảnh khắc**: 1 câu, đủ để mình nhớ lại (không cần viết hay).\n3. **Điều lắng lại** (không bắt buộc): khoảnh khắc đó khiến mình nghĩ gì?\n\nBa lưu ý để giữ thói quen:\n\n- Ngày \"không có gì\" vẫn ghi: chọn khoảnh khắc ít nhạt nhất trong ngày.\n- Gắn vào một việc có sẵn: sau khi đánh răng, trước khi tắt đèn.\n- Không đọc lại trong tuần đầu. Cứ ghi."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Ghi kiểu nhật ký","strongLabel":"Ghi kiểu khoảnh khắc","rows":[{"branch":"A","weak":"\"03/11. Gặp khách, ăn trưa, làm báo giá.\"","strong":"\"03/11. Khách hỏi tên con gái mình, lần trước mình kể đúng một lần. → Người ta nhớ những gì mình quan tâm.\""},{"branch":"B","weak":"\"03/11. Quay 2 video.\"","strong":"\"03/11. Quay lần thứ 7 vẫn vấp câu đầu. Lần 8 mình mỉm cười trước khi nói, và trôi luôn.\""},{"branch":"C","weak":"\"03/11. Họp giao ban.\"","strong":"\"03/11. Mình đọc số liệu xong, sếp hỏi 'Vậy em đề xuất gì?' và mình không có câu trả lời.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Khoảnh khắc nào không được ghi lại thì sẽ trôi đi."}],"quiz":{"kind":"choice","question":"Dòng nào là một \"khoảnh khắc\" đúng nghĩa?","options":[{"text":"\"Hôm nay mệt.\"","correct":false,"feedback":"Đây là cảm nhận chung cả ngày. Thử hỏi: mệt nhất lúc nào, ở đâu?"},{"text":"\"Hôm nay họp nhiều.\"","correct":false,"feedback":"Đây là cảm nhận chung cả ngày. Thử hỏi: họp lúc nào, ở đâu, có câu nói nào còn nhớ?"},{"text":"\"Ra khỏi phòng họp, đồng nghiệp vỗ vai: 'Lúc nãy bạn nói hay đấy.'\"","correct":true,"feedback":"Đúng rồi! Có người, có lời thoại, có nơi chốn. Đọc lại sau một năm bạn vẫn thấy cảnh."}]},"practice":{"intro":"Ghi khoảnh khắc đầu tiên và gắn thói quen 2 phút vào buổi tối.","steps":["Ghi \"khoảnh khắc của hôm nay\" vào 2 ô bên dưới (ngày được tự điền). Nếu bạn học buổi sáng, ghi cho hôm qua.","Đặt giờ nhắc mỗi tối.","Chọn việc có sẵn để gắn thói quen vào: \"Sau khi mình …… thì mình ghi khoảnh khắc.\""],"pickStory":false,"fields":[{"label":"Khoảnh khắc","placeholder":"Ví dụ: Ra khỏi phòng họp, đồng nghiệp vỗ vai: \"Lúc nãy bạn nói hay đấy.\""},{"label":"Điều lắng lại (không bắt buộc)","placeholder":"Khoảnh khắc đó khiến mình nghĩ gì?"}],"saveAs":"seeds","widget":null,"timer":null,"record":false},"review":["Khoảnh khắc mình ghi có nơi chốn hoặc người cụ thể.","Mình đã đặt giờ nhắc.","Mình biết sẽ ghi vào lúc nào mỗi tối."],"done":"Kho của bạn vừa có hạt giống thứ 4. Ngày mai mình tập kể một hạt thành lời nhé!","videos":["PH-048","PH-012"]},{"id":"d03","day":3,"stage":1,"branch":null,"milestone":false,"title":"\"Dạo này thế nào?\": trả lời bằng chuyện 30 giây","hook":"Câu hỏi xã giao nhất lại là phòng tập kể chuyện miễn phí.","cards":[{"type":"story","title":"Đốm kể","body":"Trong thang máy, anh trưởng phòng bên cạnh hỏi Tuấn: \"Dạo này thế nào em?\"\n\nTuấn đáp: \"Dạ vẫn bình thường anh ạ.\" Thang máy im lặng đến tầng 9.\n\nHôm sau, cũng câu hỏi đó, Tuấn thử trả lời khác: \"Dạ tuần này em học được một bài. Em gửi báo giá cho khách lúc 11 giờ đêm, sáng ra mới thấy đính nhầm file của khách khác. Từ hôm đó em để sáng mới gửi. Còn anh, tuần này dự án bên anh sao rồi?\"\n\nAnh trưởng phòng bật cười, kể lại chuyện của mình. Họ đứng nói tiếp thêm 2 phút ở sảnh."},{"type":"idea","title":"Ý chính","body":"Muốn kể chuyện giỏi, cần kể nhiều. Nhưng người đi làm hiếm khi có dịp kể chuyện \"chính thức\".\n\nTin vui: mỗi ngày bạn được hỏi \"Dạo này thế nào?\", \"Cuối tuần làm gì?\" ít nhất vài lần. Mỗi lần là một cơ hội tập kể một chuyện rất nhỏ, dưới 30 giây, không áp lực.\n\nVà điều quan trọng không kém: **kết bằng câu hỏi lại**. Chuyện nhỏ mở cửa, câu hỏi lại mời người kia bước vào. Cuộc trò chuyện thành hai chiều."},{"type":"how","title":"Cách làm: công thức 3 nhịp","body":"| Nhịp | Nói gì | Độ dài |\n| --- | --- | --- |\n| 1. Mở | \"Tuần này có một chuyện…\" hoặc vào thẳng khoảnh khắc | 1 câu |\n| 2. Khoảnh khắc | Lấy 1 hạt giống trong kho: chuyện gì xảy ra, mình nghĩ gì hoặc rút ra gì | 2–3 câu |\n| 3. Hỏi lại | Một câu hỏi cụ thể về người kia, không chỉ \"còn bạn?\" | 1 câu |\n\nMẹo: chuẩn bị sẵn 1 chuyện nhỏ mỗi tuần từ Kho chuyện, để khi bị hỏi bạn không phải nghĩ."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Trả lời xã giao","strongLabel":"Trả lời bằng chuyện 30 giây","rows":[{"branch":"A","weak":"*(Gặp bạn cũ)* \"Ổn, vẫn thế.\"","strong":"\"Ổn lắm. Tuần trước con mình tự buộc dây giày lần đầu, mất 10 phút, cả nhà đứng cổ vũ. Nhà bạn bé Bin dạo này học lớp mấy rồi?\""},{"branch":"B","weak":"*(Mở đầu livestream)* \"Chào cả nhà, hôm nay mình lại lên live đây.\"","strong":"\"Sáng nay mình mở hộp hàng mới, có một món mình nhìn mãi vì không đoán ra dùng để làm gì. Cả nhà đoán thử trong bình luận nhé?\""},{"branch":"C","weak":"*(Đầu buổi họp nhóm)* \"Dạ tuần này bình thường ạ.\"","strong":"\"Tuần này em có một khoảnh khắc vui: khách gọi lại chỉ để khen bạn giao hàng. Bên mình có ai cũng nhận được tin vui nào không ạ?\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Trả lời bằng một chuyện nhỏ, kết bằng một câu hỏi lại."}],"quiz":{"kind":"choice","question":"Câu hỏi lại nào mở cuộc trò chuyện tốt hơn?","options":[{"text":"\"Còn bạn?\"","correct":false,"feedback":"Không sai, nhưng dễ nhận lại câu 'Ổn'. Thử hỏi về một điều cụ thể bạn biết về họ."},{"text":"\"Lần trước bạn nói đang tập chạy, giờ chạy được bao xa rồi?\"","correct":true,"feedback":"Tuyệt! Câu hỏi cụ thể cho thấy bạn nhớ và quan tâm. Người kia sẽ có chuyện để kể lại."}]},"practice":{"intro":"Biến một hạt giống trong kho thành câu trả lời 30 giây cho \"Dạo này thế nào?\".","steps":["Mở Kho chuyện, chọn 1 hạt giống từ ngày 1–2.","Viết câu trả lời theo 3 nhịp vào 3 ô bên dưới.","Bấm đồng hồ **30 giây**, nói thành tiếng như đang trả lời đồng nghiệp. Vượt 30 giây? Cắt bớt phần giới thiệu và nói lại một lần.","Thử thách thật (không bắt buộc): lần tới có người hỏi \"Dạo này thế nào?\", dùng đúng câu này."],"pickStory":true,"fields":[{"label":"Mở","placeholder":"Ví dụ: \"Tuần này em học được một bài.\""},{"label":"Khoảnh khắc","placeholder":"Chuyện gì xảy ra, mình nghĩ gì hoặc rút ra gì (2–3 câu)"},{"label":"Hỏi lại","placeholder":"Ví dụ: \"Còn anh, tuần này dự án bên anh sao rồi?\""}],"saveAs":"storyNote","widget":null,"timer":30,"record":true},"review":["Câu trả lời dưới 30 giây.","Có ít nhất 1 chi tiết cụ thể (giờ, nơi, câu nói).","Kết bằng 1 câu hỏi lại cụ thể."],"done":"Giọng bạn nghe lại có hơi lạ không? Ai cũng vậy đó. Nghe nhiều sẽ quen!","videos":["PH-015","PH-040"]},{"id":"d04","day":4,"stage":1,"branch":null,"milestone":false,"title":"Lần đầu, Gần nhất, Tốt nhất, Tệ nhất","hook":"Một chủ đề, bốn câu hỏi, bốn câu chuyện.","cards":[{"type":"story","title":"Đốm kể","body":"Thảo chuẩn bị phỏng vấn vị trí trưởng nhóm. Nhà tuyển dụng dặn: \"Chị sẽ hỏi em về kinh nghiệm làm việc với khách hàng.\"\n\nThảo ngồi nhìn trang giấy trắng. 6 năm làm khách hàng, mà không nghĩ ra chuyện nào để kể.\n\nRồi Thảo tự hỏi lại theo cách khác: \"Khách hàng **đầu tiên** của mình là ai?\" Ngay lập tức, Thảo nhớ ra buổi chiều run tay gọi điện cho một chủ cửa hàng ở Hải Phòng, và câu chú nói khi chốt đơn."},{"type":"idea","title":"Ý chính","body":"Câu hỏi rộng (\"Kể về khách hàng\") làm não đứng hình. Câu hỏi hẹp (\"Khách hàng đầu tiên\") mở ngay một cánh cửa ký ức.\n\nBài tập hôm nay là một cái bảng: lấy **một chủ đề** quen thuộc, rồi hỏi **4 câu**: lần đầu, lần gần nhất, lần tốt nhất, lần tệ nhất. Một chủ đề cho bạn 4 chuyện. Năm chủ đề cho bạn 20 chuyện.\n\nBài tập này cũng do Matthew Dicks đề xuất, Philipp Humm hướng dẫn lại trên kênh."},{"type":"how","title":"Cách làm","body":"| Chủ đề | Lần đầu | Gần nhất | Tốt nhất | Tệ nhất |\n| --- | --- | --- | --- | --- |\n| Sếp | Ngày đầu gặp sếp cũ | Lần gần nhất sếp khen | Một lần sếp bảo vệ mình | Một lần bị sếp mắng |\n| Đồng nghiệp | … | … | … | … |\n| Khách hàng | … | … | … | … |\n\nGợi ý chủ đề hợp người đi làm: sếp, đồng nghiệp, khách hàng, buổi họp, ngày làm việc đầu tiên, lần được tăng lương, lần đổi việc, chuyến công tác.\n\nLưu ý: ô \"Tệ nhất\" chỉ chọn những chuyện bạn đã có thể mỉm cười khi nhớ lại. Chuyện còn đau thì để sau."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Câu hỏi rộng","strongLabel":"Câu hỏi hẹp và chuyện hiện ra","rows":[{"branch":"A","weak":"\"Kể về bạn bè đi.\"","strong":"\"Lần gần nhất bạn thân giúp mình?\" → \"Tối thứ Bảy xe mình chết máy giữa đường, nó chạy 7 cây số sang đẩy hộ.\""},{"branch":"B","weak":"\"Nói về công việc của bạn.\"","strong":"\"Lần đầu bạn tự tay làm sản phẩm này?\" → \"Mẻ bánh đầu tiên cháy đen, cả nhà vẫn ăn hết.\""},{"branch":"C","weak":"\"Kinh nghiệm làm dự án của anh/chị.\"","strong":"\"Dự án tệ nhất?\" → \"Dự án trễ 3 tuần vì không ai hỏi khách câu 'Đúng ý chị chưa?'\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Hỏi hẹp thì ký ức mới mở."}],"quiz":{"kind":"choice","question":"Câu hỏi nào giúp bạn nhớ ra chuyện nhanh hơn?","options":[{"text":"\"Những trải nghiệm đáng nhớ trong sự nghiệp?\"","correct":false,"feedback":"Câu này quá rộng, não dễ trả lời 'chắc là không có gì'."},{"text":"\"Ngày đầu tiên đi làm, mình ngồi đâu, ai nói chuyện với mình đầu tiên?\"","correct":true,"feedback":"Đúng! Có mốc thời gian, có nơi chốn, có người. Não tìm ra ngay."}]},"practice":{"intro":"Đào 4 chuyện từ một chủ đề công việc quen thuộc.","steps":["Chọn **1 chủ đề** từ danh sách gợi ý, hoặc tự nhập.","Điền 4 ô: Lần đầu – Gần nhất – Tốt nhất – Tệ nhất. Mỗi ô 1 dòng. Ô nào bí quá 30 giây thì bỏ qua.","Còn thời gian? Làm thêm chủ đề thứ hai."],"topics":["Sếp","Đồng nghiệp","Khách hàng","Buổi họp","Ngày làm việc đầu tiên","Lần được tăng lương","Lần đổi việc","Chuyến công tác"],"pickStory":false,"saveAs":"seeds","widget":"flbw","timer":null,"record":false},"review":["Mình điền được ít nhất 3/4 ô.","Có ít nhất 1 chuyện mình đã quên lâu rồi.","Ô \"Tệ nhất\" là chuyện mình đã có thể mỉm cười khi nhớ lại."],"done":"Chỉ một cái bảng mà bạn có thêm 4 chuyện. Ngày mai Đốm rủ bạn nhìn lại cả một năm!","videos":["PH-009","PH-049"]},{"id":"d05","day":5,"stage":1,"branch":null,"milestone":false,"title":"Đỉnh và đáy","hook":"Những chuyện đáng kể nhất thường nằm ở chỗ mọi thứ đổi chiều.","cards":[{"type":"story","title":"Đốm kể","body":"Nam được mời chia sẻ với các bạn nhân viên mới về \"năm đầu đi làm\". Nam định kể theo thứ tự: tháng 1 làm gì, tháng 2 làm gì…\n\nRồi Nam thử vẽ một đường lên xuống trên giấy. Điểm thấp nhất: tháng thứ 3, ngồi trong nhà vệ sinh công ty vì bị khách phàn nàn trước cả phòng. Điểm cao nhất: tháng thứ 9, chính vị khách đó gọi đích danh Nam phụ trách hợp đồng mới.\n\nNam bỏ bài kể theo tháng. Chỉ kể hai điểm đó. Cả phòng lắng nghe."},{"type":"idea","title":"Ý chính","body":"Mỗi giai đoạn của cuộc đời có những **đỉnh** (lúc vui, tự hào, nhẹ nhõm) và những **đáy** (lúc hụt hẫng, xấu hổ, bế tắc). Chuyện đáng kể nằm ở đó, không nằm ở những tháng bình thường.\n\nKhi đặt đỉnh và đáy cạnh nhau, bạn thấy được **điều gì đã thay đổi** ở giữa. Đó thường là bài học đáng kể nhất."},{"type":"how","title":"Cách làm: vẽ đường đời trong 3 bước","body":"1. **Chọn một giai đoạn** cụ thể: năm đầu đi làm, thời gian ở công ty cũ, năm 2025, dự án vừa xong.\n2. **Ghi 3 đỉnh và 3 đáy**, mỗi cái 1 dòng, theo thứ tự thời gian.\n3. **Hỏi câu nối**: từ đáy sâu nhất đến đỉnh cao nhất, điều gì đã thay đổi ở mình?\n\nLưu ý: chọn đáy ở mức bạn thoải mái chia sẻ nơi công sở. Không cần \"vạch áo\" để có chuyện hay."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Kể đều theo thời gian","strongLabel":"Kể từ đỉnh và đáy","rows":[{"branch":"A","weak":"\"Năm nay mình chuyển nhà, đổi việc, rồi đi du lịch.\"","strong":"\"Tuần đầu ở chỗ mới mình ngồi ăn trưa một mình 5 ngày liền. Đến tháng 6, chính mình là người rủ cả nhóm đi ăn.\""},{"branch":"B","weak":"\"Mình làm kênh được 1 năm, đăng 80 video.\"","strong":"\"Video thứ 12 có đúng 3 lượt xem, 2 lượt là của mình. Video thứ 40, một người lạ nhắn: 'Nhờ bạn mà mình dám thử.'\""},{"branch":"C","weak":"\"Quý 3 doanh số giảm, quý 4 tăng lại.\"","strong":"\"Tháng 8, cả nhóm ngồi nhìn con số đỏ trên màn hình, không ai nói gì. Tháng 11, cũng phòng họp đó, mọi người vỗ tay.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Đừng kể cả con đường. Kể chỗ nó rẽ."}],"quiz":{"kind":"choice","question":"Bạn muốn kể về năm đầu làm quản lý. Bắt đầu từ đâu?","options":[{"text":"\"Tháng 1 mình được bổ nhiệm, tháng 2 tuyển thêm 2 bạn…\"","correct":false,"feedback":"Kể theo tháng dễ thành bản báo cáo. Thử nhảy thẳng vào điểm đáy."},{"text":"\"Lần đầu mình phải nói chuyện cho một bạn nghỉ việc, mình tập trước gương cả tối.\"","correct":true,"feedback":"Đúng rồi! Một đáy rõ ràng, người nghe muốn biết chuyện gì xảy ra tiếp."}]},"practice":{"intro":"Vẽ đường lên xuống của một giai đoạn và tìm điều đã thay đổi.","steps":["Chọn 1 giai đoạn.","Ghi 3 đỉnh và 3 đáy theo thứ tự thời gian, kéo thanh trượt \"vui ↔ buồn\" cho từng ô.","Viết 1 câu nối: \"Từ …… đến ……, mình đã hiểu ra …….\""],"topics":["Năm đầu đi làm","Thời gian ở công ty cũ","Dự án vừa xong"],"pickStory":false,"saveAs":"seeds","widget":"highlow","timer":null,"record":false},"review":["Mình có ít nhất 2 đỉnh và 2 đáy.","Mình viết được câu nối \"điều gì đã thay đổi\".","Các đáy mình chọn đều là chuyện mình thoải mái chia sẻ."],"done":"Nhìn lại đường đi của mình cũng đáng yêu đấy chứ. Mai mình sắp xếp kho chuyện cho gọn nhé!","videos":["PH-011"]},{"id":"d06","day":6,"stage":1,"branch":null,"milestone":false,"title":"Kho chuyện đầu tiên","hook":"Chuyện có sẵn trong kho thì lúc cần mới lấy ra được.","cards":[{"type":"story","title":"Đốm kể","body":"Chi có một cuốn sổ ghi khoảnh khắc từ tháng 3. Đến tháng 9, sếp bất ngờ nhờ Chi nói 2 phút mở đầu buổi đào tạo về \"chăm sóc khách hàng\".\n\nChi lật sổ. 60 dòng, chữ ngắn chữ dài, không biết dòng nào hợp. Mất 15 phút Chi mới tìm ra chuyện bác khách lớn tuổi quay lại cảm ơn vì được chờ thêm 5 phút để đọc kỹ hợp đồng.\n\nChuyện thì có sẵn. Chỉ thiếu một cách sắp xếp để lấy ra nhanh."},{"type":"idea","title":"Ý chính","body":"Sau 5 ngày, bạn đã có khoảng 10–20 hạt giống. Hôm nay mình biến đống hạt giống đó thành **kho chuyện**: mỗi chuyện có tên gọi, ý chính, và biết khi nào dùng.\n\nKho chuyện là tài sản dài hạn của người kể. Mỗi tuần thêm 1–2 chuyện, sau một năm bạn có vài chục chuyện cho mọi dịp: phỏng vấn, họp, đào tạo, trò chuyện."},{"type":"how","title":"Cách làm: mỗi chuyện 4 thông tin","body":"| Thông tin | Viết gì | Ví dụ |\n| --- | --- | --- |\n| Tên chuyện | 3–5 chữ, đọc là nhớ ra | \"Bác khách đọc hợp đồng\" |\n| Ý chính | 1 câu: chuyện này nói lên điều gì | \"Chậm lại 5 phút có khi giữ được một khách cả đời\" |\n| Dùng khi nào | 1–2 nhãn dịp dùng | Đào tạo, phỏng vấn |\n| Độ sẵn sàng | ★ hạt giống · ★★ đã dựng khung · ★★★ đã kể thử | ★ |\n\nKhông cần hoàn hảo. Một kho 5 chuyện có tên và ý chính có ích hơn một cuốn sổ 60 dòng chưa sắp xếp."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Ghi chép chưa sắp xếp","strongLabel":"Một thẻ trong kho chuyện","rows":[{"branch":"A","weak":"\"Chú bảo vệ đưa xôi\"","strong":"**Chú bảo vệ và hộp xôi** · Người ta để ý những thói quen nhỏ của mình · Trò chuyện, làm quen · ★"},{"branch":"B","weak":"\"Live quên bật mic\"","strong":"**10 phút nói với không khí** · Bắt đầu tệ vẫn hơn không bắt đầu · Video giới thiệu bản thân · ★★"},{"branch":"C","weak":"\"Họp tháng 8 số đỏ\"","strong":"**Con số đỏ tháng 8** · Nhóm vượt khó khi nói thẳng với nhau · Mở đầu họp tổng kết · ★"}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Chuyện có tên thì mới gọi ra được."}],"quiz":{"kind":"choice","question":"Tên chuyện nào giúp bạn nhớ lại nhanh nhất sau 6 tháng?","options":[{"text":"\"Chuyện công việc 3\"","correct":false,"feedback":"Tên này không gợi lại gì cả."},{"text":"\"Bài học về sự kiên nhẫn\"","correct":false,"feedback":"Đây là ý chính, nên để ở cột Ý chính. Tên nên là một hình ảnh."},{"text":"\"Báo giá lúc 11 giờ đêm\"","correct":true,"feedback":"Chuẩn! Tên có hình ảnh cụ thể, đọc là thấy cảnh."}]},"practice":{"intro":"Đưa 5 hạt giống bạn thích nhất lên kệ, mỗi chuyện có tên, ý chính và dịp dùng.","steps":["Mở Kho chuyện, xem các hạt giống từ ngày 1–5.","Chọn **5 hạt giống** bạn thích nhất.","Với mỗi hạt: đặt tên, viết ý chính, chọn dịp dùng.","Các hạt giống còn lại vẫn nằm trong kho, không mất."],"pickStory":false,"saveAs":null,"widget":"shelf","timer":null,"record":false},"review":["Kho có ít nhất 5 chuyện có tên.","Tên chuyện là một hình ảnh, không phải bài học.","Mỗi chuyện có ít nhất 1 dịp dùng."],"done":"Kệ chuyện của bạn đã có 5 cuốn! Ngày mai là ngày qua màn đầu tiên. Chọn sẵn một chuyện bạn thích nhất nhé.","videos":["PH-027","PH-009"]},{"id":"d07","day":7,"stage":1,"branch":null,"milestone":true,"title":"Mốc: kể 1 chuyện 30 giây","hook":"Bạn đã có chuyện. Giờ là lúc kể nó.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Sáu ngày qua bạn đã làm một việc mà nhiều người chưa bao giờ làm: dừng lại để ý cuộc sống của chính mình.\n\nHôm nay bạn chọn một chuyện trong kho, kể 30 giây, ghi âm lại. Đốm không chấm hay dở. Bản ghi này chỉ để 3 tuần nữa bạn nghe lại và thấy mình đã đi xa thế nào."},{"type":"idea","title":"Ôn nhanh chặng 1","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 1 | Bạn không thiếu chuyện, chỉ chưa nhặt chúng lên |\n| 2 | Khoảnh khắc nào không được ghi lại thì sẽ trôi đi |\n| 3 | Trả lời bằng chuyện nhỏ, kết bằng câu hỏi lại |\n| 4 | Hỏi hẹp thì ký ức mới mở |\n| 5 | Đừng kể cả con đường, kể chỗ nó rẽ |\n| 6 | Chuyện có tên thì mới gọi ra được |"},{"type":"how","title":"Chuẩn bị (2 phút)","body":"1. Chọn 1 chuyện trong kho. Gợi ý theo nhánh:\n   - **A. Giao tiếp**: chuyện bạn sẽ kể khi được hỏi \"Dạo này thế nào?\"\n   - **B. Trước camera**: chuyện bạn sẽ kể trong video giới thiệu bản thân.\n   - **C. Thuyết trình**: chuyện bạn sẽ kể để mở đầu một buổi họp nhóm.\n2. Ghi 3 dòng nhắc bài: mở bằng gì – khoảnh khắc chính là gì – kết bằng gì (một điều rút ra hoặc một câu hỏi lại).\n3. Không viết ra cả bài. Nói từ 3 dòng này thôi."}],"quiz":null,"practice":{"intro":"Kể một chuyện trong kho thành tiếng trong 30 giây và giữ lại bản ghi ngày 7.","steps":["Bấm ghi âm, kể trong **30 giây**.","Nghe lại một lần.","Được kể lại tối đa 2 lần nữa. Chọn bản bạn thích nhất để lưu làm **\"Bản ghi ngày 7\"**.","Việc nhỏ cho cuối tuần (không bắt buộc): kể chuyện này cho một người thật, rồi bấm \"Đã kể cho người thật\" trên thẻ chuyện để nhận huy hiệu."],"pickStory":true,"fields":[{"label":"Mở bằng gì","placeholder":"Ví dụ: \"Sáng thứ Năm, chú bảo vệ gọi mình lại…\""},{"label":"Khoảnh khắc chính","placeholder":"Chuyện gì xảy ra, ai nói câu gì"},{"label":"Kết bằng gì","placeholder":"Một điều rút ra hoặc một câu hỏi lại"}],"saveAs":"storyNote","widget":null,"timer":30,"record":true},"review":["Mình chọn được 1 chuyện từ kho, không phải nghĩ từ đầu.","Chuyện có 1 khoảnh khắc cụ thể (nơi chốn, người, câu nói).","Mình kể trong khoảng 30 giây.","Kết bằng một điều rút ra hoặc câu hỏi lại.","Mình đã nghe lại giọng mình."],"done":"Chúc mừng bạn đã qua màn đầu tiên! Bạn đã biết cách nhặt chuyện. Từ tuần sau, Đốm chỉ bạn cách dựng chúng thành những câu chuyện khiến người nghe muốn nghe tiếp.","videos":[]},{"id":"d08","day":8,"stage":2,"branch":null,"milestone":false,"title":"Zoom vào khoảnh khắc","hook":"Đừng kể tóm tắt. Hãy đưa người nghe vào đúng một khoảnh khắc.","cards":[{"type":"story","title":"Đốm kể","body":"Tuần trước Đốm nghe hai bạn cùng phòng kể về cùng một tình huống với khách.\n\nBạn thứ nhất nói: *\"Tuần trước team mình gặp một tình huống khó với khách, nhưng cuối cùng cũng giải quyết ổn.\"* Mọi người gật đầu rồi quay lại điện thoại.\n\nBạn thứ hai nói: *\"8 giờ sáng thứ Hai. Điện thoại rung. Khách nhắn: 'Em ơi, sao đơn của chị chưa tới?' Mình nhìn màn hình, nghĩ: 'Chết rồi, hôm qua mình quên xác nhận.'\"* Cả bàn im lặng chờ nghe tiếp.\n\nCùng một chuyện. Khác nhau ở chỗ: bạn thứ hai không kể *về* tình huống, bạn ấy đưa người nghe *vào trong* khoảnh khắc đó."},{"type":"idea","title":"Ý chính","body":"Khi kể, chúng ta hay \"bay trực thăng\": nhìn từ trên cao, tóm tắt cả tuần trong một câu. Người nghe hiểu, nhưng không cảm.\n\nMuốn người nghe cảm, hãy \"xuống chiến hào\": chọn **một khoảnh khắc** quan trọng nhất, rồi kể như thể nó đang xảy ra ngay bây giờ. Người nghe không cần biết hết mọi chuyện. Họ cần đứng cạnh bạn trong vài giây đó."},{"type":"how","title":"Cách làm: 5 thứ đưa người nghe vào cảnh","body":"| Thứ | Làm thế nào | Ví dụ |\n| --- | --- | --- |\n| 1. Nơi chốn | Gọi tên là đủ, không tả dài. Não người nghe tự vẽ phần còn lại | \"Ở phòng họp tầng 5\" |\n| 2. Hành động | Bạn đang làm gì đúng lúc đó | \"Mình đang cắm sạc laptop\" |\n| 3. Suy nghĩ | Câu nói trong đầu, nguyên văn, chưa được làm đẹp | \"Chết rồi, mình quên xác nhận\" |\n| 4. Cảm xúc qua cơ thể | Tả phản ứng của cơ thể thay vì gọi tên cảm xúc | \"Tay mình lạnh ngắt\" thay cho \"mình rất lo\" |\n| 5. Lời thoại | Nhắc lại câu người khác nói, ngắn gọn | \"Khách nhắn: 'Sao đơn của chị chưa tới?'\" |\n\nKhông cần đủ cả 5. Chỉ cần 2–3 thứ là câu chuyện đã khác hẳn."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Bản tóm tắt","strongLabel":"Bản khoảnh khắc","rows":[{"branch":"A","weak":"\"Hôm gặp lại lớp cũ, mình ngại lắm.\"","strong":"\"Mình đẩy cửa quán, cả bàn quay ra. Đứa bạn thân ngày xưa đứng dậy: 'Ơ, Tuấn đấy à?' Mình nghĩ: 'Nó vẫn nhớ tên mình.'\""},{"branch":"B","weak":"\"Lần đầu quay video, mình rất run.\"","strong":"\"Đèn đỏ trên điện thoại bật sáng. Mình mở miệng, và quên sạch câu đầu đã tập 20 lần. Mình nghĩ: 'Thôi, nói đại.'\""},{"branch":"C","weak":"\"Hôm thuyết trình đầu tiên, mình run lắm.\"","strong":"\"Chị trưởng phòng gật đầu: 'Em bắt đầu đi.' Mình cầm bút trình chiếu, bấm sang slide 2 thì nó nhảy luôn sang slide 5. Mình nghĩ: 'Thôi xong.'\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Người nghe không nhớ câu tóm tắt. Họ nhớ khoảnh khắc."}],"quiz":{"kind":"choice","question":"Câu nào đưa người nghe vào cảnh?","options":[{"text":"\"Buổi phỏng vấn hôm đó khá căng thẳng.\"","correct":false,"feedback":"Câu này là bản tóm tắt: nói cho biết là căng, nhưng không cho thấy. Thử nhìn lại câu còn lại nhé."},{"text":"\"Anh phỏng vấn lật hồ sơ của mình, dừng lại, hỏi: 'Sao em nghỉ việc cũ sau có 3 tháng?'\"","correct":true,"feedback":"Đúng rồi! Câu này có hành động và lời thoại, bạn nghe là thấy cảnh ngay."}]},"practice":{"intro":"Biến một chuyện trong kho thành một khoảnh khắc sống động.","steps":["Mở Kho chuyện, chọn 1 chuyện bạn đã lưu ở chặng 1 (hoặc nhớ lại một lần căng thẳng ở chỗ làm).","Tìm đúng **1 giây** quan trọng nhất trong chuyện đó.","Trả lời nhanh 4 câu bên dưới, mỗi câu một dòng.","Bấm đồng hồ 60 giây, nói thành tiếng: bắt đầu từ khoảnh khắc đó, không dẫn chuyện."],"pickStory":true,"fields":[{"label":"Lúc đó bạn ở đâu?","placeholder":"Ví dụ: ở bàn làm việc, cạnh cửa sổ"},{"label":"Bạn đang làm gì?","placeholder":"Ví dụ: đang ăn dở hộp cơm"},{"label":"Trong đầu bạn nghĩ gì, nguyên văn?","placeholder":"Ví dụ: \"Chết rồi…\""},{"label":"Bạn nghe thấy gì, ai nói câu gì?","placeholder":"Ví dụ: Sếp gọi: \"Em qua phòng anh chút\""}],"saveAs":"storyNote","timer":60,"record":true},"review":["Mình bắt đầu ngay tại khoảnh khắc, không vòng vo.","Có ít nhất 1 câu suy nghĩ nguyên văn.","Có ít nhất 1 câu lời thoại hoặc 1 hành động cụ thể."],"done":"Chuyện của bạn vừa có hình ảnh rồi đó. Mai mình thêm màu cho nó nhé!","videos":["PH-001","PH-004"]},{"id":"d09","day":9,"stage":2,"branch":null,"milestone":false,"title":"Nơi chốn – hành động – lời thoại – suy nghĩ","hook":"Bốn thứ nhỏ biến một câu kể thành một cảnh người nghe nhìn thấy được.","cards":[{"type":"story","title":"Đốm kể","body":"Ngọc kể với Đốm: *\"Hôm gặp khách lần đầu, mình hơi lúng túng, nhưng rồi cũng ổn.\"* Đốm nghe xong, chẳng thấy gì trong đầu.\n\nĐốm hỏi lại bốn câu: Ở đâu? Bạn đang làm gì? Ai nói gì? Bạn nghĩ gì?\n\nNgọc kể lại: *\"Quán cà phê đối diện tòa nhà khách. Mình vừa đặt tập hồ sơ lên bàn thì ly trà đá đổ lênh láng. Anh khách nhìn đống giấy ướt, nói: 'Không sao, em kể anh nghe là được.' Mình nghĩ: 'Thôi, nói không cần giấy vậy.'\"*\n\nVẫn là chuyện đó. Chỉ thêm bốn thứ, và Đốm thấy mình như đang ngồi ở bàn bên cạnh."},{"type":"idea","title":"Ý chính","body":"Hôm qua bạn đã biết 5 thứ đưa người nghe vào cảnh. Hôm nay Đốm gói lại thành **4 thứ dễ nhớ nhất**: Nơi chốn – Hành động – Lời thoại – Suy nghĩ. Tên gốc tiếng Anh là khung PAST (Place – Action – Speech – Thoughts).\n\nHãy hình dung như quay phim. Nơi chốn là khung hình. Hành động làm cảnh chuyển động. Lời thoại cho cảnh có tiếng. Suy nghĩ đưa người nghe vào trong đầu bạn.\n\nTin vui: **không cần đủ cả 4**. Có 3 trong 4 là chuyện đã sống động rồi."},{"type":"how","title":"Cách làm: 4 thứ, mỗi thứ một dòng","body":"| Thứ | Làm thế nào | Lỗi hay gặp | Ví dụ |\n| --- | --- | --- | --- |\n| Nơi chốn | 1 cụm từ, có thể kèm giờ | Tả cả căn phòng, màu tường, bàn ghế | \"9 giờ tối, ở bãi gửi xe công ty\" |\n| Hành động | Động từ cụ thể, đang diễn ra | \"Mình xử lý công việc\" | \"Mình dắt xe ra, chùm chìa khóa rơi xuống rãnh\" |\n| Lời thoại | Nhắc nguyên câu, ngắn. Không nhớ chính xác thì dùng câu sát nhất | Kể gián tiếp: \"chú bảo là không sao\" | Chú bảo vệ: \"Để chú lấy cái móc.\" |\n| Suy nghĩ | Câu thật trong đầu, đời thường | Câu \"chuyên nghiệp\": \"mình nhận ra cần bình tĩnh\" | \"Thôi, mai đi xe ôm vậy.\" |\n\nMẹo soát nhanh: đọc lại chuyện, đánh dấu 4 chữ N – H – L – S. Thiếu từ 2 chữ trở lên thì thêm vào."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Kể chung chung","strongLabel":"Có 3–4 yếu tố","rows":[{"branch":"A","weak":"\"Hôm đám cưới đồng nghiệp, mình gặp lại sếp cũ, nói chuyện khá vui.\"","strong":"\"Bàn số 12, mình đang gắp miếng nem thì có người vỗ vai: 'Ơ, Hà đây mà, giờ làm ở đâu rồi?' Quay lại, sếp cũ. Mình nghĩ: 'Chết, tay đang dính mỡ.'\""},{"branch":"B","weak":"\"Buổi live đầu tiên có khách hỏi khó, mình trả lời cũng tạm được.\"","strong":"\"Phòng ngủ, đèn vòng bật sáng. Mình đang giơ chiếc áo lên thì bình luận hiện ra: 'Bên kia bán rẻ hơn.' Mình nghĩ: 'Lờ đi hay trả lời đây?'\""},{"branch":"C","weak":"\"Trong buổi họp quý, phần số liệu của em có chút trục trặc.\"","strong":"\"Phòng họp tầng 3. Em vừa bấm sang biểu đồ doanh thu thì anh phó giám đốc giơ tay: 'Khoan, cột này sao thấp thế?' Em nghĩ: 'Mình để nhầm đơn vị rồi.'\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Có 3 trong 4 thứ – nơi chốn, hành động, lời thoại, suy nghĩ – là người nghe đã ở trong cảnh."}],"quiz":{"kind":"choice","question":"Đoạn kể sau còn thiếu thứ gì? *\"Ở sảnh khách sạn, mình kéo vali tới quầy. Cô lễ tân nói: 'Dạ, phòng anh đặt cho ngày mai ạ.'\"*","options":[{"text":"Nơi chốn","correct":false,"feedback":"Nơi chốn có rồi: \"sảnh khách sạn\". Gọn mà đủ. Thử tìm thứ còn vắng nhé."},{"text":"Lời thoại","correct":false,"feedback":"Lời thoại có rồi: câu của cô lễ tân. Thứ còn thiếu nằm trong đầu người kể."},{"text":"Suy nghĩ","correct":true,"feedback":"Chính xác! Người nghe đang chờ biết lúc đó bạn nghĩ gì. Thêm một câu như \"Mình nghĩ: 'Tối nay ngủ đâu?'\" là chuyện bật lên ngay."}]},"practice":{"intro":"Viết lại một chuyện trong kho cho đủ 4 thứ.","steps":["Mở Kho chuyện, chọn chuyện bạn đã zoom hôm qua (hoặc một chuyện khác bạn thích).","Điền 4 ô bên dưới, mỗi ô **1 dòng**. Ô nào bí quá 30 giây thì bỏ qua: 3 trong 4 là đủ.","Đọc lại cả 4 dòng. Gạch bớt chữ nào đang tả dài.","Bấm đồng hồ 45 giây, ghép 4 dòng thành lời kể và nói thành tiếng."],"pickStory":true,"fields":[{"label":"Nơi chốn","placeholder":"Ví dụ: 7 giờ sáng, ở cửa thang máy tầng hầm"},{"label":"Hành động","placeholder":"Ví dụ: mình đang bấm nút, tay kia cầm ly cà phê"},{"label":"Lời thoại","placeholder":"Ví dụ: Anh bảo vệ gọi: \"Em ơi, thang này hỏng rồi!\""},{"label":"Suy nghĩ","placeholder":"Ví dụ: \"Tầng 12… đi bộ thật à?\""}],"saveAs":"storyNote","timer":45,"record":true},"review":["Mình gọi tên nơi chốn bằng 1 cụm từ, không tả dài.","Chuyện của mình có ít nhất 3 trong 4 thứ.","Câu suy nghĩ là câu thật lúc đó, không phải câu \"chuyên nghiệp\"."],"done":"Chuyện của bạn giờ đã có hình, có tiếng. Mai Đốm chỉ bạn cách để người nghe cảm được mà không cần nói \"mình rất lo\" nhé!","videos":["PH-008","PH-001"]},{"id":"d10","day":10,"stage":2,"branch":null,"milestone":false,"title":"Nói suy nghĩ thay vì gọi tên cảm xúc","hook":"Nói \"mình rất lo\" thì người nghe chỉ biết. Nói câu bạn nghĩ lúc đó thì họ lo cùng bạn.","cards":[{"type":"story","title":"Đốm kể","body":"Giờ nghỉ trưa, Vy kể về lần đầu chạy chương trình khuyến mãi: *\"Hôm đó mình lo lắm, lo cực kỳ luôn.\"* Ba lần chữ \"lo\". Cả bàn vẫn ăn tiếp.\n\nRồi Vy kể thêm: *\"10 giờ tối mà số đơn vẫn bằng 0. Mình bấm tải lại trang liên tục, nghĩ: 'Hay đường link hỏng? Hay mình chọn nhầm ngày?'\"*\n\nChị Hạnh đặt đũa xuống: \"Rồi sao nữa em?\"\n\nChữ \"lo\" không làm ai lo theo. Câu hỏi trong đầu Vy thì có."},{"type":"idea","title":"Ý chính","body":"Có 3 mức đưa cảm xúc vào chuyện:\n\n1. **Kể việc**: \"Hôm đó chưa có đơn nào.\" Người nghe biết chuyện gì xảy ra.\n2. **Gọi tên cảm xúc**: \"Mình rất lo.\" Người nghe biết bạn lo, nhưng không lo cùng.\n3. **Nói ra suy nghĩ**: \"Hay đường link hỏng?\" Người nghe nghĩ cùng bạn, và tự thấy lo.\n\nCảm xúc là kết quả, suy nghĩ là nguyên nhân. Đưa nguyên nhân cho người nghe, họ sẽ tự ra kết quả."},{"type":"how","title":"Cách làm: từ \"mình rất…\" sang câu trong đầu","body":"1. **Tìm chữ cảm xúc** trong chuyện: lo, vui, sợ, bực, ngại, hồi hộp…\n2. **Hỏi mình**: \"Lúc đó trong đầu mình đang nói câu gì?\" Viết nguyên văn, để trong ngoặc kép.\n3. **Giữ câu thô**: \"Thôi xong\", \"Ơ, sao lại thế?\" Đừng sửa cho hay.\n4. **Không nhớ suy nghĩ?** Tả một phản ứng của cơ thể: tay lạnh, mặt nóng, nuốt nước bọt.\n\n| Gọi tên cảm xúc | Nói suy nghĩ |\n| --- | --- |\n| \"Mình rất lo\" | \"Lỡ khách hỏi giá mà mình chưa có báo giá thì sao?\" |\n| \"Mình vui lắm\" | \"Trời, chị ấy nhớ cả tên mình.\" |\n| \"Mình bực lắm\" | \"Lần thứ ba rồi, sao không ai đọc tin nhắn nhóm?\" |\n\nKhông cần xóa hết chữ cảm xúc. Một câu gọi tên đi kèm một câu suy nghĩ vẫn rất ổn."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Gọi tên cảm xúc","strongLabel":"Nói ra suy nghĩ","rows":[{"branch":"A","weak":"\"Lần đầu đi họp phụ huynh cho con, mình ngại lắm.\"","strong":"\"Cô giáo đọc to: 'Phụ huynh em Bin ở lại chút nhé.' Mình nghĩ: 'Thằng bé lại làm gì rồi?'\""},{"branch":"B","weak":"\"Đăng video đầu tiên xong, mình hồi hộp vô cùng.\"","strong":"\"Đăng xong, mình úp điện thoại xuống bàn. Năm phút sau lật lên, nghĩ: 'Chắc chưa ai xem đâu… mà lỡ có người chê thì sao?'\""},{"branch":"C","weak":"\"Lúc sếp hỏi câu đó, em rất bối rối.\"","strong":"\"Sếp hỏi: 'Thế phương án dự phòng là gì?' Em nghĩ: 'Mình chưa từng nghĩ tới phương án dự phòng.'\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Đừng bảo người nghe là bạn lo. Cho họ nghe câu bạn nghĩ, họ sẽ lo cùng bạn."}],"quiz":{"kind":"choice","question":"Câu nào giúp người nghe cảm được nhiều nhất?","options":[{"text":"\"Mình cực kỳ, cực kỳ hồi hộp.\"","correct":false,"feedback":"Gọi tên to hơn không làm người nghe cảm nhiều hơn. Họ vẫn chỉ được \"báo\" là bạn hồi hộp."},{"text":"\"Hôm đó mình được gọi lên phát biểu.\"","correct":false,"feedback":"Câu này mới kể việc. Người nghe chưa biết bên trong bạn đang diễn ra gì."},{"text":"\"Mình nhìn tờ giấy, nghĩ: 'Đọc hết dòng ba là hết bài, còn bốn phút thì nói gì?'\"","correct":true,"feedback":"Đúng rồi! Không có chữ \"hồi hộp\" nào, nhưng ai nghe cũng thấy tim mình đập nhanh theo."}]},"practice":{"intro":"Đổi 5 câu gọi tên cảm xúc thành 5 câu suy nghĩ cụ thể.","steps":["Luyện tay với 4 câu đầu: hình dung tình huống trong ngoặc, viết câu bạn sẽ nghĩ trong đầu, nguyên văn.","Mở chuyện bạn đang dựng. Tìm chỗ bạn định nói \"mình thấy…\" hoặc \"mình rất…\", viết lại vào ô số 5.","Bấm đồng hồ 45 giây, kể khoảnh khắc chính của chuyện, dùng câu suy nghĩ mới."],"pickStory":true,"fields":[{"label":"1. \"Mình rất lo.\" (sếp nhắn: \"Gặp anh lúc 10 giờ.\")","placeholder":"Câu trong đầu bạn, có ngoặc kép"},{"label":"2. \"Mình vui lắm.\" (khách cũ giới thiệu thêm một khách mới)","placeholder":"Câu trong đầu bạn, có ngoặc kép"},{"label":"3. \"Mình bực mình.\" (file gửi nhóm lần thứ ba vẫn chưa ai mở)","placeholder":"Câu trong đầu bạn, có ngoặc kép"},{"label":"4. \"Mình xấu hổ quá.\" (gọi nhầm tên khách giữa cuộc họp)","placeholder":"Câu trong đầu bạn, có ngoặc kép"},{"label":"5. Trong chuyện của bạn: câu cảm xúc nào, đổi thành suy nghĩ gì?","placeholder":"Ví dụ: \"mình rất ngại\" → \"Mọi người có đang nhìn mình không?\""}],"saveAs":"storyNote","timer":45,"record":true},"review":["Mình đổi được ít nhất 3 câu cảm xúc thành câu suy nghĩ.","Câu suy nghĩ của mình thô, đời thường, đặt trong ngoặc kép.","Khoảnh khắc chính trong chuyện của mình có ít nhất 1 câu suy nghĩ."],"done":"Giờ người nghe đã nghĩ cùng bạn rồi. Mai mình xếp các mảnh lại thành một câu chuyện có đầu có cuối nhé!","videos":["PH-004","PH-049"]},{"id":"d11","day":11,"stage":2,"branch":null,"milestone":false,"title":"Bối cảnh – Trở ngại – Giải quyết – Điều rút ra","hook":"Chuyện hay không dồn thời gian vào phần dẫn. Nó dồn vào phần khó khăn.","cards":[{"type":"story","title":"Đốm kể","body":"Khoa kể chuyện đi công tác Đà Nẵng. Hai phút đầu, Khoa kể mua vé ra sao, khách sạn thế nào, tối ăn món gì.\n\nĐến đoạn hay nhất thì mọi người đã bắt đầu lướt điện thoại. Còn 30 phút nữa khai mạc, máy chiếu không nhận laptop. Khoa kể đoạn này đúng hai câu, rồi chốt: \"Nhưng rồi cũng xong.\"\n\nChuyện của Khoa có đủ nguyên liệu. Chỉ là phần ngon nhất bị dồn vào cuối, và ngắn nhất."},{"type":"idea","title":"Ý chính","body":"Một câu chuyện ngắn chỉ cần **4 ô**: Bối cảnh – Trở ngại – Giải quyết – Điều rút ra. Tên gốc là khung CART (Context – Adversity – Resolution – Takeaway).\n\nHai bí quyết nằm ở đầu và giữa. Bối cảnh thật ngắn, nhưng nói rõ **lúc đó mình muốn gì**. Người nghe sẽ tự hỏi: \"Có được không?\" và nghe tiếp để biết.\n\n**Trở ngại là phần dài nhất.** Đó là chỗ người nghe hồi hộp, là chỗ bạn dùng nơi chốn, lời thoại, suy nghĩ của hai hôm trước."},{"type":"how","title":"Cách làm: điền 4 ô","body":"| Ô | Trả lời câu hỏi | Độ dài (chuyện 1 phút) | Ví dụ |\n| --- | --- | --- | --- |\n| Bối cảnh | Ở đâu, khi nào, mình muốn gì? | 1–2 câu | \"Sáng khai mạc hội thảo ở Đà Nẵng. Mình chỉ mong buổi đầu mình phụ trách chạy trơn tru.\" |\n| Trở ngại | Điều gì cản đường, cái gì sắp hỏng? | Khoảng một nửa thời gian | \"Còn 30 phút. Máy chiếu không nhận laptop. Đổi hai dây cáp rồi vẫn thế. Khách bắt đầu vào hội trường.\" |\n| Giải quyết | 1–2 việc then chốt mình đã làm. Kết quả ra sao? | 2–3 câu | \"Mình chạy xuống quầy lễ tân mượn laptop của khách sạn, chép file qua USB. Khai mạc trễ đúng 3 phút.\" |\n| Điều rút ra | Mình đã khác đi thế nào? | 1 câu | \"Từ hôm đó, mình luôn mang theo USB dự phòng và có mặt sớm một tiếng.\" |\n\nĐời thật có thể có mười việc để giải quyết. Câu chuyện chỉ cần một hai việc quan trọng nhất.\n\nỞ ô cuối, nói theo kiểu **\"mình học được…\"**, không phải \"các bạn nên…\". Người nghe dễ nhận bài học từ trải nghiệm hơn từ lời khuyên."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Dẫn dài, khó khăn một câu","strongLabel":"Dẫn ngắn, khó khăn là phần chính","rows":[{"branch":"A","weak":"\"Nhà mới ở Long Biên, hai phòng ngủ, gần chợ, thuê qua người quen, giá cũng hợp lý… Hôm chuyển thì mưa, nhưng rồi cũng xong.\"","strong":"\"Hôm chuyển nhà, mình chỉ mong xong trước tối. 5 giờ chiều trời đổ mưa, xe tải báo trễ hai tiếng. Chủ nhà cũ nhắn: '7 giờ chị bàn giao cho người mới nhé.' Cuối cùng mấy đứa bạn đội áo mưa khiêng từng thùng. Mình học được: nhờ bạn sớm hơn mình tưởng.\""},{"branch":"B","weak":"\"Mình bán hàng online mấy năm rồi, đầu tiên bán quần áo, sau chuyển sang đồ gia dụng… Có lần bị trả hàng nhiều, mình rút ra phải cẩn thận.\"","strong":"\"Tháng đầu bán nồi chiên, mình chỉ mong hòa vốn. Rồi một tuần có 7 đơn bị trả về, hàng chất kín góc phòng. Mình gọi lại từng khách hỏi vì sao. Từ đó mình gọi xác nhận trước khi gửi. Mình học được: hỏi một câu rẻ hơn ship một đơn.\""},{"branch":"C","weak":"\"Dự án ra mắt ứng dụng có 5 giai đoạn, nhóm 6 người, dùng phần mềm quản lý công việc… Cuối cùng trễ một chút nhưng vẫn xong.\"","strong":"\"Nhóm em cần ra mắt ứng dụng trước Tết. Hai tuần trước hạn, khách đổi toàn bộ màn hình thanh toán. Em chia màn hình thành 3 phần, nhờ khách duyệt từng phần. Trễ 4 ngày, nhưng không phải làm lại. Nhóm học được: xin duyệt sớm, duyệt từng phần nhỏ.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Bối cảnh thật ngắn, trở ngại thật rõ, kết bằng đúng một điều mình học được."}],"quiz":{"kind":"order","question":"Sắp xếp 4 câu sau theo khung Bối cảnh – Trở ngại – Giải quyết – Điều rút ra.","items":["\"Tuần đầu làm trưởng nhóm, mình chỉ muốn cả nhóm nộp báo cáo đúng hạn.\"","\"5 giờ chiều thứ Sáu, mới có 2 trên 6 bạn nộp. Sếp nhắn: 'Sáng mai chị cần nhé.'\"","\"Mình gọi từng bạn, hỏi đang vướng chỗ nào, rồi chia lại phần việc.\"","\"Mình học được: hỏi 'đang vướng gì' sớm thì đỡ phải nhắc 'nộp chưa'.\""],"feedback":"Câu đầu nói rõ mình muốn gì, nên người nghe tò mò \"có kịp không?\". Câu thứ hai là trở ngại, có giờ và lời thoại. Câu ba là việc then chốt. Câu cuối là điều rút ra, nói theo kiểu \"mình học được\"."},"practice":{"intro":"Dựng khung 4 ô cho chuyện bạn đang làm.","steps":["Mở Kho chuyện, chọn chuyện bạn đã thêm ghi chú ở ngày 8–10.","Điền 4 ô bên dưới. Ô **Trở ngại** viết dài nhất: dùng lại nơi chốn, lời thoại, suy nghĩ đã có.","Đọc lại ô Bối cảnh: đã có câu \"mình muốn…\" chưa? Dài quá 2 câu thì cắt.","Bấm đồng hồ 60 giây, kể thành tiếng theo đúng thứ tự 4 ô."],"pickStory":true,"fields":[{"label":"Bối cảnh – ở đâu, khi nào, mình muốn gì?","placeholder":"Ví dụ: Ngày đầu nhận việc mới, mình chỉ mong không bị ai để ý."},{"label":"Trở ngại – điều gì cản đường?","placeholder":"Viết dài nhất. Có lời thoại hoặc câu suy nghĩ càng tốt."},{"label":"Giải quyết – 1–2 việc then chốt mình đã làm","placeholder":"Ví dụ: Mình hít một hơi, đứng dậy hỏi thẳng chị trưởng nhóm."},{"label":"Điều rút ra – mình đã khác đi thế nào?","placeholder":"Bắt đầu bằng: \"Mình học được…\""}],"saveAs":"storyNote","timer":60,"record":true},"review":["Bối cảnh của mình chỉ 1–2 câu và có nói \"mình muốn gì\".","Phần trở ngại là phần dài nhất.","Điều rút ra là 1 câu, nói theo kiểu \"mình học được\"."],"done":"Chuyện của bạn giờ đã có xương sống. Mai mình tìm câu mở khiến người ta muốn nghe ngay từ giây đầu nhé!","videos":["PH-010","PH-009"]},{"id":"d12","day":12,"stage":2,"branch":null,"milestone":false,"title":"5 cách mở chuyện","hook":"Câu đầu tiên quyết định người nghe ngẩng lên hay cúi xuống điện thoại.","cards":[{"type":"story","title":"Đốm kể","body":"Buổi đào tạo nhân viên mới, chị Thu mở đầu: *\"Dạ, hôm nay em xin kể một câu chuyện nhỏ, cũng không có gì đặc biệt lắm…\"* Hàng ghế cuối bắt đầu mở điện thoại.\n\nTuần sau, cũng chuyện đó, chị Thu đổi câu đầu: *\"Chị khách đặt tờ 500 nghìn lên quầy, đẩy về phía tôi: 'Em cầm lấy, coi như chị cảm ơn.'\"* Cả phòng ngẩng lên.\n\nPhần sau của câu chuyện không đổi một chữ. Chỉ đổi câu đầu."},{"type":"idea","title":"Ý chính","body":"Nhiều người mở chuyện bằng một câu dẫn: \"Để mình kể…\",
