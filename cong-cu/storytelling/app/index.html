\"Chuyện cũng không có gì…\". Câu dẫn báo trước là sắp kể, nhưng chưa cho người nghe lý do để nghe.\n\nNgười nghe không cần được báo trước. Họ cần được **thả ngay vào giữa cảnh**. Câu đầu tiên của bạn nên là một phần của câu chuyện, không phải lời xin phép kể chuyện."},{"type":"how","title":"Cách làm: 5 kiểu câu mở cho cùng một chuyện","body":"Chuyện ví dụ: giao nhầm màu sơn cho khách.\n\n| Kiểu mở | Làm thế nào | Ví dụ |\n| --- | --- | --- |\n| 1. Hành động | Nhân vật đang làm gì đó | \"Mình đang bê thùng sơn cuối cùng lên xe thì nhìn thấy nhãn: màu kem, không phải màu trắng.\" |\n| 2. Lời thoại | Câu then chốt, nguyên văn | \"'Em ơi, tường nhà chị đang thành màu vàng rồi đấy.'\" |\n| 3. Câu hỏi | Câu người nghe cũng từng gặp | \"Bạn đã bao giờ gửi đi một thứ, rồi mới biết là gửi sai chưa?\" |\n| 4. Nhân vật | Vài nét riêng của một người | \"Chị khách ấy nói nhanh, cười to, và không bao giờ đọc tin nhắn quá dòng thứ hai.\" |\n| 5. Mở ở điểm gay cấn | Bắt đầu sát khoảnh khắc căng nhất, rồi tua lại | \"Mình đứng trước bức tường sơn dở, chủ nhà khoanh tay sau lưng. Tua lại ba tiếng trước…\" |\n\nChọn kiểu hợp hoàn cảnh. Trò chuyện hợp hành động, lời thoại. Thuyết trình hợp câu hỏi. Video hợp kiểu mở ở điểm gay cấn."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Mở bằng câu dẫn","strongLabel":"Mở vào giữa cảnh","rows":[{"branch":"A","weak":"\"Kể cho nghe chuyện này hơi dài nhé, hôm trước nhà mình đi Đà Lạt…\"","strong":"\"'Anh ơi, xe này không lên dốc nổi đâu.' Chú tài xế nói câu đó khi cả nhà mình đang ở chân đèo.\""},{"branch":"B","weak":"\"Xin chào cả nhà, hôm nay mình sẽ chia sẻ câu chuyện mình bắt đầu bán hàng.\"","strong":"\"Bạn đã bao giờ nhập 200 cái ốp điện thoại, rồi phát hiện chúng không vừa chiếc máy nào chưa?\""},{"branch":"C","weak":"\"Trước khi vào nội dung chính, em xin kể một câu chuyện nhỏ liên quan đến khách hàng.\"","strong":"\"8 giờ tối thứ Sáu, em nhận cuộc gọi: 'Hợp đồng ngày mai chị không ký nữa.' Tua lại một tuần trước…\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Đừng báo là sắp kể. Kể luôn."}],"quiz":{"kind":"choice","question":"Câu mở nào khiến bạn muốn nghe tiếp nhất?","options":[{"text":"\"Hôm nay mình xin kể một chuyện nhỏ về ngày đầu đi làm.\"","correct":false,"feedback":"Câu này mới báo là sắp kể. Người nghe chưa thấy cảnh nào, chưa có gì để tò mò."},{"text":"\"Cửa thang máy mở. Người đứng trong đó là ông chú mình vừa tranh chỗ đỗ xe sáng nay. Chú đeo thẻ: Giám đốc.\"","correct":true,"feedback":"Đúng rồi! Có hành động, có nhân vật, có điểm gay cấn. Ai nghe cũng muốn biết chuyện gì xảy ra tiếp."},{"text":"\"Chuyện này cũng bình thường thôi, nhưng mình vẫn muốn kể.\"","correct":false,"feedback":"Câu này còn tự hạ giá câu chuyện trước khi kể. Thử vào thẳng một cảnh nhé."}]},"practice":{"intro":"Viết 3 câu mở khác nhau cho cùng một chuyện.","steps":["Mở Kho chuyện, chọn chuyện bạn đã dựng khung 4 ô hôm qua.","Viết 3 câu mở vào 3 ô, mỗi ô một kiểu khác nhau. Không câu nào bắt đầu bằng \"Để mình kể…\".","Đọc to cả 3 câu. Chọn câu khiến bạn muốn nói tiếp nhất, chép câu đó vào ô cuối cùng bên dưới.","Bấm đồng hồ 45 giây, kể chuyện bắt đầu từ câu bạn vừa chọn."],"pickStory":true,"fields":[{"label":"Câu mở 1 – bằng hành động hoặc lời thoại","placeholder":"Ví dụ: \"Mình vừa ngồi xuống thì sếp gọi: 'Em qua đây chút.'\""},{"label":"Câu mở 2 – bằng câu hỏi hoặc chân dung nhân vật","placeholder":"Ví dụ: \"Bạn đã bao giờ…\""},{"label":"Câu mở 3 – mở ở điểm gay cấn rồi tua lại","placeholder":"Ví dụ: \"… Tua lại sáng hôm đó.\""}],"saveAs":"storyNote","timer":45,"record":true},"review":["Mình viết được 3 câu mở theo 3 kiểu khác nhau.","Không câu nào mở bằng lời xin phép hay \"Để mình kể…\".","Mình đã chọn 1 câu mở và kể thử từ câu đó."],"done":"Câu đầu của bạn đã mở được cửa rồi. Mai mình học cách cắt bớt, để người nghe đi một mạch đến cuối nhé!","videos":["PH-028","PH-006"]},{"id":"d13","day":13,"stage":2,"branch":null,"milestone":false,"title":"\"Nhưng / vì vậy\", vào muộn ra sớm","hook":"Chuyện dài không làm người nghe mệt. Những đoạn thừa mới làm họ mệt.","cards":[{"type":"story","title":"Đốm kể","body":"Long kể chuyện lần đầu dẫn đoàn khách đi thăm nhà máy: *\"Sáng đó mình dậy lúc 5 giờ, rồi đi đón xe, rồi điểm danh, rồi phát nước, rồi xe chạy, rồi…\"*\n\nĐến chữ \"rồi\" thứ bảy, Đốm vẫn chưa biết chuyện nằm ở đâu.\n\nHóa ra chuyện nằm ở đây: đến cổng nhà máy, bảo vệ không cho xe vào. Danh sách khách bị gửi nhầm sang ngày mai. Long chỉ cần bắt đầu từ cái cổng đó."},{"type":"idea","title":"Ý chính","body":"Hôm nay có hai công cụ cắt gọt.\n\n**Một: thay \"và rồi\" bằng \"nhưng\" hoặc \"vì vậy\".** \"Và rồi\" biến chuyện thành bản liệt kê. \"Nhưng\" mang trở ngại vào. \"Vì vậy\" cho thấy việc này dẫn tới việc kia. Đây là mẹo quen thuộc của các biên kịch.\n\n**Hai: vào muộn, ra sớm.** Bắt đầu càng gần lúc có vấn đề càng tốt. Nói xong điều rút ra thì dừng. Giống phim đã biên tập: không ai chiếu cảnh nhân vật đi tìm chỗ đỗ xe trước cuộc họp quan trọng."},{"type":"how","title":"Cách làm: cắt chuyện còn một nửa trong 3 lượt","body":"1. **Lượt 1 – Vào muộn.** Tìm câu đầu tiên có vấn đề. Gạch mọi thứ trước nó, giữ lại tối đa 1 câu bối cảnh.\n2. **Lượt 2 – Nối bằng \"nhưng / vì vậy\".** Xem từng chỗ nối. Có trở ngại thì dùng \"nhưng\". Có nguyên nhân thì dùng \"vì vậy\". Không nối được bằng từ nào? Câu đó có thể bỏ.\n3. **Lượt 3 – Ra sớm.** Sau điều rút ra, dừng. Bỏ các câu \"sau đó mình về\", \"nói chung là vậy\", \"chuyện của mình chỉ có thế thôi\".\n\nVí dụ lượt 2:\n\n> Trước: \"Và rồi mình gọi khách, và rồi khách không nghe máy, và rồi mình nhắn tin.\"\n>\n> Sau: \"Mình gọi khách. **Nhưng** khách không nghe máy. **Vì vậy** mình nhắn: 'Chị ơi, đơn có vấn đề, 3 giờ em gọi lại nhé.'\""},{"type":"compare","title":"Yếu và mạnh","weakLabel":"\"Và rồi… và rồi…\"","strongLabel":"Vào muộn, nối bằng \"nhưng / vì vậy\"","rows":[{"branch":"A","weak":"\"Hôm giỗ ông, mình dậy sớm, rồi đi chợ, rồi về nấu cỗ, rồi bày mâm, rồi bà nếm canh, rồi…\"","strong":"\"Mâm cỗ vừa bày xong thì bà nếm canh, nhíu mày. Mặn chát. **Nhưng** còn 10 phút là khách tới. **Vì vậy** mình đổ thêm nửa nồi nước, thả thêm rau. Bà gật gù: 'Lần sau nêm sau cùng nhé.'\""},{"branch":"B","weak":"\"Mình dựng chân máy, rồi chỉnh đèn, rồi bật live, rồi chào mọi người, rồi giới thiệu sản phẩm, rồi mạng lag…\"","strong":"\"Đang giới thiệu món thứ ba thì hình đứng im. **Nhưng** bình luận vẫn chạy: 'Shop ơi còn không?' **Vì vậy** mình chuyển sang 4G, câu đầu tiên là: 'Cả nhà ơi, mạng nhà mình vừa đi uống trà.'\""},{"branch":"C","weak":"\"Đầu tiên nhóm em họp khởi động, rồi phân công, rồi làm khảo sát, rồi tổng hợp, rồi phát hiện số liệu sai…\"","strong":"\"Hai ngày trước buổi báo cáo, em thấy cột số liệu lệch một dòng. **Nhưng** file đã gửi sếp. **Vì vậy** em gửi ngay bản sửa, kèm một dòng: 'Em nhầm, bản đúng đây ạ.' Từ đó em luôn soát lại trước khi bấm gửi.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Vào thẳng lúc có vấn đề, nối bằng \"nhưng\" và \"vì vậy\", nói xong điều rút ra thì dừng."}],"quiz":{"kind":"choice","question":"Bạn kể chuyện quên mật khẩu máy tính đúng buổi giới thiệu sản phẩm cho khách. Nên bắt đầu từ đâu?","options":[{"text":"\"Sáng hôm đó mình dậy muộn, vội đi làm, quên cả ăn sáng.\"","correct":false,"feedback":"Đoạn này chưa có vấn đề gì. Người nghe phải chờ khá lâu mới tới chỗ hay."},{"text":"\"Khách đã ngồi đủ. Mình mở laptop, gõ mật khẩu. Sai. Gõ lại. Vẫn sai.\"","correct":true,"feedback":"Chuẩn! Vào muộn nhất có thể: ngay giây vấn đề xuất hiện. Người nghe căng lên cùng bạn."},{"text":"\"Công ty mình làm phần mềm kế toán được 5 năm rồi.\"","correct":false,"feedback":"Đây là bối cảnh xa. Nếu cần, gói nó vào nửa câu sau khi đã vào cảnh."}]},"practice":{"intro":"Cắt chuyện bạn đang dựng còn khoảng một nửa, dưới 60 giây.","steps":["Mở Kho chuyện, chọn chuyện bạn đã dựng khung 4 ô. Đọc lại các ghi chú từ ngày 8 đến 12.","**Vào muộn**: viết câu mở mới, bắt đầu sát lúc có vấn đề (có thể dùng câu mở hôm qua).","Tìm một chỗ \"và rồi\" hoặc chỗ nối lỏng, viết lại bằng \"nhưng\" hoặc \"vì vậy\". Rồi viết câu kết mới: dừng ngay sau điều rút ra.","Bấm đồng hồ 60 giây, kể bản đã cắt. Xong trước tiếng chuông là đạt."],"pickStory":true,"fields":[{"label":"Câu mở mới – vào muộn","placeholder":"Ví dụ: \"Còn 10 phút là họp, máy in báo kẹt giấy.\""},{"label":"Một chỗ nối bằng \"nhưng\" hoặc \"vì vậy\"","placeholder":"Ví dụ: \"Mình gọi chị Lan. Nhưng chị đang họp. Vì vậy mình…\""},{"label":"Câu kết mới – ra sớm","placeholder":"Câu điều rút ra. Sau câu này là hết."}],"saveAs":"storyNote","timer":60,"record":true},"review":["Chuyện của mình bắt đầu ngay lúc có vấn đề, tối đa 1 câu bối cảnh.","Mình đã đổi ít nhất 1 chỗ \"và rồi\" thành \"nhưng\" hoặc \"vì vậy\".","Mình dừng ngay sau điều rút ra, và kể xong trong 60 giây."],"done":"Chuyện của bạn đã gọn và có nhịp. Mai là ngày qua màn chặng 2: kể trọn chuyện này trong 1 phút nhé!","videos":["PH-032","PH-020"]},{"id":"d14","day":14,"stage":2,"branch":null,"milestone":true,"title":"Mốc: 1 chuyện hoàn chỉnh 1 phút","hook":"Một tuần trước, đây chỉ là một dòng trong kho. Hôm nay nó là một câu chuyện.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Một tuần trước, chuyện của bạn chỉ là một hạt giống trong kho: một dòng, vài chữ.\n\nSáu ngày qua, bạn đã zoom vào nó, thêm nơi chốn và lời thoại, đổi \"mình rất lo\" thành câu trong đầu. Bạn dựng 4 ô, viết câu mở, rồi cắt còn một nửa.\n\nHôm nay bạn kể trọn chuyện đó trong 1 phút và ghi âm lại. Bản ghi này sẽ nằm cạnh bản ghi ngày 7, để bạn nghe mình đã đi được bao xa."},{"type":"idea","title":"Ôn nhanh chặng 2","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 8 | Người nghe không nhớ câu tóm tắt, họ nhớ khoảnh khắc |\n| 9 | Có 3 trong 4: nơi chốn, hành động, lời thoại, suy nghĩ |\n| 10 | Cho người nghe nghe câu bạn nghĩ, họ sẽ cảm cùng bạn |\n| 11 | Bối cảnh ngắn, trở ngại rõ, kết bằng một điều học được |\n| 12 | Đừng báo là sắp kể. Kể luôn |\n| 13 | Vào lúc có vấn đề, nối bằng \"nhưng / vì vậy\", xong thì dừng |"},{"type":"how","title":"Chuẩn bị (2 phút)","body":"1. Mở chuyện bạn đã dựng từ ngày 8. Chưa dựng đủ? Chọn chuyện có nhiều ghi chú nhất trong kho.\n2. Nghĩ xem bạn sẽ kể nó ở đâu. Gợi ý theo nhánh:\n   - **A. Giao tiếp**: kể cho đồng nghiệp trong bữa trưa.\n   - **B. Trước camera**: kể trong một video ngắn giới thiệu bản thân.\n   - **C. Thuyết trình**: kể để mở đầu một buổi họp hoặc buổi đào tạo.\n3. Ghi 4 dòng nhắc vào các ô bên dưới: câu mở – khoảnh khắc chính – giải quyết – điều rút ra.\n4. Không viết cả bài. Kể từ 4 dòng nhắc thôi."}],"quiz":null,"practice":{"intro":"Kể trọn một chuyện đã dựng trong 1 phút, ghi âm và tự chấm.","steps":["Điền 4 dòng nhắc, mỗi dòng vài chữ là đủ.","Bấm ghi âm, kể trong **60 giây**.","Nghe lại một lần. Được kể lại tối đa 2 lần nữa, chọn bản bạn thích nhất làm **\"Bản ghi ngày 14\"**.","Nếu có bản ghi ngày 7, nghe lại nó. Ghi 1 điều bạn thấy đã khác."],"pickStory":true,"fields":[{"label":"Câu mở","placeholder":"Câu mở bạn đã chọn ở ngày 12–13"},{"label":"Khoảnh khắc chính (có 1 câu suy nghĩ)","placeholder":"Ví dụ: Máy chiếu tắt phụt. Mình nghĩ: \"Còn 30 phút…\""},{"label":"Giải quyết","placeholder":"1–2 việc then chốt"},{"label":"Điều rút ra","placeholder":"\"Mình học được…\""}],"saveAs":"storyNote","timer":60,"record":true},"review":["Mình đưa người nghe vào một khoảnh khắc cụ thể, không chỉ tóm tắt.","Khoảnh khắc chính có nơi chốn, hành động, lời thoại và ít nhất 1 câu suy nghĩ nguyên văn.","Chuyện đi đủ 4 ô, phần trở ngại rõ nhất, kết bằng một điều rút ra.","Câu đầu tiên vào thẳng cảnh, không có \"Để mình kể…\".","Mình kể xong trong khoảng 60 giây và dừng ngay sau điều rút ra."],"done":"Chúc mừng bạn đã qua màn chặng 2 và lên cấp 3 – Người kể tập sự! Từ ngày 15, lộ trình tách theo nhánh bạn đã chọn, Đốm sẽ cùng bạn mang câu chuyện vào đúng nơi bạn cần nói.","videos":[]},{"id":"d15A","day":15,"stage":3,"branch":"A","milestone":false,"title":"Trả lời có khung: Ý kiến – Lý do – Ví dụ – Nhắc lại","hook":"Bị hỏi \"Bạn thấy sao?\" mà không lan man: chỉ cần 4 nhịp.","cards":[{"type":"story","title":"Đốm kể","body":"Giờ ăn trưa, chị Hằng trưởng nhóm hỏi: \"Liên hoan cuối năm nên đi đâu các em?\"\n\nVy trả lời trước: *\"Dạ em thấy chỗ nào cũng được ạ. Nhà hàng gần công ty thì tiện, mà đi biển thì vui hơn, nhưng đi biển lại xa…\"* Nói gần hai phút, chị Hằng hỏi lại: \"Tóm lại em chọn chỗ nào?\"\n\nPhong ngồi cạnh nói: *\"Em chọn nhà hàng gần công ty. Vì tối thứ Sáu, ai cũng muốn về nhà sớm. Năm ngoái đi Ba Vì, nửa đoàn kẹt xe đến 11 giờ đêm. Nên em vẫn nghiêng về chỗ gần.\"* Chị Hằng gật: \"Hợp lý.\"\n\nPhong không thông minh hơn Vy. Phong chỉ có sẵn một cái khung."},{"type":"idea","title":"Ý chính","body":"Ta hay lan man không phải vì thiếu ý. Mà vì vừa nghĩ vừa nói, không có đường ray. Ý nào nảy ra trước thì nói trước.\n\n**Khung PREP** (Point – Reason – Example – Point) cho bạn đường ray đó: **Ý kiến – Lý do – Ví dụ – Nhắc lại**. Nó hợp nhất khi ai đó hỏi ý kiến bạn: \"Bạn thấy sao?\", \"Nên chọn cái nào?\".\n\nNhịp Ví dụ là chỗ người kể chuyện tỏa sáng. Bạn đã có kho chuyện và biết zoom vào khoảnh khắc. Giờ chỉ cần đặt một chuyện nhỏ vào giữa câu trả lời."},{"type":"how","title":"Cách làm: 4 nhịp PREP","body":"| Nhịp | Nói gì | Mẫu câu |\n| --- | --- | --- |\n| 1. Ý kiến | Câu trả lời thẳng, 1 câu | \"Mình nghĩ là…\", \"Mình chọn…\" |\n| 2. Lý do | 1 lý do chính, không cần 5 | \"Vì…\" |\n| 3. Ví dụ | 1 chuyện nhỏ hoặc 1 hình ảnh cụ thể | \"Có lần…\", \"Như hôm…\" |\n| 4. Nhắc lại | Nói lại ý kiến, rồi dừng | \"Nên mình vẫn chọn…\" |\n\nHai mẹo nhỏ:\n\n- Thở một hơi trước câu đầu tiên. Hai giây đó đủ để bạn chọn ý kiến.\n- Chưa chắc chắn? \"Mình đang nghiêng về…\" vẫn là một ý kiến rõ ràng."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nghĩ đến đâu nói đến đấy","strongLabel":"Có khung PREP","rows":[{"branch":null,"weak":"Bạn hỏi: \"Mua laptop nào cho con học?\" — \"Ừ thì máy nào cũng có cái hay. Máy này nhẹ, mà máy kia rẻ hơn, nhưng máy này pin lâu… Tùy bạn thôi.\"","strong":"\"Mình chọn máy nhẹ. Vì con mang đi học hằng ngày. Cháu mình dùng máy nặng, được hai tuần là để ở nhà luôn. Nên mình vẫn bảo chọn máy nhẹ.\""},{"branch":null,"weak":"Khách hỏi: \"Gói nào hợp với bên chị?\" — \"Dạ bên em có ba gói. Gói cơ bản thì… gói tiêu chuẩn thì… còn gói nâng cao thì…\"","strong":"\"Dạ em nghĩ gói tiêu chuẩn hợp với chị nhất. Vì bên chị có 8 bạn, gói này đủ tài khoản cho cả nhóm. Tháng trước một tiệm cùng cỡ chọn gói cơ bản, hai tuần sau đã xin nâng cấp. Nên em gợi ý chị bắt đầu từ gói tiêu chuẩn.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Nói ý kiến trước, kể ví dụ ở giữa, nhắc lại ở cuối."}],"quiz":{"kind":"order","question":"Bạn bè hỏi: \"Có nên đi học thêm buổi tối không?\" Sắp xếp câu trả lời theo PREP.","items":["\"Mình nghĩ là nên, nếu chỉ học 2 buổi một tuần.\"","\"Vì học đều vẫn hơn học dồn rồi bỏ giữa chừng.\"","\"Năm ngoái mình đăng ký 5 buổi một tuần, được ba tuần thì nghỉ hẳn.\"","\"Nên mình vẫn bảo: nên học, nhưng 2 buổi thôi.\""],"feedback":"Ý kiến đi trước để người nghe biết ngay câu trả lời. Lý do và ví dụ làm ý kiến đáng tin. Câu cuối nhắc lại để khép lại gọn gàng, không lửng lơ."},"practice":{"intro":"Trả lời một câu hỏi ý kiến bằng 4 nhịp PREP, gọn trong 45 giây.","steps":["Chọn 1 câu hỏi bên dưới, hoặc một câu bạn đã bị hỏi trong tuần này.","Điền 4 ô, mỗi ô một dòng. Ô Ví dụ: lấy một chuyện trong Kho chuyện nếu hợp.","Bấm đồng hồ 45 giây, nói thành tiếng. Thở một hơi trước câu đầu tiên.","Nghe lại và tự hỏi: câu đầu tiên có phải là ý kiến không?"],"topics":["Đồng nghiệp hỏi: \"Liên hoan cuối năm nên đi đâu?\"","Bạn hỏi: \"Có nên đổi sang làm việc gần nhà hơn không?\"","Khách hỏi: \"Em thấy chị nên chọn mẫu nào?\""],"pickStory":false,"fields":[{"label":"Ý kiến","placeholder":"Ví dụ: Mình chọn nhà hàng gần công ty."},{"label":"Lý do","placeholder":"Ví dụ: Vì tối thứ Sáu ai cũng muốn về sớm."},{"label":"Ví dụ","placeholder":"Ví dụ: Năm ngoái đi xa, nửa đoàn kẹt xe đến khuya."},{"label":"Nhắc lại","placeholder":"Ví dụ: Nên mình vẫn nghiêng về chỗ gần."}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Câu đầu tiên của mình là ý kiến, không phải \"Ừ thì…\".","Ví dụ của mình là một chuyện nhỏ hoặc một hình ảnh cụ thể.","Mình nhắc lại ý kiến ở cuối rồi dừng."],"done":"Có khung rồi, bị hỏi bất ngờ cũng không sợ lạc. Mai Đốm chỉ bạn cách làm người nghe hiểu ngay, chỉ bằng ba chữ \"giống như…\".","videos":["PH-016"]},{"id":"d15B","day":15,"stage":3,"branch":"B","milestone":false,"title":"Nói với một người, không nói với \"các bạn\"","hook":"Trước camera không có đám đông. Chỉ có một người đang cầm điện thoại xem bạn.","cards":[{"type":"story","title":"Đốm kể","body":"Hà bán đồ gốm online, tối nào cũng livestream. Vừa bật live, Hà nói một mạch: *\"Chào các bạn, chào cả nhà! Hôm nay shop lên rất nhiều mẫu mới, các bạn xem nhé…\"* Mắt Hà dán vào dòng bình luận, giọng như đọc thông báo.\n\nMột tối, chị khách quen nhắn riêng: *\"Em nói như đọc tin, chị nghe một lúc là lướt.\"*\n\nHôm sau, Hà dán một mẩu giấy cạnh camera: *\"Chị Mai – tìm bộ bát tặng mẹ.\"* Bật live, Hà nói: *\"Chị đang tìm quà cho mẹ phải không? Chị nhìn bộ này nhé.\"* Giọng Hà chậm lại, ấm hơn. Bình luận hỏi han cũng nhiều hơn hẳn."},{"type":"idea","title":"Ý chính","body":"Người xem video không ngồi trong hội trường. Mỗi người đang xem **một mình**, trên chiếc điện thoại trong tay.\n\nKhi bạn nói \"các bạn ơi\", họ thấy mình đứng lẫn trong đám đông. Khi bạn nói với \"bạn\", với \"chị\", họ thấy bạn đang nói với chính họ.\n\nCách dễ nhất: chọn trước **một người cụ thể** mà video này giúp được, rồi nói với đúng người đó. Đầu bạn bận nghĩ \"mình giúp người này thế nào\", nên bớt chỗ cho câu \"mình trông có ổn không\"."},{"type":"how","title":"Cách làm: 4 bước nói với một người","body":"1. **Chọn một người thật.** Một khách quen, một đồng nghiệp mới, một người bạn. Ghi tên và điều họ đang cần lên mẩu giấy.\n2. **Dán mẩu giấy cạnh camera.** Nhìn vào ống kính như nhìn vào mắt người đó. Đừng nhìn mặt mình trên màn hình.\n3. **Đổi cách xưng hô.** \"Các bạn\", \"mọi người\" → \"bạn\", \"chị\", \"anh\". Chào \"cả nhà\" một câu lúc mở live cũng được, sau đó quay về nói với một người.\n4. **Nhẩm một câu trước khi bấm quay:** \"Mình ở đây để giúp chị Mai.\"\n\nHọp Zoom hay Google Meet cũng vậy: nhìn vào chấm camera, nghĩ tới người cần thông tin của bạn nhất."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nói với đám đông","strongLabel":"Nói với một người","rows":[{"branch":null,"weak":"\"Chào các bạn! Hôm nay mình chia sẻ với các bạn 3 mẹo pha cà phê phin mà các bạn nên biết.\"","strong":"\"Sáng nào bạn cũng pha phin mà cà phê cứ nhạt? Mình chỉ bạn ba mẹo, sáng mai làm được ngay.\""},{"branch":null,"weak":"*(Họp Zoom, mắt nhìn màn hình)* \"Dạ, em xin phép cập nhật với mọi người tình hình dự án ạ.\"","strong":"*(Nhìn vào camera)* \"Anh Tùng, hôm trước anh hỏi lịch giao hàng. Em cập nhật luôn: đợt một xong thứ Sáu ạ.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Nói với một người, thì mỗi người xem đều thấy bạn đang nói với mình."}],"quiz":{"kind":"choice","question":"Bạn quay video giới thiệu lớp nấu ăn online. Câu mở nào khiến người xem thấy được nói với mình?","options":[{"text":"\"Xin chào tất cả các bạn đang xem video này!\"","correct":false,"feedback":"Câu này chào cả đám đông. Người xem nghe xong vẫn chưa biết video có dành cho mình không."},{"text":"\"Tối nào bạn cũng nghĩ mãi không ra nấu món gì? Video này dành cho bạn.\"","correct":true,"feedback":"Đúng rồi! Câu này nói với một người, chạm đúng điều họ đang bận tâm."}]},"practice":{"intro":"Quay 45 giây nói với đúng một người.","steps":["Chọn một điều bạn muốn giới thiệu, hoặc lấy một đề có sẵn bên dưới.","Điền 2 ô: người xem của bạn là ai, và câu đầu tiên bạn nói với họ.","Kê điện thoại ngang tầm mắt, nhìn vào ống kính. Bấm ghi (trên công cụ hoặc camera trước của điện thoại), nói **45 giây** với người đó, xưng \"bạn\", \"chị\" hoặc \"anh\".","Nghe lại, đếm xem mình nói \"các bạn\", \"mọi người\" mấy lần."],"topics":["Giới thiệu một món đồ bạn đang bán hoặc rất hay dùng","Chia sẻ một mẹo nhỏ trong công việc của bạn","Mời một người tham gia buổi gặp mặt hoặc sự kiện sắp tới"],"pickStory":false,"fields":[{"label":"Người xem của bạn là ai, họ đang cần gì?","placeholder":"Ví dụ: chị Mai, khách quen, đang tìm quà tặng mẹ"},{"label":"Câu đầu tiên bạn nói với họ","placeholder":"Ví dụ: Chị đang tìm quà cho mẹ phải không?"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Mình nói với một người cụ thể, có tên trong đầu.","Mình xưng \"bạn/chị/anh\"; \"các bạn\" xuất hiện không quá 1 lần.","Mình nhìn vào ống kính phần lớn thời gian, không nhìn mặt mình."],"done":"Video của bạn vừa có một người xem thật sự. Mai mình sắp lại lời nói để người đó hiểu ngay từ câu đầu nhé!","videos":["PH-030","PH-022"]},{"id":"d15C","day":15,"stage":3,"branch":"C","milestone":false,"title":"5 lỗi khiến bài nói khó hiểu","hook":"Bạn hiểu rõ vấn đề mà người nghe vẫn mơ hồ? Thường là do một trong 5 lỗi này.","cards":[{"type":"story","title":"Đốm kể","body":"Cuối tuần, Đốm dự buổi đào tạo nội bộ của chị Thảo, trưởng nhóm chăm sóc khách hàng. Chị chuẩn bị rất kỹ: 25 slide, đủ quy trình, đủ số liệu, đủ tình huống.\n\nChị mở đầu: *\"Hôm nay chị sẽ nói về việc nâng cao trải nghiệm khách hàng và tối ưu phối hợp liên phòng ban.\"* Rồi chị đi lần lượt từng slide, ý nào cũng nặng như nhau.\n\nBốn mươi phút sau, chị kết: *\"Ừm… chắc vậy thôi, mọi người có hỏi gì không?\"* Cả phòng im lặng.\n\nRa về, Đốm hỏi hai bạn mới: \"Hôm nay học được gì?\" Hai bạn nhìn nhau. Chị Thảo không thiếu kiến thức. Chị chỉ mắc vài lỗi rất hay gặp khi nói."},{"type":"idea","title":"Ý chính","body":"Nói rõ không phải năng khiếu, cũng không cần giỏi hơn người. Nó là kỹ năng, và phần lớn là **bớt đi** chứ không phải thêm vào.\n\nNgười nghe tin người nói rõ, hơn là người nói nhiều. Khi bạn nói tất cả, họ không biết đâu là điều quan trọng. Nói hết mọi thứ thường có nghĩa là mình chưa chọn."},{"type":"how","title":"Cách làm: nhận ra 5 lỗi và sửa","body":"| Lỗi | Dấu hiệu | Cách sửa |\n| --- | --- | --- |\n| 1. Nói tràn lan | Ý nào cũng đưa ra, mong người nghe tự nhặt | **Rọi đèn** vào một điều: \"Nếu chỉ nhớ một điều hôm nay, hãy nhớ…\" |\n| 2. Đổ hết ra bàn | \"Thứ nhất… à còn cái này nữa…\", không có thứ tự | **Báo khung trước**: \"Có hai nguyên nhân\", \"Gồm ba bước\" |\n| 3. Nói khái niệm | \"Tối ưu phối hợp\", \"nâng cao trải nghiệm\" | **Cho thấy bằng hình ảnh**: so với một điều ai cũng biết |\n| 4. Cố tỏ ra giỏi | Câu dài, nhiều từ chuyên môn, nói nhanh vì run | **Đổi câu hỏi trong đầu**: từ \"mình trông thế nào\" sang \"làm sao để họ hiểu\" |\n| 5. Kết nhạt | \"Ừm, chắc vậy thôi ạ\" | **Chốt một câu rồi dừng**. Để khoảng lặng làm phần còn lại |\n\nKhông cần sửa cả 5 cùng lúc. Mỗi lần nói, chọn sửa 1 lỗi bạn hay mắc nhất."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Khó hiểu","strongLabel":"Rõ ràng","rows":[{"branch":null,"weak":"\"Mục tiêu quý này là nâng cao hiệu quả phối hợp giữa các phòng ban.\"","strong":"\"Quý này mình chỉ cần một điều: khách hỏi tồn kho, sale và kho trả lời cùng một con số. Giờ khách hỏi một câu, mỗi bên nói một kiểu.\""},{"branch":null,"weak":"\"…Đó là toàn bộ phần của em. Ừm, chắc vậy thôi ạ, em cảm ơn.\"","strong":"\"Tóm lại, em đề xuất kho gửi số tồn lên nhóm Zalo trước 9 giờ mỗi sáng.\" *(dừng, nhìn mọi người)*"}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Nói hết mọi thứ nghĩa là chưa chọn điều gì quan trọng nhất."}],"quiz":{"kind":"choice","question":"Bạn vừa trình bày xong một đề xuất. Câu kết nào mạnh hơn?","options":[{"text":"\"Dạ, em nghĩ đại khái là vậy, không biết mọi người thấy sao ạ…\"","correct":false,"feedback":"Đây là kiểu \"kết nhạt\". Người nghe nhớ nhất câu cuối, mà câu cuối lại không có ý gì. Thử câu còn lại nhé."},{"text":"\"Tóm lại: chuyển giờ giao hàng sang buổi sáng sẽ giảm đơn trễ.\" *(dừng)*","correct":true,"feedback":"Đúng rồi! Một câu chốt rõ ý, rồi dừng. Khoảng lặng giúp câu chốt ở lại trong đầu người nghe."}]},"practice":{"intro":"Soát một bài nói sắp tới theo 5 lỗi, rồi nói lại cho rõ.","steps":["Chọn 1 việc bạn sắp phải trình bày hoặc giải thích ở chỗ làm. Chưa có? Chọn 1 đề có sẵn.","Điền 4 ô bên dưới. Mỗi ô một câu, càng ngắn càng tốt.","Bấm đồng hồ 60 giây, nói thành tiếng theo thứ tự: rọi đèn → báo khung → so sánh → câu chốt rồi dừng.","Nghe lại, đếm xem mình còn mắc lỗi nào trong 5 lỗi."],"topics":["Giải thích cho nhân viên mới vì sao phải chốt đơn trước 4 giờ chiều","Trình bày lý do cần đổi giờ họp nhóm hằng tuần","Giới thiệu quy trình xin nghỉ phép mới cho cả phòng"],"pickStory":false,"fields":[{"label":"Điều duy nhất mình muốn người nghe nhớ","placeholder":"Ví dụ: Đơn chốt sau 4 giờ chiều sẽ giao trễ một ngày"},{"label":"Câu báo khung","placeholder":"Ví dụ: Có hai lý do."},{"label":"Một so sánh với điều ai cũng biết","placeholder":"Ví dụ: Giống như ra bến khi chuyến xe cuối đã chạy"},{"label":"Câu chốt (nói xong thì dừng)","placeholder":"Ví dụ: Vậy nên mình chốt đơn trước 4 giờ nhé."}],"saveAs":null,"widget":null,"timer":60,"record":true},"review":["Mình nói rõ một điều quan trọng nhất, không rải đều mọi ý.","Mình báo trước khung: có mấy ý, mấy bước.","Mình kết bằng một câu chốt rồi dừng, không thêm \"vậy thôi ạ\"."],"done":"Bạn vừa soát được 5 lỗi mà nhiều người nói cả đời không để ý. Mai Đốm chỉ bạn cách sắp thứ tự khi báo cáo sếp nhé.","videos":["PH-005"]},{"id":"d16A","day":16,"stage":3,"branch":"A","milestone":false,"title":"So sánh để người nghe hiểu ngay","hook":"Giải thích mãi mà người ta vẫn ngơ ngác? Thử nói \"Nó giống như…\".","cards":[{"type":"story","title":"Đốm kể","body":"Ở đám cưới bạn thân, bác của cô dâu hỏi Khánh: \"Cháu làm nghề gì?\"\n\nKhánh đáp: *\"Dạ cháu làm phân tích dữ liệu, xây dựng báo cáo để tối ưu vận hành ạ.\"* Bác gật gù, rồi quay sang hỏi chuyện món ăn.\n\nLần khác, cũng câu hỏi đó, Khánh nói: *\"Dạ cháu giống người xem bản đồ giao thông cho công ty. Mọi người lái xe, còn cháu báo chỗ nào đang tắc, đường nào đi nhanh hơn.\"* Bác bật cười: \"À, thế thì quan trọng đấy!\" Rồi hỏi tiếp.\n\nCùng một công việc. Lần sau, Khánh cho bác **thấy** thay vì bắt bác **hiểu**."},{"type":"idea","title":"Ý chính","body":"Từ ngữ trừu tượng bắt người nghe phải dịch trong đầu. Dịch không kịp, họ gật đầu cho qua.\n\nHình ảnh thì khác. Khi bạn nối điều mới với một thứ người nghe đã biết, họ hiểu ngay, không cần cố.\n\nCó ba cách nói bằng hình ảnh: **so sánh** (\"giống như…\"), **thế giới tưởng tượng** (\"Hãy tưởng tượng bạn…\") và **câu chuyện** (bạn đã tập ở chặng 2). Hôm nay mình tập hai cách đầu."},{"type":"how","title":"Cách làm: từ khái niệm sang hình ảnh","body":"1. **Chọn một điều bạn hay phải giải thích**: nghề của bạn, một quy định mới, vì sao bạn chọn làm việc gì đó.\n2. **Tự hỏi: \"Nó giống cái gì quen thuộc?\"** Tìm trong bếp, trên đường, ở chợ, trong bóng đá, trên điện thoại.\n3. **Nói theo mẫu: \"X giống như Y, vì…\"** Vế \"vì…\" chỉ ra chỗ giống, để người nghe không phải đoán.\n4. **Hoặc mở bằng \"Hãy tưởng tượng bạn…\"**, rồi tả một khoảnh khắc ngắn. Chữ \"bạn\" kéo người nghe vào cảnh.\n\nPhép thử nhanh: nếu phải nói cho một đứa trẻ 10 tuổi hiểu, bạn sẽ nói thế nào?\n\nLưu ý: chọn hình ảnh hợp người nghe. Với bác lớn tuổi, nói chuyện chợ, xe máy, nấu cơm. Với bạn trẻ, nói chuyện ứng dụng, trò chơi."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nói bằng khái niệm","strongLabel":"Nói bằng hình ảnh","rows":[{"branch":null,"weak":"Đồng nghiệp mới hỏi vì sao phải cập nhật file chung mỗi ngày: \"Để dữ liệu đồng bộ và các bộ phận phối hợp hiệu quả.\"","strong":"\"File chung giống bảng giờ tàu ở ga. Một người quên cập nhật là cả nhóm ra nhầm sân ga.\""},{"branch":null,"weak":"Bạn mới quen hỏi về việc chăm sóc khách hàng: \"Mình phụ trách duy trì quan hệ và nâng cao trải nghiệm sau bán hàng.\"","strong":"\"Hãy tưởng tượng bạn mua máy giặt mới, về nhà không biết bấm nút nào. Người bạn gọi đầu tiên chính là mình.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Khi người nghe nhíu mày, đừng giải thích thêm. Hãy nói \"Nó giống như…\""}],"quiz":{"kind":"choice","question":"Bạn giải thích cho mẹ vì sao không nên dùng một mật khẩu cho mọi tài khoản. Câu nào mẹ hiểu ngay?","options":[{"text":"\"Dùng chung mật khẩu làm tăng rủi ro bảo mật trên nhiều nền tảng.\"","correct":false,"feedback":"Câu này đúng, nhưng toàn khái niệm. Mẹ phải tự dịch \"rủi ro bảo mật\" là gì. Thử nhìn câu còn lại nhé."},{"text":"\"Giống như dùng một chìa khóa cho cả cửa nhà, xe máy và tủ tiền. Rơi một chìa là mất hết.\"","correct":true,"feedback":"Đúng rồi! Chìa khóa là thứ mẹ dùng hằng ngày. Nghe là thấy ngay cái nguy."}]},"practice":{"intro":"Tập nghĩ bằng hình ảnh, rồi giải thích công việc của bạn trong 30 giây.","steps":["Khởi động 2 phút: viết nhanh 3 câu \"X giống như Y\" về việc thường ngày. Câu dở cũng được, đừng tự chấm.","Chọn 1 câu hỏi bên dưới. Viết một câu so sánh, hoặc một câu bắt đầu bằng \"Hãy tưởng tượng bạn…\".","Bấm đồng hồ 30 giây, nói thành tiếng như đang trả lời người hỏi thật. Không dùng từ chuyên môn.","Nghe lại: một người ngoài nghề có hình dung ra không?"],"topics":["Họ hàng hỏi: \"Cháu làm nghề gì?\"","Bạn mới quen ở sự kiện hỏi: \"Công ty bạn làm về gì?\"","Đồng nghiệp mới hỏi: \"Phòng mình chủ yếu làm gì?\""],"pickStory":false,"fields":[{"label":"Câu so sánh 1","placeholder":"Ví dụ: Dọn hộp thư giống rửa bát, để lâu là ngập."},{"label":"Câu so sánh 2","placeholder":"Ví dụ: Họp không có mục tiêu giống đi chợ không có danh sách."},{"label":"Câu so sánh 3","placeholder":"Ví dụ: …giống như…"},{"label":"Công việc của mình giống như…, vì…","placeholder":"Ví dụ: giống người xem bản đồ giao thông, vì mình báo chỗ nào đang tắc."}],"saveAs":null,"widget":null,"timer":30,"record":true},"review":["Mình viết được ít nhất 3 câu \"X giống như Y\".","Hình ảnh mình chọn là thứ người nghe quen thuộc.","Mình giải thích công việc trong 30 giây mà không dùng từ chuyên môn."],"done":"Giờ bác ở quê cũng hiểu bạn làm gì rồi. Mai mình tập một việc khó hơn cả nói: lắng nghe.","videos":["PH-029"]},{"id":"d16B","day":16,"stage":3,"branch":"B","milestone":false,"title":"Kết luận trước, báo trước \"có ba điều\"","hook":"Người xem lướt đi chỉ bằng một cái chạm. Hãy để câu đầu nói điều quan trọng nhất.","cards":[{"type":"story","title":"Đốm kể","body":"Dũng bán máy lọc nước online. Video đầu tiên, Dũng mở: *\"Chào bạn, hôm nay mình quay ở kho. Máy này nhập về từ đầu năm, lõi lọc gồm mấy lớp…\"* Gần hết video, Dũng mới nói: *\"Nên máy rất hợp với nhà có con nhỏ.\"*\n\nXem thống kê, Dũng thấy phần lớn người xem đã lướt đi từ những giây đầu. Họ chưa kịp nghe điều Dũng muốn nói nhất.\n\nVideo sau, Dũng mở: *\"Nhà bạn có con nhỏ thì máy này đáng xem. Có ba lý do.\"* Người xem ở lại lâu hơn. Bình luận hỏi đúng vào ba điều đó."},{"type":"idea","title":"Ý chính","body":"Video và họp online giống nhau ở một điểm: người nghe rời đi chỉ bằng một cái chạm. Lướt sang video khác, mở tab khác.\n\nVì vậy, đừng giữ điều quan trọng nhất đến cuối. **Nói nó trước tiên.** Rồi báo trước có mấy ý: \"Có ba điều.\"\n\nGiống như mua tủ về tự lắp: phải xem hình chiếc tủ hoàn chỉnh trước, rồi mới mở từng tấm gỗ. Người xem biết mình đang đi đâu, và biết khi nào bạn nói xong."},{"type":"how","title":"Cách làm: khung 3 câu đầu video","body":"| Câu | Làm gì | Ví dụ |\n| --- | --- | --- |\n| 1. Kết luận | Điều duy nhất người xem cần nhớ, hoặc điều họ sẽ nhận được | \"Nhà có con nhỏ thì nên chọn máy có vòi nước ấm.\" |\n| 2. Báo trước | Nói có mấy ý, tối đa ba | \"Có ba lý do.\" |\n| 3. Vào ý | Đánh số rõ từng ý | \"Một là, pha sữa đêm không phải chờ đun nước.\" |\n\n**Kết video:** nhắc lại câu kết luận một lần, rồi dừng. Không kết bằng \"vậy thôi ạ\".\n\nChưa chắc có đủ ba ý? Hai cũng được. Quan trọng là bạn nói ra con số, và đi đủ đúng con số đó."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Dẫn dắt dài","strongLabel":"Kết luận trước","rows":[{"branch":null,"weak":"\"Hôm nay mình kể bạn nghe da mình hồi trước thế nào. Rồi mình thử nhiều loại, loại này thì… loại kia thì… cuối cùng thì…\"","strong":"\"Da dầu mà muốn kem chống nắng không bết thì chọn loại dạng sữa lỏng. Có hai lý do, mình nói nhanh.\""},{"branch":null,"weak":"*(Họp Meet)* \"Dạ tuần này team em làm nhiều việc. Thứ Hai thì… thứ Ba thì… rồi có vướng mấy chỗ…\"","strong":"*(Họp Meet)* \"Dự án đang đúng hạn. Có một việc cần anh chị quyết hôm nay. Em nói ba ý.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Câu đầu nói điều quan trọng nhất. Câu thứ hai nói có mấy điều."}],"quiz":{"kind":"order","question":"Sắp xếp lời mở video giới thiệu một quán bún chả theo đúng thứ tự:","items":["\"Bạn thích bún chả đúng vị Hà Nội cũ? Quán này đáng để bạn ghé.\"","\"Có ba điều khiến mình quay lại lần thứ năm.\"","\"Một là, chả nướng than hoa ngay trước cửa, thơm từ đầu ngõ.\""],"feedback":"Kết luận đi trước, rồi báo trước số ý, rồi mới vào ý đầu tiên. Người xem biết ngay họ được gì và còn nghe bao lâu nữa."},"practice":{"intro":"Quay 45 giây có kết luận ở câu đầu và báo trước số ý.","steps":["Chọn một điều bạn muốn nói, hoặc lấy một đề có sẵn bên dưới.","Điền 3 ô: câu kết luận, số ý, và các ý viết thật ngắn.","Bấm ghi, nói **45 giây**. Đánh số rõ từng ý: \"Một là… Hai là…\". Kết bằng nhắc lại câu đầu, rồi dừng.","Nghe lại 10 giây đầu: người xem đã biết điều quan trọng nhất chưa?"],"topics":["Giới thiệu một món đồ bạn bán hoặc rất hay dùng","Cập nhật tiến độ công việc trong cuộc họp online","Gợi ý một quán ăn hoặc một chỗ chơi cho người mới đến thành phố"],"pickStory":false,"fields":[{"label":"Câu kết luận (điều người xem cần nhớ)","placeholder":"Ví dụ: Nhà có con nhỏ thì nên chọn máy có vòi nước ấm."},{"label":"Có mấy ý?","placeholder":"Ví dụ: Có ba lý do."},{"label":"Các ý, mỗi ý vài chữ","placeholder":"Ví dụ: pha sữa đêm nhanh · không cần ấm đun · lõi lọc dễ thay"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Câu đầu tiên là kết luận hoặc điều người xem nhận được.","Mình nói ra số ý và đi đủ đúng số đó.","Mình kết bằng nhắc lại kết luận rồi dừng, không \"vậy thôi ạ\"."],"done":"Người xem của bạn giờ biết mình đang đi đâu. Mai mình tập nói chậm lại một chút để họ theo kịp nhé!","videos":["PH-005","PH-022"]},{"id":"d16C","day":16,"stage":3,"branch":"C","milestone":false,"title":"Báo cáo sếp: kết luận trước","hook":"Sếp hỏi \"Tóm lại là sao?\" Nghĩa là bạn đã nói ngược thứ tự.","cards":[{"type":"story","title":"Đốm kể","body":"Lan làm marketing. Sáng thứ Ba, Lan vào phòng chị Giám đốc để xin thêm ngân sách quảng cáo. Lan bắt đầu: \"Dạ, tháng trước team em chạy 3 kênh. Kênh Facebook thì chi phí mỗi đơn là… còn Zalo thì… rồi TikTok tuần đầu chưa ổn nhưng tuần thứ ba…\"\n\nĐến phút thứ hai, chị Giám đốc cắt ngang: \"Tóm lại em muốn gì?\"\n\nLan không sai về số liệu. Lan sai về **thứ tự**."},{"type":"idea","title":"Ý chính","body":"Khi kể chuyện, ta để điều quan trọng nhất ở cuối. Khi báo cáo, làm ngược lại: **kết luận đi trước, lý do theo sau, chi tiết chờ được hỏi**.\n\nSếp nghe báo cáo để ra quyết định. Nếu phải nghe hết chi tiết mới biết bạn đề xuất gì, sếp vừa mệt vừa dễ hiểu sai."},{"type":"how","title":"Cách làm: Kim tự tháp 3 tầng","body":"1. **Đỉnh – 1 câu kết luận hoặc đề xuất.** Mẫu câu: \"Điều duy nhất em muốn chị nắm là…\"\n2. **Giữa – 2 hoặc 3 lý do.** Báo trước con số: \"Có hai lý do.\" Người nghe biết khi nào bạn nói xong.\n3. **Đáy – số liệu, chi tiết.** Chuẩn bị sẵn, nhưng chỉ đưa ra khi sếp hỏi hoặc khi cần chứng minh một lý do.\n\nThêm một mẹo: sau câu kết luận, **dừng 2 giây**. Khoảng lặng này cho sếp thời gian tiếp nhận, và cho thấy bạn tự tin với đề xuất của mình."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Theo thứ tự thời gian","strongLabel":"Kim tự tháp","rows":[{"branch":null,"weak":"\"Tháng trước team em chạy 3 kênh. Facebook thì… Zalo thì… TikTok tuần đầu chưa ổn nhưng tuần ba… Nên em nghĩ là có lẽ mình nên… có thể cân nhắc tăng thêm cho TikTok…\"","strong":"\"Em đề xuất chuyển 30 triệu từ Facebook sang TikTok trong tháng tới. *(dừng)* Có hai lý do. Một, chi phí mỗi đơn trên TikTok đã thấp hơn Facebook ba tuần liền. Hai, khách từ TikTok mua lại nhiều hơn. Số liệu chi tiết em để ở trang sau, chị cần em đi vào phần nào ạ?\""},{"branch":null,"weak":"\"Dạ, tuần trước bên đối tác gửi thiếu dữ liệu, em phải nhắn mấy lần qua Zalo. Rồi anh Hùng đi công tác đột xuất, phần kiểm thử dồn lại… Team em đã làm thêm cuối tuần, nhưng chắc là có thể sẽ chậm một chút ạ…\"","strong":"\"Dự án sẽ bàn giao muộn 1 tuần, sang thứ Sáu tuần sau. *(dừng)* Có hai lý do. Một, đối tác gửi thiếu dữ liệu, team mất 3 ngày chờ bổ sung. Hai, phần kiểm thử cần làm đủ để khách dùng không bị lỗi. Em đã có kế hoạch bù tiến độ, anh muốn em trình bày luôn không ạ?\""}],"note":"Số liệu trong ví dụ là giả định để minh họa cách nói."},{"type":"takeaway","title":"Mang theo 1 câu","body":"Kể chuyện thì giữ bất ngờ đến cuối. Báo cáo thì nói điều quan trọng nhất trước tiên."}],"quiz":{"kind":"order","question":"Sắp xếp lại 3 câu sau theo kim tự tháp, từ đỉnh xuống đáy.","items":["\"Em đề xuất lùi ngày giao hàng đợt này thêm 3 ngày.\"","\"Nếu giao đúng hạn, khả năng cao sẽ sai sót số lượng.\"","\"Tuần trước có 2 nhân viên kho xin nghỉ đột xuất.\""],"feedback":"Đề xuất đứng đầu, rủi ro sai sót là lý do, 2 nhân viên nghỉ là chi tiết. Chuyện nhân viên nghỉ là nguyên nhân, nhưng sếp chỉ cần biết khi muốn hỏi sâu."},"practice":{"intro":"Dựng một báo cáo 45 giây theo kim tự tháp: kết luận, lý do, chi tiết.","steps":["Chọn 1 việc bạn cần báo cáo hoặc đề xuất trong tuần này. Chưa có? Chọn 1 đề có sẵn.","Điền 3 ô: Đỉnh, Giữa, Đáy.","Bấm đồng hồ 45 giây, nói thành tiếng như đang đứng trước sếp. Nhớ dừng 2 giây sau câu đầu."],"topics":["Xin thêm người cho dự án","Báo dự án trễ hạn","Đề xuất đổi nhà cung cấp"],"pickStory":false,"fields":[{"label":"Đỉnh","placeholder":"\"Điều duy nhất em muốn anh/chị nắm là…\""},{"label":"Giữa","placeholder":"\"Có … lý do. Một… Hai…\""},{"label":"Đáy","placeholder":"1 con số hoặc chi tiết bạn sẵn sàng nếu bị hỏi"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Câu đầu tiên là kết luận/đề xuất, không phải bối cảnh.","Mình báo trước số lý do.","Mình xong trong 45 giây và có dừng sau câu đầu."],"done":"Thử dùng đúng khung này trong tin nhắn gửi sếp ngày mai nhé. Viết cũng hiệu quả như nói đó!","videos":["PH-022"]},{"id":"d17A","day":17,"stage":3,"branch":"A","milestone":false,"title":"Lắng nghe và hỏi lại","hook":"Người ta nhớ ai đã thật sự nghe họ, hơn là ai nói hay.","cards":[{"type":"story","title":"Đốm kể","body":"Ở một buổi giao lưu doanh nghiệp, Trang gặp anh Quân, chủ một xưởng đồ gỗ. Anh kể: \"Tháng trước bên anh vừa xuất lô hàng đầu tiên đi Nhật.\"\n\nTrong lúc anh nói, Trang đang nghĩ câu giới thiệu công ty mình. Anh vừa dừng, Trang nói luôn: *\"Dạ hay quá ạ. Bên em thì làm phần mềm kế toán…\"* Anh Quân gật đầu, mắt nhìn ra phía cửa.\n\nMười phút sau, Trang thấy anh đang nói chuyện rất vui với một người khác. Người đó chỉ hỏi một câu: *\"Lô hàng đầu tiên đi Nhật, khó nhất là khâu nào hả anh?\"*"},{"type":"idea","title":"Ý chính","body":"Trong trò chuyện, nhiều khi ta không nghe. Ta **chờ đến lượt mình nói**. Đầu bận soạn câu tiếp theo, và người đối diện cảm nhận được điều đó.\n\nLắng nghe thật là có mặt trọn vẹn với người kia. Bạn nhặt một chi tiết họ vừa nói, rồi hỏi sâu vào đúng chi tiết đó.\n\nNgười được hỏi đúng chỗ sẽ mở ra kể chuyện của họ. Đó cũng là nửa còn lại của bài ngày 3: kể một chuyện nhỏ, rồi **mời người kia kể**."},{"type":"how","title":"Cách làm: Nghe – Nhặt – Nhắc – Hỏi","body":"| Bước | Làm gì | Ví dụ |\n| --- | --- | --- |\n| 1. Nghe | Để ý lúc mình đang soạn câu tiếp theo. Kéo sự chú ý về người kia, nhìn họ, thở chậm | Tạm quên câu giới thiệu của mình |\n| 2. Nhặt | Tìm một chi tiết \"có nhiệt\": lần đầu, suýt nữa, bất ngờ, một con số | \"lô hàng **đầu tiên**\" |\n| 3. Nhắc | Nhắc lại chi tiết đó thật ngắn, cho thấy bạn đã nghe | \"Lô đầu tiên đi Nhật ạ?\" |\n| 4. Hỏi | Hỏi mở về một khoảnh khắc, không hỏi có/không | \"Lúc nhận tin hàng đạt, anh đang ở đâu?\" |\n\nLưu ý: chỉ kể chuyện của mình khi người kia đã kể xong. Câu \"Em cũng thế, em…\" đến quá sớm là giành mất lượt của họ."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Chờ đến lượt mình","strongLabel":"Nghe và hỏi lại","rows":[{"branch":null,"weak":"Đồng nghiệp: \"Cuối tuần mình đưa bố mẹ đi Đà Lạt, lần đầu cả nhà đi xa.\" — \"Ồ hay thế. Mình thì cuối tuần ở nhà dọn tủ quần áo.\"","strong":"\"Lần đầu cả nhà đi xa à? Bố mẹ bạn thích chỗ nào nhất?\""},{"branch":null,"weak":"Khách ở quầy: \"Chị đổi ba chỗ rồi mà vẫn chưa ưng.\" — \"Dạ bên em đang có ưu đãi tháng này, chị xem thử nhé.\"","strong":"\"Ba chỗ rồi ạ? Điều gì làm chị chưa ưng nhất, chị kể em nghe với?\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Nghe để hiểu, không phải nghe để chờ đến lượt mình."}],"quiz":{"kind":"choice","question":"Người mới quen nói: \"Mình vừa chuyển từ ngân hàng sang mở tiệm bánh được ba tháng.\" Câu hỏi lại nào mở chuyện tốt nhất?","options":[{"text":"\"Thế à, làm bánh có vui không?\"","correct":false,"feedback":"Không sai, nhưng dễ nhận lại câu \"Cũng vui\". Thử hỏi về một khoảnh khắc cụ thể nhé."},{"text":"\"Từ ngân hàng sang làm bánh! Hôm bạn quyết định nghỉ, chuyện gì đã xảy ra?\"","correct":true,"feedback":"Tuyệt! Bạn nhặt đúng chi tiết có nhiệt và hỏi về một khoảnh khắc. Người kia sẽ có cả một câu chuyện để kể."},{"text":"\"Mình cũng mê làm bánh lắm, tuần trước mình mới làm bông lan.\"","correct":false,"feedback":"Câu này chuyển ngay sang chuyện của bạn. Người kia vừa mở lời, hãy để họ kể trước đã."}]},"practice":{"intro":"Tập nhặt một chi tiết và hỏi lại đúng chỗ.","steps":["Chọn 1 câu người khác nói ở bên dưới, hoặc một câu bạn nghe được hôm nay.","Điền 3 ô: chi tiết có nhiệt, câu nhắc lại, câu hỏi mở.","Bấm đồng hồ 30 giây, nói thành tiếng như đang đứng trước người đó. Nhắc, hỏi, rồi im lặng chờ.","Thử thật (không bắt buộc): hôm nay, trong một cuộc trò chuyện, hỏi sâu thêm một câu trước khi kể chuyện của mình."],"topics":["Đồng nghiệp: \"Hôm qua mình suýt lỡ chuyến bay đi công tác.\"","Khách quen: \"Tháng này chị vừa mở thêm cửa hàng thứ hai.\"","Người mới quen ở sự kiện: \"Mình từ Đà Nẵng ra Hà Nội làm được nửa năm.\""],"pickStory":false,"fields":[{"label":"Chi tiết có nhiệt mình nhặt được","placeholder":"Ví dụ: suýt lỡ chuyến bay"},{"label":"Câu nhắc lại ngắn","placeholder":"Ví dụ: Suýt lỡ chuyến bay luôn á?"},{"label":"Câu hỏi mở theo chi tiết đó","placeholder":"Ví dụ: Lúc chạy ra cửa lên máy bay, bạn nghĩ gì?"}],"saveAs":null,"widget":null,"timer":30,"record":true},"review":["Mình nhặt được 1 chi tiết cụ thể trong lời người kia.","Câu hỏi của mình không trả lời được bằng có hoặc không.","Mình không chen chuyện của mình vào trước khi họ kể xong."],"done":"Người biết hỏi thì không bao giờ thiếu chuyện để nghe. Mai mình thử nói khi không kịp chuẩn bị gì cả nhé!","videos":["PH-014","PH-015"]},{"id":"d17B","day":17,"stage":3,"branch":"B","milestone":false,"title":"Khoảng lặng, nhịp và giọng","hook":"Nói liền một mạch không làm bạn trông giỏi hơn. Một khoảng lặng đúng chỗ mới làm được.","cards":[{"type":"story","title":"Đốm kể","body":"Linh làm video hướng dẫn Excel cho dân văn phòng. Sợ người xem chán, Linh nói thật nhanh, không nghỉ. Chỗ nào trống là có \"ờ\", \"thì là\" chen vào.\n\nXem lại, chính Linh cũng thấy mệt.\n\nLinh thử quay lại, hết mỗi câu thì thở một hơi. Lúc quay, Linh thấy chậm kinh khủng. Xem lại thì nghe bình thường, như một người hiểu rõ việc mình đang nói. Chữ \"ờ\" cũng ít hẳn, vì Linh đã có thời gian nghĩ câu tiếp theo."},{"type":"idea","title":"Ý chính","body":"Khoảng lặng không chỉ để người xem kịp nghe. Trước hết, nó **dành cho bạn**: để thở, để nghĩ câu tiếp theo. Thiếu nó, bạn vừa nghĩ vừa nói, và \"ờ\", \"kiểu là\" tự chen vào.\n\nGiọng nói cũng vậy. Bạn có thể nói nhanh hay chậm, to hay nhỏ, cao hay thấp. Nhưng nhiều người chỉ dùng một nốt từ đầu đến cuối video.\n\nBạn không cần đổi thành người khác. Chỉ cần có thêm vài nốt, và dùng đúng chỗ."},{"type":"how","title":"Cách làm: 3 bài tập, 3 chỗ dùng","body":"**Tập trước khi quay (2 phút):**\n\n1. **Luật hơi thở:** nói một đoạn bất kỳ. Hết mỗi câu thì dừng, hít vào, thở ra, rồi mới nói tiếp. Cố tình làm quá. Khi lặng dài đã quen, lặng ngắn sẽ dễ.\n2. **Rung môi và trượt giọng:** rung môi \"brrr\" khoảng 20 giây. Rồi kéo giọng từ thấp lên cao, rồi xuống lại.\n3. **Câu nói lái:** \"Nồi đồng nấu ốc, nồi đất nấu ếch.\" Đọc chậm trước, nhanh dần, chữ nào cũng phải rõ.\n\n**Dùng khi quay:**\n\n- Dừng 2 giây **trước** ý quan trọng nhất, và **sau** câu kết luận.\n- Chậm lại, hạ giọng một chút khi nói điều bạn muốn người xem nhớ.\n- Nhanh hơn, to hơn một chút khi kể đoạn sôi nổi.\n\nLúc quay thấy chậm, xem lại thường là vừa. Hãy tin bản ghi hơn cảm giác."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nói một hơi","strongLabel":"Có lặng, có nhịp","rows":[{"branch":null,"weak":"\"Sản phẩm này rất tốt ạ ờ dùng được cho cả nhà ạ thì là giá cũng rất là hợp lý ạ cả nhà nhanh tay chốt đơn nhé ạ.\"","strong":"\"Cái nồi này, nhà bốn người dùng vừa đủ. *(dừng)* Và điều mình thích nhất… *(chậm lại)* là rửa xong chỉ mất một phút.\""},{"branch":null,"weak":"*(Họp Zoom)* \"Doanh số tháng này giảm ờ chủ yếu do kênh online ờ thì bên em đang tìm hiểu nguyên nhân ạ.\"","strong":"*(Họp Zoom)* \"Doanh số tháng này giảm. *(dừng)* Nguyên nhân chính nằm ở kênh online. *(dừng)* Em đề xuất ba việc.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Khoảng lặng là để bạn thở. Người xem nghe thấy bạn vững vàng."}],"quiz":{"kind":"choice","question":"Trong một video 1 phút, bạn nên dừng 2 giây ở đâu?","options":[{"text":"Sau mỗi từ, để người xem kịp nghe.","correct":false,"feedback":"Dừng sau mỗi từ làm câu bị vụn, người xem khó theo. Hãy dừng ở chỗ có ý quan trọng."},{"text":"Trước ý quan trọng nhất và sau câu kết luận.","correct":true,"feedback":"Đúng rồi! Khoảng lặng ở đó báo cho người xem: \"Chỗ này đáng nhớ đây.\""},{"text":"Không dừng chỗ nào, video ngắn thì phải nói liền.","correct":false,"feedback":"Nói liền thì bạn không có lúc để thở và nghĩ, nên dễ chen \"ờ\". Video ngắn càng cần nhịp rõ."}]},"practice":{"intro":"Tập luật hơi thở, rồi quay một đoạn ngắn có lặng và có nhịp.","steps":["Khởi động 1 phút: rung môi, trượt giọng, đọc câu nói lái nhanh dần.","Viết 4–5 câu giới thiệu vào ô dưới (có thể dùng lại đoạn hôm qua). Đánh dấu \"/\" ở chỗ dừng, đánh dấu chữ cần nói chậm.","Bấm ghi, nói **60 giây** theo luật hơi thở: hết câu là thở. Dừng 2 giây trước ý quan trọng nhất.","Nghe lại: đếm số chữ \"ờ\", và nghe xem chỗ dừng có thật sự chậm như lúc nói không."],"pickStory":false,"fields":[{"label":"Đoạn bạn sẽ nói (đánh dấu / ở chỗ dừng)","placeholder":"Ví dụ: Cái nồi này, / nhà bốn người dùng vừa đủ. / Và điều mình thích nhất… / là rửa xong chỉ mất một phút."}],"saveAs":null,"widget":null,"timer":60,"record":true},"review":["Mình dừng thở sau mỗi câu, kể cả khi thấy hơi chậm.","Mình có dừng 2 giây trước ý quan trọng nhất.","Số chữ \"ờ\", \"thì là\" ít hơn lần quay hôm qua."],"done":"Giọng bạn vừa có thêm vài nốt nhạc. Mai Đốm đưa đề bất ngờ, bạn nói ngay trước điện thoại nhé!","videos":["PH-033","PH-022"]},{"id":"d17C","day":17,"stage":3,"branch":"C","milestone":false,"title":"Việc gì – Vì sao quan trọng – Làm gì tiếp","hook":"Báo một tình huống vừa xảy ra, đừng dừng ở \"chuyện là thế này\". Người nghe cần biết nó ảnh hưởng gì và giờ làm gì.","cards":[{"type":"story","title":"Đốm kể","body":"Sáng thứ Hai, họp giao ban. Anh Phúc phụ trách kho được hỏi về lô hàng tuần trước.\n\nAnh kể: *\"Dạ, thứ Tư xe bên vận chuyển đến muộn, rồi thứ Năm lại mưa, anh em phải che bạt, tối thứ Năm mới bốc xong, sáng thứ Sáu thì…\"*\n\nAnh kể đúng, kể đủ. Nhưng chị Giám đốc vẫn phải hỏi thêm hai câu: *\"Thế khách có bị ảnh hưởng không? Giờ em tính làm sao?\"*\n\nAnh Phúc mới trả lời một phần ba câu hỏi. Hai phần còn lại, người nghe phải tự đi hỏi."},{"type":"idea","title":"Ý chính","body":"Khi sếp hỏi *\"Chuyện đó sao rồi?\"*, sếp muốn biết ba thứ dù chỉ hỏi một câu. Chuyện gì đã xảy ra. Nó có nghĩa gì với mình. Và giờ làm gì.\n\nNgười báo cáo hay dừng ở ý đầu, vì đó là phần mình biết rõ nhất. Nhưng người nghe cần nhất hai ý sau để ra quyết định.\n\nHôm qua bạn có kim tự tháp, dùng khi đề xuất. Hôm nay là khung dùng khi giải thích một tình huống đã xảy ra."},{"type":"how","title":"Cách làm: 3 câu hỏi, mỗi câu 1–2 câu trả lời","body":"1. **Việc gì?** *(What)* Chuyện đã xảy ra, gọn trong 1–2 câu. Chỉ giữ chi tiết người nghe cần. Mẫu câu: \"Lô hàng tuần trước giao trễ 2 ngày.\"\n2. **Vì sao quan trọng?** *(So what)* Ảnh hưởng tới khách, tiền, tiến độ hay đội ngũ. Mẫu câu: \"Điều này có nghĩa là…\", \"Ảnh hưởng lớn nhất là…\"\n3. **Làm gì tiếp?** *(Now what)* Việc cụ thể: ai làm, khi nào xong. Mẫu câu: \"Em đề xuất…\", \"Từ tuần này, bên em sẽ…\"\n\nMẹo: viết 3 chữ **việc – nghĩa – làm** lên tờ giấy nhớ, dán cạnh màn hình. Lúc bị hỏi bất ngờ, chỉ cần nhìn là nhớ."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Chỉ kể việc","strongLabel":"Việc – Vì sao – Làm gì","rows":[{"branch":null,"weak":"\"Dạ, thứ Tư xe đến muộn, thứ Năm mưa, anh em phải che bạt, tối thứ Năm mới bốc xong…\"","strong":"\"Lô hàng tuần trước giao trễ 2 ngày vì xe vận chuyển đến muộn. Ba khách đại lý đã gọi phàn nàn, một khách hỏi hủy đơn. Em đề xuất ký thêm một bên vận chuyển dự phòng, em gửi báo giá trước thứ Tư.\""},{"branch":null,"weak":"\"Phần mềm chấm công mới bị lỗi đăng nhập mấy hôm nay, bên IT đang kiểm tra ạ.\"","strong":"\"Phần mềm chấm công bị lỗi đăng nhập từ thứ Hai. Nếu chưa sửa xong trước ngày 25, bảng lương tháng này sẽ chậm. Em đã nhờ IT ưu tiên, và làm sẵn bảng chấm công tay để dự phòng.\""}],"note":"*Số liệu trong ví dụ là giả định để minh họa.*"},{"type":"takeaway","title":"Mang theo 1 câu","body":"Đừng chỉ báo chuyện gì xảy ra. Nói luôn vì sao nó quan trọng và mình làm gì tiếp."}],"quiz":{"kind":"order","question":"Sắp xếp 3 câu sau theo thứ tự Việc gì – Vì sao quan trọng – Làm gì tiếp.","items":["\"Tuần này có 5 đơn bị giao nhầm địa chỉ.\"","\"Mỗi đơn nhầm, mình mất phí ship hai chiều và một khách không vui.\"","\"Em đề xuất thêm bước gọi xác nhận địa chỉ trước khi giao.\""],"feedback":"Việc trước, rồi ý nghĩa, cuối cùng là hành động. Nếu dừng ở câu đầu, người nghe sẽ hỏi lại: \"Thì sao?\""},"practice":{"intro":"Báo cáo một tình huống vừa xảy ra, đủ 3 ý, trong 45 giây.","steps":["Chọn 1 tình huống gần đây ở chỗ làm cần báo lại cho sếp hoặc nhóm. Chưa có? Chọn 1 đề có sẵn.","Điền 3 ô bên dưới, mỗi ô 1–2 câu.","Bấm đồng hồ 45 giây, nói thành tiếng như đang ở buổi họp giao ban.","Nghe lại: nếu là sếp, bạn có còn phải hỏi \"thì sao?\" hay \"giờ làm gì?\" không?"],"topics":["Khách lớn báo sẽ thanh toán chậm 2 tuần","Một nhân viên chủ chốt xin nghỉ giữa dự án","Buổi đào tạo nội bộ tuần trước chỉ có nửa số người đến"],"pickStory":false,"fields":[{"label":"Việc gì đã xảy ra?","placeholder":"Ví dụ: Khách A báo thanh toán chậm 2 tuần"},{"label":"Vì sao quan trọng? Ảnh hưởng gì?","placeholder":"Ví dụ: Tháng này mình sẽ thiếu tiền trả nhà cung cấp đúng hạn"},{"label":"Làm gì tiếp? Ai làm, khi nào?","placeholder":"Ví dụ: Em xin lùi lịch trả nhà cung cấp, gọi trước thứ Năm"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Phần \"việc gì\" của mình gọn trong 1–2 câu.","Mình nói rõ ảnh hưởng tới khách, tiền, tiến độ hoặc đội ngũ.","Mình kết bằng một việc cụ thể: ai làm, khi nào."],"done":"Giờ bạn có hai khung: kim tự tháp để đề xuất, và khung này để báo một tình huống. Mai mình tập làm cho con số dễ nhớ nhé.","videos":["PH-016"]},{"id":"d18A","day":18,"stage":3,"branch":"A","milestone":false,"title":"Ứng khẩu với đề văn phòng Việt","hook":"Đầu trống rỗng khi bị hỏi bất ngờ không phải vì bạn kém. Chỉ là bạn chưa tập.","cards":[{"type":"story","title":"Đốm kể","body":"Tiệc tất niên công ty. MC bất ngờ gọi: \"Mời bạn Hưng phòng kinh doanh lên nói vài lời về năm qua!\"\n\nHưng cầm micro. Đầu trắng xóa. *\"Dạ… em… năm qua… em cảm ơn mọi người ạ.\"* Ba giây im lặng, dài như ba phút.\n\nTối về, nằm trên giường, Hưng nghĩ ra năm câu rất hay. Ai cũng có những \"câu hay lúc về nhà\" như thế.\n\nHưng không thiếu ý. Chỉ là não đóng băng khi bị đặt vào thế bất ngờ."},{"type":"idea","title":"Ý chính","body":"Nói nhanh khi bị hỏi bất ngờ không liên quan đến thông minh. Nó là khả năng **giữ bình tĩnh khi chưa sẵn sàng**.\n\nNhiều người nghĩ tự tin đến từ chuẩn bị thật kỹ. Thật ra nó đến từ niềm tin: \"Có gì xảy ra, mình cũng xoay xở được.\"\n\nNiềm tin đó chỉ có khi bạn đã nhiều lần nói mà không chuẩn bị, ở nơi an toàn. Hôm nay là lần đầu, một mình, với điện thoại."},{"type":"how","title":"Cách làm: 3 động tác khi bị hỏi bất ngờ","body":"1. **Thở một hơi.** Bị bất ngờ, ta hay nín thở và não càng đơ. Một hơi thở cho bạn hai giây để bật lại. Có thể nói: \"Để em nghĩ một chút.\"\n2. **Bám một khung có sẵn.** Hỏi ý kiến → Ý kiến – Lý do – Ví dụ – Nhắc lại. Hỏi tình hình → Trước đây – Bây giờ – Sắp tới. Hỏi cảm nghĩ → một chuyện trong kho.\n3. **Cứ nói tiếp, đừng dừng để sửa.** Lạc ý thì nói thật: \"Khoan, mình đang nói đến đâu nhỉ?\" Người nghe thường nhắc giúp, và chẳng ai chê bạn.\n\nKết bằng một câu gọn, rồi dừng.\n\nMuốn luyện thêm bằng tiếng Anh? Philipp Humm có trang miễn phí **speaking.games** với nhiều trò chơi ứng khẩu."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Đóng băng","strongLabel":"Thở – bám khung – nói tiếp","rows":[{"branch":null,"weak":"Sếp hỏi trong thang máy: \"Dự án thế nào rồi em?\" — \"Dạ… cũng… đang làm ạ. Cũng ổn ạ.\"","strong":"*(thở)* \"Dạ đầu tháng bọn em hơi chậm vì chờ khách duyệt mẫu. Giờ mẫu đã chốt, cả nhóm đang chạy nhanh. Thứ Sáu tuần sau em gửi anh bản đầu tiên ạ.\""},{"branch":null,"weak":"MC mời phát biểu ở tiệc cuối năm: \"Dạ em… không chuẩn bị gì… thôi em cảm ơn mọi người ạ.\"","strong":"*(thở)* \"Năm nay em nhớ nhất một tối tháng Bảy. Cả phòng ở lại đóng hàng đến 10 giờ, chị Mai đi mua bánh mì cho cả nhóm. Năm tới em mong mình vẫn là một nhóm như thế. Em cảm ơn mọi người!\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Người nói nhanh chỉ là người đã tập nói khi chưa sẵn sàng."}],"quiz":{"kind":"choice","question":"Đang nói giữa chừng, bạn quên mất ý tiếp theo. Nên làm gì?","options":[{"text":"Xin lỗi liên tục rồi dừng hẳn.","correct":false,"feedback":"Dừng hẳn làm khoảnh khắc ngượng kéo dài hơn. Người nghe không cần bạn hoàn hảo, họ chỉ cần bạn đi tiếp."},{"text":"Dừng, thở, nói thật: \"Khoan, mình đang nói đến đâu nhỉ?\" rồi nói tiếp.","correct":true,"feedback":"Chuẩn! Thở giúp não bật lại. Nói thật làm không khí nhẹ đi, và thường có người nhắc giúp bạn."},{"text":"Nói nhanh hơn để lấp chỗ trống.","correct":false,"feedback":"Nói nhanh khi đang rối dễ thành nói lan man. Một hơi thở có ích hơn mười chữ đệm."}]},"practice":{"intro":"Nói 60 giây với một đề bất ngờ, không chuẩn bị trước.","steps":["Bấm \"Bốc đề\". Công cụ đưa bạn 1 đề ngẫu nhiên, bối cảnh công sở. Đừng đổi đề, đề nào cũng nói được.","Cho mình đúng 10 giây: thở một hơi, chọn một khung hoặc một chuyện trong kho.","Bấm đồng hồ 60 giây, nói liền một mạch. Lạc ý thì nói \"Khoan, mình đang nói đến đâu nhỉ?\" rồi đi tiếp.","Còn thời gian? Bốc thêm 1–2 đề. Nghe lại bản bạn thấy ngại nhất."],"pickStory":false,"saveAs":null,"widget":"impromptu","timer":60,"record":true},"review":["Mình thở một hơi trước khi nói câu đầu.","Mình nói đủ 60 giây, không bỏ dở giữa chừng.","Mình bám được một khung hoặc một chuyện trong kho."],"done":"Bạn vừa làm điều nhiều người né cả đời: nói khi chưa chuẩn bị. Mai mình học cách giữ bình tĩnh khi bị chê.","videos":["PH-031","PH-036"]},{"id":"d18B","day":18,"stage":3,"branch":"B","milestone":false,"title":"Ứng khẩu 60 giây trước điện thoại","hook":"Tự tin trước camera không đến từ kịch bản thuộc lòng. Nó đến từ việc biết mình vẫn nói tiếp được.","cards":[{"type":"story","title":"Đốm kể","body":"Ngọc chuẩn bị livestream ra mắt dòng túi mới. Ngọc viết kịch bản hai trang, học thuộc từng câu.\n\nĐến phút thứ ba, một khách bình luận: *\"Mẫu này khác mẫu cũ thế nào em?\"* Ngọc trả lời xong, quay lại kịch bản thì không nhớ mình đang ở đâu. Ngọc đứng im, chỉ nói được *\"Dạ… dạ…\"*.\n\nSau buổi đó, Ngọc đổi cách tập. Mỗi sáng bốc một đề ngẫu nhiên, nói 60 giây trước điện thoại, quay một lần. Vài tuần sau, khách hỏi gì Ngọc cũng đáp được. Chưa mượt, nhưng không còn đứng hình."},{"type":"idea","title":"Ý chính","body":"Học thuộc là luyện trí nhớ, không phải luyện nói. Khi có gì lệch kịch bản, trí nhớ bỏ bạn lại một mình.\n\nThứ giúp bạn vững là niềm tin: **\"Có chuyện gì, mình cũng xoay xở được.\"** Niềm tin này không cần có trước rồi mới nói. Nó lớn lên sau mỗi lần bạn nói mà không chuẩn bị.\n\nĐứng hình khi bị hỏi bất ngờ không có nghĩa là bạn kém. Đó chỉ là phản ứng với áp lực. Và phản ứng thì tập được."},{"type":"how","title":"Cách làm: luật ứng khẩu 60 giây","body":"1. **Nghĩ tối đa 30 giây.** Chọn một lối vào: nêu ý kiến (\"Mình nghĩ… có hai lý do\"), kể một chuyện nhỏ trong kho, hoặc mở bằng một câu hỏi.\n2. **Quay một lần.** Không dừng để làm lại. Vấp thì cứ nói tiếp.\n3. **Bí thì thở.** Dừng lại, hít một hơi, nói \"để mình nghĩ thêm chút\" rồi đi tiếp. Người xem thấy bạn bình tĩnh, không thấy bạn bí.\n4. **Mục tiêu là nói tiếp, không phải nói hay.** Đề càng lạ, càng vui.\n\nMuốn luyện thêm bằng tiếng Anh? Trang **speaking.games** của Philipp Humm có nhiều trò luyện ứng khẩu miễn phí."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Đứng hình","strongLabel":"Thở rồi nói tiếp","rows":[{"branch":null,"weak":"*(Livestream, khách hỏi \"Sao bên em đắt hơn shop khác?\")* \"Dạ… cái này thì… ờ… em cũng không biết nói sao ạ…\"","strong":"*(Hít một hơi)* \"Chị hỏi đúng chỗ ạ. Bên em không rẻ nhất. Nhưng có hai điều chị nhận thêm: bảo hành một năm, và đổi size miễn phí.\""},{"branch":null,"weak":"*(Họp Meet, sếp hỏi bất ngờ \"Em thấy đề xuất này sao?\")* \"Dạ em… em chưa chuẩn bị phần này ạ.\"","strong":"\"Anh cho em nghĩ một giây ạ. *(dừng)* Em thấy hợp lý ở một điểm, và còn lo ở một điểm.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Không cần nói hay. Chỉ cần nói tiếp."}],"quiz":{"kind":"choice","question":"Đang quay 60 giây, bạn quên mất ý tiếp theo. Bạn làm gì?","options":[{"text":"Dừng quay, xóa đi, làm lại từ đầu.","correct":false,"feedback":"Hôm nay luật là quay một lần. Làm lại thì bạn chỉ tập được câu mở đầu, không tập được cách xoay xở."},{"text":"Hít một hơi, nói \"để mình nghĩ thêm chút\", rồi đi tiếp.","correct":true,"feedback":"Đúng rồi! Một hơi thở cho bạn lại quyền kiểm soát. Người xem chỉ thấy một khoảng lặng bình thường."},{"text":"Nói nhanh hơn cho qua chỗ bí.","correct":false,"feedback":"Nói nhanh lúc bí dễ thành lan man và thêm nhiều \"ờ\". Chậm lại một nhịp mới giúp bạn tìm ra ý."}]},"practice":{"intro":"Nhận một đề bất ngờ và nói 60 giây trước điện thoại, quay một lần.","steps":["Kê điện thoại ngang tầm mắt. Mở chế độ ghi của công cụ, hoặc camera trước của điện thoại.","Bấm \"Đề mới\" để nhận một đề ngẫu nhiên. Nghĩ tối đa 30 giây, chọn một lối vào.","Nói **60 giây**, nhìn vào ống kính. Chỉ quay một lần; vấp thì thở và nói tiếp.","Nghe lại một lần. Nhớ lại chỗ mình bí và cách mình đã thoát ra."],"pickStory":false,"saveAs":null,"widget":"impromptu","timer":60,"record":true},"review":["Mình bắt đầu nói sau không quá 30 giây suy nghĩ.","Mình quay đúng một lần, không làm lại.","Khi bí, mình dừng thở rồi nói tiếp, không bỏ ngang."],"done":"Bạn vừa nói 60 giây mà không cần kịch bản. Mai mình học cách giải thích bằng hình ảnh để người xem hiểu ngay nhé!","videos":["PH-031","PH-036"]},{"id":"d18C","day":18,"stage":3,"branch":"C","milestone":false,"title":"Biến số liệu thành hình ảnh","hook":"Con số đúng chưa chắc đã được nhớ. Hãy giúp người nghe thấy con số đó.","cards":[{"type":"story","title":"Đốm kể","body":"Cuối tháng, Minh trình bày báo cáo vận hành. Minh đọc: *\"Thời gian nhập liệu tay là 20 giờ mỗi người mỗi tháng.\"* Cả phòng gật đầu, rồi chuyển sang mục khác.\n\nTháng sau, Minh nói lại đúng con số đó, theo cách khác: *\"20 giờ. (dừng) Tức là mỗi tháng, mỗi bạn ở đây mất hai ngày rưỡi chỉ để gõ lại số từ file này sang file kia. (dừng)\"*\n\nLần này, anh trưởng phòng hỏi ngay: *\"Làm tự động thì tốn bao nhiêu?\"*\n\nCon số không đổi. Minh chỉ giúp mọi người **thấy** nó.\n\n*Số liệu trong ví dụ là giả định để minh họa.*"},{"type":"idea","title":"Ý chính","body":"Con số đứng một mình thì khô. Người nghe nghe xong là quên, vì đầu óc khó giữ một thứ trừu tượng.\n\nNgười nghe nhớ hình ảnh: thứ họ thấy được trong đầu. Việc của bạn là dịch con số sang điều họ đã quen: người, ngày, tiền, đồ vật, một cảnh cụ thể."},{"type":"how","title":"Cách làm: 5 cách cho con số có hình","body":"| Cách | Làm thế nào | Ví dụ |\n| --- | --- | --- |\n| 1. Số – dừng – câu – dừng | Nói con số thật chậm, dừng một nhịp, nói câu đầy đủ, dừng tiếp | \"20 giờ. *(dừng)* Đó là thời gian mỗi bạn nhập liệu tay mỗi tháng. *(dừng)*\" |\n| 2. Đổi sang thứ quen | Quy về người, ngày, tiền, đồ vật | \"Tỉ lệ đơn hoàn 10%\" → \"Cứ 10 đơn giao đi, 1 đơn quay về kho\" |\n| 3. So sánh | \"Việc này giống như…\" | \"Chạy quảng cáo khi trang bán hàng còn lỗi giống như mời khách đến nhà mà cửa còn khóa\" |\n| 4. \"Hãy tưởng tượng…\" | Đặt người nghe vào cảnh, gọi thẳng \"anh\", \"chị\" | \"Hãy tưởng tượng chị là khách. Đặt hàng thứ Hai, thứ Sáu vẫn chưa ai gọi.\" |\n| 5. Một trường hợp thật | Kể một người cụ thể đứng sau con số | \"Tuần trước, chị Hoa ở Hải Phòng gọi ba lần mà chưa ai nghe máy.\" |\n\nMỗi bài báo cáo chỉ cần 1–2 con số có hình. Đó là những con số bạn muốn người nghe mang về.\n\n*Số liệu trong ví dụ là giả định để minh họa.*"},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Con số khô","strongLabel":"Con số có hình","rows":[{"branch":null,"weak":"\"Chi phí phần mềm quản lý kho là 120 triệu một năm.\"","strong":"\"120 triệu một năm. *(dừng)* Bằng tiền lương một năm của một bạn nhân viên kho. Nhưng nó làm thay phần việc nhập liệu của cả hai bạn.\""},{"branch":null,"weak":"\"Thời gian phản hồi khách trung bình tăng từ 2 giờ lên 6 giờ.\"","strong":"\"Hãy tưởng tượng anh là khách, nhắn hỏi lúc 9 giờ sáng. Trước đây, 11 giờ anh đã có câu trả lời. Giờ thì 3 giờ chiều mới có.\""}],"note":"*Số liệu trong ví dụ là giả định để minh họa.*"},{"type":"takeaway","title":"Mang theo 1 câu","body":"Con số để chứng minh. Hình ảnh để người nghe nhớ."}],"quiz":{"kind":"choice","question":"Bạn cần báo: \"Tỉ lệ khách bỏ giỏ hàng là 50%.\" Cách nói nào dễ nhớ hơn?","options":[{"text":"\"Tỉ lệ bỏ giỏ hàng đang ở mức 50%, cao hơn kỳ vọng của bộ phận.\"","correct":false,"feedback":"Câu này đúng nhưng khô: thêm chữ, không thêm hình. Người nghe vẫn phải tự hình dung con số."},{"text":"\"Cứ 2 khách bỏ hàng vào giỏ, thì 1 người đóng trang mà không mua.\"","correct":true,"feedback":"Đúng rồi! Đổi phần trăm thành người thật, ai nghe cũng thấy ngay cảnh đó."}]},"practice":{"intro":"Biến 1 con số trong công việc của bạn thành hình ảnh, rồi nói nó thật chậm.","steps":["Chọn 1 con số bạn hay phải báo cáo: doanh số, chi phí, số đơn, thời gian xử lý… Chưa có? Chọn 1 đề có sẵn.","Ghi con số gốc, rồi viết 2 cách nói có hình vào các ô bên dưới.","Chọn cách bạn thích nhất. Bấm đồng hồ 45 giây, nói theo nhịp: số – dừng – câu – dừng, rồi thêm hình ảnh.","Nghe lại: chỗ dừng đã đủ lâu chưa? Một người ngoài ngành nghe có thấy hình không?"],"topics":["Mỗi ngày phòng chăm sóc khách hàng nhận 300 cuộc gọi","Doanh số kênh online tháng này tăng gấp đôi","Mỗi tuần cả phòng mất 6 giờ cho những cuộc họp không có kết luận"],"pickStory":false,"fields":[{"label":"Con số gốc","placeholder":"Ví dụ: Tỉ lệ đơn hoàn tháng này là 10%"},{"label":"Đổi sang người, ngày, tiền hoặc đồ vật quen thuộc","placeholder":"Ví dụ: Cứ 10 đơn giao đi, 1 đơn quay về kho"},{"label":"Một so sánh, hoặc \"Hãy tưởng tượng…\"","placeholder":"Ví dụ: Hãy tưởng tượng anh là shipper, chở 10 đơn đi thì phải chở 1 đơn về"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Mình nói con số chậm, có dừng trước và sau.","Con số được đổi sang thứ người nghe thấy được: người, ngày, tiền, đồ vật.","Mình chọn 1 con số chính, không đọc cả bảng."],"done":"Con số của bạn giờ đã có hình rồi đó. Mai mình tập giữ bình tĩnh khi bị chất vấn giữa họp nhé.","videos":["PH-002","PH-029"]},{"id":"d19A","day":19,"stage":3,"branch":"A","milestone":false,"title":"Khi bị chê: Cảm ơn – Hỏi – Nhắc lại","hook":"Bị chê trước mặt mọi người: đừng đứng hình, đừng cãi lại. Có một lối thứ ba.","cards":[{"type":"story","title":"Đốm kể","body":"Ngọc tổ chức chuyến du lịch công ty. Buổi họp rút kinh nghiệm, anh Tùng phòng kỹ thuật nói to: \"Nói thật, lịch trình dày quá, mệt chứ chẳng vui.\"\n\nCả phòng im phắc. Mặt Ngọc nóng bừng. Trong đầu có hai câu: *\"Thôi im luôn cho xong\"* và *\"Anh tổ chức bao giờ chưa mà nói?\"*\n\nNgọc hít một hơi, rồi nói: *\"Em cảm ơn anh đã nói thẳng. Anh thấy đoạn nào mệt nhất ạ?\"* Anh Tùng ngập ngừng: \"Thì… hôm thứ hai, 5 giờ sáng đã phải dậy.\"\n\n*\"Dạ, tức là anh muốn có một buổi sáng thong thả hơn.\"* Anh Tùng gật, giọng dịu hẳn: \"Ừ. Còn lại thì cũng vui.\""},{"type":"idea","title":"Ý chính","body":"Bị chê công khai, ta thường có hai phản xạ: **đứng hình** hoặc **cãi lại**. Cả hai làm không khí căng hơn.\n\nLối thứ ba là **khung AAA** (Appreciate – Ask – Acknowledge): **Cảm ơn – Hỏi – Nhắc lại**. Nhiều khi người chê chỉ muốn được nghe. Khi thấy mình được nghe, họ hạ giọng.\n\nNhắc lại không có nghĩa là đồng ý. Bạn chỉ cho thấy mình đã nghe đúng. Đồng ý hay không, nói sau cũng chưa muộn."},{"type":"how","title":"Cách làm: 3 bước AAA","body":"| Bước | Làm gì | Mẫu câu |\n| --- | --- | --- |\n| 1. Cảm ơn | Thở một hơi, cảm ơn sự thẳng thắn. Khó nhất, nhưng xoay chuyển cả không khí | \"Em cảm ơn anh đã nói thẳng.\" |\n| 2. Hỏi | Hỏi để hiểu điều họ thật sự muốn. Bước quan trọng nhất, lại cho bạn thời gian nghĩ | \"Anh thấy chỗ nào chưa ổn nhất?\", \"Chị mong điều gì ạ?\" |\n| 3. Nhắc lại | Nói lại điều vừa nghe bằng lời của mình. Không giải thích, không thanh minh | \"Dạ, tức là anh muốn…\" |\n\nSau 3 bước, nếu có câu hỏi thật cần trả lời, lúc đó mới nói ý của mình. Khung Ý kiến – Lý do – Ví dụ – Nhắc lại của ngày 15 dùng rất hợp.\n\nHai lưu ý:\n\n- Thuộc sẵn 1 câu cảm ơn và 1 câu hỏi. Lúc nóng mặt, não không kịp nghĩ câu mới.\n- Lời cảm ơn phải thật lòng. Nói bằng giọng mỉa còn tệ hơn im lặng."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Phản xạ tự vệ","strongLabel":"Cảm ơn – Hỏi – Nhắc lại","rows":[{"branch":null,"weak":"Khách ở quán: \"Phục vụ gì mà chậm thế!\" — \"Dạ hôm nay đông quá chị ơi, bên em có mỗi hai người.\"","strong":"\"Dạ em cảm ơn chị đã nói ạ. Chị chờ lâu nhất ở khâu nào ạ?\" … \"Dạ, tức là chị gọi món xong mười phút mà chưa ai xác nhận.\""},{"branch":null,"weak":"Bạn trong nhóm: \"Lần nào ông đặt quán cũng xa tít.\" — \"Thế lần sau ông tự đặt đi.\"","strong":"\"Cảm ơn ông nói thật. Với ông thì bao xa là ổn?\" … \"À, tức là ngồi xe không quá 20 phút là được.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Nhắc lại không phải là đồng ý. Đó là cho người kia thấy họ đã được nghe."}],"quiz":{"kind":"order","question":"Bạn bè chê: \"Bài đăng của bạn dài quá, chẳng ai đọc hết.\" Sắp xếp câu đáp theo AAA.","items":["\"Cảm ơn bạn đã nói thật nhé.\"","\"Bạn thấy đoạn nào nên cắt nhất?\"","\"À, tức là bạn muốn ý chính nằm ngay trong ba dòng đầu.\""],"feedback":"Cảm ơn trước để hạ nhiệt. Hỏi để hiểu người kia muốn gì. Nhắc lại để họ thấy mình đã nghe đúng. Chưa cần thanh minh câu nào."},"practice":{"intro":"Chuẩn bị sẵn câu đáp cho một lời chê bạn hay gặp, rồi nói thành tiếng.","steps":["Chọn 1 lời chê bên dưới, hoặc một lời chê thật bạn từng nhận và giờ đã nguôi.","Điền 3 ô Cảm ơn – Hỏi – Nhắc lại. Ô Nhắc lại: tự đoán người kia sẽ trả lời gì.","Bấm đồng hồ 30 giây. Đọc to lời chê, thở một hơi, rồi nói 3 câu của bạn. Giọng chậm, không thanh minh.","Nói lại lần 2 mà không nhìn chữ."],"topics":["Đồng nghiệp: \"Tin nhắn nhóm của bạn lúc nào cũng dài dòng.\"","Khách: \"Em tư vấn mà chẳng hiểu chị cần gì cả.\"","Người quen: \"Lần nào hẹn bạn cũng đến muộn.\""],"pickStory":false,"fields":[{"label":"Cảm ơn","placeholder":"Ví dụ: Cảm ơn bạn đã nói thẳng."},{"label":"Hỏi","placeholder":"Ví dụ: Tin nhắn nào làm bạn thấy dài nhất?"},{"label":"Nhắc lại","placeholder":"Ví dụ: À, tức là bạn muốn việc cần làm nằm ngay dòng đầu."}],"saveAs":null,"widget":null,"timer":30,"record":true},"review":["Câu đầu tiên của mình là lời cảm ơn, nói bằng giọng thật.","Mình hỏi một câu để hiểu, không phải hỏi vặn.","Mình nhắc lại ý người kia mà không thanh minh."],"done":"Lời chê vừa thành thông tin để mình tiến bộ, không còn là cú đấm. Mai Đốm chỉ bạn 5 bước chuẩn bị để bước vào cuộc trò chuyện nào cũng vững.","videos":["PH-018"]},{"id":"d19B","day":19,"stage":3,"branch":"B","milestone":false,"title":"So sánh để người xem hiểu ngay","hook":"Người xem không có thời gian ngồi nghĩ. Hãy cho họ thấy bằng một hình ảnh họ đã biết.","cards":[{"type":"story","title":"Đốm kể","body":"Minh làm kênh nói về chi tiêu cho người mới đi làm. Video về quỹ dự phòng, Minh nói: *\"Quỹ dự phòng là khoản tiền dành riêng cho các chi phí phát sinh ngoài kế hoạch.\"* Đúng, nhưng phần bình luận im ắng.\n\nVideo sau, Minh mở bằng câu: *\"Quỹ dự phòng giống chiếc áo mưa trong cốp xe. Ngày nắng bạn quên nó. Ngày mưa bạn mừng vì nó ở đó.\"*\n\nBình luận đầu tiên: *\"Giờ mới hiểu.\"* Cùng một ý. Chỉ khác ở chỗ người xem nhìn thấy nó."},{"type":"idea","title":"Ý chính","body":"Nói bằng khái niệm thì người xem phải dừng lại nghĩ. Nói bằng hình ảnh thì họ **thấy** ngay.\n\nTrên video, người xem không giơ tay hỏi lại được. Không hiểu thì họ lướt đi.\n\nPhép so sánh nối điều mới với điều họ đã quen: \"Cái này giống cái kia, vì…\". Nghe dễ hiểu quan trọng hơn nghe có vẻ giỏi."},{"type":"how","title":"Cách làm: 3 cách nói bằng hình ảnh","body":"| Cách | Mẫu câu | Ví dụ |\n| --- | --- | --- |\n| 1. So sánh | \"X giống Y, vì…\" | \"Lõi lọc nước bẩn giống khẩu trang đeo cả tuần: vẫn che, nhưng không còn lọc.\" |\n| 2. Hãy tưởng tượng | \"Hãy tưởng tượng bạn…\" | \"Hãy tưởng tượng 10 giờ tối bạn mở tủ lạnh, chỉ còn một quả trứng…\" |\n| 3. Kể khoảnh khắc | \"Lần đầu mình nhận ra điều này là…\" | \"Lần đầu mình nhận ra là hôm khách trả lại cả thùng hàng.\" |\n\n**Phép thử:** giải thích cho một đứa trẻ 10 tuổi. Nó hiểu, thì người xem của bạn sẽ hiểu.\n\nChọn hình ảnh người Việt gặp hằng ngày: xe máy, chợ, bếp, áo mưa, nhóm Zalo gia đình."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nói khái niệm","strongLabel":"Nói bằng hình ảnh","rows":[{"branch":null,"weak":"\"Kem dưỡng này có kết cấu nhẹ, thẩm thấu nhanh, không gây bí da.\"","strong":"\"Thoa lên, kem lặn vào da nhanh như nước thấm vào khăn giấy. Một phút sau chạm mặt không còn dính tay.\""},{"branch":null,"weak":"*(Họp Zoom)* \"Chúng ta cần cải thiện phối hợp giữa các phòng ban để tăng hiệu quả vận hành.\"","strong":"*(Họp Zoom)* \"Giờ mình giống nhóm khiêng tủ mà không ai hô. Ai cũng gồng, mà cái tủ chẳng nhích được bước nào.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Nói khái niệm thì người xem phải nghĩ. Nói bằng hình ảnh thì họ thấy."}],"quiz":{"kind":"choice","question":"Bạn quay video khuyên mọi người sao lưu dữ liệu điện thoại. Câu nào người xem hiểu ngay?","options":[{"text":"\"Sao lưu giúp đảm bảo an toàn và tính toàn vẹn của dữ liệu cá nhân.\"","correct":false,"feedback":"Câu này đúng nhưng toàn khái niệm. Người xem phải tự dịch ra hình ảnh, và nhiều người sẽ lướt đi."},{"text":"\"Không sao lưu giống như để hết ảnh cưới trong một chiếc điện thoại, rồi ngày nào cũng mang nó ra đường.\"","correct":true,"feedback":"Đúng rồi! Người xem thấy ngay cái được mất, không cần giải thích thêm."}]},"practice":{"intro":"Viết 3 phép so sánh cho điều bạn hay phải giải thích, rồi quay 45 giây với câu hay nhất.","steps":["Chọn một điều bạn hay phải giải thích: sản phẩm, công việc, hoặc một khái niệm trong nghề. Bí thì lấy một đề bên dưới.","Viết nhanh 3 câu \"X giống Y, vì…\" vào 3 ô. Đừng chấm điểm lúc viết, câu dở cũng được.","Chọn câu dễ hình dung nhất. Bấm ghi, giải thích trong **45 giây**, mở đầu bằng chính phép so sánh đó.","Nghe lại: một người chưa biết gì xem video này, họ có hiểu không?"],"topics":["Giải thích công việc của bạn cho một người ngoài ngành","Giải thích vì sao sản phẩm của bạn đáng tiền hơn loại rẻ","Giải thích một quy trình ở chỗ làm cho nhân viên mới"],"pickStory":false,"fields":[{"label":"So sánh 1","placeholder":"Ví dụ: Quỹ dự phòng giống chiếc áo mưa trong cốp xe, vì…"},{"label":"So sánh 2","placeholder":"Ví dụ: Làm kế toán giống trông nồi cơm, vì…"},{"label":"So sánh 3","placeholder":"Ví dụ: Chăm khách cũ giống tưới cây, vì…"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Mình viết đủ 3 phép so sánh, không ngồi chờ câu thật hay.","Video của mình mở bằng một hình ảnh, không mở bằng định nghĩa.","Hình ảnh mình chọn là thứ người xem gặp hằng ngày."],"done":"Người xem vừa \"thấy\" được điều bạn nói. Mai là bài cuối trước ngày qua màn: chuẩn bị và khởi động trước khi bấm quay.","videos":["PH-029"]},{"id":"d19C","day":19,"stage":3,"branch":"C","milestone":false,"title":"Bị chất vấn giữa họp","hook":"Bị hỏi vặn trước cả phòng, đừng đứng hình, cũng đừng cãi. Thở một hơi, rồi đi 3 bước.","cards":[{"type":"story","title":"Đốm kể","body":"Hà đang trình bày kế hoạch đào tạo nội bộ quý mới. Đến slide thứ ba, anh Quân bên kinh doanh lên tiếng: *\"Nói thật, kế hoạch này xa thực tế quá. Anh em sale lấy đâu ra thời gian mà ngồi học?\"*\n\nCả phòng quay sang nhìn Hà. Hà thấy mặt mình nóng lên. Trong đầu bật ra một câu: *\"Anh chưa nghe hết đã…\"*\n\nNhưng Hà thở một hơi, rồi nói: *\"Cảm ơn anh đã nói thẳng. Anh lo nhất phần nào ạ, thời lượng hay lịch học?\"*\n\nAnh Quân nghĩ một chút: *\"Lịch. Chiều thứ Sáu là lúc anh em chốt đơn.\"* Không khí dịu hẳn. Và Hà biết chính xác mình cần sửa gì."},{"type":"idea","title":"Ý chính","body":"Bị chất vấn trước đông người, ta thường có hai phản xạ: **đứng hình** hoặc **phản công**. Cả hai đều làm phòng họp căng hơn.\n\nPhần lớn người góp ý gay gắt chỉ muốn được lắng nghe. Khi thấy mình được nghe, họ hạ giọng. Và bạn có thêm vài giây để nghĩ.\n\nĐầu óc trống rỗng lúc bị hỏi khó không phải vì bạn kém. Lúc căng, ta hay nín thở mà không biết. Một hơi thở giúp bạn lấy lại nhịp."},{"type":"how","title":"Cách làm: Thở, rồi khung AAA","body":"1. **Thở.** Trước khi mở miệng, hít một hơi chậm rồi thở ra. Một giây im lặng trông bình tĩnh hơn bạn nghĩ.\n2. **Cảm ơn** *(Appreciate)*. Cảm ơn sự thẳng thắn, và nói thật lòng. Mẫu câu: \"Cảm ơn anh đã nói thẳng.\"\n3. **Hỏi** *(Ask)*. Hỏi để hiểu điều họ thật sự lo. Đây là bước quan trọng nhất. Mẫu câu: \"Anh lo nhất phần nào ạ?\", \"Chị mong phần này có thêm gì?\"\n4. **Nhắc lại** *(Acknowledge)*. Nói lại ý họ bằng lời của bạn. Nhắc lại chưa phải là đồng ý, chỉ cho thấy bạn đã nghe. Mẫu câu: \"Vậy là anh lo lịch học trùng giờ chốt đơn, đúng không ạ?\"\n\nNếu đó là một câu hỏi thật, giờ mới trả lời: **đồng ý phần đúng, rồi thêm ý của mình**. Ví dụ: \"Anh nói đúng, chiều thứ Sáu không hợp. Em sẽ dời sang sáng thứ Ba, mỗi buổi 45 phút.\""},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Đứng hình hoặc phản công","strongLabel":"Thở + AAA","rows":[{"branch":null,"weak":"Đồng nghiệp: \"Kế hoạch này xa thực tế quá.\" → \"Anh chưa nghe hết đã nói. Kế hoạch này em làm cả tuần rồi.\"","strong":"*(thở)* \"Cảm ơn anh đã nói thẳng. Anh thấy phần nào xa thực tế nhất ạ?\" … \"Vậy là anh lo anh em sale mất buổi chiều chốt đơn. Em hiểu rồi.\""},{"branch":null,"weak":"Khách: \"Báo giá bên em cao quá.\" → \"Dạ không đâu chị, bên em chất lượng hơn hẳn mà.\"","strong":"*(thở)* \"Em cảm ơn chị đã nói rõ. Chị đang so với gói nào bên kia ạ?\" … \"Vậy là chị cần một mức giá vừa ngân sách quý này, đúng không ạ?\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Bị chất vấn, đừng vội trả lời. Thở, cảm ơn, hỏi, nhắc lại, rồi mới nói ý mình."}],"quiz":{"kind":"order","question":"Giữa họp, anh trưởng phòng khác nói: \"Số liệu này không tin được.\" Sắp xếp câu trả lời theo đúng thứ tự.","items":["(Hít một hơi chậm, thở ra.)","\"Em cảm ơn anh đã hỏi thẳng.\"","\"Anh thấy chỗ nào chưa khớp ạ?\"","\"Vậy là anh thấy số đơn tháng 9 khác báo cáo bên kế toán, đúng không ạ?\""],"feedback":"Thở trước, rồi cảm ơn, hỏi, nhắc lại. Đến lúc này bạn đã biết chính xác chỗ cần giải thích, thay vì đoán rồi cãi."},"practice":{"intro":"Tập trả lời một câu chất vấn bằng một hơi thở và 3 bước AAA.","steps":["Chọn 1 câu chất vấn bạn từng nghe, hoặc sợ sẽ nghe trong họp. Chưa có? Chọn 1 đề có sẵn.","Điền 3 ô bên dưới. Ở ô nhắc lại, tự đoán người hỏi sẽ trả lời thế nào.","Đọc to câu chất vấn như người khác đang nói. Bấm đồng hồ 45 giây: thở một hơi, trả lời theo 3 bước, rồi thêm ý của bạn ở cuối.","Nghe lại: giọng mình chậm và đều, hay vội như đang cãi?"],"topics":["\"Làm cả tháng mà kết quả chỉ có thế này à?\"","\"Đề xuất này tốn tiền mà không thấy lợi gì.\"","\"Sao giờ này mới báo? Sao không báo sớm hơn?\""],"pickStory":false,"fields":[{"label":"Câu cảm ơn","placeholder":"Ví dụ: Em cảm ơn chị đã nói thẳng."},{"label":"Câu hỏi để hiểu","placeholder":"Ví dụ: Chị thấy phần nào chưa đạt nhất ạ?"},{"label":"Câu nhắc lại ý người hỏi","placeholder":"Ví dụ: Vậy là chị mong số khách mới cao hơn, đúng không ạ?"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Mình thở một hơi trước khi mở miệng.","Mình hỏi lại để hiểu, không vội giải thích hay bào chữa.","Mình nhắc lại ý người hỏi bằng lời của mình trước khi nói ý mình."],"done":"Bạn vừa tập một việc khó: giữ bình tĩnh khi bị hỏi vặn. Mai Đốm chỉ bạn 5 bước chuẩn bị để bước vào họp vững hơn nhé.","videos":["PH-018","PH-036"]},{"id":"d20A","day":20,"stage":3,"branch":"A","milestone":false,"title":"5 bước chuẩn bị trước khi nói","hook":"Tự tin không phải tính cách bẩm sinh. Nó là một vòng lặp bạn tự xây được.","cards":[{"type":"story","title":"Đốm kể","body":"Linh được nhờ giới thiệu mình trong 1 phút ở buổi họp mặt cựu sinh viên, trước khoảng 50 người.\n\nTối hôm trước, Linh viết sẵn bài giới thiệu, học thuộc từng chữ, đọc đi đọc lại 20 lần.\n\nĐến lượt Linh, anh MC hỏi thêm một câu ngoài lề: \"Linh giờ còn chơi cầu lông không?\" Linh cười gượng, và quên sạch phần đã thuộc.\n\nLinh chuẩn bị rất kỹ. Chỉ là chuẩn bị nhầm thứ: Linh **tập nhớ**, chứ không **tập nói**."},{"type":"idea","title":"Ý chính","body":"Tự tin không đến từ thuộc lòng. Nó đến từ cảm giác: lệch kịch bản, mình vẫn ổn.\n\n**Vòng tự tin 5P** gồm 5 bước: **Bằng chứng – Luyện tập – Khởi động – Mục đích – Ghi nhận** (Proof – Practice – Prime – Purpose – Praise).\n\nĐiều hay nhất: bước cuối quay lại nuôi bước đầu. Mỗi lần bạn ghi nhận điều mình làm tốt, bạn có thêm một bằng chứng cho lần sau."},{"type":"how","title":"Cách làm: vòng tự tin 5P","body":"| Bước | Làm gì | Ví dụ |\n| --- | --- | --- |\n| 1. Bằng chứng | Mỗi tối ghi 1 khoảnh khắc hơi ngại mà mình đã vượt qua | \"Hôm nay mình phát biểu đầu tiên trong họp.\" |\n| 2. Luyện tập | Nhớ ý, không nhớ chữ. Mỗi lần tập nói bằng lời hơi khác | Nói 3 lần, mỗi lần một kiểu |\n| 3. Khởi động | 5 phút trước khi nói: rũ vai, rũ tay, thở chậm, nghĩ 3 điều biết ơn. Không đọc lại ghi chú | \"Mình biết ơn vì được mời.\" |\n| 4. Mục đích | Đổi câu hỏi \"Mình trông thế nào?\" thành \"Mình giúp gì được cho người nghe?\" | Nhìn một người, nhẩm \"mình đến để cho\" |\n| 5. Ghi nhận | Nói xong, ghi 3 điều làm tốt trước. Không kèm chữ \"nhưng\" | \"Mình mở đầu bằng một chuyện vui.\" |\n\nNgại khởi động trước mặt người khác? Ra hành lang hoặc vào nhà vệ sinh. Một phút là đủ."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Chuẩn bị kiểu học thuộc","strongLabel":"Chuẩn bị theo 5P","rows":[{"branch":null,"weak":"Trước buổi gặp khách lần đầu: ngồi trong xe đọc lại kịch bản, lo khách hỏi câu khó.","strong":"Đọc lướt 3 ý chính, ra ngoài đi bộ một vòng, thả lỏng vai, nghĩ: \"Hôm nay mình giúp chị ấy chọn đúng thứ chị cần.\""},{"branch":null,"weak":"Sau khi giới thiệu ở buổi kết nối: về nhà nghĩ mãi \"Mình nói 'ờ' nhiều quá, chắc người ta thấy mình kém.\"","strong":"Ghi ngay 3 dòng: mình nói rõ tên công ty, mình cười khi bắt tay, có hai người xin số. Rồi mới nghĩ lần sau sửa gì."}]},{"type":"tak
