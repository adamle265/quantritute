eaway","title":"Mang theo 1 câu","body":"Tự tin là kho ký ức về những lần mình dám. Mỗi ngày bỏ thêm vào một ký ức."}],"quiz":{"kind":"choice","question":"5 phút trước khi giới thiệu bản thân ở một buổi họp mặt, bạn nên làm gì?","options":[{"text":"Đọc lại ghi chú lần cuối cho chắc.","correct":false,"feedback":"Nghe thì có vẻ chăm chỉ, nhưng việc này giữ đầu bạn ở chế độ lo lắng. Phần chuẩn bị nên xong từ trước."},{"text":"Rũ vai, thở chậm, nghĩ 3 điều biết ơn và một người mình muốn giúp.","correct":true,"feedback":"Đúng rồi! Cơ thể thả lỏng thì đầu mới thoáng. Nghĩ đến người nghe giúp bạn bớt soi vào chính mình."}]},"practice":{"intro":"Lập vòng tự tin cho một lần nói sắp tới của bạn.","steps":["Chọn một lần nói sắp tới, hoặc một đề bên dưới. Điền 3 ô đầu: Bằng chứng, Mục đích, 3 điều biết ơn.","Khởi động 30 giây thật: đứng dậy, rũ vai, rũ tay, thở chậm 3 hơi.","Bấm đồng hồ 60 giây, nói phần mở đầu. Nhớ ý, không đọc chữ.","Nghe lại, ghi 3 điều bạn làm tốt vào ô cuối. Không kèm chữ \"nhưng\"."],"topics":["Giới thiệu bản thân 1 phút ở buổi kết nối","Nói vài lời chúc ở đám cưới đồng nghiệp","Chào hỏi và giới thiệu dịch vụ với một khách mới"],"pickStory":false,"fields":[{"label":"Bằng chứng: một lần mình từng vượt qua cảm giác ngại khi nói","placeholder":"Ví dụ: tháng trước mình hỏi câu đầu tiên ở buổi hội thảo"},{"label":"Mục đích: người nghe sẽ nhận được gì từ mình?","placeholder":"Ví dụ: biết bên mình giúp được gì cho cửa hàng của họ"},{"label":"3 điều mình biết ơn lúc này","placeholder":"Ví dụ: được mời, đã chuẩn bị, có bạn đi cùng"},{"label":"3 điều mình vừa làm tốt","placeholder":"Ví dụ: nói rõ tên, giọng chậm, có một câu đùa nhẹ"}],"saveAs":null,"widget":null,"timer":60,"record":true},"review":["Mình tìm được 1 bằng chứng rằng mình từng làm được.","Mình khởi động bằng cơ thể thay vì đọc lại ghi chú.","Mình ghi 3 điều làm tốt mà không kèm chữ \"nhưng\"."],"done":"Vòng tự tin của bạn đã bắt đầu quay. Mai là ngày qua màn chặng 3: ba câu hỏi bất ngờ đang chờ bạn!","videos":["PH-050"]},{"id":"d20B","day":20,"stage":3,"branch":"B","milestone":false,"title":"5 bước chuẩn bị + khởi động giọng","hook":"Năm phút trước khi quay, đừng đọc lại kịch bản. Hãy khởi động.","cards":[{"type":"story","title":"Đốm kể","body":"Trang bán quần áo, livestream lúc 8 giờ tối. Trước giờ live, Trang ngồi đọc đi đọc lại ghi chú, vừa đọc vừa lo: *\"Tối nay liệu có ai xem không?\"* Bật live, giọng Trang khô, vai cứng đơ.\n\nMột tối, Trang đổi cách. Năm phút trước giờ live, Trang đứng dậy rũ tay chân, mở một bài hát mình thích, rung môi, đọc to \"nồi đồng nấu ốc\". Rồi Trang nghĩ tới chị khách hay hỏi size.\n\nBật live, Trang cười được ngay từ câu đầu. Nội dung tối đó vẫn vậy. Chỉ khác là cơ thể Trang đã sẵn sàng."},{"type":"idea","title":"Ý chính","body":"Tự tin không phải tính cách có sẵn. Nó là một vòng lặp bạn tự xây, gồm 5 bước. Đốm gọi là **vòng tự tin 5P**: Bằng chứng – Luyện tập – Khởi động – Mục đích – Ghi nhận.\n\nBước cuối quay lại nuôi bước đầu. Mỗi lần bạn ghi nhận điều mình làm tốt, bạn có thêm một bằng chứng cho lần quay sau.\n\nBước hay bị bỏ qua nhất là Khởi động. Đọc lại ghi chú phút chót giữ bạn ở trong đầu. Trong khi lúc đó, bạn cần ở trong cơ thể mình."},{"type":"how","title":"Cách làm: vòng 5 bước quanh một lần quay","body":"| Bước | Làm gì | Khi nào |\n| --- | --- | --- |\n| 1. Bằng chứng | Ghi một lần mình đã dám: dám bật camera trong họp, dám đăng video đầu | Mỗi tối, 1 dòng |\n| 2. Luyện tập | Ứng khẩu 60 giây với đề ngẫu nhiên, thay vì học thuộc | Mỗi ngày |\n| 3. Khởi động | Rũ người 1 phút, thở bụng 3 hơi, rung môi, trượt giọng, câu nói lái | 3–5 phút trước khi quay |\n| 4. Mục đích | Nghĩ tới một người video này giúp, nhủ \"mình ở đây để giúp\" | Ngay trước khi bấm quay |\n| 5. Ghi nhận | Ghi 3 điều làm tốt **trước**, rồi mới nghĩ tới điều chưa tốt | Ngay sau khi quay |\n\n**Góc quay không cần thiết bị đắt:** kê điện thoại lên chồng sách cho ngang tầm mắt. Ngồi quay mặt về phía cửa sổ để ánh sáng chiếu vào mặt. Nhìn vào ống kính."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Thói quen cũ","strongLabel":"Vòng 5 bước","rows":[{"branch":null,"weak":"*(Năm phút trước live)* Ngồi đọc lại ghi chú, mở xem lượt theo dõi, tự nhủ: \"Đừng có nói vấp.\"","strong":"*(Năm phút trước live)* Đứng dậy rũ người, rung môi, đọc to câu nói lái, nghĩ tới chị khách hay hỏi size."},{"branch":null,"weak":"*(Quay xong)* \"Mình ờ nhiều quá, mặt cứng đơ. Thôi, xóa.\"","strong":"*(Quay xong)* \"Câu mở rõ. Mình có dừng trước ý chính. Mình nhìn ống kính suốt.\" Rồi mới ghi một điều cần sửa."}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Đừng đợi tự tin rồi mới quay. Cứ khởi động, quay, ghi nhận, và tự tin sẽ lớn dần."}],"quiz":{"kind":"order","question":"Sắp xếp những việc nên làm quanh một lần quay video:","items":["Rũ người, thở bụng, khởi động giọng","Nghĩ tới một người mà video này giúp","Bấm quay và nói","Ghi 3 điều mình làm tốt"],"feedback":"Khởi động đưa bạn về với cơ thể. Mục đích kéo bạn ra khỏi nỗi lo về mình. Quay xong thì ghi nhận điều tốt trước, sửa sau."},"practice":{"intro":"Chạy thử trọn vòng 5 bước quanh một video 45 giây.","steps":["**Bằng chứng:** ghi vào ô dưới một lần bạn đã dám. Nó sẽ thành một hạt giống trong Kho chuyện.","**Khởi động** 2 phút: rũ người, thở bụng 3 hơi, rung môi, trượt giọng, đọc \"nồi đồng nấu ốc, nồi đất nấu ếch\" nhanh dần.","**Mục đích:** kê điện thoại ngang tầm mắt, quay mặt về phía cửa sổ. Nghĩ tới một người, nhủ \"mình ở đây để giúp\". Bấm ghi, nói **45 giây** với một đề bên dưới.","**Ghi nhận:** xem lại, nói to 3 điều mình làm tốt, chưa vội nghĩ tới điều chưa tốt."],"topics":["Giới thiệu bản thân và việc bạn đang làm","Một mẹo nhỏ giúp công việc của bạn nhẹ hơn","Vì sao bạn bắt đầu bán hàng hoặc làm nội dung"],"pickStory":false,"fields":[{"label":"Một lần mình đã dám","placeholder":"Ví dụ: lần đầu bật camera trong cuộc họp Zoom với khách"}],"saveAs":"seeds","widget":null,"timer":45,"record":true},"review":["Mình khởi động đủ 2 phút trước khi quay, không đọc lại ghi chú.","Mình nghĩ tới một người cụ thể trước khi bấm quay.","Xem lại, mình kể được 3 điều làm tốt trước khi nghĩ tới điều chưa tốt."],"done":"Bạn đã có đủ đồ nghề của chặng 3. Mai là ngày qua màn: 3 video, mỗi video quay một lần. Đốm tin bạn làm được!","videos":["PH-050"]},{"id":"d20C","day":20,"stage":3,"branch":"C","milestone":false,"title":"5 bước chuẩn bị trước buổi họp","hook":"Bạn chuẩn bị slide rất kỹ. Còn chính mình thì sao?","cards":[{"type":"story","title":"Đốm kể","body":"Chiều nay Tú trình bày kế hoạch quý trước ban giám đốc. Năm phút trước giờ họp, Tú ngồi lật slide lần thứ mười, nhẩm lại từng câu đã học thuộc.\n\nVào phòng, Tú nói trơn tru được hai phút. Rồi chị Phó giám đốc hỏi một câu không có trong kịch bản. Đầu Tú trắng xóa, phần còn lại cũng rơi mất.\n\nTối đó Tú nghĩ: *\"Mình chuẩn bị kỹ thế cơ mà.\"* Tú đã chuẩn bị kỹ **nội dung**. Nhưng chưa chuẩn bị **chính mình**."},{"type":"idea","title":"Ý chính","body":"Nhiều người nghĩ tự tin là thứ có sẵn, người có người không. Thật ra tự tin giống một kho ký ức: những lần mình run mà vẫn làm được.\n\nKho đó xây được, theo một vòng 5 bước gọi là **5P**: Bằng chứng – Luyện tập – Khởi động – Mục đích – Ghi nhận. Bước cuối của buổi họp này trở thành bước đầu của buổi họp sau."},{"type":"how","title":"Cách làm: Vòng tự tin 5P","body":"| Bước | Khi nào | Làm gì |\n| --- | --- | --- |\n| 1. Bằng chứng *(Proof)* | Tối hôm trước | Ghi lại 1 lần bạn từng nói được dù run. Đó là \"áo giáp\" mang vào phòng họp |\n| 2. Luyện tập *(Practice)* | 1–2 ngày trước | Nói thử ý chính thành tiếng, mỗi lần một kiểu lời, đừng học thuộc. Tự đặt 3 câu sếp có thể hỏi và trả lời thử |\n| 3. Khởi động *(Prime)* | 5 phút trước | Thay vì lật slide lần nữa: ra hành lang, rũ vai, rũ tay, thở chậm 3 hơi, nghĩ 3 điều mình biết ơn |\n| 4. Mục đích *(Purpose)* | Lúc bắt đầu nói | Chọn 1 người trong phòng, nhủ: \"Mình ở đây để giúp anh/chị ấy…\" |\n| 5. Ghi nhận *(Praise)* | Ngay sau họp | Trước khi mở điện thoại, ghi 3 điều mình làm tốt. Không kèm chữ \"nhưng\" |\n\nBa điều làm tốt hôm nay chính là bằng chứng cho buổi họp sau. Vòng cứ thế quay, và mỗi vòng bạn vững thêm một chút."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Chỉ chuẩn bị nội dung","strongLabel":"Chuẩn bị cả chính mình","rows":[{"branch":null,"weak":"5 phút trước giờ họp: lật slide lần thứ mười, nhẩm lại câu mở đầu đã học thuộc.","strong":"5 phút trước giờ họp: ra hành lang rũ vai, thở chậm 3 hơi, nhủ: \"Mình nắm rõ dự án này. Hôm nay mình vào để giúp chị Phó giám đốc quyết nhanh.\""},{"branch":null,"weak":"Họp xong, trên đường về chỗ: \"Mình lại nói 'ờ' nhiều quá, đoạn số liệu thì lộn xộn, chán thật.\"","strong":"Họp xong, ghi vào điện thoại: \"1. Mình nói kết luận ngay câu đầu. 2. Bị hỏi khó, mình thở rồi mới trả lời. 3. Mình xong đúng giờ.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Tự tin không phải tính cách. Nó được chuẩn bị, như chuẩn bị tài liệu."}],"quiz":{"kind":"choice","question":"Còn 5 phút nữa là vào họp, bạn hơi run. Nên làm gì?","options":[{"text":"Mở slide ra đọc lại lần cuối cho chắc.","correct":false,"feedback":"Nghe thì chăm chỉ, nhưng việc này giữ bạn mắc kẹt trong đầu và làm bạn căng hơn. Nội dung đã xong rồi, giờ là lúc chuẩn bị cơ thể."},{"text":"Ra hành lang rũ vai, thở chậm vài hơi, nghĩ 3 điều mình biết ơn.","correct":true,"feedback":"Đúng rồi! Đây là bước Khởi động. Khó mà vừa lo lắng vừa thấy biết ơn cùng một lúc."},{"text":"Lướt điện thoại cho đỡ căng.","correct":false,"feedback":"Lướt điện thoại làm đầu óc tản ra, không đưa bạn vào trạng thái sẵn sàng. Thử một cách khởi động có chủ đích nhé."}]},"practice":{"intro":"Lên kế hoạch 5P cho buổi họp sắp tới, rồi tập luôn bước Luyện tập.","steps":["Chọn 1 buổi họp hoặc buổi trình bày sắp tới. Chưa có? Chọn 1 đề có sẵn.","Điền 4 ô bên dưới, mỗi ô 1 câu.","Bấm đồng hồ 45 giây, trả lời thành tiếng câu hỏi khó nhất bạn vừa ghi. Không cần hay, chỉ cần không dừng.","Xong, ghi ngay 1 điều bạn làm tốt ở phần Ghi nhận. Đó chính là bước 5."],"topics":["Báo cáo kết quả quý trước ban giám đốc","Trình bày đề xuất mua phần mềm mới với phòng kế toán","Đứng lớp đào tạo nội bộ 30 phút cho nhân viên mới"],"pickStory":false,"fields":[{"label":"Bằng chứng: 1 lần mình từng nói được dù run","placeholder":"Ví dụ: Lần báo khách giao trễ, mình vẫn nói rõ và khách đồng ý lùi lịch"},{"label":"Luyện tập: câu hỏi khó nhất có thể bị hỏi","placeholder":"Ví dụ: Sao chi phí quý này vượt kế hoạch?"},{"label":"Khởi động: 5 phút trước họp mình sẽ làm gì","placeholder":"Ví dụ: Ra hành lang, rũ vai, thở 3 hơi, nghĩ 3 điều biết ơn"},{"label":"Mục đích: mình vào họp để giúp ai, giúp gì","placeholder":"Ví dụ: Giúp chị Giám đốc chốt được ngân sách trong 15 phút"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Mình có 1 bằng chứng cụ thể để mang vào phòng họp.","Mình đã tập trả lời câu hỏi khó nhất, không học thuộc.","Mình biết mình vào họp để giúp ai, giúp gì."],"done":"Bạn đã có đủ đồ nghề của chặng này. Mai là ngày qua màn: làm đúng 5 bước này trước khi bấm ghi âm nhé!","videos":["PH-050"]},{"id":"d21A","day":21,"stage":3,"branch":"A","milestone":true,"title":"Mốc: 3 câu hỏi bất ngờ","hook":"Ba câu hỏi bạn chưa biết trước, mỗi câu 45 giây. Bạn đã sẵn sàng hơn bạn nghĩ.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Một tuần qua bạn đã tập những việc ít người chịu tập: trả lời có khung, nói bằng hình ảnh, nghe để hỏi lại, nói khi chưa chuẩn bị, đón lời chê.\n\nHôm nay công cụ bốc ngẫu nhiên 3 câu hỏi, giống những câu bạn hay gặp ở công sở, ở sự kiện, trong bữa cơm. Mỗi câu 45 giây.\n\nĐốm không chấm hay dở. Vấp, lạc ý, ngập ngừng đều được. Điều quan trọng là bạn nói hết 45 giây và nghe lại chính mình."},{"type":"idea","title":"Ôn nhanh chặng 3","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 15 | Nói ý kiến trước, kể ví dụ ở giữa, nhắc lại ở cuối. |\n| 16 | Khi người nghe nhíu mày, đừng giải thích thêm. Hãy nói \"Nó giống như…\" |\n| 17 | Nghe để hiểu, không phải nghe để chờ đến lượt mình. |\n| 18 | Người nói nhanh chỉ là người đã tập nói khi chưa sẵn sàng. |\n| 19 | Nhắc lại không phải là đồng ý. Đó là cho người kia thấy họ đã được nghe. |\n| 20 | Tự tin là kho ký ức về những lần mình dám. Mỗi ngày bỏ thêm vào một ký ức. |"},{"type":"how","title":"Chuẩn bị (2 phút)","body":"1. **Khởi động**: đứng dậy, rũ vai, thở chậm 3 hơi, nghĩ 3 điều biết ơn.\n2. **Nhẩm 3 khung**: hỏi ý kiến → Ý kiến – Lý do – Ví dụ – Nhắc lại. Hỏi tình hình → Trước đây – Bây giờ – Sắp tới. Hỏi chuyện, hỏi cảm nghĩ → một chuyện trong kho.\n3. **Chọn sẵn 2 chuyện** trong Kho chuyện mà bạn dùng được cho nhiều dịp.\n4. **Nhắc mình mục đích**: mình nói để người nghe nhận được điều gì, không phải để được khen."}],"quiz":null,"practice":{"intro":"Trả lời 3 câu hỏi bất ngờ, mỗi câu 45 giây, ghi âm cả 3.","steps":["Bấm \"Bốc đề\". Thở một hơi, chọn khung trong 5 giây.","Bấm ghi âm, nói 45 giây. Không dừng để sửa; lạc ý thì nói thật rồi đi tiếp.","Làm tương tự với đề thứ 2 và thứ 3. Không đổi đề.","Nghe lại cả 3, chọn bản bạn thích nhất để lưu làm \"Bản ghi ngày 21\"."],"pickStory":false,"saveAs":null,"widget":"impromptu","timer":45,"record":true},"review":["Câu đầu của mỗi câu trả lời đi thẳng vào ý: ý kiến, tình hình hoặc khoảnh khắc.","Mình bám được một khung trong ít nhất 2 trên 3 câu.","Có ít nhất một câu so sánh hoặc một chuyện nhỏ cụ thể.","Mình nói hết 45 giây, kể cả khi bị lạc ý.","Nghe lại, mình ghi được 3 điều làm tốt trước khi nghĩ đến điều cần sửa."],"done":"Chúc mừng bạn qua màn chặng 3, giờ bạn là Người kể vững vàng! Tuần tới mình học cách chạm đến người nghe: mở lời bằng một câu chuyện, kết bằng một câu khiến họ nhớ lâu.","videos":[]},{"id":"d21B","day":21,"stage":3,"branch":"B","milestone":true,"title":"Mốc: quay 3 video 45 giây, mỗi video 1 lần","hook":"Không kịch bản, không làm lại. Chỉ có bạn, chiếc điện thoại và những gì bạn đã tập.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Sáu ngày qua, bạn đã tập nói với một người, đưa kết luận lên đầu, dừng đúng chỗ. Bạn còn tập ứng khẩu, nói bằng hình ảnh, và khởi động trước khi quay.\n\nHôm nay bạn quay 3 video ngắn, mỗi video đúng **một lần**. Vấp cũng giữ lại. Đốm không chấm đẹp hay xấu.\n\nBa video này là bằng chứng: bạn đã đứng trước camera mà không cần kịch bản. Hãy lưu lại, chặng sau bạn sẽ cần đến chúng."},{"type":"idea","title":"Ôn nhanh chặng 3","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 15 | Nói với một người, thì mỗi người xem đều thấy bạn đang nói với mình |\n| 16 | Câu đầu nói điều quan trọng nhất, câu thứ hai nói có mấy điều |\n| 17 | Khoảng lặng là để bạn thở |\n| 18 | Không cần nói hay, chỉ cần nói tiếp |\n| 19 | Nói khái niệm thì người xem phải nghĩ, nói hình ảnh thì họ thấy |\n| 20 | Khởi động trước khi quay, ghi nhận điều tốt sau khi quay |"},{"type":"how","title":"Chuẩn bị (2 phút)","body":"1. Kê điện thoại ngang tầm mắt, quay mặt về phía cửa sổ. Mở chế độ ghi của công cụ, hoặc camera trước của điện thoại.\n2. Khởi động 1 phút: rũ người, thở bụng, rung môi, câu nói lái.\n3. Ghi tên một người bạn muốn giúp lên mẩu giấy, dán cạnh camera.\n4. Xem trước 3 video sẽ quay:\n   - **Video 1:** giới thiệu bạn và việc bạn làm, nói với người trên mẩu giấy.\n   - **Video 2:** giới thiệu một sản phẩm, dịch vụ hoặc ý tưởng. Kết luận trước, báo trước số ý, có một phép so sánh.\n   - **Video 3:** một đề bất ngờ từ công cụ, nghĩ tối đa 30 giây.\n\nKhông viết cả bài. Mỗi video chỉ cần nhớ câu đầu tiên."}],"quiz":null,"practice":{"intro":"Quay 3 video, mỗi video 45 giây và chỉ quay một lần.","steps":["**Video 1:** bấm ghi, giới thiệu bạn và việc bạn làm trong **45 giây**, nói với một người cụ thể.","**Video 2:** chọn một điều để giới thiệu (bí thì lấy một đề bên dưới). Kết luận trước, \"có hai/ba điều\", chen một phép so sánh. Quay một lần.","**Video 3:** bấm \"Đề mới\", nghĩ tối đa 30 giây, rồi nói 45 giây. Bí thì thở và nói tiếp.","Xem lại cả 3 video. Nói to 3 điều làm tốt trước, rồi mới tự chấm theo 5 tiêu chí."],"topics":["Một món đồ bạn đang bán hoặc rất hay dùng","Một dịch vụ, lớp học hay sự kiện bạn muốn mời người khác tham gia","Một cách làm việc bạn muốn đề xuất với nhóm"],"pickStory":false,"saveAs":null,"widget":"impromptu","timer":45,"record":true},"review":["Mình quay đủ 3 video, mỗi video đúng một lần.","Mình nói với một người, xưng \"bạn/chị/anh\" thay cho \"các bạn\".","Video 2 có kết luận ở câu đầu, báo trước số ý và có một phép so sánh.","Khi vấp hoặc bí, mình dừng thở rồi nói tiếp, không bỏ ngang.","Mình kể được 3 điều làm tốt trước khi nghĩ tới điều chưa tốt."],"done":"Chúc mừng bạn đã qua chặng 3, giờ bạn là \"Người kể vững vàng\"! Ba video hôm nay là bằng chứng bạn nói được trước camera. Chặng 4, Đốm chỉ bạn cách giữ chân người xem ngay từ những giây đầu.","videos":["PH-030"]},{"id":"d21C","day":21,"stage":3,"branch":"C","milestone":true,"title":"Mốc: trả lời 3 câu hỏi bất ngờ của \"sếp\"","hook":"Sếp hỏi bất ngờ, bạn trả lời gọn trong 45 giây. Ba lần.","cards":[{"type":"story","title":"Đốm nói trước khi bắt đầu","body":"Sáu ngày qua, bạn đã học cách nói để người khác hiểu ngay. Chọn một điều, nói kết luận trước, nói ảnh hưởng và việc tiếp theo, cho con số có hình.\n\nHôm nay Đốm đóng vai sếp. Đốm sẽ hỏi bạn 3 câu bất ngờ, như gặp nhau ở thang máy hay giữa buổi họp. Mỗi câu bạn có 45 giây.\n\nKhông cần hoàn hảo. Vấp thì thở một hơi, rồi nói tiếp. Bản ghi hôm nay được giữ lại để bạn so với ngày 28."},{"type":"idea","title":"Ôn nhanh chặng 3","body":"| Ngày | Điều mang theo |\n| --- | --- |\n| 15 | Nói hết mọi thứ nghĩa là chưa chọn điều gì quan trọng nhất. |\n| 16 | Kể chuyện thì giữ bất ngờ đến cuối. Báo cáo thì nói điều quan trọng nhất trước tiên. |\n| 17 | Đừng chỉ báo chuyện gì xảy ra. Nói luôn vì sao nó quan trọng và mình làm gì tiếp. |\n| 18 | Con số để chứng minh. Hình ảnh để người nghe nhớ. |\n| 19 | Bị chất vấn, đừng vội trả lời. Thở, cảm ơn, hỏi, nhắc lại, rồi mới nói ý mình. |\n| 20 | Tự tin không phải tính cách. Nó được chuẩn bị, như chuẩn bị tài liệu. |"},{"type":"how","title":"Chuẩn bị (2 phút)","body":"Nhìn kiểu câu hỏi, chọn ngay khung:\n\n| Sếp hỏi kiểu | Khung dùng | Câu mở |\n| --- | --- | --- |\n| Xin ý kiến, đề xuất: \"Em thấy nên làm sao?\" | Kim tự tháp | \"Em đề xuất… Có hai lý do.\" |\n| Hỏi tình hình: \"Chuyện đó sao rồi?\" | Việc gì – Vì sao quan trọng – Làm gì tiếp | \"Việc là… Điều này có nghĩa là… Bên em sẽ…\" |\n| Bắt bẻ: \"Sao lại để thế được?\" | Thở + Cảm ơn – Hỏi – Nhắc lại | \"Em cảm ơn anh đã hỏi thẳng. Anh lo nhất phần nào ạ?\" |\n\nTrước khi bấm ghi âm: đứng dậy, rũ vai, thở chậm 3 hơi. Nhủ thầm: \"Mình trả lời để giúp sếp nắm nhanh.\"\n\nMỗi câu trả lời kết bằng một câu chốt, rồi dừng. Không \"vậy thôi ạ\"."}],"quiz":null,"practice":{"intro":"Trả lời 3 câu hỏi bất ngờ của \"sếp\", mỗi câu 45 giây, có ghi âm.","steps":["Bấm lấy 1 đề ngẫu nhiên. Đọc đề, thở một hơi, nhận ra kiểu câu hỏi và chọn khung.","Bấm ghi âm, trả lời trong **45 giây**. Câu đầu tiên phải là ý chính.","Làm tiếp với đề thứ hai và thứ ba. Vấp giữa chừng thì nói tiếp, không quay lại từ đầu.","Nghe lại cả 3 bản ghi. Chọn bản bạn thích nhất để lưu làm **\"Bản ghi ngày 21\"**."],"topics":["\"Dự án bên em tuần này thế nào rồi?\"","\"Sao tháng này số đơn giảm thế?\"","\"Em thấy mình có nên đổi nhà cung cấp không?\""],"pickStory":false,"fields":[],"saveAs":null,"widget":"impromptu","timer":45,"record":true},"review":["Câu đầu tiên của mỗi câu trả lời là ý chính, không phải bối cảnh.","Mình chọn đúng khung cho từng kiểu câu hỏi.","Gặp câu khó, mình thở một hơi rồi mới nói.","Mỗi câu trả lời xong trong 45 giây, kết bằng một câu chốt rồi dừng.","Mình đã nghe lại cả 3 bản ghi."],"done":"Chúc mừng bạn đã qua chặng 3, lên cấp \"Người kể vững vàng\"! Bạn đã nói rõ và nói vững. Chặng cuối, Đốm chỉ bạn cách chạm tới người nghe, bắt đầu từ câu mở bài.","videos":[]},{"id":"d22A","day":22,"stage":4,"branch":"A","milestone":false,"title":"Mở lời bằng một câu chuyện","hook":"Câu chào mở cửa. Một chuyện nhỏ giữ cho cánh cửa ấy mở.","cards":[{"type":"story","title":"Đốm kể","body":"Ở buổi giao lưu doanh nghiệp, Hằng đứng cạnh một anh bên công ty vận chuyển. Hằng chào: *\"Em chào anh, em là Hằng, làm kế toán bên công ty Sao Việt ạ.\"* Anh gật đầu: *\"Chào em.\"* Rồi cả hai cùng cúi xuống điện thoại.\n\nMười phút sau, ở bàn nước, Hằng thử cách khác: *\"Em chào anh. Sáng nay em đi nhầm sang hội trường bên cạnh, ngồi nghe 5 phút về phân bón mới biết. Anh có phải tìm phòng lâu không ạ?\"* Anh bật cười: *\"Anh cũng suýt vào đấy!\"* Hai người nói chuyện đến lúc tan.\n\nHằng không nói gì to tát. Hằng chỉ đổi lời giới thiệu thành một khoảnh khắc nhỏ, kèm một câu hỏi mời người kia vào."},{"type":"idea","title":"Ý chính","body":"Khi làm quen, ta hay mở bằng \"lý lịch\": tên, chức danh, công ty. Người nghe lịch sự gật đầu, nhưng không có gì để nói tiếp.\n\nMột chuyện nhỏ gắn với nơi cả hai đang đứng cho người kia một **chỗ bám** để trả lời. Họ có thể cười, kể lại chuyện của họ, hoặc hỏi thêm.\n\nQuan trọng hơn câu mở là **tâm thế**. Bạn đến để chú tâm vào người kia, không phải để gây ấn tượng. Người ta cảm được điều đó ngay từ câu đầu."},{"type":"how","title":"Cách làm: Chào – Chuyện nhỏ – Trao lượt","body":"| Nhịp | Làm gì | Ví dụ |\n| --- | --- | --- |\n| 1. Chào | Chào hỏi đủ lễ, nhất là với người lớn tuổi hơn. Đừng bỏ bước này | \"Em chào chị ạ.\" |\n| 2. Chuyện nhỏ | 1–2 câu về một khoảnh khắc gắn với nơi đang đứng: đường đến, đồ ăn, phần vừa nghe. Vào thẳng hành động hoặc lời thoại | \"Lúc nãy xếp hàng lấy cà phê, bạn phía trước gọi hộ em luôn một ly.\" |\n| 3. Trao lượt | Một câu hỏi cụ thể, dễ trả lời | \"Chị thấy phần chia sẻ vừa rồi có ý nào dùng được không ạ?\" |\n\nTrước khi bước tới, thở chậm một hơi và nhẩm: \"Mình đến để nghe người này.\" Tên và chức danh để sau, khi người kia đã muốn biết."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Mở bằng lý lịch","strongLabel":"Mở bằng chuyện nhỏ","rows":[{"branch":null,"weak":"*(Gặp khách lần đầu)* \"Dạ em là Long, chuyên viên kinh doanh bên Minh Phát, hôm nay em qua giới thiệu sản phẩm ạ.\"","strong":"\"Em chào anh ạ. Lúc lên đây em thấy kệ hàng mẫu ngoài sảnh xếp theo màu, em đứng ngắm mất một lúc. Bên mình ai sắp xếp vậy anh?\""},{"branch":null,"weak":"*(Đồng nghiệp mới chuyển về phòng)* \"Chào em, chị là Mai bên nhân sự. Có gì cần cứ hỏi chị nhé.\"","strong":"\"Chào em, chị là Mai bên nhân sự. Ngày đầu đến đây, chị đi tìm phòng pha trà mà lạc vào phòng giám đốc. Hôm nay em đã tìm được chỗ nào chưa?\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Chào cho đủ lễ, rồi mở bằng một chuyện nhỏ và một câu hỏi."}],"quiz":{"kind":"choice","question":"Ở buổi kết nối doanh nghiệp, câu mở nào dễ thành một cuộc trò chuyện nhất?","options":[{"text":"\"Em chào chị, em là Thu, trưởng nhóm marketing công ty Sao Mai ạ.\"","correct":false,"feedback":"Câu này lịch sự, nhưng người nghe chỉ biết gật đầu. Thử thêm một khoảnh khắc nhỏ và một câu hỏi."},{"text":"\"Em chào chị. Lúc nãy diễn giả hỏi ai từng livestream bán hàng, em giơ tay mà nhìn quanh chỉ có mình em. Bên chị có làm livestream không ạ?\"","correct":true,"feedback":"Đúng rồi! Có chào, có một khoảnh khắc cả hai cùng vừa thấy, và một câu hỏi dễ trả lời."},{"text":"\"Chị ơi, để em kể chị nghe chuyện này hay lắm…\"","correct":false,"feedback":"Báo trước \"hay lắm\" làm người nghe chờ đợi nhiều và dễ ngại. Cứ vào thẳng khoảnh khắc."}]},"practice":{"intro":"Chuẩn bị sẵn một câu mở bằng chuyện cho lần gặp gỡ sắp tới.","steps":["Chọn một dịp gặp gỡ sắp tới của bạn, hoặc một đề có sẵn.","Nhặt **1 khoảnh khắc nhỏ** gắn với dịp đó: đường đến, chỗ ngồi, đồ ăn, điều vừa nghe. Kho chuyện có hạt giống hợp thì dùng luôn.","Điền 3 ô bên dưới: Chào – Chuyện nhỏ – Trao lượt.","Bấm đồng hồ 45 giây, nói thành tiếng như đang đứng trước người đó. Nói 2 lần, lần sau thả lỏng hơn."],"topics":["Buổi giao lưu doanh nghiệp: bạn đứng cạnh một người lạ ở bàn nước","Lần đầu đến văn phòng khách hàng, đang ngồi chờ trong phòng họp","Đồng nghiệp mới chuyển về phòng, ngồi cạnh bạn giờ ăn trưa"],"pickStory":false,"fields":[{"label":"Chào","placeholder":"Ví dụ: Em chào anh ạ."},{"label":"Chuyện nhỏ (1–2 câu)","placeholder":"Ví dụ: Sáng nay em đi nhầm sang hội trường bên cạnh…"},{"label":"Câu hỏi trao lượt","placeholder":"Ví dụ: Anh có phải tìm phòng lâu không ạ?"}],"saveAs":null,"timer":45,"record":true},"review":["Mình chào đủ lễ trước khi vào chuyện.","Chuyện nhỏ chỉ 1–2 câu, gắn với nơi đang đứng.","Mình kết bằng một câu hỏi cụ thể, dễ trả lời."],"done":"Câu mở của bạn đã nằm sẵn trong túi. Mai Đốm chỉ bạn cách góp ý cho người khác mà không thành giảng giải nhé!","videos":["PH-014","PH-028"]},{"id":"d22B","day":22,"stage":4,"branch":"B","milestone":false,"title":"20 giây đầu giữ chân người xem","hook":"Người xem quyết định ở lại hay lướt đi chỉ sau vài câu. Hãy cho họ một lý do thật.","cards":[{"type":"story","title":"Đốm kể","body":"Vy bán gốm thủ công, livestream mỗi tối thứ Năm. Vy hay mở live thế này: *\"Chào cả nhà, mình là Vy, chủ shop Gốm Nhà Vy. Hôm nay mình lại lên live, mọi người vào đông đủ chưa ạ?\"* Đến câu thứ ba, số người xem đã bắt đầu giảm.\n\nTuần sau Vy thử khác. Vy giơ một chiếc cốc sát camera: *\"Chiếc cốc này hôm qua ra lò bị nứt một đường nhỏ. Mình suýt bỏ đi, rồi nghĩ ra một cách. Lát nữa mình cho cả nhà xem nó thành cái gì.\"* Bình luận hiện lên: \"Thành cái gì vậy chị?\"\n\nVà Vy giữ lời. Mười phút sau, chiếc cốc nứt thành một chậu cây nhỏ. Không ai thấy bị lừa, họ thấy mình được dẫn đi một đoạn đường thú vị."},{"type":"idea","title":"Ý chính","body":"Mở bằng tên, lời chào, \"hôm nay mình sẽ nói về…\" là cách an toàn. Nhưng người xem nghe là đoán được phần còn lại, nên họ lướt đi.\n\n20 giây đầu cần trả lời câu hỏi thầm của người xem: **\"Mình được gì nếu ở lại?\"** Một câu hỏi, một khoảnh khắc, một điều bất ngờ có thật đều làm được việc đó.\n\nNhưng nhớ chữ **tử tế**: câu mở là một lời hứa. Gây sốc sai sự thật để câu view thì người xem ở lại một lần, rồi mất lòng tin mãi."},{"type":"how","title":"Cách làm: 4 kiểu mở trước camera","body":"| Kiểu mở | Làm thế nào | Ví dụ |\n| --- | --- | --- |\n| 1. Câu hỏi | Hỏi đúng điều người xem đang gặp, để họ tự trả lời trong đầu | \"Bạn đã bao giờ quay một video mười lần mà vẫn thấy chưa ổn?\" |\n| 2. Khoảnh khắc | Vào thẳng một cảnh có hành động, như bạn đã tập ở chặng 2 | \"11 giờ đêm qua, mình vẫn ngồi gói đơn thì chuông cửa reo.\" |\n| 3. Điều bất ngờ có thật | Một sự thật ngược với điều người xem nghĩ. Phải kiểm chứng được | \"Món bán chạy nhất shop mình lại là món mình định bỏ.\" |\n| 4. Lời hứa | Nói thẳng người xem nhận được gì sau video | \"Hết video này, bạn tự pha được ly cà phê muối ở nhà.\" |\n\nSau câu mở, bỏ phần chào hỏi dài. Tên và lời chào để sau, hoặc nói thật ngắn.\n\nKiểm tra tử tế trước khi quay: **phần sau video có trả đủ điều câu mở đã hứa không?** Nếu không, đổi câu mở."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Mở an toàn hoặc câu view","strongLabel":"Mở tử tế, có lý do để ở lại","rows":[{"branch":null,"weak":"\"Xin chào mọi người, mình là Khoa, hôm nay mình sẽ nói về cách chọn hạt cà phê.\"","strong":"\"Cùng một gói hạt, mình pha hai ly, vị khác hẳn nhau. Chỉ vì một bước nhỏ. Video này là về bước đó.\""},{"branch":null,"weak":"\"SỐC! Bí mật làm giàu nhanh mà không ai dám nói cho bạn!\" (phần sau chỉ là vài lời khuyên chung chung)","strong":"\"Tháng trước mình ghi lại mọi khoản chi lặt vặt. Cuối tháng cộng lại, mình ngồi im một lúc. Mình chia sẻ cách ghi đó nhé.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"20 giây đầu là một lời hứa: hứa điều có thật, rồi trả đủ."}],"quiz":{"kind":"choice","question":"Bạn quay video hướng dẫn giữ rau tươi lâu. Câu mở nào vừa giữ chân vừa tử tế?","options":[{"text":"\"Chào cả nhà, hôm nay mình chia sẻ về cách bảo quản rau nhé.\"","correct":false,"feedback":"Câu này an toàn, nhưng người xem đoán được phần còn lại. Họ chưa có lý do để ở lại."},{"text":"\"Cảnh báo: rau trong tủ lạnh nhà bạn đang đầu độc cả gia đình!\"","correct":false,"feedback":"Câu này gây sốc nhưng không đúng sự thật. Người xem có thể ở lại, rồi thấy bị lừa và không quay lại nữa."},{"text":"\"Bó rau mua thứ Hai, đến thứ Sáu vẫn giòn. Mình chỉ làm thêm một bước khi cất vào tủ.\"","correct":true,"feedback":"Đúng rồi! Có hình ảnh cụ thể, có điều tò mò, và phần sau video trả được lời hứa đó."}]},"practice":{"intro":"Viết và nói thử 20 giây mở đầu cho một video của bạn.","steps":["Chọn 1 video bạn sắp quay hoặc 1 buổi livestream sắp tới. Chưa có? Chọn 1 đề có sẵn.","Viết 2 câu mở theo 2 kiểu khác nhau trong bảng 4 kiểu.","Viết 1 dòng: phần sau video trả lời hứa bằng cách nào. Không trả được thì sửa câu mở.","Dựng điện thoại ngang tầm mắt. Bấm đồng hồ 20 giây, nói câu mở bạn thích hơn như đang quay thật."],"topics":["Mở đầu buổi livestream giới thiệu sản phẩm mới","Video 1 phút giới thiệu dịch vụ của bạn","Mở đầu phần trình bày của bạn trong cuộc họp online"],"pickStory":false,"fields":[{"label":"Câu mở thứ nhất (ghi rõ kiểu)","placeholder":"Ví dụ: Câu hỏi – \"Bạn đã bao giờ…?\""},{"label":"Câu mở thứ hai (kiểu khác)","placeholder":"Ví dụ: Khoảnh khắc – \"11 giờ đêm qua…\""},{"label":"Phần sau video trả lời hứa bằng cách nào?","placeholder":"Ví dụ: phút thứ hai mình làm mẫu bước cất rau"}],"saveAs":null,"widget":null,"timer":20,"record":true},"review":["Câu đầu tiên của mình không phải tên hay lời chào.","Câu mở cho người xem một lý do để ở lại.","Điều mình hứa là có thật, và phần sau video trả đủ."],"done":"Bạn vừa có một cánh cửa mở tử tế. Mai Đốm chỉ bạn cách nói rõ lời hứa và vẽ đường đi cho người xem nhé!","videos":["PH-002","PH-003","PH-013"]},{"id":"d22C","day":22,"stage":4,"branch":"C","milestone":false,"title":"Đừng mở bài bằng tên và chức danh","hook":"Mười giây đầu, người nghe quyết định có nghe tiếp hay không. Đừng dùng nó để đọc danh thiếp.","cards":[{"type":"story","title":"Đốm kể","body":"Buổi đào tạo nội bộ chiều thứ Sáu. Hùng, trưởng nhóm kho, đứng lên: *\"Xin chào mọi người, em là Hùng, trưởng nhóm kho vận. Hôm nay em xin trình bày về quy trình kiểm hàng mới.\"* Hàng ghế cuối, ba người mở điện thoại.\n\nHọ biết Hùng là ai. Họ nghĩ mình cũng đoán được phần còn lại.\n\nTuần sau đến lượt Thảo bên chăm sóc khách hàng. Thảo giơ lên một tờ phiếu giao hàng nhàu: *\"Tờ phiếu này đi từ kho, qua nhà khách, rồi quay về bàn em. Chỉ vì thiếu một chữ ký.\"* Thảo dừng lại. Cả phòng ngẩng lên.\n\nThảo không nói gì to tát. Thảo chỉ cho người nghe một lý do để tò mò ngay từ câu đầu."},{"type":"idea","title":"Ý chính","body":"Câu mở quen thuộc *\"Em xin tự giới thiệu… Hôm nay em xin trình bày về…\"* khiến người nghe nghĩ \"biết rồi\". Họ vẫn ngồi đó, nhưng đầu đã sang việc khác. Não người ta tự lướt qua những gì đoán trước được.\n\nMở bài tốt đưa ra một điều người nghe **chưa đoán trước**: một câu hỏi, một sự thật bất ngờ, một cảnh. Nhưng nhớ: **bất ngờ phải đúng sự thật**. Bịa con số hay dọa người nghe để gây chú ý thì mất lòng tin ngay câu đầu.\n\nTên và chức danh vẫn có chỗ: nói sau câu mở, gọn trong một câu. Cả phòng đã biết bạn thì bỏ hẳn cũng được."},{"type":"how","title":"Cách làm: 4 kiểu mở tử tế cho buổi họp","body":"| Kiểu mở | Làm thế nào | Ví dụ |\n| --- | --- | --- |\n| 1. Câu hỏi khiến người nghe tự nghĩ | Hỏi điều họ từng gặp, rồi dừng 2 giây cho họ nghĩ | \"Tuần rồi, ai phải gọi lại cho khách chỉ vì thiếu một thông tin?\" |\n| 2. Sự thật bất ngờ | Một con số có thật trong công việc. Nói con số, dừng, rồi nói hết câu | \"Ba. *(dừng)* Ba lần, một đơn hàng phải in lại phiếu trong tháng này.\" |\n| 3. Cảnh tưởng tượng | \"Hãy hình dung…\" kèm 2–3 động từ cụ thể | \"Hãy hình dung: 8 giờ sáng, khách gọi, bạn mở máy và không thấy đơn.\" |\n| 4. Một vật hoặc một hình | Giơ lên, hoặc chiếu đúng một hình, rồi nói một câu | Tờ phiếu nhàu, ảnh chụp tin nhắn của khách |\n\nSoát lại trước khi dùng: *Câu này có đúng sự thật không? Có dẫn thẳng vào nội dung chính không?* Mở bằng chuyện ngắn cũng rất mạnh; Đốm dành riêng ngày 24 cho nó.\n\n*Số liệu trong ví dụ là giả định để minh họa.*"},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Mở bằng thủ tục","strongLabel":"Mở bằng điều người nghe chưa đoán trước","rows":[{"branch":null,"weak":"\"Dạ, em là Phúc, chuyên viên nhân sự. Hôm nay em xin trình bày về quy định chấm công mới.\"","strong":"\"Có ai từng bị tính thiếu công chỉ vì quên bấm vân tay buổi chiều không? *(dừng 2 giây)* Quy định mới giải quyết đúng chuyện đó. Mình là Phúc, bên nhân sự.\""},{"branch":null,"weak":"\"Kính chào anh chị, em là Ngọc, phụ trách kinh doanh khu vực phía Bắc. Sau đây em xin báo cáo kết quả quý.\"","strong":"\"Hãy hình dung khách mở tủ hàng ngay sáng Rằm và thấy trống trơn. Quý này, chuyện đó đã xảy ra ở khu vực mình. Em là Ngọc, em xin báo cáo cách mình xử lý.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Câu đầu tiên là để người nghe muốn nghe, không phải để đọc danh thiếp."}],"quiz":{"kind":"choice","question":"Bạn trình bày trong buổi họp công ty về việc tiết kiệm giấy in. Câu mở nào vừa cuốn vừa tử tế?","options":[{"text":"\"Em xin tự giới thiệu, em là Duy, phòng hành chính. Hôm nay em nói về tiết kiệm giấy in.\"","correct":false,"feedback":"Câu này an toàn nhưng người nghe đoán được hết. Hãy để tên sau câu mở nhé."},{"text":"\"Mỗi năm công ty mình in số giấy chồng cao bằng tòa nhà 20 tầng!\" (dù bạn chưa hề tính)","correct":false,"feedback":"Bất ngờ thật, nhưng chưa kiểm. Chỉ cần một người hỏi \"số ở đâu ra?\" là cả bài mất lòng tin."},{"text":"\"Tháng trước, máy in tầng 3 hết giấy bốn lần. *(dừng)* Em đã đi xem những tờ bị bỏ lại trên khay.\"","correct":true,"feedback":"Chuẩn! Đúng sự thật, cụ thể, và khiến người nghe muốn biết trên khay có gì."}]},"practice":{"intro":"Viết lại câu mở cho bài trình bày 3 phút bạn sẽ dùng đến ngày 28.","steps":["Chọn một bài trình bày 3 phút bạn sắp nói, hoặc một đề bên dưới. Bạn sẽ dùng chính bài này suốt chặng 4 và trình bày trọn vẹn vào ngày 28.","Viết câu mở bạn *định* nói theo thói quen (thường là tên, chức danh, \"hôm nay em xin trình bày…\").","Viết 2 câu mở mới theo 2 kiểu khác nhau trong bảng. Soát lại: đúng sự thật chưa, có dẫn vào nội dung chính không.","Bấm đồng hồ 30 giây. Nói câu mở bạn thích nhất, dừng 2 giây, rồi mới giới thiệu tên trong một câu."],"topics":["Giới thiệu quy trình duyệt chi mới cho cả phòng","Đề xuất đổi giờ họp giao ban sang đầu giờ chiều","Hướng dẫn nhân viên mới cách trả lời tin nhắn khách trên Zalo"],"pickStory":false,"fields":[{"label":"Câu mở theo thói quen","placeholder":"Ví dụ: \"Em là…, hôm nay em xin trình bày về…\""},{"label":"Câu mở mới – kiểu thứ nhất","placeholder":"Ví dụ: một câu hỏi người nghe từng gặp"},{"label":"Câu mở mới – kiểu thứ hai","placeholder":"Ví dụ: \"Hãy hình dung…\""}],"saveAs":null,"widget":null,"timer":30,"record":true},"review":["Câu đầu tiên của mình không phải tên hay chức danh.","Điều bất ngờ mình nói là đúng sự thật và liên quan đến chủ đề.","Mình dừng được khoảng 2 giây sau câu mở."],"done":"Người nghe đã ngẩng lên rồi đó. Mai mình cho họ một lý do để nghe đến hết: một lời hứa và một tấm bản đồ.","videos":["PH-002","PH-003","PH-013"]},{"id":"d23A","day":23,"stage":4,"branch":"A","milestone":false,"title":"Chuyện trước, lời khuyên sau","hook":"Lời khuyên dễ bị gạt đi. Một câu chuyện thì người nghe tự rút ra.","cards":[{"type":"story","title":"Đốm kể","body":"Khoa mới vào nhóm bán hàng. 10 giờ tối, Khoa nhắn chị Ngọc: *\"Chị ơi, em nói gì khách cũng chê đắt, em chán quá.\"*\n\nLần trước gặp chuyện này, Ngọc trả lời: *\"Em phải nói về giá trị, đừng nói về giá.\"* Bạn kia nhắn \"Dạ\" rồi im.\n\nLần này Ngọc kể: *\"Năm đầu chị cũng vậy. Chị chỉ mong chốt được một đơn để khỏi bị nhắc tên trong họp. Chị tưởng giảm giá là xong. Hóa ra khách vẫn từ chối, vì họ chưa hiểu mua về để làm gì. Từ đó chị hỏi khách trước, báo giá sau.\"* Khoa nhắn lại: *\"Vậy mai em thử hỏi khách trước xem.\"*\n\nCùng một ý. Lần đầu là lời khuyên. Lần sau là một câu chuyện, và Khoa tự tìm ra việc mình cần làm."},{"type":"idea","title":"Ý chính","body":"Khi ai đó kể khó khăn, ta hay vội khuyên. Lời khuyên đi thẳng vào đầu, nên người nghe dễ nghĩ \"nói thì dễ\".\n\nCâu chuyện đi đường vòng. Người nghe đứng vào chỗ của bạn, thấy bạn cũng từng vấp. Đến lúc bạn nói điều mình học được, họ đã gật đầu từ trước.\n\nBa thứ làm câu chuyện có sức nặng: **mục tiêu nói rõ ngay đầu**, một khoảnh khắc **\"tưởng… hóa ra…\"**, và **một điều mình học được**, nói ở ngôi \"mình\" chứ không phải \"em nên\"."},{"type":"how","title":"Cách làm: 4 bước kể thay lời khuyên","body":"1. **Nghe hết đã.** Hỏi lại một câu cho rõ, như bạn đã tập ở ngày 17. Đừng kể khi người kia chưa nói xong.\n2. **Nói mục tiêu lúc đó.** Một câu: \"Hồi đó mình chỉ muốn…\". Người nghe có lý do để theo đến cuối.\n3. **Kể khoảnh khắc \"tưởng… hóa ra…\".** Mình tưởng cách này được, hóa ra không. Nhắc lại nguyên văn câu ai đó đã nói, nếu có.\n4. **Chốt bằng điều mình học được, rồi trao lại.** \"Từ đó mình…\" và hỏi: \"Còn em, chuyện của em giống hay khác?\"\n\nLưu ý: chuyện của bạn nên ngắn hơn phần người kia vừa kể. Đây là lúc của họ, không phải của bạn."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Khuyên thẳng","strongLabel":"Kể trước, khuyên sau","rows":[{"branch":null,"weak":"*(Bạn thân lo đi phỏng vấn)* \"Bình tĩnh đi, cứ tự tin lên là được.\"","strong":"\"Lần mình phỏng vấn chỗ cũ, mình chỉ mong đừng run. Mình tưởng học thuộc câu trả lời là chắc. Hóa ra câu đầu tiên họ hỏi, mình quên sạch. Từ đó mình chỉ nhớ 3 chuyện để kể, còn lại nói tự nhiên. Bạn chọn được chuyện nào chưa?\""},{"branch":null,"weak":"*(Đồng nghiệp ngại nhắc lỗi cấp dưới)* \"Em phải nói thẳng, ngại thì sao quản lý được.\"","strong":"\"Hồi mới làm trưởng nhóm, anh chỉ muốn ai cũng quý mình. Anh tưởng im lặng là tử tế. Hóa ra một bạn làm sai cả tháng rồi hỏi: 'Sao anh không nói em sớm?' Từ đó anh nhắc ngay trong ngày, nói riêng. Em đang ngại nhất ở chỗ nào?\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Kể lần mình từng vấp trước, rồi mới nói điều mình học được."}],"quiz":{"kind":"order","question":"Đồng nghiệp lo vì lần đầu phải trình bày trước khách. Sắp xếp lời đáp của bạn theo 4 bước:","items":["\"Hồi đầu chị chỉ mong nói hết slide mà không vấp.\"","\"Chị tưởng đọc kỹ slide là ổn. Hóa ra khách cắt ngang ngay slide 2 để hỏi giá.\"","\"Từ đó chị luôn chuẩn bị sẵn 3 câu khách hay hỏi nhất.\"","\"Em thử đoán xem khách mình sẽ hỏi gì đầu tiên?\""],"feedback":"Mục tiêu → tưởng… hóa ra… → điều mình học được → trao lại. Câu hỏi cuối giúp đồng nghiệp tự nghĩ, thay vì chỉ ngồi nghe khuyên."},"practice":{"intro":"Biến một chuyện trong kho thành lời khuyên không giảng giải.","steps":["Chọn một đề: một người quen đang gặp khó và hỏi ý bạn.","Mở Kho chuyện, chọn 1 chuyện bạn từng gặp điều tương tự. Chuyện có nhãn Bài học hoặc Thất bại thường hợp.","Điền 4 ô bên dưới, mỗi ô 1 câu.","Bấm đồng hồ 60 giây, nói như đang ngồi cà phê với người đó."],"topics":["Em đồng nghiệp mới bị khách mắng, hỏi bạn có nên xin chuyển bộ phận","Bạn thân sắp đi phỏng vấn, lo sẽ run","Đồng nghiệp ngại từ chối khi bị nhờ quá nhiều việc"],"pickStory":true,"fields":[{"label":"Hồi đó mình chỉ muốn…","placeholder":"Ví dụ: chốt được một đơn để khỏi bị nhắc tên"},{"label":"Mình tưởng… Hóa ra…","placeholder":"Ví dụ: Mình tưởng giảm giá là xong. Hóa ra khách vẫn từ chối."},{"label":"Từ đó mình…","placeholder":"Ví dụ: hỏi khách trước, báo giá sau"},{"label":"Câu hỏi trao lại","placeholder":"Ví dụ: Còn em, chuyện của em giống hay khác?"}],"saveAs":"storyNote","timer":60,"record":true},"review":["Mình nói rõ mục tiêu lúc đó ngay đầu chuyện.","Có một khoảnh khắc \"tưởng… hóa ra…\".","Mình chốt bằng điều mình học được, trao lại bằng câu hỏi, không nói \"em nên\"."],"done":"Bạn vừa khuyên mà không ai thấy bị khuyên. Mai mình luyện câu cuối, câu khiến người ta còn nhớ khi đã về nhà nhé!","videos":["PH-017","PH-024"]},{"id":"d23B","day":23,"stage":4,"branch":"B","milestone":false,"title":"Hứa một điều, báo trước đường đi","hook":"Người xem ở lại khi biết mình sẽ nhận được gì, và còn bao xa nữa.","cards":[{"type":"story","title":"Đốm kể","body":"Chị Hạnh làm bánh, quay video hướng dẫn làm bông lan trứng muối. Video đủ bước, quay đẹp. Nhưng người xem thường rời đi ở giữa, đúng đoạn đánh trứng.\n\nChị hỏi một khách quen. Khách nói thật: *\"Em xem mà không biết còn bao lâu mới tới đoạn nướng, nên em lướt.\"*\n\nVideo sau, chị Hạnh chỉ thêm hai câu ở đầu: *\"Xem hết video, bạn sẽ có một mẻ bông lan không bị xẹp. Mình đi qua ba chặng: đánh trứng, trộn bột, nướng.\"* Lần này, nhiều người xem đến tận cuối."},{"type":"idea","title":"Ý chính","body":"Ở ngày 16, bạn đã tập nói kết luận trước và báo trước \"có ba điều\". Hôm nay mình ghép hai thứ đó thành **lời hứa + lộ trình** cho cả video.\n\n**Lời hứa** trả lời câu \"mình được gì\". **Lộ trình** trả lời câu \"còn bao xa\". Người xem giống người đi đường: biết đích và biết có mấy chặng thì yên tâm đi tiếp.\n\nLời hứa nói từ phía người xem (\"bạn sẽ…\"). Nói kết quả họ nhận được, không nói việc bạn sẽ làm."},{"type":"how","title":"Cách làm: 3 câu đầu video","body":"1. **Lời hứa**: \"Sau [thời lượng] này, bạn sẽ [kết quả cụ thể].\" Nói kết quả, không kể tính năng.\n2. **Lộ trình**: \"Mình đi qua [số] bước: một…, hai…, ba…\" Tối đa 3 bước để người xem nhớ được.\n3. **Đánh dấu khi đi**: trong video, nhắc vị trí. \"Xong bước một. Giờ sang bước hai.\" Người xem luôn biết mình đang ở đâu.\n\nKiểm tra trước khi quay:\n\n- Lời hứa có thấy được kết quả không? \"Hiểu thêm về…\" còn mơ hồ. \"Làm được…\", \"chọn được…\" là rõ.\n- Video có đi đủ các bước đã báo không? Hứa ba bước mà chỉ có hai, người xem sẽ thấy hụt."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nói việc mình làm","strongLabel":"Hứa điều người xem nhận + lộ trình","rows":[{"branch":null,"weak":"\"Hôm nay mình giới thiệu phần mềm bán hàng bên mình, nó có rất nhiều tính năng hay.\"","strong":"\"5 phút nữa, bạn sẽ tự tạo được đơn hàng đầu tiên trên phần mềm. Mình đi qua 3 bước: thêm sản phẩm, thêm khách, tạo đơn.\""},{"branch":null,"weak":"(Họp online) \"Em xin trình bày một chút về tình hình kênh TikTok tháng này ạ.\"","strong":"(Họp online) \"Sau 3 phút, anh chị sẽ biết tháng sau nên dồn sức cho loại video nào. Em nói 2 ý: loại nào đang hiệu quả, và em đề xuất gì.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Hứa một điều, báo trước đường đi, rồi đi đúng đường đó."}],"quiz":{"kind":"order","question":"Sắp xếp phần mở video hướng dẫn chọn vali theo thứ tự: lời hứa – lộ trình – vào bước đầu.","items":["\"Hết video này, bạn sẽ chọn được chiếc vali hợp chuyến đi mà không phải đổi trả.\"","\"Mình xem 3 thứ: kích thước, bánh xe, khóa kéo.\"","\"Bắt đầu với kích thước. Trước hết, bạn xem quy định hành lý của hãng bay.\""],"feedback":"Lời hứa đi đầu để người xem biết mình được gì. Lộ trình theo sau để họ biết còn bao xa. Rồi mới vào bước một, kèm câu \"bắt đầu với…\" để đánh dấu vị trí."},"practice":{"intro":"Viết lời hứa và lộ trình cho một video 2 phút, rồi nói thử.","steps":["Chọn 1 video hoặc buổi livestream bạn sắp làm (có thể dùng lại đề hôm qua). Chưa có? Chọn 1 đề có sẵn.","Điền 3 ô: lời hứa, lộ trình, câu đánh dấu khi chuyển bước.","Đọc lại lời hứa. Nếu người xem hỏi \"vậy mình làm được gì?\", câu đó đã trả lời chưa?","Bấm đồng hồ 30 giây, nhìn vào camera điện thoại, nói lời hứa, lộ trình và câu vào bước một."],"topics":["Video hướng dẫn dùng một sản phẩm bạn bán","Video chia sẻ một mẹo trong nghề của bạn","Phần báo cáo của bạn trong cuộc họp online đầu tuần"],"pickStory":false,"fields":[{"label":"Lời hứa: Sau … này, bạn sẽ…","placeholder":"Ví dụ: Sau 2 phút này, bạn sẽ gói được hộp quà không cần băng dính"},{"label":"Lộ trình: Mình đi qua … bước","placeholder":"Ví dụ: gấp giấy – gài nắp – thắt nơ"},{"label":"Câu đánh dấu khi chuyển bước","placeholder":"Ví dụ: Xong phần gấp giấy. Giờ sang gài nắp."}],"saveAs":null,"widget":null,"timer":30,"record":true},"review":["Lời hứa của mình nói từ phía người xem, có kết quả cụ thể.","Mình báo trước số bước, không quá 3.","Mình nói xong lời hứa và lộ trình trong 30 giây."],"done":"Người xem giờ đã biết đích và đường đi. Mai mình rắc thêm \"gia vị\" để họ không lơ đãng giữa đường nhé!","videos":["PH-013","PH-022"]},{"id":"d23C","day":23,"stage":4,"branch":"C","milestone":false,"title":"Lời hứa đầu bài và \"có ba điều\"","hook":"Người nghe luôn ngầm hỏi \"mình được gì?\". Trả lời họ ngay phút đầu, rồi cho họ xem bản đồ.","cards":[{"type":"story","title":"Đốm kể","body":"Chị Hương, kế toán trưởng, được giao hướng dẫn cả công ty làm hồ sơ thanh toán. Lần đầu, chị mở: *\"Hôm nay chị sẽ nói về quy trình thanh toán.\"* Rồi chị đi qua mười mấy slide.\n\nĐến slide thứ tám, có người hỏi nhỏ: *\"Còn bao nhiêu slide nữa ạ?\"*\n\nLần sau, chị nói khác: *\"Sau 10 phút này, các em sẽ tự làm được một bộ hồ sơ đúng ngay lần đầu. Chị có ba điều. Một, giấy tờ cần có. Hai, ba lỗi hay gặp. Ba, nộp cho ai, lúc nào.\"*\n\nNội dung gần như cũ. Nhưng lần này cả phòng ghi chép. Ai cũng biết mình sắp được gì, và đang ở đoạn nào."},{"type":"idea","title":"Ý chính","body":"Ngồi nghe, ai cũng ngầm hỏi: *\"Mình được gì?\"*. **Lời hứa** trả lời câu đó. Nói từ phía người nghe, nói lợi ích họ nhận, không kể bạn sẽ nói những gì.\n\nNgay sau lời hứa là **lộ trình**: *\"Có ba điều.\"* Giống như cho xem ảnh cái tủ đã lắp xong trước khi đưa từng tấm gỗ. Người nghe biết bài dài bao nhiêu, đang ở đâu, nên yên tâm theo.\n\nLời hứa phải là điều bạn **trả được trong bài**. Hứa quá tay thì cuối buổi người nghe thấy mình bị lừa."},{"type":"how","title":"Cách làm: 2 câu ngay sau câu mở","body":"1. **Lời hứa – 1 câu.** Mẫu: *\"Sau [mấy phút] này, anh chị sẽ [làm được gì / tránh được gì].\"* Đổi \"em sẽ nói về…\" thành \"anh chị sẽ…\".\n2. **Lộ trình – báo trước số ý.** *\"Em có ba điều. Một… Hai… Ba…\"* Mỗi ý gọi tên trong vài chữ.\n3. **Đánh dấu khi chuyển ý.** *\"Điều thứ hai…\"*, *\"Và điều cuối cùng…\"*. Người nghe biết mình đã đi được bao xa.\n\nHai hoặc ba ý là vừa. Từ năm ý trở lên, người nghe không nhớ nổi; hãy gộp lại."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nói về nội dung","strongLabel":"Hứa lợi ích và báo lộ trình","rows":[{"branch":null,"weak":"\"Hôm nay em xin giới thiệu về phần mềm quản lý công việc mới.\"","strong":"\"Sau 5 phút này, anh chị sẽ giao việc mà không phải nhắc lại trên Zalo. Em có ba điều: tạo việc, gắn hạn, và xem ai đang chậm.\""},{"branch":null,"weak":"\"Em xin trình bày đề xuất đổi nhà cung cấp bao bì, gồm bối cảnh, phân tích, so sánh, rủi ro, chi phí, tiến độ và kiến nghị.\"","strong":"\"Cuối buổi này, anh chị sẽ đủ thông tin để chốt có đổi nhà cung cấp bao bì hay không. Em có hai điều: chất lượng và chi phí.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Hứa điều người nghe được, báo trước có mấy điều, rồi giữ đúng lời hứa."}],"quiz":{"kind":"choice","question":"Bạn hướng dẫn đồng nghiệp dùng mẫu báo cáo tuần mới. Lời hứa nào tốt nhất?","options":[{"text":"\"Hôm nay mình giới thiệu mẫu báo cáo tuần mới, gồm 6 mục.\"","correct":false,"feedback":"Câu này nói nội dung, chưa nói người nghe được gì. Thử đổi sang \"các bạn sẽ…\"."},{"text":"\"Sau 5 phút này, mỗi bạn sẽ viết xong báo cáo tuần nhanh hơn, không phải ngồi cả chiều thứ Sáu nữa.\"","correct":true,"feedback":"Đúng rồi! Nói từ phía người nghe, lợi ích rõ, và bạn trả được nếu mẫu mới thật sự gọn hơn."},{"text":"\"Sau buổi này, các bạn sẽ thành người viết báo cáo giỏi nhất công ty.\"","correct":false,"feedback":"Hứa quá tay. 5 phút không làm được điều đó, và người nghe biết vậy."}]},"practice":{"intro":"Viết lời hứa và lộ trình cho bài 3 phút của bạn.","steps":["Lấy bài trình bày đã chọn hôm qua (hoặc chọn một đề bên dưới).","Viết 1 câu lời hứa bắt đầu bằng *\"Sau 3 phút này, anh chị sẽ…\"*. Đọc lại: mình có trả được trong bài không?","Viết lộ trình: 3 ý, mỗi ý không quá 5 chữ.","Bấm đồng hồ 45 giây. Nói câu mở hôm qua, rồi lời hứa, rồi *\"Em có ba điều…\"*."],"topics":["Giới thiệu quy trình duyệt chi mới cho cả phòng","Đề xuất đổi giờ họp giao ban sang đầu giờ chiều","Hướng dẫn nhân viên mới cách trả lời tin nhắn khách trên Zalo"],"pickStory":false,"fields":[{"label":"Lời hứa","placeholder":"Sau 3 phút này, anh chị sẽ…"},{"label":"Điều thứ nhất","placeholder":"Tối đa 5 chữ"},{"label":"Điều thứ hai","placeholder":"Tối đa 5 chữ"},{"label":"Điều thứ ba","placeholder":"Tối đa 5 chữ"}],"saveAs":null,"widget":null,"timer":45,"record":true},"review":["Lời hứa của mình nói từ phía người nghe (\"anh chị sẽ…\").","Mình báo trước số ý và gọi tên từng ý thật ngắn.","Mình trả được lời hứa này trong 3 phút."],"done":"Bài của bạn đã có lối vào và bản đồ. Mai mình thêm một câu chuyện để người nghe nhớ lâu hơn.","videos":["PH-013","PH-005"]},{"id":"d24A","day":24,"stage":4,"branch":"A","milestone":false,"title":"Câu chốt để lại ấn tượng","hook":"Người nghe quên gần hết câu chuyện. Họ mang về câu cuối.","cards":[{"type":"story","title":"Đốm kể","body":"Tiệc chia tay anh Tâm chuyển công tác, mỗi người nói vài lời. Dũng kể chuyện anh Tâm thức đến 2 giờ sáng sửa hồ sơ thầu cùng mình. Chuyện hay, cả phòng chăm chú.\n\nRồi Dũng kết: *\"…Vâng, đại khái là vậy. Chúc anh mọi điều tốt đẹp.\"* Tiếng vỗ tay thưa thớt.\n\nChị Trang kể chuyện khác, ngắn hơn. Chị kết: *\"Anh Tâm không dạy em làm hồ sơ. Anh dạy em không bỏ về khi đồng đội chưa xong.\"* Chị dừng lại. Cả phòng im một giây, rồi vỗ tay.\n\nHai chuyện đều thật. Chỉ có một câu cuối được nhắc lại suốt tối hôm đó."},{"type":"idea","title":"Ý chính","body":"Câu chuyện giống một bữa cơm, câu chốt là món tráng miệng: đến sau cùng nên nhớ lâu nhất. Kết bằng \"đại khái là vậy\" thì như dọn bàn khi khách còn đang ăn.\n\nCâu chốt tốt chỉ có **một câu, một điều thật**. Nó gói điều câu chuyện muốn nói, bằng chữ của chính bạn.\n\nNói xong câu chốt thì **dừng**. Đừng giải thích thêm, đừng \"vâng, thế thôi\". Khoảng lặng giúp câu đó thấm."},{"type":"how","title":"Cách làm: 3 kiểu câu chốt dễ dùng","body":"| Kiểu | Mẫu câu | Ví dụ |\n| --- | --- | --- |\n| 1. Đối lập | \"Không phải… mà là…\" | \"Cái giữ khách ở lại không phải giá rẻ, mà là một cuộc gọi hỏi thăm.\" |\n| 2. Tưởng – hóa ra | \"Mình tưởng… hóa ra…\" | \"Mình tưởng tiết kiệm được 5 phút. Hóa ra mất cả buổi chiều làm lại.\" |\n| 3. Lặp đầu câu | Lặp một cụm ở 2–3 vế ngắn | \"Hôm đó mình học cách chờ. Học cách hỏi. Học cách nói 'em chưa biết'.\" |\n\nCách thử: đọc to câu chốt. Phải lấy hơi giữa chừng là câu đang quá dài, cắt bớt.\n\nTránh khẩu hiệu chung chung kiểu \"hãy luôn cố gắng\". Câu chốt phải mọc ra từ chính câu chuyện của bạn."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Kết nhạt","strongLabel":"Câu chốt","rows":[{"branch":null,"weak":"*(Kể với bạn bè về tháng đi làm đầu tiên)* \"…Nói chung cũng vất vả, nhưng giờ ổn rồi. Thế đấy.\"","strong":"\"…Tháng lương đầu, mình không mua gì cho mình. Mình mua cho mẹ cái nồi cơm mới. *(dừng)* Hóa ra lớn lên là lúc mình nghĩ đến người khác trước.\""},{"branch":null,"weak":"*(Giới thiệu đồng nghiệp với khách)* \"…Nên em rất tin bạn Hà. Bạn ấy làm việc tốt lắm ạ.\"","strong":"\"…Hôm đó Hà gọi lại cho khách lúc 9 giờ tối chỉ để xác nhận một con số. *(dừng)* Hà không làm cho xong. Hà làm cho chắc.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Một câu, một điều thật, rồi dừng."}],"quiz":{"kind":"choice","question":"Bạn kể chuyện lần đầu đi gặp khách một mình. Câu chốt nào tốt nhất?","options":[{"text":"\"Vâng, chuyện của mình chỉ có vậy thôi ạ.\"","correct":false,"feedback":"Câu này báo hết chuyện, nhưng không để lại gì. Người nghe sẽ quên ngay."},{"text":"\"Mình tưởng khách cần một người nói giỏi. Hóa ra khách cần một người chịu nghe.\"","correct":true,"feedback":"Chuẩn! Kiểu tưởng – hóa ra, một câu, một điều thật, mọc ra từ chính câu chuyện."},{"text":"\"Vì vậy mọi người hãy luôn tự tin và cố gắng hết mình nhé!\"","correct":false,"feedback":"Đây là khẩu hiệu, ai cũng nói được. Câu chốt hay phải gắn với chuyện của riêng bạn."}]},"practice":{"intro":"Viết và nói câu chốt cho một chuyện trong kho.","steps":["Mở Kho chuyện, chọn 1 chuyện đã có Điều rút ra (từ khung 4 ô ở ngày 11).","Viết câu chốt theo cả 3 kiểu bên dưới. Chưa hay cũng được.","Đọc to từng câu, chọn câu bạn nói tự nhiên nhất.","Bấm đồng hồ 60 giây: kể nhanh khoảnh khắc chính, kết bằng câu chốt đã chọn, rồi **dừng 2 giây** trước khi tắt ghi âm."],"pickStory":true,"fields":[{"label":"Đối lập: Không phải… mà là…","placeholder":"Ví dụ: Cái giữ khách không phải giá rẻ, mà là một cuộc gọi hỏi thăm."},{"label":"Tưởng – hóa ra: Mình tưởng… Hóa ra…","placeholder":"Ví dụ: Mình tưởng khách cần người nói giỏi. Hóa ra khách cần người chịu nghe."},{"label":"Lặp đầu câu: …, …, …","placeholder":"Ví dụ: Học cách chờ. Học cách hỏi. Học cách nói 'em chưa biết'."}],"saveAs":"storyNote","timer":60,"record":true},"review":["Câu chốt của mình chỉ một câu, đọc không phải lấy hơi.","Câu chốt mọc ra từ chính câu chuyện, không phải khẩu hiệu chung.","Nói xong câu chốt, mình dừng lại, không thêm \"vâng, thế thôi\"."],"done":"Câu chuyện của bạn giờ đã có một cái kết đáng nhớ. Mai mình tập một việc khó hơn: kể lần mình vấp, sao cho vừa thật vừa tử tế.","videos":["PH-007","PH-025"]},{"id":"d24B","day":24,"stage":4,"branch":"B","milestone":false,"title":"Mỗi 60 giây một \"gia vị\"","hook":"Câu mở hay chỉ giữ người xem được một phút. Những phút sau cần thứ khác.","cards":[{"type":"story","title":"Đốm kể","body":"Quân dạy mẹo Excel trên mạng. Video nào của Quân cũng mở rất tốt. Nhưng xem thống kê, Quân thấy người xem rời đi nhiều nhất quanh phút thứ hai.\n\nQuân xem lại video của mình. Từ phút thứ hai, Quân nói một giọng đều đều: bấm chuột, giải thích, bấm chuột, giải thích. Đúng nội dung, nhưng đoán trước được.\n\nVideo tiếp theo, giữa chừng Quân dừng lại hỏi: *\"Bạn đoán xem, bấm tổ hợp phím này thì bảng sẽ ra sao?\"* Rồi mới bấm. Bình luận có người viết: \"Đoán sai rồi, hay ghê!\""},{"type":"idea","title":"Ý chính","body":"Người xem ít khi rời đi vì bạn nói sai. Họ rời đi khi **đoán trước được** câu tiếp theo.\n\nCách chữa là cứ khoảng 60 giây, thêm một \"gia vị\": một điều nhỏ khiến người xem chú ý lại. Không cần màu mè, chỉ cần nhịp đổi đi một chút.\n\nCâu mở kéo người xem vào. Gia vị giữ họ ở lại từng phút một."},{"type":"how","title":"Cách làm: 6 gia vị dễ dùng trước camera","body":"| Gia vị | Ví dụ |\n| --- | --- |\n| 1. Báo trước điều hay | \"Lát nữa có một mẹo mình ước biết sớm hơn. Nhưng trước hết…\" (và phải trả đúng mẹo đó) |\n| 2. Hỏi người xem | \"Nhà bạn hay để chìa khóa ở đâu? Ghi vào bình luận nhé.\" |\n| 3. Một khoảnh khắc 15 giây | \"Lần đầu mình làm cách này, khách gọi lại hỏi: 'Em đổi công thức à?'\" |\n| 4. Một phép so sánh | \"Lọc dữ liệu giống nhặt rau: bỏ lá úa trước, rồi mới rửa.\" |\n| 5. Cho xem tận mắt | Đưa sản phẩm sát camera, làm mẫu, đặt trước và sau cạnh nhau |\n| 6. Đổi nhịp | Dừng 2 giây, nói chậm lại, hoặc đổi góc quay |\n\nTrước khi quay, lập **bản đồ gia vị**: mỗi phút ghi 1 gia vị sẽ dùng. Không cần đủ 6, chọn 2–3 cái hợp với mình."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Đều đều từ đầu đến cuối","strongLabel":"Có gia vị giữa chừng","rows":[{"branch":null,"weak":"(Livestream) \"Sản phẩm thứ ba là bình giữ nhiệt, có ba màu, dung tích vừa, giá…\" (nói liền như đọc danh sách)","strong":"(Livestream) \"Giờ mình làm một thử nghiệm nhỏ. Mình rót nước nóng vào bình từ đầu buổi live. Cả nhà đoán xem giờ còn nóng không?\" (mở nắp trước camera)"},{"branch":null,"weak":"(Video hướng dẫn) \"Bước bốn, bạn chọn ô này. Bước năm, bạn chọn ô kia. Bước sáu…\"","strong":"(Video hướng dẫn) \"Bước bốn là chỗ nhiều người hay làm sai, trong đó có mình hồi đầu. Bạn để ý tay mình nhé.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Câu mở kéo người xem vào. Mỗi phút một gia vị giữ họ ở lại."}],"quiz":{"kind":"choice","question":"Bạn livestream giới thiệu bộ nồi và đã nói đều đều 1 phút về chất liệu. Làm gì tiếp là hợp nhất?","options":[{"text":"Nói nhanh hơn để kịp giới thiệu hết thông số.","correct":false,"feedback":"Nói nhanh hơn vẫn là cùng một nhịp. Người xem không thấy gì mới để chú ý lại."},{"text":"Đổ ít nước vào nồi, đặt lên bếp, hỏi: \"Cả nhà đoán bao lâu thì sôi?\"","correct":true,"feedback":"Chuẩn! Vừa cho xem tận mắt, vừa hỏi người xem. Họ có lý do để ở lại xem kết quả."},{"text":"Nói \"Sắp có điều cực sốc!\", rồi tiếp tục nói về chất liệu.","correct":false,"feedback":"Báo trước điều hay chỉ là gia vị khi bạn trả đúng điều đó. Hứa suông thì người xem sẽ thấy hụt."}]},"practice":{"intro":"Lập bản đồ gia vị cho một video 3 phút và nói thử 1 phút có gia vị.","steps":["Chọn 1 video bạn sắp quay. Có thể dùng video bạn đã viết lời hứa hôm qua.","Chia video thành 3 phút. Mỗi phút điền 1 gia vị lấy từ bảng 6 gia vị.","Chọn phút bạn thấy dễ nhàm nhất. Bấm đồng hồ 60 giây, nói đoạn đó trước camera, có dùng gia vị đã chọn.","Nghe lại với vai người xem: đến chỗ gia vị, bạn có chú ý lại không?"],"topics":["Livestream giới thiệu 3 sản phẩm","Video hướng dẫn một việc có 4–5 bước","Phần chia sẻ kinh nghiệm của bạn trong cuộc họp online"],"pickStory":false,"fields":[{"label":"Phút 1: nói gì, gia vị gì?","placeholder":"Ví dụ: lời hứa + lộ trình, gia vị: hỏi người xem"},{"label":"Phút 2: nói gì, gia vị gì?","placeholder":"Ví dụ: bước một và hai, gia vị: một khoảnh khắc 15 giây"},{"label":"Phút 3: nói gì, gia vị gì?","placeholder":"Ví dụ: bước ba và kết, gia vị: cho xem trước và sau"}],"saveAs":null,"widget":null,"timer":60,"record":true},"review":["Mỗi phút trong bản đồ của mình có 1 gia vị.","Trong 60 giây mình nói, có ít nhất 1 chỗ đổi nhịp rõ ràng.","Nếu mình báo trước điều hay, mình đã trả đúng điều đó."],"done":"Video của bạn giờ có nhịp lên xuống rồi. Mai mình học cách hạ cánh cho êm và đọng lại nhé!","videos":["PH-043"]},{"id":"d24C","day":24,"stage":4,"branch":"C","milestone":false,"title":"Câu chuyện mở đầu hoặc minh họa","hook":"Người nghe quên gạch đầu dòng sau một tuần. Một chuyện ngắn đặt đúng chỗ thì họ còn kể lại cho người khác.","cards":[{"type":"story","title":"Đốm kể","body":"Anh Quân phụ trách đào tạo bán hàng. Slide của anh rất đủ: năm bước chăm sóc khách, mỗi bước ba gạch đầu dòng. Học viên gật đầu, rồi quên.\n\nMột lần, anh bỏ slide đầu và kể: *\"Chiều thứ Bảy, một chị khách đứng ở quầy, cầm hộp quà đã gói. Chị nói: 'Em gói lại giúp chị, chị cần tặng mẹ chồng.' Bạn nhân viên mới liếc đồng hồ, nghĩ: 'Còn năm phút nữa là hết ca.'\"*\n\nCả lớp im, chờ xem bạn ấy làm gì. Kể xong, anh Quân nói: *\"Đó là bước thứ ba. Hôm nay mình học vì sao nó quan trọng.\"*\n\nMột tháng sau, học viên vẫn nhắc \"chuyện hộp quà\". Không ai nhắc gạch đầu dòng nào."},{"type":"idea","title":"Ý chính","body":"Trong thuyết trình, câu chuyện không phải để giải trí. Nó là **bằng chứng có hình ảnh** cho một ý bạn muốn người nghe nhớ.\n\nCó hai chỗ đặt chuyện. **Mở đầu**, để kéo người nghe vào chủ đề. Hoặc **minh họa**, ngay sau một ý khô, để ý đó có mặt người. Bài 3 phút chỉ cần một chuyện, dài 30–45 giây.\n\nBạn đã có kho chuyện và đã biết zoom vào khoảnh khắc. Hôm nay chỉ thêm một việc: **nối chuyện vào ý chính**."},{"type":"how","title":"Cách làm: chuyện 45 giây cho bài trình bày","body":"1. **Vào thẳng hành động.** Câu đầu có nơi chốn và việc đang làm. Bỏ câu \"để em kể một chuyện\".\n2. **Nói rõ mục tiêu:** *\"Lúc đó mình chỉ muốn…\"*. Người nghe có lý do để theo đến cuối.\n3. **Hé lộ dự đoán:** *\"Mình nghĩ: chắc khách sẽ…\"*. Người nghe tò mò xem có đúng không.\n4. **Một câu lời thoại thật**, thay cho câu tóm tắt.\n5. **Câu nối:** *\"Đó là lý do…\"* hoặc *\"Chuyện này chính là điều thứ hai của em.\"* Một điều rút ra, một câu.\n\nBước 5 là bước hay bị quên nhất. Thiếu nó, người nghe phải tự đoán chuyện liên quan gì đến bài."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Ý khô","strongLabel":"Ý có chuyện minh họa","rows":[{"branch":null,"weak":"\"Kiểm tra lại địa chỉ giao hàng là rất quan trọng, mọi người chú ý giúp em.\"","strong":"\"Tuần trước, shipper gọi em: 'Chị ơi, số nhà này trong ngõ không có.' Em mở đơn ra: khách ghi thiếu tên ngách. Đó là lý do bước gọi xác nhận không được bỏ.\""},{"branch":null,"weak":"\"Khách hàng rất coi trọng việc phản hồi nhanh.\"","strong":"\"Chín giờ tối, một chị khách nhắn Zalo hỏi giá. Em trả lời luôn, nghĩ chắc chị chỉ hỏi cho biết. Sáng hôm sau chị chốt đơn, kèm câu: 'Chị chọn bên em vì em trả lời ngay.'\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Ý chính để người nghe hiểu. Câu chuyện để người nghe nhớ."}],"quiz":{"kind":"choice","question":"Trong bài đào tạo chăm sóc khách, bạn vừa kể chuyện chị khách nhắn lúc 9 giờ tối. Câu tiếp theo nên là gì?","options":[{"text":"\"Vâng, đó là chuyện của em. Giờ mình sang slide tiếp nhé.\"","correct":false,"feedback":"Chuyện bị treo lơ lửng. Người nghe phải tự đoán nó liên quan gì đến bài."},{"text":"\"Đó là lý do quy tắc đầu tiên của mình là: trả lời khách thật nhanh, kể cả khi chưa có đáp án đầy đủ.\"","correct":true,"feedback":"Chuẩn! Một câu nối, một điều rút ra. Chuyện vừa thành bằng chứng cho ý chính."},{"text":"\"Chuyện còn dài lắm, để em kể tiếp phần sau đó nữa.\"","correct":false,"feedback":"Bài 3 phút không có chỗ cho chuyện dài. Ra sớm, nối vào ý chính, rồi đi tiếp."}]},"practice":{"intro":"Chọn một chuyện trong kho và nối nó vào bài 3 phút của bạn.","steps":["Mở Kho chuyện, chọn 1 chuyện hợp với chủ đề bài (để mở đầu) hoặc hợp với một trong ba điều (để minh họa).","Quyết định đặt chuyện ở đâu: mở đầu, hay ngay sau điều thứ mấy.","Điền 4 ô bên dưới, mỗi ô một câu.","Bấm đồng hồ 45 giây. Kể chuyện từ câu hành động, và kết bằng câu nối vào ý chính."],"pickStory":true,"fields":[{"label":"Đặt chuyện ở đâu?","placeholder":"Ví dụ: mở đầu / minh họa cho điều thứ hai"},{"label":"Câu đầu: nơi chốn và hành động","placeholder":"Ví dụ: \"Chiều thứ Bảy, mình đang đứng ở quầy…\""},{"label":"Lúc đó mình muốn gì, nghĩ gì?","placeholder":"Ví dụ: \"Mình chỉ mong khách đừng hỏi thêm…\""},{"label":"Câu nối vào ý chính","placeholder":"Ví dụ: \"Đó là lý do…\""}],"saveAs":"storyNote","widget":null,"timer":45,"record":true},"review":["Chuyện của mình bắt đầu bằng hành động, không có câu \"để em kể\".","Có ít nhất 1 câu lời thoại hoặc suy nghĩ thật.","Mình kết bằng một câu nối rõ ràng vào ý chính."],"done":"Bài của bạn giờ có một chuyện để người nghe mang về. Mai mình giữ cho họ tỉnh táo ở phần giữa nhé.","videos":["PH-017","PH-004"]},{"id":"d25A","day":25,"stage":4,"branch":"A","milestone":false,"title":"Kể thất bại một cách tử tế","hook":"Kể lần mình vấp khiến người nghe thấy gần bạn hơn, nếu kể đúng liều.","cards":[{"type":"story","title":"Đốm kể","body":"Buổi đầu tuần, chị trưởng phòng mới mời mỗi người giới thiệu về mình. Ai cũng kể thành tích: dự án lớn, giải thưởng, khách lớn. Không khí lịch sự, nhưng hơi xa cách.\n\nĐến lượt anh Phong. Anh kể: *\"Tháng đầu đi làm, anh gửi email báo giá cho cả danh sách khách mà quên ẩn địa chỉ, ai cũng thấy email của nhau. Chị trưởng phòng hồi đó gọi anh vào, chỉ hỏi: 'Giờ em định làm gì?' Tối đó anh viết thư xin lỗi từng khách.\"* Anh cười: *\"Từ đó anh kiểm tra ô người nhận hai lần.\"*\n\nGiờ nghỉ, ba bạn mới đến bàn anh Phong bắt chuyện. Không ai đến hỏi về giải thưởng."},{"type":"idea","title":"Ý chính","body":"Chuyện chỉ có thành công thường nghe như khoe. Không có vấp ngã thì không có câu chuyện, chỉ có bảng thành tích.\n\nKể một lần mình vấp cho thấy bạn thật, và đủ vững để nhìn lại. Người nghe thấy mình trong đó nên mở lòng hơn.\n\nNhưng người Việt có câu \"đừng vạch áo cho người xem lưng\". Kể thất bại cần **liều lượng**: đủ thật để chạm, đủ nhẹ để người nghe không phải lúng túng thay bạn."},{"type":"how","title":"Cách làm: 4 điều giữ chuyện vấp ngã tử tế","body":"| Điều | Nghĩa là | Nên tránh |\n| --- | --- | --- |\n| 1. Kể vết sẹo, không kể vết thương | Chuyện đã qua, bạn kể mà vẫn mỉm cười được | Chuyện còn đau, còn đang xử lý |\n| 2. Nhận phần của mình | Kể lỗi của mình, không đổ cho ai | Chuyện mà người nghe đoán ra ai là \"người có lỗi\" |\n| 3. Hợp người, hợp chỗ | Chuyện công việc cho chỗ làm, chuyện riêng cho người thân | Chuyện gia đình, tiền bạc ở chỗ đông người |\n| 4. Qua đáy nhanh, ở lại với điều thay đổi | 1–2 câu cho lúc khó nhất, phần còn lại cho điều mình làm khác đi | Kể lể dài để được thương |\n\nCâu tự kiểm tra: **\"Kể xong, người nghe có phải an ủi mình không?\"** Nếu có, chuyện đang quá nặng với dịp này."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Quá ít hoặc quá nhiều","strongLabel":"Đúng liều","rows":[{"branch":null,"weak":"*(Làm quen nhóm mới – quá ít, nghe như khoe khéo)* \"Điểm yếu của em là hơi cầu toàn, việc gì cũng muốn hoàn hảo.\"","strong":"\"Dự án đầu tiên em ôm hết việc vì ngại nhờ. Đến hôm nộp còn thiếu hai phần, em phải nhắn chị trưởng nhóm lúc 11 giờ đêm. Từ đó tuần nào em cũng hỏi: 'Việc này có ai làm cùng được không?'\""},{"branch":null,"weak":"*(Liên hoan với đồng nghiệp mới – quá nhiều, lại đổ lỗi)* \"Năm ngoái mình bị cho nghỉ việc. Sếp cũ thì không ra gì, công ty thì tệ, mình bực mấy tháng trời…\"","strong":"\"Năm ngoái có lúc mình phải tìm việc mới. Buổi phỏng vấn thứ năm, anh tuyển dụng hỏi: 'Em giỏi nhất việc gì?' Mình ngồi im khá lâu. Tối đó mình viết ra những việc mình từng làm tốt. Lần sau mình trả lời được ngay.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Kể vết sẹo, không kể vết thương."}],"quiz":{"kind":"choice","question":"Bạn muốn kể một lần vấp khi làm quen nhóm mới. Chuyện nào hợp nhất?","options":[{"text":"Lần bạn nộp báo cáo trễ vì đồng nghiệp cũ giao số liệu sai.","correct":false,"feedback":"Chuyện này dễ thành đổ lỗi. Người nghe sẽ nhớ đồng nghiệp cũ, không nhớ bạn."},{"text":"Lần bạn quên tên khách ngay sau khi vừa được giới thiệu, và cách bạn xử lý.","correct":true,"feedback":"Đúng rồi! Chuyện nhẹ, lỗi của mình, đã qua và có điều rút ra. Vừa liều cho dịp làm quen."},{"text":"Giai đoạn gia đình bạn gặp khó khăn về tiền bạc.","correct":false,"feedback":"Chuyện riêng và còn nặng. Để dành cho người thân, không hợp chỗ đông người mới quen."}]},"practice":{"intro":"Chọn một lần vấp và kể nó ở mức vừa đủ.","steps":["Mở Kho chuyện, chọn 1 chuyện có nhãn Thất bại hoặc ô \"Tệ nhất\" ở ngày 4. Chỉ chọn chuyện bạn đã mỉm cười được khi nhớ lại.","Điền 3 ô bên dưới.","Hỏi mình: \"Kể xong, người nghe có phải an ủi mình không?\" Nếu có, đổi sang chuyện nhẹ hơn.","Bấm đồng hồ 60 giây, kể như đang ngồi cùng nhóm mới quen."],"pickStory":true,"fields":[{"label":"Khoảnh khắc khó nhất (1–2 câu)","placeholder":"Ví dụ: Chị trưởng phòng gọi mình vào, chỉ hỏi: 'Giờ em định làm gì?'"},{"label":"Phần lỗi của mình là…","placeholder":"Ví dụ: mình gửi vội, không kiểm tra ô người nhận"},{"label":"Từ đó mình làm khác đi là…","placeholder":"Ví dụ: kiểm tra người nhận hai lần trước khi bấm gửi"}],"saveAs":"storyNote","timer":60,"record":true},"review":["Mình chọn chuyện đã qua, kể mà vẫn mỉm cười được.","Mình nhận phần của mình, không nhắc ai là người có lỗi.","Phần lớn thời gian dành cho điều mình làm khác đi, không kể lể."],"done":"Kể được lần mình vấp mà vẫn nhẹ nhàng, bạn vừa làm một việc nhiều người né mãi. Mai Đốm chỉ bạn cách quay về đúng cảnh đó trước khi kể.","videos":["PH-032"]},{"id":"d25B","day":25,"stage":4,"branch":"B","milestone":false,"title":"Kết video: Tóm lại – Hành động – Câu chốt","hook":"Người xem mang về phần kết. Đừng để video tắt lịm bằng \"vậy thôi nha\".","cards":[{"type":"story","title":"Đốm kể","body":"Linh làm chăm sóc khách hàng cho một shop đồ gia dụng. Mỗi tuần Linh quay một video giải đáp thắc mắc. Phần giữa video rõ ràng, dễ hiểu.\n\nNhưng video nào cũng kết giống nhau: *\"Ừm… vậy thôi á. Có gì mọi người cứ nhắn shop nha. Bye bye.\"* Rồi Linh cười gượng, với tay tắt máy.\n\nMột khách nhắn: *\"Video hay mà kết hụt hẫng quá chị.\"* Linh nhận ra: mình chuẩn bị kỹ phần đầu và phần giữa, nhưng chưa bao giờ chuẩn bị câu cuối."},{"type":"idea","title":"Ý chính","body":"Một video giống một chuyến bay. Cất cánh tốt, bay êm, nhưng hạ cánh xóc thì người ta nhớ cú xóc.\n\nPhần kết là thứ người xem mang về. Nó cần được **chuẩn bị trước**, không phải nghĩ ra lúc đang quay.\n\nKhung **RAP (Tóm lại – Hành động – Câu chốt)** giúp bạn hạ cánh lần nào cũng gọn, rõ và đọng lại."},{"type":"how","title":"Cách làm: khung RAP trong 20 giây","body":"| Phần | Làm thế nào | Ví dụ |\n| --- | --- | --- |\n| R – Tóm lại | 1–3 ý chính, không thêm thông tin mới | \"Nhớ ba điều: ngâm nước ấm, dùng bàn chải mềm, phơi khô hẳn.\" |\n| A – Hành động | Một việc nhỏ người xem làm được ngay hôm nay | \"Tối nay, thử ngâm chiếc thớt nhà bạn mười phút trước khi rửa.\" |\n| P – Câu chốt | Một câu ngắn chứa trái tim của video. Nói xong, nhìn camera, im 2–3 giây | \"Đồ dùng bền không nhờ đắt tiền, mà nhờ được chăm đúng cách.\" |\n\nSau khoảng lặng mới cảm ơn, chào, hay nhắc theo dõi kênh. Lời cảm ơn đi sau, không thay cho câu chốt.\n\nMẹo: viết câu chốt **trước khi quay** và đọc to vài lần. Đây là câu duy nhất trong video nên thuộc lòng."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Kết lịm dần","strongLabel":"Kết theo RAP","rows":[{"branch":null,"weak":"(Livestream) \"Thôi chắc vậy thôi, ai cần gì cứ nhắn shop nha, mình off đây, bye cả nhà.\"","strong":"(Livestream) \"Tối nay mình đã cho cả nhà xem ba cách giữ hoa ly lâu tàn. Mua hoa lần tới, cắt chéo cuống ngay khi về nhé. Hoa tươi lâu nhờ người biết chăm, không nhờ hoa đắt.\" (dừng) \"Cảm ơn cả nhà.\""},{"branch":null,"weak":"(Họp online) \"Dạ em trình bày xong rồi ạ… Chắc vậy thôi ạ.\"","strong":"(Họp online) \"Tóm lại: video ngắn đang kéo khách tốt hơn ảnh. Tuần này em xin làm thử 3 video. Mình thử nhỏ trước, để kết quả trả lời.\" (dừng) \"Em cảm ơn anh chị.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Kết video như hạ cánh: tóm lại, giao một việc, chốt một câu, rồi im."}],"quiz":{"kind":"order","question":"Sắp xếp phần kết video hướng dẫn tiết kiệm điện theo khung RAP.","items":["\"Nhớ hai điều: rút sạc khi không dùng, và tắt hẳn tivi thay vì để chờ.\"","\"Tối nay, đi một vòng nhà và rút hết những cục sạc đang cắm không.\"","\"Hóa đơn điện nhỏ lại nhờ những thói quen nhỏ.\""],"feedback":"Tóm lại trước để người xem nhớ ý chính. Rồi giao một việc làm được ngay tối nay. Cuối cùng là câu chốt: nói xong thì im 2–3 giây rồi mới chào."},"practice":{"intro":"Viết và nói phần kết 20 giây theo RAP cho một video của bạn.","steps":["Chọn video bạn đã làm ở ngày 23–24, hoặc chọn 1 đề có sẵn.","Điền 3 ô R – A – P. Hành động phải làm được ngay trong hôm nay.","Đọc to câu chốt 3 lần cho thuộc.","Bấm đồng hồ 30 giây, nói phần kết trước camera. Sau câu chốt, nhìn camera, im 2–3 giây, rồi mới chào."],"topics":["Kết buổi livestream bán hàng","Kết video chia sẻ một mẹo trong nghề","Kết phần trình bày của bạn trong cuộc họp online"],"pickStory":false,"fields":[{"label":"R – Tóm lại (1–3 ý)","placeholder":"Ví dụ: Nhớ ba điều: …"},{"label":"A – Một việc làm được ngay hôm nay","placeholder":"Ví dụ: Tối nay, thử…"},{"label":"P – Câu chốt","placeholder":"Một câu ngắn chứa trái tim của video"}],"saveAs":null,"widget":null,"timer":30,"record":true},"review":["Phần tóm lại của mình không quá 3 ý, không có thông tin mới.","Hành động mình giao nhỏ và làm được ngay hôm nay.","Mình im 2–3 giây sau câu chốt rồi mới chào."],"done":"Video của bạn giờ đã có đầu, có giữa, có kết. Mai Đốm chỉ bạn cách vào trạng thái trước khi bấm quay, để kể như đang sống lại chuyện đó.","videos":["PH-034"]},{"id":"d25C","day":25,"stage":4,"branch":"C","milestone":false,"title":"Gia vị và khoảng lặng","hook":"Mở bài hay chỉ giữ người nghe một phút. Phần giữa cần một \"gia vị\" mỗi phút và vài khoảng lặng đúng chỗ.","cards":[{"type":"story","title":"Đốm kể","body":"Duy trình bày kế hoạch bán hàng Tết cho cả phòng. Mở bài tốt, cả phòng chú ý. Sang phút thứ hai, Duy đọc liền tám chỉ tiêu, giọng đều đều. Anh phó phòng bắt đầu lướt điện thoại.\n\nHôm tập lại, chị trưởng phòng góp ý: *\"Em nói không sai. Nhưng nghe như đọc danh sách, chị không có chỗ nào để thở.\"*\n\nLần sau, Duy chỉ thêm hai thứ. Trước chỉ tiêu quan trọng nhất, Duy nói: *\"Lát nữa em sẽ chỉ ra con số làm cả kế hoạch đổi hướng.\"* Khi nói đến con số đó, Duy dừng hẳn hai giây.\n\nAnh phó phòng đặt điện thoại xuống."},{"type":"idea","title":"Ý chính","body":"Người nghe không bỏ đi vì nội dung dở. Họ bỏ đi vì **đoán trước được**: giọng đều, nhịp đều, slide nào cũng giống slide nào.\n\n**Gia vị** là một điều nhỏ, hơi bất ngờ, đặt khoảng mỗi phút một lần để kéo người nghe quay lại. **Khoảng lặng** là lúc bạn im 2–3 giây, cho ý quan trọng kịp thấm.\n\nHai thứ này không cần năng khiếu. Chỉ cần đánh dấu sẵn trên dàn ý trước khi nói."},{"type":"how","title":"Cách làm: 4 gia vị và 3 chỗ dừng","body":"**Gia vị – mỗi phút chọn một:**\n\n- **Báo trước điều hay:** *\"Lát nữa em sẽ chỉ ra…\"*\n- **Hỏi người nghe:** *\"Anh chị đoán xem…?\"*, rồi dừng cho họ đoán.\n- **Ví dụ hoặc chuyện ngắn:** một tin nhắn khách, một câu lời thoại thật.\n- **So sánh đời thường:** *\"Quy trình này giống lấy số thứ tự ở ngân hàng.\"*\n\n**Chỗ dừng 2–3 giây:**\n\n- Ngay **trước** ý quan trọng nhất.\n- Ngay **sau** một con số hoặc một câu hỏi.\n- Khi **chuyển ý**: *\"Điều thứ hai. (dừng)\"*\n\nBạn sẽ thấy 2 giây dài như cả phút. Người nghe thì không thấy vậy."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Nói đều một mạch","strongLabel":"Có gia vị và khoảng lặng","rows":[{"branch":null,"weak":"\"Quý này mình có ba thay đổi, thứ nhất là đổi mẫu hợp đồng, thứ hai là thêm bước duyệt, thứ ba là đổi người ký, mọi người lưu ý giúp em.\"","strong":"\"Quý này có ba thay đổi. *(dừng)* Hai cái đầu rất nhỏ. Cái thứ ba thì chạm đến từng hợp đồng anh chị đang làm. Em nói nó trước nhé.\""},{"branch":null,"weak":"\"Số khách quay lại tháng này tăng, em nghĩ là nhờ mình gọi hỏi thăm sau khi giao hàng.\"","strong":"\"Anh chị đoán xem, điều gì làm khách quay lại nhiều nhất tháng này? *(dừng)* Không phải khuyến mãi. Là một cuộc gọi hỏi thăm ngắn sau khi giao hàng.\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Mỗi phút một gia vị, mỗi ý quan trọng một khoảng lặng."}],"quiz":{"kind":"choice","question":"Bạn cần báo: số đơn giao trễ tháng này giảm một nửa. Cách nói nào để con số thấm nhất?","options":[{"text":"Nói liền một hơi thật nhanh, để thể hiện mình tự tin.","correct":false,"feedback":"Nói nhanh thì con số trôi qua trước khi người nghe kịp hiểu nó lớn cỡ nào."},{"text":"\"Một nửa. *(dừng)* Tháng này, số đơn giao trễ giảm một nửa. *(dừng)*\"","correct":true,"feedback":"Đúng rồi! Con số, dừng, câu đầy đủ, dừng. Người nghe có hai nhịp để tiếp nhận."},{"text":"\"Tháng này mình… *(dừng, nhìn lại slide)* …à, giảm được một nửa số đơn trễ.\"","correct":false,"feedback":"Dừng vì tìm chữ khác hẳn dừng có chủ đích. Khoảng lặng đẹp nằm sau ý quan trọng, không nằm giữa câu."}]},"practice":{"intro":"Đánh dấu gia vị và chỗ dừng cho phần giữa bài 3 phút.","steps":["Nhìn lại ba điều của bài (đã viết ở ngày 23).","Với mỗi điều, chọn 1 gia vị và viết nguyên câu bạn sẽ nói.","Chọn câu quan trọng nhất cả bài. Đánh dấu chỗ dừng bằng dấu \"/\".","Bấm đồng hồ 60 giây. Nói điều bạn thấy khô nhất, có gia vị và ít nhất 2 lần dừng thật sự."],"topics":["Giới thiệu quy trình duyệt chi mới cho cả phòng","Đề xuất đổi giờ họp giao ban sang đầu giờ chiều","Hướng dẫn nhân viên mới cách trả lời tin nhắn khách trên Zalo"],"pickStory":false,"fields":[{"label":"Gia vị cho điều thứ nhất","placeholder":"Ví dụ: \"Anh chị đoán xem…?\""},{"label":"Gia vị cho điều thứ hai","placeholder":"Ví dụ: \"Lát nữa em sẽ chỉ ra…\""},{"label":"Gia vị cho điều thứ ba","placeholder":"Ví dụ: một so sánh đời thường"},{"label":"Câu quan trọng nhất, có dấu /","placeholder":"Ví dụ: \"Một nửa. / Tháng này số đơn trễ giảm một nửa. /\""}],"saveAs":null,"widget":null,"timer":60,"record":true},"review":["Mình có ít nhất 1 gia vị trong 60 giây.","Mình dừng thật sự 2 giây trước hoặc sau ý quan trọng.","Lúc dừng, mình im hẳn, không chèn \"ờ\", \"à\"."],"done":"Phần giữa bài của bạn hết đều đều rồi. Mai mình học cách hạ cánh cho thật chắc.","videos":["PH-043","PH-022"]},{"id":"d26A","day":26,"stage":4,"branch":"A","milestone":false,"title":"Sống lại cảnh khi kể","hook":"Muốn người nghe cảm, bạn phải cảm trước. Đừng học thuộc lời, hãy quay lại cảnh.","cards":[{"type":"story","title":"Đốm kể","body":"Vy chuẩn bị kể chuyện lần đầu nhận lương ở buổi họp lớp. Vy viết ra, học thuộc từng câu. Lúc kể, Vy nói trôi chảy, giọng đều đều như đọc. Bạn bè nghe lịch sự.\n\nTối về, Vy kể lại cho em gái, không nhìn giấy. Vy nhắm mắt nhớ: cây ATM đầu ngõ, tờ biên lai in ra, Vy đứng đọc con số ba lần. *\"Chị cứ sợ máy in nhầm.\"* Em gái bật cười: *\"Rồi chị mua gì?\"*\n\nLần đầu, Vy nhớ lời. Lần sau, Vy nhớ cảnh. Giọng Vy tự đổi theo."},{"type":"idea","title":"Ý chính","body":"Kể lại giống như cho người khác xem một tấm ảnh. Sống lại thì giống như dắt họ đến tận nơi.\n\nKhi học thuộc, bạn bận nhớ chữ: giọng đều, mắt nhìn lên trần tìm câu tiếp theo. Khi sống lại cảnh, bạn thấy nó trong đầu. Giọng, nhịp, nét mặt tự đổi theo cảm xúc thật, không cần diễn.\n\nBạn đã biết Nơi chốn – Hành động – Lời thoại – Suy nghĩ ở ngày 8–9. Hôm nay dùng chúng theo chiều ngược lại: không để viết, mà để **nhớ lại** ngay trước khi nói."},{"type":"how","title":"Cách làm: 1 phút sống lại cảnh","body":"1. **Nhắm mắt, quay về đúng một khoảnh khắc.** Không phải cả chuyện, chỉ vài giây quan trọng nhất.\n2. **Thấy gì?** Bạn đang ở đâu, trước mặt có gì, đang cầm gì.\n3. **Nghe gì?** Ai nói câu gì, nguyên văn. Xung quanh có tiếng gì.\n4. **Nghĩ gì?** Câu trong đầu lúc đó, chưa làm đẹp.\n5. **Mở mắt và kể ngay**, khi cảnh còn nóng. Chỉ cần nhớ câu chốt, còn lại kể theo những gì bạn đang thấy.\n\nChuyện vui thì nụ cười tự đến. Chuyện căng thì giọng tự chậm lại. Đừng cố tạo, cứ để nó đến."},{"type":"compare","title":"Yếu và mạnh","weakLabel":"Học thuộc lời","strongLabel":"Sống lại cảnh","rows":[{"branch":null,"weak":"*(Kể bạn bè nghe lần đầu lái ô tô)* \"Lần đầu mình lái ô tô ra đường, mình rất hồi hộp, nhưng cuối cùng cũng về nhà an toàn.\"","strong":"\"Đèn vàng ở ngã tư. Xe máy kín hai bên. Tay mình bám chặt vô lăng, trong đầu chỉ có một câu: 'Đừng chết máy, đừng chết máy.'\""},{"branch":null,"weak":"*(Kể đồng nghiệp nghe buổi gặp khách khó)* \"Hôm đó khách rất khó tính, mình cố gắng giải thích và cuối cùng khách cũng đồng ý.\"","strong":"\"Khách đặt tập hồ sơ xuống bàn, đẩy về phía mình: 'Em đọc lại trang 3 đi.' Mình lật ra, thấy ngay chỗ sai. Mình nghĩ: 'Sao hôm qua mình không thấy nhỉ.'\""}]},{"type":"takeaway","title":"Mang theo 1 câu","body":"Đừng nhớ lời, hãy quay lại cảnh. Lời sẽ tự đến."}],"quiz":{"kind":"choice","question":"Trước khi kể một chuyện ở buổi họp lớp, cách chuẩn bị nào giúp bạn kể có hồn hơn?","options":[{"text":"Viết ra từng câu và học thuộc đến khi đọc trôi chảy.","correct":false,"feedback":"Học thuộc giúp đỡ quên chữ, nhưng giọng dễ thành đọc bài. Người nghe nhận ra ngay."},{"text":"Nhắm mắt 1 phút, nhớ lại mình thấy gì, nghe gì, nghĩ gì, rồi kể.","correct":true,"feedback":"Đúng rồi! Thấy lại cảnh thì giọng và nét mặt tự đổi theo, không cần diễn."}]},"practice":{"intro":"Sống lại một khoảnh khắc trong 1 phút, rồi kể khi cảnh còn nóng.","steps":["Mở Kho chuyện, chọn 1 chuyện bạn đã kể vài lần, tốt nhất là chuyện bạn thấy mình kể còn \"đều đều\".","Nhắm mắt khoảng 1 phút, quay về đúng khoảnh khắc quan trọng nhất.","Mở mắt, ghi nhanh 3 ô bên dưới, mỗi ô vài chữ.","Bấm đồng hồ 90 giây, kể ngay, không nhìn ghi chú. Nghe lại: giọng có chỗ nào tự đổi không?"],"pickStory":true,"fields":[{"label":"Mình thấy gì?","placeholder":"Ví dụ: cây ATM đầu ngõ, tờ biên lai trong tay"},{"label":"Mình nghe gì? Ai nói câu gì?","placeholder":"Ví dụ: tiếng máy in rè rè, bác bảo vệ hỏi: 'Rút được chưa cháu?'"},{"label":"Mình nghĩ gì trong đầu?","placeholder":"Ví dụ: \"Chắc máy in nhầm…\""}],"saveAs":"storyNote","timer":90,"record":true},"review":["Mình kể mà không nhìn giấy, không đọc thuộc.","Có ít nhất 1 chi tiết mình thấy hoặc nghe mà lần trước chưa kể.","Giọng mình có chỗ chậm lại, nhanh lên hoặc bật cười theo cảnh."],"done":"Bạn vừa dắt người nghe đến tận nơi rồi đó. Mai mình nghe lại chính mình bằng tai của người nghe, và chỉ sửa một điểm thôi.","videos":["PH-042","PH-046"]},{"id":"d26B","day":26,"stage":4,"branch":"B","milestone":false,"title":"Khởi động và sống lại cảnh","hook":"Học thuộc lời thì nói như đọc. Sống lại cảnh thì lời tự đến.","cards":[{"type":"story","title"
