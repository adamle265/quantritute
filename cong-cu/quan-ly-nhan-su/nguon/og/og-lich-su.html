<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Ảnh chia sẻ trang Lịch sử phiên bản /quan-ly-nhan-su/ (1200×630): dòng thời gian các bản – đọc ?d=<JSON [[bản, module, ngày, 'xong'|'dang']]> */
*{box-sizing:border-box;margin:0}
/* 08/11/2026 anh: đổi sang màu nền thương hiệu (giấy #F4EFE5, chữ #231E19 / #6A6157, xanh rêu #3E6B34, cam Đốm #F2A93B) – đồng bộ ảnh bản og.html */
body{width:1200px;height:630px;overflow:hidden;font-family:Lexend,sans-serif;color:#231E19;background:radial-gradient(120% 140% at 0% 0%,#F7F1E6 0%,#F1E9DC 55%,#ECE2D2 100%);position:relative}
.k{position:absolute;left:64px;top:56px;font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.06em;color:#3E6B34;text-transform:uppercase}
h1{position:absolute;left:62px;top:96px;font-size:58px;line-height:1.12;font-weight:700;color:#231E19;letter-spacing:-.01em}
p.s{position:absolute;left:64px;top:240px;width:760px;font-size:22px;line-height:1.5;color:#6A6157}
.dom{position:absolute;right:56px;top:46px;width:170px}
.tl{position:absolute;left:64px;right:64px;top:350px;display:flex;align-items:flex-start}
.st{flex:1;position:relative;padding-top:46px}
.st::before{content:"";position:absolute;left:0;right:0;top:15px;height:4px;background:#D8CCB8}
.st:first-child::before{left:16px}.st:last-child::before{right:auto;width:16px}
.dot{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:#3E6B34;border:4px solid #F4EFE5;box-shadow:0 0 0 2px #3E6B34;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.st.dang .dot{background:#F4EFE5;border:4px dashed #F2A93B;box-shadow:none;color:#F2A93B}
.v{font-size:28px;font-weight:700;color:#231E19}.m{font-size:21px;color:#4A433B;margin-top:2px}.d{font-family:"IBM Plex Mono",monospace;font-size:16px;color:#8A7F72;margin-top:4px}
.st.dang .v{color:#C77A12}.st.dang .m{color:#6A6157}
.u{position:absolute;left:64px;bottom:36px;font-size:24px;color:#4A433B}
.u b{color:#231E19}
</style></head><body>
<div class="k">Quản trị tử tế · Hành trình xây công cụ</div>
<h1>Phần mềm nhân sự<br>qua từng phiên bản</h1>
<p class="s">Mỗi phiên bản một link dùng thử, bản sau không ghi đè bản trước. Miễn phí cho đơn vị dưới 20 người.</p>
<img class="dom" src="/assets/dom/dom-01-chao-sang.webp" alt="">
<div class="tl" id="tl"></div>
<div class="u"><b>quantritute.com</b>/quan-ly-nhan-su</div>
<script>
var D = JSON.parse(new URLSearchParams(location.search).get('d') || '[]');
document.getElementById('tl').innerHTML = D.map(function (x) { return '<div class="st ' + x[3] + '"><span class="dot">' + (x[3] === 'xong' ? '✓' : '') + '</span><div class="v">Bản ' + x[0] + '</div><div class="m">' + x[1] + '</div><div class="d">' + x[2] + '</div></div>'; }).join('');
</script>
</body></html>
