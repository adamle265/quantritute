<style>
:root{
  --bg:#F4EFE5;--surface:#FBF8F2;--surface-2:#F7F2E8;--surface-3:#EFE7D8;
  --border:#E3DACB;--border-strong:#D3C7B4;
  --text:#231E19;--text-muted:#6B6259;--text-faint:#988D80;
  --accent:#2F5F8F;--accent-strong:#234A70;--accent-soft:#E2ECF5;
  --ok:#2F7D4F;--ok-soft:#E3F1E8;--warn:#9A5A16;--warn-soft:#FCE2B6;--danger:#A63A2B;--danger-soft:#F8E3DE;
  --amb:#D9822B;
  --shadow:0 1px 2px rgba(35,30,25,.06),0 10px 28px -14px rgba(35,30,25,.25);
  --font:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;--f-wall:"Lexend","Be Vietnam Pro","Segoe UI",sans-serif;--accent-2:#3F78AE;--warn-c:#B06A22;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210;--surface:#1D1A17;--surface-2:#191613;--surface-3:#26221D;--border:#332D27;--border-strong:#463E35;
  --text:#F2ECE2;--text-muted:#B5AA9C;--text-faint:#8A8074;--accent:#7FB0E0;--accent-strong:#A3C8EE;--accent-soft:#1E2B38;
  --ok:#7CC79A;--ok-soft:#1C2E23;--warn:#E8A65C;--warn-soft:#3A2A17;--danger:#EE9A8C;--danger-soft:#3A1F1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210;--surface:#1D1A17;--surface-2:#191613;--surface-3:#26221D;--border:#332D27;--border-strong:#463E35;
  --text:#F2ECE2;--text-muted:#B5AA9C;--text-faint:#8A8074;--accent:#7FB0E0;--accent-strong:#A3C8EE;--accent-soft:#1E2B38;
  --ok:#7CC79A;--ok-soft:#1C2E23;--warn:#E8A65C;--warn-soft:#3A2A17;--danger:#EE9A8C;--danger-soft:#3A1F1A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
#home,#app{flex:1;width:100%}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.ip-top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.ip-wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.ip-top .ip-wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.ip-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:240px}
.ip-brand img{width:40px;height:40px}
.ip-brand b{display:block;font-size:16px;line-height:1.25}
.ip-brand small{color:var(--text-muted);font-size:12.5px}
.ip-tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0e1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0e1620}}
.btn.pri:hover{filter:brightness(.93);background:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
main.ip-wrap{padding-block:22px 90px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.ip-stat .opt{min-width:0;overflow-wrap:anywhere}
.ip-hero{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:16px 18px}
.ip-hero p{margin:0;color:var(--text)}
.ip-hero b{color:var(--accent-strong)}
.ip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ip-card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px}
.ip-card h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;flex:none}
:root[data-theme="dark"] .ip-card h2 .n{color:#0e1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ip-card h2 .n{color:#0e1620}}
.ip-card .sub{margin:0 0 14px 36px;color:var(--text-muted);font-size:13px}
.ip-card.off{opacity:.55;pointer-events:none}
.ip-drop{border:2px dashed var(--border-strong);border-radius:12px;padding:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface-2);transition:.15s}
.ip-drop.over{border-color:var(--amb);background:var(--warn-soft)}
.ip-drop .t{flex:1;min-width:220px}
.ip-drop .t b{display:block;font-size:15px}
.ip-drop .t span{color:var(--text-muted);font-size:13px}
.ip-drop .acts{display:flex;gap:8px;flex-wrap:wrap}
.ip-stat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
.ip-stat .pill{background:var(--surface-3);border-radius:999px;padding:3px 12px}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-top:14px}
.ip-f label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:4px;font-weight:600}
.ip-f select,.ip-f input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);padding:0 10px}
.ip-f select:focus,.ip-f input:focus{outline:2px solid var(--accent);outline-offset:1px}
.req{color:var(--danger)}
.ip-tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:12px;max-height:560px}
table.ip-t{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.ip-t th{position:sticky;top:0;background:var(--surface-3);text-align:center;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border-strong);white-space:nowrap;z-index:1}
.ip-t td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.ip-t td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.ip-t td.mono{font-family:var(--mono);white-space:nowrap}
.ip-t td.fn{max-width:330px;word-break:break-all}
.ip-t tr.r-ok td:first-child{box-shadow:inset 3px 0 var(--ok)}
.ip-t tr.r-so td:first-child{box-shadow:inset 3px 0 var(--amb)}
.ip-t tr.r-miss td:first-child{box-shadow:inset 3px 0 var(--danger)}
.ip-t select{max-width:280px;height:30px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-size:12.5px}
.lnk{background:none;border:0;padding:0;color:var(--accent-strong);cursor:pointer;text-align:left;font:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.so{background:var(--warn-soft);color:var(--warn)}
.tag.miss{background:var(--danger-soft);color:var(--danger)}
.tag.mute{background:var(--surface-3);color:var(--text-muted)}
.ip-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.tile{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface-2);cursor:pointer;text-align:left}
.tile:hover{border-color:var(--border-strong)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tile b{display:block;font-size:22px;font-family:var(--mono);line-height:1.2}
.tile span{font-size:12.5px;color:var(--text-muted)}
.tile.k-ok b{color:var(--ok)}.tile.k-so b{color:var(--warn)}.tile.k-miss b,.tile.k-err b{color:var(--danger)}
.ip-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-muted);margin:12px 0 0}
.ip-note svg{flex:none;margin-top:2px}
.ip-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ip-row .sp{flex:1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.chk small{display:block;color:var(--text-muted);font-size:12.5px}
.alt-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--text);font-size:13px}
.alt-l svg{color:var(--warn);flex:none}
.shl{margin-top:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:10px 12px}
.shl-h{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:8px}
.shl-h .opt{font-size:12.5px}
.shl ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;max-height:260px;overflow:auto}
.shl li{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:10px;padding:4px 6px 4px 10px;background:var(--surface)}
.shl li.off{opacity:.6}.shl li.cur{border-color:var(--accent)}
.shl li .chk{flex:1;align-items:center;min-width:0}.shl li .opt{font-size:12px;white-space:nowrap}
.shl .mv{width:26px;height:26px;padding:0;border-radius:8px}
.nm-wrap{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1.2fr);gap:16px 22px;margin-top:10px}
.nm-wrap>*{min-width:0}
@media (max-width:760px){.nm-wrap{grid-template-columns:1fr}.nm-acts .btn{flex:1 1 auto}}
.nm-parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.nm-parts li{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:6px 8px 6px 10px;background:var(--surface-2)}
.nm-parts li.off{opacity:.62}
.nm-parts li,.shl li{cursor:grab;user-select:none;-webkit-user-select:none;position:relative}
.shl li .grip{flex:none;display:grid;place-items:center;width:14px;height:24px;color:var(--text-faint);cursor:grab;touch-action:none}
.shl li.dragging{cursor:grabbing;opacity:1;z-index:5;box-shadow:var(--shadow);border-color:var(--accent)}
.shl li.ins-before::before,.shl li.ins-after::after{content:"";position:absolute;top:4px;bottom:4px;width:3px;border-radius:3px;background:var(--accent)}
.shl li.ins-before::before{left:-5px}.shl li.ins-after::after{right:-5px}
.nm-parts li .grip{flex:none;display:grid;place-items:center;width:18px;height:28px;color:var(--text-faint);cursor:grab;touch-action:none}
.nm-parts li.dragging{cursor:grabbing;opacity:1;z-index:5;box-shadow:var(--shadow);background:var(--surface);border-color:var(--accent)}
.nm-parts li.ins-before::before,.nm-parts li.ins-after::after{content:"";position:absolute;left:6px;right:6px;height:3px;border-radius:3px;background:var(--accent)}
.nm-parts li.ins-before::before{top:-5px}.nm-parts li.ins-after::after{bottom:-5px}
body.nm-dragging,body.nm-dragging *{cursor:grabbing!important}
.nm-parts li .chk{flex:1;align-items:center}
.nm-parts li .chk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.nm-parts li input[type=text]{width:84px}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ymd=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
function num(v){
  if(v==null||v==='')return 0; if(typeof v==='number')return v;
  let s=String(v).trim().replace(/[₫\s]/g,'');
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); else s=s.replace(/,/g,'');
  const n=Number(s); return isFinite(n)?n:0;
}
function toDate(v){
  if(v==null||v==='')return null; const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))) return ymd(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return ymd(+m[3],+m[2],+m[1]);
  if(/^\d+(\.\d+)?$/.test(s)){const n=+s; if(n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);return ymd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}}
  return null;
}
const hhmm=v=>{const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?pad(m[1])+':'+m[2]:'';};

const colNum=s=>{let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n;};

const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return ymd(x.getFullYear(),x.getMonth()+1,x.getDate());};

/* ---------- Đọc ZIP / XLSX (không dùng thư viện ngoài) ---------- */
async function inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
async function openZip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf), td=new TextDecoder('utf-8');
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0) throw new Error('File không phải định dạng .xlsx hợp lệ');
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true);
  const map={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    map[name.toLowerCase()]={name,method,csize,off};
    p+=46+nl+el+cl;
  }
  return {
    names:Object.values(map).map(e=>e.name),
    async text(path){
      const e=map[path.toLowerCase()]; if(!e)return null;
      const lnl=dv.getUint16(e.off+26,true), lel=dv.getUint16(e.off+28,true);
      const start=e.off+30+lnl+lel, data=u8.subarray(start,start+e.csize);
      return td.decode(e.method===0?data:await inflateRaw(data));
    }
  };
}
const XML=s=>new DOMParser().parseFromString(s,'application/xml');
const els=(n,t)=>Array.from(n.getElementsByTagNameNS('*',t));
const kids=(n,t)=>Array.from(n.children).filter(e=>e.localName===t);
const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
function resolvePath(p){const out=[];for(const s of p.split('/')){if(s==='..')out.pop();else if(s&&s!=='.')out.push(s);}return out.join('/');}
/* Đọc từng ô thực tế: bỏ qua khai báo <dimension> (file sàn hay khai sai), không phụ thuộc cấu trúc <row> */
function parseSheetXml(xml,ss){
  const doc=XML(xml);
  const grid=[]; let maxR=0,maxC=0,cells=0,hiddenRows=0,precision=0,lastRow=0;
  const dimEl=els(doc,'dimension')[0]; const declared=dimEl?dimEl.getAttribute('ref'):'';
  for(const row of els(doc,'row')){
    const ra=parseInt(row.getAttribute('r'),10); const rIdx=isNaN(ra)?lastRow+1:ra; lastRow=rIdx;
    if(row.getAttribute('hidden')==='1'||row.getAttribute('hidden')==='true')hiddenRows++;
    let pos=0;
    for(const c of kids(row,'c')){
      const ref=c.getAttribute('r'); let col,r=rIdx;
      const m=ref&&ref.match(/^([A-Z]+)(\d+)$/);
      if(m){col=colNum(m[1]);r=+m[2];}else col=pos+1;
      pos=col;
      const t=c.getAttribute('t'); let v=null;
      if(t==='inlineStr'){v=els(c,'t').map(x=>x.textContent).join('');}
      else{const ve=kids(c,'v')[0]; if(ve){v=ve.textContent; if(t==='s')v=ss[+v]; else if(t==='b')v=v==='1'?'TRUE':'FALSE'; else if(!t||t==='n'){ if(/^\d(\.\d+)?E\+\d+$/i.test(v))precision++; }}}
      if(v==null||v==='')continue;
      (grid[r]||(grid[r]=[]))[col]=v; cells++;
      if(r>maxR)maxR=r; if(col>maxC)maxC=col;
    }
  }
  return {grid,maxR,maxC,cells,declared,actual:maxR?('A1:'+colName(maxC)+maxR):'',hiddenRows,precision};
}
function parseCsv(txt){
  const grid=[];let r=1,c=1,cur='',q=false,maxR=0,maxC=0,cells=0;
  const push=()=>{if(cur!==''){(grid[r]||(grid[r]=[]))[c]=cur;cells++;if(r>maxR)maxR=r;if(c>maxC)maxC=c;}cur='';};
  txt=txt.replace(/^﻿/,'');
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true; else if(ch===','){push();c++;} else if(ch==='\n'){push();r++;c=1;} else if(ch!=='\r')cur+=ch;}
  push();

async function readWorkbook(file){

  if(low.endsWith('.xls'))throw new Error('Định dạng .xls cũ chưa hỗ trợ. Mở file bằng Excel và lưu lại dạng .xlsx.');
  const z=await openZip(await file.arrayBuffer());
  const wbXml=await z.text('xl/workbook.xml'); if(!wbXml)throw new Error('Không tìm thấy nội dung bảng tính trong file');

}

const SCHEMAS=[
  {type:'order',label:'Đơn hàng (OrderSKUList)',req:['order id','order status','sku id','quantity','created time']},
  {type:'income',label:'Income – Chi tiết đơn hàng',req:['id đơn hàng/điều chỉnh','tổng số tiền quyết toán','tổng doanh thu','tổng phí']},

  {type:'cost',label:'Giá vốn',req:['sku id'],any:['giá vốn'],not:['order status']},

function detectTable(sh){
  const lim=Math.min(sh.maxR,60);
  for(let r=1;r<=lim;r++){
    const row=sh.grid[r]; if(!row)continue;
    const hdr={}; row.forEach((v,c)=>{if(v!=null){const k=norm(v); if(k&&!(k in hdr))hdr[k]=c;}});
    const keys=Object.keys(hdr);
    for(const sc of SCHEMAS){
      if(!sc.req.every(k=>k in hdr))continue;
      if(sc.any&&!keys.some(k=>sc.any.some(a=>k.includes(a))))continue;
      if(sc.not&&sc.not.some(k=>k in hdr))continue;
      return {...sc,headerRow:r,hdr};
    }
  }
  return null;
}
function detectReport(sh){
  const kv={};
  for(let r=1;r<=sh.maxR;r++){const row=sh.grid[r]; if(!row)continue; const vals=row.filter(v=>v!=null&&v!==''); if(vals.length>=2)kv[norm(vals[0])]=vals[vals.length-1];}
  return ('tổng số tiền quyết toán' in kv&&'khoảng thời gian' in kv)?kv:null;
}
function records(sh,t){
  const out=[]; const cols=Object.entries(t.hdr);
  for(let r=t.headerRow+1;r<=sh.maxR;r++){
    const row=sh.grid[r]; if(!row)continue; const o={_r:r}; let any=false;
    for(const [k,c] of cols){const v=row[c]; if(v!=null&&v!==''){o[k]=v;any=true;}}
    if(any)out.push(o);
  }
  return out;
}

        }else if(t.type==='cost'){
          const hk=Object.keys(t.hdr); const costK=hk.find(k=>k.includes('giá vốn')); const nameK=hk.find(k=>k.includes('rút gọn'));

function classify(o){
  const st=norm(o.status), ct=norm(o.ctype);
  if(/return|refund|trả hàng|hoàn tiền/.test(ct))return 'return';
  if(/hủy|huỷ|cancel/.test(st))return 'cancel';
  if(/chờ thanh toán|unpaid|awaiting payment/.test(st))return 'unpaid';
  if(/chờ|awaiting|to ship|đang xử lý/.test(st)&&!o.delivered)return 'pending';
  return 'success';
}

// cost[sku] = {cost:number|null, name:'', parts:[{sku,q}]|null}
function unitsOf(vari){
  const s=norm(vari); let m=s.match(/(?:combo|bộ|set)\s*(\d+)/)||s.match(/(\d+)\s*(quyển|cuốn|hộp|chai|lọ|cái|gói|túi|bộ|set|sp|sản phẩm|hũ|tuýp|đôi|cặp)/);
  return m?Math.max(1,+m[1]):1;
}
function costOf(C,sku,depth){
  const c=C[sku]; if(!c)return null; depth=depth||0;
  if(c.parts&&c.parts.length&&depth<4){let s=0;for(const p of c.parts){const v=costOf(C,p.sku,depth+1);if(v==null)return null;s+=v*p.q;}return s;}
  return c.cost!=null&&c.cost!==''?+c.cost:null;
}
function collectSkus(orders){
  const m=new Map();
  for(const o of orders.values())for(const l of o.skus){
    let s=m.get(l.sku); if(!s){s={sku:l.sku,ssku:l.ssku,name:l.name,vari:l.vari,units:new Set(),qtyOk:0,qtyAll:0,orders:0};m.set(l.sku,s);}
    if(l.unit)s.units.add(l.unit); s.qtyAll+=l.qty; if(o.cls==='success'){s.qtyOk+=l.qty;s.orders++;} if(l.ssku)s.ssku=l.ssku; if(!s.vari&&l.vari)s.vari=l.vari;
  }
  const list=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'vi')||unitsOf(a.vari)-unitsOf(b.vari)||b.qtyOk-a.qtyOk);
  list.forEach(s=>{s.n=unitsOf(s.vari);s.price=[...s.units][0]||0;});
  return list;
}
/* Gợi ý giá vốn cho SKU nhiều đơn vị (Combo 2 quyển…) từ SKU 1 đơn vị cùng tên sản phẩm */
function costHints(skus,C){
  const H={};
  for(const s of skus){
    if(s.n<2)continue;
    const base=skus.find(b=>b.name===s.name&&b.n===1&&costOf(C,b.sku)!=null); if(!base)continue;
    const c1=costOf(C,base.sku), want=c1*s.n, cur=costOf(C,s.sku);
    if(cur==null)H[s.sku]={type:'miss',want,base:base.sku,n:s.n,c1};
    else if(cur<want*0.8)H[s.sku]={type:'low',want,base:base.sku,n:s.n,c1};
  }
  return H;
}

/* ---------- Lợi nhuận ---------- */
function buildProfit(D,C,pname){
  const L=[];
  for(const x of D.R){
    if(!x.o)continue; const o=x.o;
    if(o.cls==='success'){
      const est=!x.g; const feeO=est?D.rate*o.rev:-x.g.fee;
      for(const l of o.skus){
        const share=o.rev?l.rev/o.rev:1/o.skus.length; const c=costOf(C,l.sku); const cogs=c==null?null:l.qty*c;
        const fee=feeO*share, profit=l.rev-(cogs||0)-fee;
        L.push({id:o.id,date:o.created,month:o.created?o.created.slice(0,7):'',sku:l.sku,name:pname(l),qty:l.qty,rev:l.rev,cogs,fee,profit,pct:l.rev?profit/l.rev:null,est,noCost:c==null,kind:'sale'});
      }
    }else if(x.g&&Math.abs(x.settle)>=0.5){
      // đơn hủy/trả hàng có tiền quyết toán (thường âm: phí giao thất bại, phí trả hàng)
      L.push({id:o.id,date:o.created,month:o.created?o.created.slice(0,7):'',sku:'',name:'Phí đơn hủy/trả hàng',qty:0,rev:0,cogs:0,fee:-x.settle,profit:x.settle,pct:null,est:false,noCost:false,kind:'fail'});
    }
  }
  return L;
}
function aggProfit(L,key){
  const m=new Map();
  for(const l of L){const k=key==='sku'&&l.kind==='fail'?'(phí đơn hủy/trả)':(l[key]||'');let a=m.get(k);if(!a){a={key:k,ids:new Set(),sku:l.sku,name:l.name,qty:0,rev:0,cogs:0,fee:0,profit:0,estIds:new Set(),noCost:0,fail:0};m.set(k,a);}
    if(l.kind==='sale')a.ids.add(l.id);a.qty+=l.qty;a.rev+=l.rev;a.cogs+=l.cogs||0;a.fee+=l.fee;a.profit+=l.profit;if(l.est)a.estIds.add(l.id);if(l.noCost)a.noCost++;if(l.kind==='fail')a.fail+=l.fee;}
  return [...m.values()].map(a=>({...a,n:a.ids.size,estN:a.estIds.size,pct:a.rev?a.profit/a.rev:null}));
}

function walletDays(D,opening){
  const days=new Map();

  for(const w of D.wallet){if(!w.date||!okSt(w))continue;const a=g(w.date);if(isEarn(w))a.earn+=w.amount;else if(isWd(w))a.wd+=w.amount;else a.other+=w.amount;a.list.push(w);}
  Object.keys(D.S_D).forEach(d=>g(d));

  let bal=opening||0; arr.forEach(a=>{a.open=bal;bal+=a.earn+a.wd+a.other;a.close=bal;});
  return arr;
}

/* ô ngày dd / mm / yyyy: dấu / có sẵn; đủ ngày tự nhảy sang tháng, đủ tháng sang năm; bấm/nháy đúp chọn cả phần; Backspace ở ô trống lùi về ô trước; dán 01/07/2026 tự tách */
function bindDateBox(box,onDone){
  if(!box)return; const P=[...box.querySelectorAll('input')];
  const selAll=el=>{try{el.setSelectionRange(0,el.value.length);}catch(e){}};
  const go=i=>{if(P[i]){P[i].focus();selAll(P[i]);}};
  const fire=()=>{const v=dboxVal(box);if(v!==null)onDone(v);};
  P.forEach((el,i)=>{
    const len=i===2?4:2;
    el.addEventListener('focus',()=>selAll(el));
    el.addEventListener('mouseup',e=>{e.preventDefault();selAll(el);});
    el.addEventListener('dblclick',()=>selAll(el));
    el.addEventListener('input',()=>{
      const v=el.value.replace(/\D/g,'').slice(0,len); el.value=v;
      if(i===0&&v.length===1&&+v>3){el.value='0'+v;go(1);return;}
      if(i===1&&v.length===1&&+v>1){el.value='0'+v;go(2);return;}
      if(v.length===len&&i<2)go(i+1);
      if(i===2&&v.length===4)fire();
    });
    el.addEventListener('keydown',e=>{
      if(/^[\/.\-]$/.test(e.key)){e.preventDefault();if(!el.value)return;if(el.value.length===1&&i<2)el.value='0'+el.value;go(i+1);return;}
      if(e.key==='Backspace'&&!el.value&&i>0){e.preventDefault();const t=P[i-1];t.value=t.value.slice(0,-1);t.focus();return;}
      if(e.key==='Enter'){fire();}
    });
    el.addEventListener('blur',()=>{if(el.value.length===1&&i<2)el.value='0'+el.value;if(i===2&&el.value.length===2)el.value='20'+el.value;setTimeout(()=>{if(!box.contains(document.activeElement))fire();},0);});
    el.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text').trim(),m=t.match(/^(\d{1,2})\D(\d{1,2})\D(\d{4})$/)||t.match(/^(\d{2})(\d{2})(\d{4})$/);if(m){e.preventDefault();P[0].value=pad(m[1]);P[1].value=pad(m[2]);P[2].value=m[3];fire();}});
  });
}

function dashData(){
  const D=S.D; const R=D.R.filter(x=>inRange(x.date)); const O=R.filter(x=>x.o);
  const k={orders:O.length,succ:O.filter(x=>x.cls==='success').length,cancel:O.filter(x=>x.cls==='cancel').length,ret:O.filter(x=>x.cls==='return').length};
  k.rev=R.reduce((s,x)=>s+x.rev,0);
  k.settle=R.reduce((s,x)=>s+x.settle,0); k.nSettled=R.filter(x=>x.g).length;
  k.fee=R.reduce((s,x)=>s+x.fee,0); k.feeEst=R.reduce((s,x)=>s+x.feeEst,0); k.nEst=R.filter(x=>x.st==='unsettled').length;
  k.recv=R.reduce((s,x)=>s+x.recv,0); k.unrecvSettled=R.reduce((s,x)=>s+x.unrecv,0); k.expect=R.reduce((s,x)=>s+x.expect,0);
  k.diff=R.reduce((s,x)=>s+x.diff,0); k.nDiff=R.filter(x=>x.st==='diff').length;
  k.failSettle=R.filter(x=>x.o&&x.cls!=='success').reduce((s,x)=>s+x.settle,0);
  k.failRev=R.filter(x=>x.o&&(x.cls==='cancel'||x.cls==='return')).reduce((s,x)=>s+(x.revOrder||0),0);
  const sx=R.filter(x=>x.o&&x.cls==='success');
  const f={total:sx.reduce((s,x)=>s+x.rev,0),recv:0,unrecv:0,expect:0,fee:0,feeEst:0};
  sx.forEach(x=>{if(x.g){f.recv+=x.recv;f.unrecv+=x.unrecv;f.fee+=x.fee;}else{f.expect+=x.expect;f.feeEst+=x.feeEst;}});
  k.flow=f; k.R=R;
  const L=S.L.filter(l=>inRange(l.date)); k.profit=L.reduce((s,l)=>s+l.profit,0); k.prev=L.reduce((s,l)=>s+l.rev,0); k.noCost=L.filter(l=>l.noCost).length;
  return k;
}

function drawChart(R){
  const gran=S.chartGran, key=d=>gran==='day'?d:d.slice(0,7), m=new Map();
  for(const x of R){if(!x.date||!x.o||x.cls!=='success')continue;const kk=key(x.date);let a=m.get(kk);if(!a){a={rev:0,settle:0,exp:0};m.set(kk,a);}a.rev+=x.rev;if(x.g)a.settle+=x.settle;else a.exp+=x.expect;}

  const g=k=>m.get(k)||{rev:0,settle:0,exp:0}, lab=k=>gran==='day'?k.slice(8,10)+'/'+k.slice(5,7):my(k);

  const iw=Wd-pl-pr, ih=H-pt-pb, bw=iw/n, gw=Math.max(1,bw*0.8/2), y=v=>pt+ih-(v/max)*ih;

  for(let t=0;t<=4;t++){const v=max*t/4,yy=y(v);s+='<line x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+col('--border')+'"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" text-anchor="end">'+(v>=1e6?(v/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr':v>=1e3?Math.round(v/1e3)+'k':v)+'</text>';}
  const every=Math.ceil(n/Math.max(1,Math.floor(iw/46)));
  keys.forEach((k,i)=>{const a=g(k),x0=pl+i*bw+bw*0.1;
    if(a.rev>0)s+='<rect x="'+x0+'" y="'+y(a.rev)+'" width="'+Math.max(1,gw-1)+'" height="'+(y(0)-y(a.rev))+'" fill="'+col('--accent-2')+'" rx="1"/>';

    if(a.exp>0)s+='<rect x="'+(x0+gw)+'" y="'+y(a.settle+a.exp)+'" width="'+Math.max(1,gw-1)+'" height="'+(y(a.settle)-y(a.settle+a.exp))+'" fill="'+col('--amb')+'" rx="1"/>';
    s+='<rect x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" fill="transparent"><title>'+esc(lab(k)+'\nDoanh thu: '+fmt(a.rev)+'\nQuyết toán: '+fmt(a.settle)+'\nDự kiến: '+fmt(a.exp))+'</title></rect>';
    if(i%every===0)s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(lab(k))+'</text>';});

}

  const days=delivDays(); if(!S.delivDay||(S.delivDay!=='*'&&!days.some(d=>d[0]===S.delivDay)))S.delivDay=days.length?days[days.length-1][0]:'';

function khoState(r){const k=S.kho[r.id]||{};if(k.date)return '<span class="b ok">Đã về kho</span>';const n=r.evt?daysBetween(r.evt,todayYmd()):null;return '<span class="b bad">Chưa về kho</span>'+(n!=null&&n>=0?'<div class="muted" style="font-size:12px;margin-top:3px">'+n+' ngày từ khi '+(r.kind==='cancel'?'hủy':'phát sinh trả')+'</div>':'');}

function renderWallet(){
  const D=S.D; const open=S.opening==null?0:S.opening; const days=walletDays(D,open);
  const inR=days.filter(d=>inRange(d.date));
  const mm=new Map(); days.forEach(d=>{const k=d.date.slice(0,7);let a=mm.get(k);if(!a){a={m:k,open:d.open,earn:0,wd:0,other:0,settle:0,close:0};mm.set(k,a);}a.earn+=d.earn;a.wd+=d.wd;a.other+=d.other;a.settle+=d.settle;a.close=d.close;});
  let h=filterBar({lbl:'theo ngày giao dịch ví',noSearch:true})+head('Ví sàn & dòng tiền');
  h+='<p class="lead">Số dư ví = số dư đầu kỳ + tiền vào ví (Earnings) − tiền rút về ngân hàng. File sàn không có số dư đầu kỳ, nhập số dư tại ngày đầu tiên có giao dịch để số dư cuối khớp với ví thực tế. Cột Quyết toán (Income) dùng để kiểm tra tiền vào ví từng ngày.</p>';

function pdData(){
  const L=profitLines(), T=totP(L), sale=L.filter(l=>l.kind==='sale');
  const ids=new Set(sale.map(l=>l.id));
  // cơ cấu phí sàn: đơn đã quyết toán lấy theo từng khoản trong Income; đơn chưa quyết toán = phí ước tính
  const fee={}; let est=0;
  ids.forEach(id=>{const x=S.D.byId.get(id); if(!x)return; if(x.g){let known=0;FEE_TOP.forEach(([k,lab])=>{const v=-(x.g.parts[k]||0);if(Math.abs(v)>=0.5){fee[lab]=(fee[lab]||0)+v;known+=v;}});const o=-x.g.fee-known;if(Math.abs(o)>=0.5)fee['Phí khác của sàn']=(fee['Phí khác của sàn']||0)+o;}else est+=x.feeEst;});
  if(est>=0.5)fee['Phí ước tính (chưa quyết toán)']=est;
  // theo thời gian
  const span=L.length?(new Date(L.reduce((m,l)=>l.date>m?l.date:m,''))-new Date(L.reduce((m,l)=>l.date<m?l.date:m,'9999')))/864e5:0;
  const gran=S.chartGran==='month'||span>92?'month':'day';
  const tm=new Map(); L.forEach(l=>{const k=gran==='day'?l.date:l.month; if(!k)return; let a=tm.get(k); if(!a){a={rev:0,profit:0,cogs:0,fee:0};tm.set(k,a);} a.rev+=l.rev;a.profit+=l.profit;a.cogs+=l.cogs||0;a.fee+=l.fee;});
  let keys=[...tm.keys()].sort(); if(gran==='day'&&keys.length){const out=[];let d=keys[0];while(d<=keys[keys.length-1]){out.push(d);d=addDays(d,1);}keys=out;}
  const series=keys.map(k=>({k,lab:gran==='day'?k.slice(8,10)+'/'+k.slice(5,7):my(k),...(tm.get(k)||{rev:0,profit:0,cogs:0,fee:0})}));
  // sản phẩm, kênh bán
  const prod=aggProfit(sale,'name').sort((a,b)=>b.profit-a.profit);
  const ch=new Map(); sale.forEach(l=>{const o=S.D.orders.get(l.id);const k=(o&&o.channel)||'Không rõ';let a=ch.get(k);if(!a){a={key:k,ids:new Set(),rev:0,profit:0};ch.set(k,a);}a.ids.add(l.id);a.rev+=l.rev;a.profit+=l.profit;});
  const chan=[...ch.values()].sort((a,b)=>b.rev-a.rev);
  // tỷ lệ hủy/trả trong kỳ (theo ngày đặt)
  const O=[...S.D.orders.values()].filter(o=>inRange(o.created)); const st={success:0,cancel:0,return:0,other:0}; O.forEach(o=>{st[o.cls in st?o.cls:'other']++;});
  return {L,T,ids,fee,series,gran,prod,chan,st,nO:O.length};
}

    if(i%every===0)s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(a.lab)+'</text>';});
  if(pts.length>1)s+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+pdc('--amb')+'" stroke-width="2" stroke-linejoin="round"/>';

   +'<div class="pd-g2"><div class="blk"><h3>Lợi nhuận theo sản phẩm</h3>'+(top.length?hbars(top):'<p class="muted">Chưa có dữ liệu.</p>')+(d.prod.length>8?'<p class="lead" style="margin:8px 0 0;font-size:12px">8 sản phẩm lãi nhiều nhất / '+d.prod.length+'</p>':'')+'</div>'
   +'<div class="blk"><h3>Doanh thu theo kênh bán</h3>'+(chan.length?hbars(chan):'<p class="muted">Chưa có dữ liệu.</p>')+'</div></div>'
   +'<p class="lead" style="margin-top:12px;font-size:12px">'+esc(sc[1])+' · '+esc(sc[2])+'. Doanh thu = tiền hàng sau giảm giá người bán (không trừ giảm giá nền tảng). Phí đơn hủy/trả là khoản sàn trừ vào quyết toán của đơn hủy, đơn trả hàng.</p>'
   +'</div></div>';
  const old=$('#pdash'); if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',h); document.body.style.overflow='hidden';
  svgWaterfall($('#pdW'),[{l:'Doanh thu',v:T.rev,total:true,sub:'100%'},{l:'Giá vốn',v:-T.cogs,sub:fmtP(T.rev?T.cogs/T.rev:null)},{l:'Phí sàn',v:-T.fee,sub:fmtP(T.rev?T.fee/T.rev:null)},{l:'Phí hủy/trả',v:-T.fail,sub:fmtP(T.rev?T.fail/T.rev:null)},{l:'Lợi nhuận',v:T.profit,total:true,sub:fmtP(T.rev?T.profit/T.rev:null)}]);
  svgTrend($('#pdT'),d.series);
  $('#pdash .btn[data-a="pd-close"]').focus();
}
function closePDash(){const o=$('#pdash');if(o)o.remove();document.body.style.overflow='';}

/* ---------- Biểu đồ doanh thu – chi phí – lợi nhuận (Tổng quan): chọn 1 hoặc nhiều chỉ tiêu ---------- */
const PMET=[['rev','Doanh thu','#3F78AE'],['cogs','Giá vốn','#8A63B8'],['fee','Phí sàn','#C0392B'],['fail','Phí hủy/trả','#E08A2B'],['profit','Lợi nhuận','#2F7D4F']];
function pTitle(sel){const n=sel.map((m,i)=>i?m[1].toLowerCase():m[1]);if(n.length===PMET.length)return 'Doanh thu, chi phí và lợi nhuận';return n.length<2?n.join(''):n.slice(0,-1).join(', ')+' và '+n[n.length-1];}
function drawPnl(){
  const el=$('#chP'); if(!el)return; const gran=S.pGran==='month'?'month':'day', sel=PMET.filter(m=>S.pMet.includes(m[0]));
  const m=new Map();
  S.L.filter(l=>inRange(l.date)).forEach(l=>{const k=gran==='day'?l.date:l.month;if(!k)return;let a=m.get(k);if(!a){a={rev:0,cogs:0,fee:0,fail:0,profit:0};m.set(k,a);}
    a.rev+=l.rev;a.cogs+=l.cogs||0;if(l.kind==='fail')a.fail+=l.fee;else a.fee+=l.fee;a.profit+=l.profit;});
  let keys=[...m.keys()].sort(); if(gran==='day'&&keys.length){const out=[];let d=keys[0];while(d<=keys[keys.length-1]){out.push(d);d=addDays(d,1);}keys=out;}
  if(!keys.length){el.innerHTML='<p class="muted">Chưa có dữ liệu.</p>';return;}
  const g=k=>m.get(k)||{rev:0,cogs:0,fee:0,fail:0,profit:0}, lab=k=>gran==='day'?k.slice(8,10)+'/'+k.slice(5,7):my(k);
  const css=getComputedStyle(document.documentElement), col=v=>css.getPropertyValue(v).trim();
  const W=Math.max(320,el.clientWidth||700),H=gran==='day'?250:280,pl=58,pr=8,pt=gran==='month'?34:10,pb=26,n=keys.length,nb=sel.length;
  let max=1,min=0; keys.forEach(k=>{const a=g(k);sel.forEach(([f])=>{max=Math.max(max,a[f]);min=Math.min(min,a[f]);});});
  const raw=(max-min)/4, p10=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(x=>x*p10).find(x=>x>=raw);
  max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const iw=W-pl-pr, ih=H-pt-pb, bw=iw/n, gw=Math.max(1,Math.min(bw*0.84/nb,64)), y=v=>pt+ih-(v-min)/(max-min)*ih;
  const sh=v=>{const a=Math.abs(v);return (v<0?'−':'')+(a>=1e6?(a/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr':a>=1e3?Math.round(a/1e3)+'k':Math.round(a));};
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-size="11" fill="'+col('--text-muted')+'">';
  for(let v=min;v<=max+step/2;v+=step){const yy=y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+col('--border')+'"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" text-anchor="end">'+sh(v)+'</text>';}
  const every=Math.ceil(n/Math.max(1,Math.floor(iw/46)));
  keys.forEach((k,i)=>{const a=g(k),x0=pl+i*bw+(bw-nb*gw)/2, pc=v=>a.rev?' ('+fmtP(v/a.rev)+')':'';
    sel.forEach(([f,,c],j)=>{const v=a[f],t1=y(Math.max(0,v)),t2=y(Math.min(0,v));if(t2-t1>0.2)s+='<rect x="'+(x0+j*gw)+'" y="'+t1+'" width="'+Math.max(1,gw-1)+'" height="'+(t2-t1)+'" fill="'+c+'" rx="1"/>';
      if(gran==='month'){const cx=x0+j*gw+gw/2;s+='<text x="'+cx+'" y="'+(t1-(f!=='rev'&&a.rev?18:6))+'" text-anchor="middle" font-weight="600" fill="'+col('--text')+'">'+sh(v)+'</text>'+(f!=='rev'&&a.rev?'<text x="'+cx+'" y="'+(t1-5)+'" text-anchor="middle">'+fmtP(v/a.rev)+'</text>':'');}});
    s+='<rect x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" fill="transparent"><title>'+esc(lab(k)+'\n'+sel.map(([f,l])=>l+': '+fmt(a[f])+(f!=='rev'?pc(a[f]):'')).join('\n'))+'</title></rect>';
    if(i%every===0)s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(lab(k))+'</text>';});
  if(min<0)s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+col('--text-faint')+'"/>';
  el.innerHTML=s+'</svg>';
}
