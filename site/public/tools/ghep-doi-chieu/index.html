<style>
:root{
  --bg:#F4EFE5; --surface:#FBF8F2; --surface-2:#F7F2E8; --surface-3:#EFE7D8;
  --border:#E3DACB; --border-strong:#D3C7B4;
  --text:#231E19; --text-muted:#6B6259; --text-faint:#988D80;
  --accent:#2F7D4F; --accent-2:#3E9A63; --accent-strong:#245F3D; --accent-soft:#E3F1E8; --accent-soft-strong:#CDE6D6;
  --info:#2F5F8F; --info-soft:#E2ECF5;
  --warn:#9A5A16; --warn-soft:#F6E7D3;
  --danger:#A63A2B; --danger-soft:#F8E3DE;
  --amb:#B06A22;
  --shadow-sm:0 1px 2px rgba(35,30,25,.06);
  --shadow-md:0 1px 2px rgba(35,30,25,.06),0 10px 28px -12px rgba(35,30,25,.22);
  --f-wall:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:14px; --radius-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-2:#58B07C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --info:#8DB6E0; --info-soft:#1B2633; --warn:#E8B06A; --warn-soft:#3A2C1C; --danger:#E58B7C; --danger-soft:#3A1F1A; --amb:#E8B06A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1D1A17; --surface-2:#191613; --surface-3:#26221D;
  --border:#332E28; --border-strong:#443D35;
  --text:#ECE6DB; --text-muted:#A69C8F; --text-faint:#7C7368;
  --accent:#6CC08C; --accent-2:#58B07C; --accent-strong:#8AD3A6; --accent-soft:#1C2E23; --accent-soft-strong:#24402F;
  --info:#8DB6E0; --info-soft:#1B2633; --warn:#E8B06A; --warn-soft:#3A2C1C; --danger:#E58B7C; --danger-soft:#3A1F1A; --amb:#E8B06A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.45}
h1,h2,h3,h4{font-family:var(--f-wall);margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
::selection{background:var(--accent-soft-strong)}
[hidden]{display:none!important}
.app{min-height:100vh;display:flex;flex-direction:column}

/* Thanh trên cùng */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px 18px}
.tb-row1 .topbar-inner{padding-top:8px;padding-bottom:8px;transition:padding .2s}
.tb-row2{border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.tb-row2 .topbar-inner{padding-top:5px;padding-bottom:5px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none}
.brand img{width:48px;height:48px;object-fit:contain;flex-shrink:0;transition:width .2s,height .2s;filter:drop-shadow(0 2px 3px rgba(35,30,25,.15))}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt b{font-family:var(--f-wall);font-weight:600;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);font-weight:400;letter-spacing:.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.tb-tools{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.tb-tools .btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--text)}
.tb-tools .btn-ghost:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.btn-ghost svg{flex-shrink:0}
body.scrolled .tb-row1 .topbar-inner{padding-top:5px;padding-bottom:5px}
body.scrolled .brand img{width:36px;height:36px}
body.scrolled .brand small{display:none}
.stepper{display:flex;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.step-item{display:flex;align-items:center;gap:8px;background:none;border:none;padding:6px 10px;border-radius:99px;color:var(--text-faint);font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.step-item .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:99px;background:var(--surface-2);border:1.5px solid var(--border-strong);font-size:11px;font-family:var(--font-mono);color:var(--text-muted);flex-shrink:0}
.step-item.active{color:var(--text);background:var(--accent-soft)}
.step-item.active .num{background:var(--accent);border-color:var(--accent);color:#fff}
.step-item.done{color:var(--accent-strong);cursor:pointer}
.step-item.done .num{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.step-item.done:hover{background:var(--accent-soft)}
.step-item.locked{cursor:not-allowed;opacity:.55}
.step-sep{width:14px;height:1.5px;background:var(--border-strong);flex-shrink:0;margin:0 2px}
.topnav{display:flex;gap:8px;margin-left:auto}

.container{max-width:1280px;width:100%;margin:0 auto;padding:24px 20px 40px;flex:1}
.step-panel{display:flex;flex-direction:column;gap:18px}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:21px}
.panel-head p{color:var(--text-muted);font-size:14px;margin-top:3px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:18px 20px}
.card h3{font-size:15px}
.grid-2{display:flex;flex-direction:column;gap:16px}

/* Ô tải file */
.fileslot{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.fileslot-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;font-family:var(--f-wall)}
.tag{font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.tag.b{background:var(--info-soft);color:var(--info)}
.dropzone{border:2px dashed var(--border-strong);border-radius:var(--radius-sm);padding:24px 16px;text-align:center;background:var(--surface-2);transition:.15s;cursor:pointer}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.dz-icon{width:34px;height:34px;margin:0 auto 6px;color:var(--accent)}
.dz-main{font-weight:600;font-size:14px}
.dz-sub{color:var(--text-muted);font-size:12.5px;margin-top:3px}
.file-loaded{display:flex;flex-direction:column;gap:10px}
.file-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.file-name{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;flex:1 1 280px;min-width:0}
.file-name b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:12px;color:var(--text-muted);font-family:var(--font-mono);white-space:nowrap}
.btn-tiny{font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);font-weight:600;white-space:nowrap}
.btn-tiny:hover{background:var(--surface-3);color:var(--text)}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px}
.field label{font-size:12px;font-weight:600;color:var(--text-muted)}
select,.input{padding:7px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13.5px;min-height:34px}
select:focus,.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--text-faint)}
.auto-note{font-size:12px;color:var(--accent-strong);background:var(--accent-soft);padding:5px 9px;border-radius:7px;display:inline-flex;gap:6px;align-items:center;width:fit-content}
.inline-check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted);cursor:pointer}
.inline-check input{accent-color:var(--accent);width:15px;height:15px}
.removed-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:8px 10px;line-height:1.5}
.removed-note svg{flex:none;margin-top:2px}

.swap-row{display:flex;align-items:center;gap:12px;margin:-4px 0}
.swap-line{flex:1;height:1px;background:var(--border-strong)}
.swap-btn{border-radius:99px}
.pick-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.pick-off{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--danger)}
.pick-wrap{max-height:340px}
th.pick-c,td.pick-c{width:1%;text-align:center;padding-left:8px;padding-right:4px}
.pick-c input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
tr.pick-x td{color:var(--text-faint);text-decoration:line-through;background:var(--surface-2)}
tr.pick-x td.pick-c,tr.pick-x td.rn{text-decoration:none}
tr.pick-gap td{text-align:center;color:var(--text-muted);font-size:12.5px;background:var(--surface-2)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);max-height:250px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
thead th{position:sticky;top:0;background:var(--surface-3);color:var(--text);text-align:left;padding:7px 10px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--border-strong);z-index:1}
tbody td{padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums;max-width:420px;overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.num{text-align:right}
th.rn,td.rn{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;text-align:right;width:1%}
tr.st-0 td{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
tr.st-3 td{background:var(--warn-soft)}
tr.st-1 td{background:var(--danger-soft)}
tr.st-2 td{background:var(--info-soft)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.s0{background:var(--accent-soft-strong);color:var(--accent-strong)} .badge.s3{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)} .badge.s1{background:var(--danger-soft);color:var(--danger)} .badge.s2{background:var(--info-soft);color:var(--info)}

/* Nút */
.btn{border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:.15s;line-height:1.2;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .btn-primary{color:#10170f}

function afterFilesChanged(){

  ui.keyPairs = ui.keyPairs.map(function(p){ return {a: ca.indexOf(p.a)>=0?p.a:'', b: cb.indexOf(p.b)>=0?p.b:''}; });
  ui.orPairs = ui.orPairs.map(function(p){ return {a: ca.indexOf(p.a)>=0?p.a:'', b: cb.indexOf(p.b)>=0?p.b:''}; });
  ui.comparePairs = ui.comparePairs.map(function(p){ return {aCol: ca.indexOf(p.aCol)>=0?p.aCol:'', bCol: cb.indexOf(p.bCol)>=0?p.bCol:'', tolerance:p.tolerance}; });

function handleFilePicked(slot, file){
  if(!file) return Promise.resolve(null);

  return runWithProgress('Đang đọc file "'+file.name+'"...', function(){
    return engine.loadFile(slot, file).then(function(res){
      var pc = ui.pendingCfg && ui.pendingCfg.data.files && ui.pendingCfg.data.files[slot];
      var sheet = res.sheetNames[0], hr = null;
      if(pc && res.sheetNames.indexOf(pc.sheetName)>=0){ sheet=pc.sheetName; hr=pc.headerRow; if(pc.skipFooter===false) keepOpts.skipFooter=false; if(pc.groupBy) keepOpts.groupBy=pc.groupBy; }
      return engine.loadSheet(slot, sheet, hr, keepOpts);
    });
  }).then(function(rec){
    ui.fileInfo[slot]=rec; afterFilesChanged(); if(ui.view==='app'&&ui.step===1) renderStep1(); else renderStepper();

  }, function(){ return null; });

    comparePairs:ui.comparePairs.filter(function(p){ return p.aCol&&p.bCol; }).map(function(p){ return {aCol:p.aCol,bCol:p.bCol,tolerance:p.tolerance}; })};

function loadConfigFile(file){
  var r=new FileReader();
  r.onload=function(){
    var data; try{ data=JSON.parse(r.result); }catch(e){ toast('File thiết lập không đọc được.','err'); return; }
    if(!data||data.app!=='ghep-doi-chieu'){ toast('Đây không phải file thiết lập của công cụ Ghép & đối chiếu.','err'); return; }
    ui.pendingCfg={name:file.name, data:data};
    if(ui.fileInfo.A&&ui.fileInfo.B){
      // file đang mở khác sheet/dòng tiêu đề đã lưu → đọc lại theo thiết lập
      var jobs=[];
      ['A','B'].forEach(function(s){ var f=data.files&&data.files[s], cur=ui.fileInfo[s]; if(f&&cur&&cur.sheetNames.indexOf(f.sheetName)>=0&&(f.sheetName!==cur.sheetName||f.headerRow!==cur.headerRow||f.skipFooter!==cur.skipFooter||JSON.stringify(f.groupBy||[])!==JSON.stringify(cur.groupBy||[]))) jobs.push([s,f]); });
      var chain=Promise.resolve();
      jobs.forEach(function(j){ chain=chain.then(function(){ return engine.loadSheet(j[0], j[1].sheetName, j[1].headerRow, {skipFooter:j[1].skipFooter!==false, groupBy:j[1].groupBy||[]}).then(function(rec){ ui.fileInfo[j[0]]=rec; }); }); });
      runWithProgress('Đang áp dụng thiết lập...', function(){ return chain; }).then(function(){ afterFilesChanged(); tryApplyPending(); }, function(){});
    } else { renderStep1(); toast('Đã nạp thiết lập. Tải đủ 2 file để áp dụng.','info'); }
  };
  r.readAsText(file);
}
function tryApplyPending(){
  var pc=ui.pendingCfg; if(!pc||!ui.fileInfo.A||!ui.fileInfo.B) return;
  var d=pc.data, ca=ui.fileInfo.A.columns, cb=ui.fileInfo.B.columns, missing=[];
  function hasA(c){ if(ca.indexOf(c)<0){ missing.push('A: '+c); return false; } return true; }
  function hasB(c){ if(cb.indexOf(c)<0){ missing.push('B: '+c); return false; } return true; }
  var kp=(d.keyPairs||[]).filter(function(p){ var x=hasA(p.a), y=hasB(p.b); return x&&y; });
  if(kp.length) ui.keyPairs=kp.map(function(p){ return {a:p.a,b:p.b}; });
  var op=(d.orPairs||[]).filter(function(p){ var x=hasA(p.a), y=hasB(p.b); return x&&y; });
  ui.orPairs=op.map(function(p){ return {a:p.a,b:p.b}; });
  if(!kp.length && op.length) ui.keyPairs=[{a:'',b:''}];
  if(d.clean) ui.clean=Object.assign({}, ui.clean, d.clean);
  if(d.duplicateHandling) ui.duplicateHandling=d.duplicateHandling;
  if(d.dateWarn) ui.dateWarn={on:!!d.dateWarn.on, days:parseInt(d.dateWarn.days,10)||3};
  if(d.sumWarn) ui.sumWarn={on:!!d.sumWarn.on};
  if(d.amountTol) ui.amountTol={abs:d.amountTol.abs||'', pct:d.amountTol.pct||''};
  if(d.joinType) ui.joinType=+d.joinType;
  ui.colsA = d.colsA==='ALL'||!d.colsA ? 'ALL' : d.colsA.filter(function(c){ return ca.indexOf(c)>=0; });
  ui.colsB = d.colsB==='ALL'||!d.colsB ? 'ALL' : d.colsB.filter(function(c){ return cb.indexOf(c)>=0; });
  var cp=(d.comparePairs||[]).filter(function(p){ var x=hasA(p.aCol), y=hasB(p.bCol); return x&&y; });
  ui.comparePairs = cp.length ? cp.map(function(p){ return {aCol:p.aCol,bCol:p.bCol,tolerance:p.tolerance||''}; }) : [{aCol:'',bCol:'',tolerance:''}];
  ui.cmpSuggested = cp.length>0;
  ui.pendingCfg=null; ui.checkResult=null;
  if(missing.length) toast('Đã áp dụng thiết lập, nhưng không thấy các cột: '+missing.slice(0,4).join(', ')+(missing.length>4?'…':'')+'. Kiểm tra lại các bước.','err');
  else toast('Đã áp dụng thiết lập "'+pc.name+'". Kiểm tra nhanh rồi bấm Chạy.','ok');
  gotoStep(ui.joinType&&(kp.length||op.length)?3:2);
}

  else if(el.matches('input[data-role="pick-row"]')){ var pi=ui.fileInfo[el.dataset.slot], n=+el.dataset.n, ex=(pi.excluded||[]).filter(function(x){ return x!==n; }); if(!el.checked) ex.push(n); setExcluded(el.dataset.slot, ex); }

  else if(el.matches('select[data-role="keypair-b"]')){ ui.keyPairs[+el.dataset.idx].b=el.value; ui.checkResult=null; ui.cmpSuggested=false; refreshRuleSum(); }
  else if(el.matches('select[data-role="orpair-a"]')){ ui.orPairs[+el.dataset.idx].a=el.value; ui.checkResult=null; ui.cmpSuggested=false; refreshRuleSum(); }
  else if(el.matches('select[data-role="orpair-b"]')){ ui.orPairs[+el.dataset.idx].b=el.value; ui.checkResult=null; ui.cmpSuggested=false; refreshRuleSum(); }

  else if(el.matches('input[data-role="dup-radio"]')){ ui.duplicateHandling=el.value; }
  else if(el.matches('select[data-role="cmp-a"]')){ var p=ui.comparePairs[+el.dataset.idx]; p.aCol=el.value; delete p.matchRate; }
  else if(el.matches('select[data-role="cmp-b"]')){ var p2_=ui.comparePairs[+el.dataset.idx]; p2_.bCol=el.value; delete p2_.matchRate; }
  else if(el.matches('input[data-role="tol-abs"]')){ ui.amountTol.abs=el.value.trim(); ui.checkResult=null; }
  else if(el.matches('input[data-role="tol-pct"]')){ ui.amountTol.pct=el.value.trim(); ui.checkResult=null; }
  else if(el.matches('input[data-role="sw-on"]')){ ui.sumWarn.on=el.checked; }
  else if(el.matches('input[data-role="dw-on"]')){ ui.dateWarn.on=el.checked; var dd=document.querySelector('.dw-days'); if(dd) dd.hidden=!el.checked; }

  else if(el.matches('input[data-role="cmp-tol"]')){ ui.comparePairs[+el.dataset.idx].tolerance=el.value.trim(); }
});

  var rowsA=[['1.250.000','m'],['3.400.000','m'],['860.000','w'],['5.000.000','m'],['2.150.000','x'],['720.000','m']];
  var rowsB=[['3.400.000','m'],['1.250.000','m'],['865.000','w'],['640.000','x'],['5.000.000','m'],['720.000','m']];
  var link=[[0,1,'m'],[1,0,'m'],[2,2,'w'],[3,4,'m'],[5,5,'m']];
  var AX=18, BX=372, AY=78, BY=104, W=210, RH=34, R0=58;
  function sheet(x,y,tag,title,rows,cls){
    var g='<g class="sc-sh"><rect class="sc-shadow" x="'+(x+4)+'" y="'+(y+8)+'" width="'+W+'" height="'+(R0+rows.length*RH+14)+'" rx="16"/>'+
      '<rect class="sc-sheet" x="'+x+'" y="'+y+'" width="'+W+'" height="'+(R0+rows.length*RH+14)+'" rx="16"/>'+
      '<rect class="sc-tag '+cls+'" x="'+(x+14)+'" y="'+(y+14)+'" width="24" height="24" rx="6"/><text class="sc-tagt" x="'+(x+26)+'" y="'+(y+31)+'" text-anchor="middle">'+tag+'</text>'+
      '<text class="sc-title" x="'+(x+46)+'" y="'+(y+31)+'">'+title+'</text>'+
      '<rect class="sc-hd" x="'+(x+12)+'" y="'+(y+46)+'" width="'+(W-24)+'" height="6" rx="3"/>';
    rows.forEach(function(r,i){ var yy=y+R0+i*RH;
      g+='<rect class="sc-row sc-'+r[1]+'" x="'+(x+10)+'" y="'+yy+'" width="'+(W-20)+'" height="'+(RH-8)+'" rx="7"/>'+
         '<rect class="sc-bar" x="'+(x+20)+'" y="'+(yy+10)+'" width="'+(52+(i*13)%34)+'" height="6" rx="3"/>'+
         '<text class="sc-num" x="'+(x+W-20)+'" y="'+(yy+18)+'" text-anchor="end">'+r[0]+'</text>';
    });
    return g+'</g>';
  }
  var s='<svg class="scene-svg" viewBox="0 0 600 540" role="img" aria-label="Minh họa: Đốm cầm kính lúp soi 2 file Excel, nối các dòng khớp, lệch và thiếu">';
  s+='<defs><radialGradient id="scGlow"><stop offset="0" stop-color="#F2B66B" stop-opacity=".45"/><stop offset="1" stop-color="#F2B66B" stop-opacity="0"/></radialGradient></defs>';
  s+='<ellipse cx="300" cy="340" rx="200" ry="170" fill="url(#scGlow)"/>';
  s+=sheet(AX,AY,'A','Sao kê ngân hàng',rowsA,'ta')+sheet(BX,BY,'B','Sổ kế toán',rowsB,'tb');
  link.forEach(function(l){
    var y1=AY+R0+l[0]*RH+13, y2=BY+R0+l[1]*RH+13, x1=AX+W-10, x2=BX+10;
    s+='<path class="sc-link sc-l'+l[2]+'" d="M'+x1+' '+y1+' C'+(x1+70)+' '+y1+', '+(x2-70)+' '+y2+', '+x2+' '+y2+'"/>'+
       '<circle class="sc-dot sc-d'+l[2]+'" cx="'+x1+'" cy="'+y1+'" r="4.5"/><circle class="sc-dot sc-d'+l[2]+'" cx="'+x2+'" cy="'+y2+'" r="4.5"/>';
  });
  // dấu ≠ ở đường lệch, ✕ ở dòng chỉ có ở 1 file
  var wy=(AY+R0+2*RH+13+BY+R0+2*RH+13)/2;
  s+='<g class="sc-badge sc-bw"><circle cx="300" cy="'+wy+'" r="13"/><text x="300" y="'+(wy+5)+'" text-anchor="middle">≠</text></g>';
  var xa=AY+R0+4*RH+13, xb=BY+R0+3*RH+13;
  s+='<g class="sc-badge sc-bx"><circle cx="'+(AX+W+16)+'" cy="'+xa+'" r="11"/><text x="'+(AX+W+16)+'" y="'+(xa+4.5)+'" text-anchor="middle">✕</text></g>';
  s+='<g class="sc-badge sc-bx"><circle cx="'+(BX-16)+'" cy="'+xb+'" r="11"/><text x="'+(BX-16)+'" y="'+(xb+4.5)+'" text-anchor="middle">✕</text></g>';
  // Đốm cầm kính lúp
  s+='<g class="sc-dom"><image class="dom-l" href="'+DOM16S+'" x="186" y="318" width="220" height="220"/><image class="dom-d" href="'+DOM16T+'" x="186" y="318" width="220" height="220"/></g>';
  // chú thích
  s+='<g class="sc-legend" transform="translate(70 18)">'+
     '<rect class="sc-chip sc-cm" x="0" y="0" width="118" height="30" rx="15"/><text class="sc-cht sc-tm" x="59" y="20" text-anchor="middle">✓ Khớp</text>'+
     '<rect class="sc-chip sc-cw" x="128" y="0" width="138" height="30" rx="15"/><text class="sc-cht sc-tw" x="197" y="20" text-anchor="middle">≠ Lệch giá trị</text>'+
     '<rect class="sc-chip sc-cx" x="276" y="0" width="186" height="30" rx="15"/><text class="sc-cht sc-tx" x="369" y="20" text-anchor="middle">✕ Chỉ có ở 1 file</text></g>';
  return s+'</svg>';
}

function setView(v){
  ui.view=v;
  $('#home').hidden = v!=='home'; $('#mainContainer').hidden = v==='home';
  $('.tb-row2').hidden = v==='home'; document.body.classList.toggle('is-home', v==='home');
  if(v==='home') renderHome(); else setTimeout(placeProgress, 0);
  window.scrollTo(0,0);
}
var OK_EXT=/\.(xlsx|xlsm|xls|xlsb|csv)$/i;
function handleHomeFiles(list, slot){
  var files=Array.prototype.slice.call(list||[]).filter(function(f){ return OK_EXT.test(f.name); });
  if(!files.length){ toast('Chỉ nhận file .xlsx, .xls, .csv.','err'); return; }
  if(files.length>2) toast('Đã lấy 2 file đầu tiên.','info');
  var slots = files.length>=2 ? ['A','B'] : [slot || (ui.fileInfo.A&&!ui.fileInfo.B?'B':'A')];
  handleFilePicked(slots[0], files[0]).then(function(){ return files[1] ? handleFilePicked(slots[1], files[1]) : null; })
    .then(function(){
      var A=ui.fileInfo.A, B=ui.fileInfo.B;
      if(A||B){ ui.step=1; gotoStep(1); }
    });
}
function clearFiles(){
  if(!confirm('Gỡ cả File A và File B đã tải? Các cặp cột và kết quả đang có sẽ bị xoá.')) return;
  engine.clearFiles().then(function(){
    ui.fileInfo={A:null,B:null}; ui.pendingCfg=null; ui.grpOpen={}; afterFilesChanged(); ui.page=null;
    for(var i=2;i<=4;i++) $('#step-'+i).innerHTML='';
    renderStep1(); toast('Đã gỡ toàn bộ file.','info');
  });
}

function fbMsg(t,cls){ var m=$('#fbMsg'); if(m){ m.textContent=t; m.className='fb-msg '+(cls||''); } }
function sendFeedback(){
  var content=$('#fbContent').value.trim(), name=$('#fbName').value.trim(), phone=$('#fbPhone').value.trim();
  if(content.length<5){ fbMsg('Vui lòng nhập nội dung góp ý (ít nhất 5 ký tự).','err'); $('#fbContent').focus(); return; }
  if(name.length<2){ fbMsg('Vui lòng nhập họ tên để Đốm tiện phản hồi.','err'); $('#fbName').focus(); return; }
  if(phone && !/^[0-9 +().-]{8,20}$/.test(phone)){ fbMsg('Số điện thoại chưa đúng (có thể để trống).','err'); return; }
  var head='['+fb.type+']'+(fb.stars?' · Đánh giá: '+fb.stars+'/5 ★':'');
  var body={tool:TOOL_SLUG, name:name, phone:phone, content:head+'\n'+content, page:'Ghép & đối chiếu · Bước '+ui.step+' · bản '+VER, website:$('#fbHp').value};
  var btn=$('#fbSend'); btn.disabled=true; fbMsg('Đang gửi…');
  var online=/^https?:$/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname);
  var req = online
    ? fetch('/api/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error||'Chưa gửi được, vui lòng thử lại.'); return j.message; }); })
    : fetch('https://quantritute.com/api/feedback',{method:'POST',mode:'no-cors',headers:{'content-type':'text/plain'},body:JSON.stringify(body)}).then(function(){ return 'Cảm ơn bạn! Góp ý đã được gửi tới Đốm.'; });
  req.then(function(msg){ fbMsg(msg||'Cảm ơn bạn đã góp ý!','ok'); btn.textContent='Đã gửi'; setTimeout(function(){ if($('#fbForm')) closeModal(); }, 2200); },
    function(e){ btn.disabled=false; fbMsg(e&&e.message&&!/fetch|network/i.test(e.message)?e.message:'Chưa gửi được (kiểm tra kết nối mạng) – vui lòng thử lại.','err'); });
}
document.addEventListener('submit',function(e){ if(e.target.id==='fbForm'){ e.preventDefault(); sendFeedback(); } });
document.addEventListener('click',function(e){ if(e.target.matches&&e.target.matches('[data-role="modal-ov"]')) closeModal(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('#modalRoot').innerHTML) closeModal(); });
window.addEventListener('scroll',function(){ document.body.classList.toggle('scrolled', window.scrollY>40); }, {passive:true});

if(/quantritute/i.test(location.hostname)) $('#bback').setAttribute('href','/cong-cu');
if(location.protocol==='file:') $('#pyLink').setAttribute('href','https://quantritute.com/tools/ghep-doi-chieu/ban-python/Tool_Ghep_Doi_Chieu.zip');
renderStepper(); renderStep1(); setView('home');
