<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F7D4F">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chấm công">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<title>Chấm công</title>
<style>
:root{
  --bg:#F4EFE5;--surface:#FBF8F2;--surface-2:#F7F2E8;--surface-3:#EFE7D8;
  --border:#E3DACB;--border-strong:#D3C7B4;
  --text:#231E19;--text-muted:#6B6259;--text-faint:#988D80;
  --accent:#2F7D4F;--accent-2:#3E9A63;--accent-strong:#245F3D;--accent-soft:#E3F1E8;--on-accent:#fff;
  --info:#2F5F8F;--info-soft:#E2ECF5;--warn:#9A5A16;--warn-soft:#F6E7D3;--danger:#A63A2B;--danger-soft:#F8E3DE;
  --shadow:0 1px 2px rgba(35,30,25,.06),0 10px 28px -12px rgba(35,30,25,.22);
  --f-ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210;--surface:#1D1A17;--surface-2:#191613;--surface-3:#26221D;--border:#332E28;--border-strong:#443D35;
  --text:#ECE6DB;--text-muted:#A69C8F;--text-faint:#7C7368;
  --accent:#6CC08C;--accent-2:#58B07C;--accent-strong:#8AD3A6;--accent-soft:#1C2E23;--on-accent:#0E1A12;
  --info:#8DB6E0;--info-soft:#1B2633;--warn:#E8B06A;--warn-soft:#3A2C1C;--danger:#E58B7C;--danger-soft:#3A1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210;--surface:#1D1A17;--surface-2:#191613;--surface-3:#26221D;--border:#332E28;--border-strong:#443D35;
  --text:#ECE6DB;--text-muted:#A69C8F;--text-faint:#7C7368;
  --accent:#6CC08C;--accent-2:#58B07C;--accent-strong:#8AD3A6;--accent-soft:#1C2E23;--on-accent:#0E1A12;
  --info:#8DB6E0;--info-soft:#1B2633;--warn:#E8B06A;--warn-soft:#3A2C1C;--danger:#E58B7C;--danger-soft:#3A1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{margin:0;font-weight:650;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1080px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top img{width:34px;height:34px;border-radius:9px}
.top .t1{font-weight:650;font-size:16px;line-height:1.2}
.top .t2{font-size:12.5px;color:var(--text-muted)}
.top .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--text-muted)}.faint{color:var(--text-faint)}.small{font-size:13px}
.lbl{display:block;font-size:13px;color:var(--text-muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=tel],select{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2);font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:14px;min-height:42px}
.btn:hover{background:var(--surface-3)}
a.btn{text-decoration:none;color:var(--text)}
.btn{white-space:nowrap}
.top .btn{margin-left:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-strong)}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.big{width:100%;min-height:120px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);font-size:26px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow)}
.big small{font-size:14px;font-weight:500;opacity:.9}
.big.ra{background:var(--info)}
.big:active{transform:scale(.99)}
.alt{margin-top:10px;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--danger-soft);color:var(--danger)}
.pill.inf{background:var(--info-soft);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.msg{padding:12px 14px;border-radius:12px;margin:12px 0 0;font-size:14.5px}
.msg.ok{background:var(--accent-soft);color:var(--accent-strong)}
.msg.err{background:var(--danger-soft);color:var(--danger)}
/* 0.3.1 */
textarea,input[type=date]{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2);font:inherit;font-size:16px;color:inherit}
.card.hl{border:2px solid var(--accent)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.kv div{background:var(--surface-2);border-radius:10px;padding:7px 8px}.kv span{display:block;font-size:11.5px;color:var(--text-muted)}.kv b{font-size:17px}
.days{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.dk{display:inline-flex;flex-direction:column;align-items:center;min-width:34px;padding:3px 2px;border-radius:7px;background:var(--accent-soft);font-size:12px;font-weight:700;color:var(--accent-strong)}.dk i{font-style:normal;font-weight:500;font-size:10px;color:var(--text-muted)}.dk.bad{background:var(--danger-soft);color:var(--danger)}
.sub{font-size:13px;font-weight:600;margin-top:12px;color:var(--text-muted)}
.keybox{font-family:ui-monospace,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent-strong);border-radius:10px;padding:12px;margin:10px 0;word-break:break-all;user-select:all}
.msg.inf{background:var(--info-soft);color:var(--info)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--text-muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblw table{min-width:640px}
.tblw th{white-space:nowrap}
td.ipbox,td.num{white-space:nowrap;word-break:normal}
.hint{font-size:13px;color:var(--text-muted);margin-top:10px}
.ipbox{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all;color:var(--text-muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent-strong);border-bottom-color:var(--accent)}
.badge{display:inline-block;white-space:nowrap;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-muted);font-weight:600}
.badge.ok{background:var(--accent-soft);color:var(--accent-strong)}
.badge.no{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--danger-soft);color:var(--danger)}
.strike{text-decoration:line-through;color:var(--text-faint)}
.alert{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.tab.warn{color:var(--danger)}
.tab.warn.on{border-bottom-color:var(--danger)}
.card.mc{border-left:4px solid var(--danger)}
.card.mc.ok{border-left-color:var(--accent)}
@media (max-width:620px){.wide .top{flex-wrap:wrap}.wide .top .sp{flex-basis:100%;height:0}.wide .top .btn{margin-left:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
/* màn hình chung */
.tram{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;padding:24px;max-width:1300px;margin:0 auto}
@media (max-width:820px),(orientation:portrait){.tram{grid-template-columns:1fr;padding:16px}}
.clock{font-size:clamp(44px,8vw,84px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.qrbox{background:#fff;border-radius:18px;padding:14px;width:min(100%,380px);aspect-ratio:1;margin:16px 0 8px;box-shadow:var(--shadow)}
.qrbox svg{width:100%;height:100%;display:block}
.qrbox svg rect[fill="#ffffff"],.qrbox svg path{shape-rendering:crispEdges}
.bar{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;width:min(100%,380px)}
.bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.who{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.who:last-child{border-bottom:0}
.who{align-items:flex-start;flex-wrap:wrap}
.luot{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.vao{background:var(--accent-soft);color:var(--accent-strong)}
.chip.ra{background:var(--info-soft);color:var(--info)}
.vuabox{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.vua{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:17px}
.vua span{font-variant-numeric:tabular-nums}
.empty{padding:20px 0;color:var(--text-faint);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
var ROUTE = '{{ROUTE}}', VER = '{{VER}}';
var $ = function (s, r) { return (r || document).querySelector(s); };
var app = $('#app');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return String(n).padStart(2, '0'); }
var VN = 7 * 3600e3;
function vp(t) { var d = new Date(t + VN); return { d: pad(d.getUTCDate()), m: pad(d.getUTCMonth() + 1), y: d.getUTCFullYear(), h: pad(d.getUTCHours()), mi: pad(d.getUTCMinutes()), s: pad(d.getUTCSeconds()), wd: d.getUTCDay() }; }
function fDate(t) { var q = vp(t); return q.d + '/' + q.m + '/' + q.y; }
function fTime(t) { var q = vp(t); return q.h + ':' + q.mi; }
function fTimeS(t) { var q = vp(t); return q.h + ':' + q.mi + ':' + q.s; }
var THU = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
var CACH = { wifi: 'Wi-Fi', qr: 'QR', tay: 'Nhập tay' };
function api(path, body) {
  var o = body === undefined ? { credentials: 'same-origin' } : { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) };
  return fetch(path, o).then(function (r) { return r.json().catch(function () { return { ok: false, loi: 'Máy chủ trả lời không đúng (mã ' + r.status + ').' }; }).then(function (j) { j._status = r.status; return j; }); })
    .catch(function () { return { ok: false, loi: 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.', _status: 0 }; });
}
function hdr(sub, right) {
  return '<div class="top"><img src="/icon.svg" alt=""><div><div class="t1">Chấm công</div><div class="t2">' + esc(sub || '') + '</div></div><div class="sp"></div>' + (right || '') + '</div>';
}
function foot() { return '<p class="faint small" style="text-align:center;margin-top:18px">Quản trị tử tế · bản thử nghiệm ' + esc(VER) + '</p>'; }
function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent); }
function standalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

/* ================= NHÂN VIÊN (/ và /q) ================= */
var qrToken = new URLSearchParams(location.search).get('t');
var qrPass = null, qrPassExp = 0, qrErr = '';
function hasPass() { return qrPass && Date.now() < qrPassExp; }
function loginView(st, note) {
  app.innerHTML = '<div class="wrap">' + hdr(st.ten_cty || '') +
    '<div class="card"><h2 style="font-size:20px">Đăng nhập</h2>' +
    (note ? '<div class="msg inf">' + esc(note) + '</div>' : '') +
    '<label class="lbl" for="ma">Mã nhân viên</label><input id="ma" type="text" autocapitalize="characters" autocomplete="username" placeholder="VD: NV001">' +
    '<label class="lbl" for="pin">Mã PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Do kế toán cấp">' +
    '<div style="margin-top:14px"><button class="btn pri full" id="go">Đăng nhập</button></div><div id="out"></div>' +
    '<p class="hint">Chỉ cần đăng nhập một lần trên điện thoại này.</p></div>' + foot() + '</div>';
  function go() {
    var b = $('#go'); b.disabled = true;
    api('/api/dang-nhap', { ma: $('#ma').value, pin: $('#pin').value }).then(function (j) {
      b.disabled = false;
      if (j.ok) return boot(); $('#out').innerHTML = '<div class="msg err">' + esc(j.loi) + '</div>';
    });
  }
  $('#go').onclick = go; $('#pin').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('#ma').focus();
}
function nvView(st) {
  var today0 = Math.floor((st.now + VN) / 864e5) * 864e5 - VN;
  var mine = st.thang || [], todayList = mine.filter(function (r) { return r.t >= today0; }), pastToday = todayList.filter(function (r) { return r.t <= st.now; });
  var last = pastToday[pastToday.length - 1];
  var next = last && last.loai === 'vao' ? 'ra' : 'vao';
  var other = next === 'vao' ? 'ra' : 'vao';
  var LB = { vao: 'Vào ca', ra: 'Ra ca' };
  var q = vp(st.now);
  var wifiPill = st.wifi ? '<span class="pill ok"><span class="dot"></span>Đang ở mạng văn phòng</span>'
    : '<span class="pill no"><span class="dot"></span>Chưa nhận ra mạng văn phòng</span>';
  var qrPill = hasPass() ? '<span class="pill inf" id="qrpill">Đã quét mã QR</span>' : '';
  var h = '<div class="wrap">' + hdr(st.ten_cty || '', '<button class="btn sm" id="out-btn">Đăng xuất</button>') +
    '<div class="card"><div class="muted small">' + THU[q.wd] + ', ' + fDate(st.now) + '</div>' +
    '<h2 style="font-size:21px;margin:2px 0 10px">Xin chào, ' + esc(st.me.ten) + '</h2>' +
    '<div class="row">' + wifiPill + qrPill + '</div>' +
    (st.ip ? '<div class="ipbox" style="margin-top:8px">IP lượt này (' + esc(st.ip_loai) + '): ' + esc(st.ip) + '</div>' : '') +
    '<div style="margin-top:14px"><button class="big ' + next + '" id="b-main" data-l="' + next + '">' + LB[next] + '<small id="clk">' + fTimeS(Date.now()) + '</small></button>' +
    '<button class="btn alt" id="b-alt" data-l="' + other + '">Chấm ' + LB[other].toLowerCase() + '</button></div>' +
    '<div id="res"></div>' +
    (!st.wifi && !hasPass() && st.che_do !== 'chi_wifi' ? '<p class="hint">Nếu không chấm được qua Wi-Fi: mở <b>camera</b> điện thoại, quét mã QR trên màn hình chung.</p>' : '') +
    (!st.wifi ? '<div class="row" style="margin-top:8px"><button class="btn sm" id="recheck">Kiểm tra lại mạng</button></div>' : '') +
    '</div>';
  h += '<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Hôm nay</h3>' + (todayList.length ? '<table><tbody>' + todayList.map(function (r) {
    return '<tr><td class="num">' + fTime(r.t) + '</td><td>' + (r.loai === 'vao' ? 'Vào' : 'Ra') + '</td><td class="muted">' + CACH[r.cach] + '</td></tr>';
  }).join('') + '</tbody></table>' : '<div class="empty">Chưa có lượt chấm</div>') + '</div>';
  var days = {};
  mine.forEach(function (r) { var k = fDate(r.t), o = days[k] || (days[k] = { t: r.t, vao: null, ra: null, n: 0 }); o.n++; if (r.loai === 'vao' && !o.vao) o.vao = r.t; if (r.loai === 'ra') o.ra = r.t; });
  var keys = Object.keys(days).sort(function (a, b) { return days[b].t - days[a].t; });
  h += '<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Tháng ' + q.m + '/' + q.y + '</h3>' + (keys.length ? '<table><thead><tr><th>Ngày</th><th>Vào</th><th>Ra</th></tr></thead><tbody>' + keys.map(function (k) {
    var o = days[k]; return '<tr><td class="num">' + k.slice(0, 5) + ' <span class="faint small">' + THU[vp(o.t).wd].replace('Thứ ', 'T').replace('Chủ nhật', 'CN') + '</span></td><td class="num">' + (o.vao ? fTime(o.vao) : '–') + '</td><td class="num">' + (o.ra ? fTime(o.ra) : '–') + '</td></tr>';
  }).join('') + '</tbody></table>' : '<div class="empty">Chưa có dữ liệu tháng này</div>') + '<p class="hint">Bảng công chính thức do kế toán chốt cuối tháng.</p></div>';
  /* ----- 0.3.1: công tạm tính, xác nhận công tháng, đơn nghỉ ----- */
  var C = st.cong || [], need = C.filter(function (c) { return !c.du_lieu.tam && c.xn === 0; })[0], tam = C.filter(function (c) { return c.du_lieu.tam; })[0];
  function congBox(c) { var d = c.du_lieu || {}; return '<div class="kv"><div><span>Ngày công</span><b>' + (d.cong != null ? d.cong : '–') + '</b></div><div><span>Nghỉ phép, lễ</span><b>' + ((d.phep || 0) + (d.le || 0)) + '</b></div><div><span>Công hưởng lương</span><b>' + (d.huong != null ? d.huong : '–') + '</b></div><div><span>Tăng ca</span><b>' + (d.tc || 0) + 'h</b></div></div>' +
    (d.ngay ? '<div class="days">' + Object.keys(d.ngay).sort().map(function (k) { return '<span class="dk' + (/^\?|KP|KL/.test(d.ngay[k]) ? ' bad' : '') + '"><i>' + k + '</i>' + esc(d.ngay[k]) + '</span>'; }).join('') + '</div>' : ''); }
  if (need) h = h.replace('<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Hôm nay</h3>', '<div class="card hl"><h3 style="font-size:16px;margin-bottom:6px">Xác nhận công tháng ' + need.ym.slice(5) + '/' + need.ym.slice(0, 4) + '</h3><p class="muted small">Kế toán đã chốt công. Kiểm tra rồi xác nhận, hoặc báo ngày sai.</p>' + congBox(need) +
    '<div class="row" style="margin-top:12px"><button class="btn pri" id="xn-ok">Đúng, tôi xác nhận</button><button class="btn" id="xn-sai">Báo sai</button></div><div id="xn-f" style="display:none;margin-top:10px"><label class="lbl" for="xn-ph">Ngày nào sai, sai thế nào?</label><textarea id="xn-ph" rows="3"></textarea><button class="btn pri" id="xn-go" style="margin-top:8px">Gửi kế toán</button></div><div id="xn-res"></div></div>' +
    '<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Hôm nay</h3>');
