<style>
:root{--paper:#F4EFE5;--ink:#231E19;--ink2:#6A6157;--green:#3E6B34;--green2:#2F4A2B;--org:#F2A93B}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:var(--paper);font-family:Lexend,sans-serif;color:var(--ink);position:relative;overflow:hidden}
.bar{position:absolute;top:0;left:0;right:0;height:10px;background:var(--green2)}
.wrap{position:absolute;inset:0;padding:62px 60px 0}
.kick{font-family:"IBM Plex Mono",monospace;font-size:24px;letter-spacing:.06em;color:var(--green);text-transform:uppercase}
h1{font-size:56px;line-height:1.12;font-weight:700;margin-top:14px;letter-spacing:-.01em;text-wrap:balance}
h1.big{font-size:70px;line-height:1.08}
ul{list-style:none;padding:0;margin-top:20px}
li{position:relative;padding-left:34px;font-size:30px;line-height:1.38;color:var(--ink2);margin:6px 0}
li::before{content:"";position:absolute;left:2px;top:15px;width:14px;height:14px;border-radius:3px;background:var(--green)}
.shot{position:absolute;left:60px;right:60px;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px -12px rgba(45,35,20,.35),0 0 0 1px rgba(0,0,0,.06);background:#fff}
.shot img{display:block;width:100%}
.pills{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.pill{font-size:28px;padding:9px 24px;border-radius:99px;background:#E8DFCF;color:var(--ink)}
.pill.o{background:var(--org);font-weight:600;color:#3A2600}
.foot{position:absolute;left:60px;right:60px;bottom:40px;display:flex;align-items:center;gap:16px}
.foot img{width:64px;height:64px;object-fit:contain}
.foot b{display:block;font-size:30px;font-weight:600}
.foot small{display:block;font-family:"IBM Plex Mono",monospace;font-size:17px;color:var(--ink2);letter-spacing:.04em}
.foot .r{margin-left:auto;font-size:22px;color:var(--ink2)}
.dom{position:absolute;top:34px;right:26px;width:150px}
.phones{position:absolute;left:40px;right:40px;display:flex;gap:24px;justify-content:center;align-items:flex-start}
.ph{border-radius:34px;overflow:hidden;box-shadow:0 18px 44px -12px rgba(45,35,20,.38),0 0 0 7px #1d2a1f;background:#fff;flex:none}
.ph img{display:block;width:100%}
.float{position:absolute;border-radius:30px;overflow:hidden;box-shadow:0 24px 50px -10px rgba(20,15,5,.45),0 0 0 7px #1d2a1f;background:#fff}
.float img{display:block;width:100%}
.tags{position:absolute;left:60px;right:60px;display:flex;flex-wrap:wrap;gap:12px}
.tags span{font-size:25px;background:#fff;border:1px solid #E3D9C6;border-radius:12px;padding:8px 16px;color:var(--ink)}
.tags span::before{content:"✓ ";color:var(--green);font-weight:700}
</style></head><body><div class="bar" id="bar"></div><div class="wrap" id="w"></div>

 7:{k:'App nhân viên',t:'Hồ sơ, hợp đồng, hành trình của chính mình',b:['Xem, tải bản scan giấy tờ đã nộp','Mốc vào làm, ký hợp đồng, điều chỉnh lương'],phones:['14-ban.png','19-ban-hs.png','18-ban-ht.png']},

 13:{k:'Cổng tuyển dụng',t:'Trang tuyển dụng mở trên mọi điện thoại',b:['Mỗi vị trí một link, chia sẻ Facebook, Zalo','Ứng viên nộp CV, hồ sơ tự về phần mềm'],phones:['m-list.png','m-job.png','m-form.png']},

 21:{k:'Kết quả phỏng vấn',t:'Thư đúng kết quả, soạn sẵn',b:['Thư mời nhận việc hoặc thư cảm ơn, thông báo kết quả','Chặn lương thử việc dưới 85% (Điều 26 Bộ luật Lao động)'],img:'k-kq.png',wide:1},
 22:{k:'Chuyển thành nhân sự',t:'Ứng viên đạt thành nhân sự, không nhập lại',b:['Form hồ sơ nhân sự tự điền từ thông tin ứng viên','Phiếu nhu cầu tự chuyển Đã đủ người'],img:'k-tonv.png'}

var n = +location.hash.slice(1) || 1, d = P[n], w = document.getElementById('w'), BOT = 1350 - 140;
function ul(b) { return '<ul>' + b.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
function phones(list, top) {
  var el = document.createElement('div'); el.className = 'phones'; el.style.top = top + 'px';
  var gap = 24, maxW = (960 - gap * (list.length - 1)) / list.length, maxH = BOT - top, wd = Math.min(maxW, list.length === 2 ? 380 : 330, maxH * 780 / 1688);
  el.innerHTML = list.map(function (s) { return '<div class="ph" style="width:' + wd + 'px"><img src="' + s + '"></div>'; }).join('');
  w.appendChild(el);
}
if (d.hero) {
  document.getElementById('bar').style.display = 'none';
  w.innerHTML = '<img class="dom" src="/assets/dom/dom-19-hoan-thanh-sang.webp" alt=""><div class="kick">' + d.k + '</div><h1 class="big" style="max-width:860px">' + d.t + '</h1>';
  requestAnimationFrame(function () {
    var y = w.querySelector('h1').getBoundingClientRect().bottom + 26, tg = document.createElement('div'); tg.className = 'tags'; tg.style.top = y + 'px';
    tg.innerHTML = d.tags.map(function (x) { return '<span>' + x + '</span>'; }).join(''); w.appendChild(tg);
    var y2 = tg.getBoundingClientRect().bottom + 34;
    if (d.phones) phones(d.phones, y2);
    else {
      var sh = document.createElement('div'); sh.className = 'shot'; sh.style.cssText = 'left:24px;right:150px;top:' + y2 + 'px;border-radius:16px;max-height:' + (BOT - y2 - 10) + 'px'; sh.innerHTML = '<img src="' + d.desk + '">'; w.appendChild(sh);
      var fl = document.createElement('div'); fl.className = 'float'; fl.style.cssText = 'width:270px;right:36px;bottom:' + (1350 - BOT + 6) + 'px'; fl.innerHTML = '<img src="' + d.float + '">'; w.appendChild(fl);
    }
  });
} else {
  w.innerHTML = '<div class="kick">' + d.k + '</div><h1>' + d.t + '</h1>' + ul(d.b);
  requestAnimationFrame(function () {
    var top = w.querySelector('ul').getBoundingClientRect().bottom + 40;
    if (d.phones) return phones(d.phones, top);
    var sh = document.createElement('div'); sh.className = 'shot'; sh.innerHTML = '<img src="' + d.img + '">'; w.appendChild(sh);
    var max = BOT - top; sh.style.top = top + 'px'; if (d.wide) { sh.style.left = '20px'; sh.style.right = '20px'; sh.style.borderRadius = '14px'; }
    var im = sh.querySelector('img'); im.onload = fit; if (im.complete) fit();
    function fit() { var r = im.naturalHeight / im.naturalWidth, wd = d.wide ? 1040 : 960, h = wd * r; if (h > max) { var nw = max / r; sh.style.left = (1080 - nw) / 2 + 'px'; sh.style.right = 'auto'; sh.style.width = nw + 'px'; } }
  });
}
