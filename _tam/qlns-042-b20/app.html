<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F7D4F">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chấm công">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<title>Chấm công</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4EFE5;--surface:#FBF8F2;--surface-2:#F7F2E8;--surface-3:#EFE7D8;
  --border:#E3DACB;--border-strong:#D3C7B4;
  --text:#231E19;--text-muted:#6B6259;--text-faint:#988D80;
  --accent:#2F7D4F;--accent-2:#3E9A63;--accent-strong:#245F3D;--accent-soft:#E3F1E8;--on-accent:#fff;
  --info:#2F5F8F;--info-soft:#E2ECF5;--warn:#9A5A16;--warn-soft:#F6E7D3;--danger:#A63A2B;--danger-soft:#F8E3DE;
  --shadow:0 1px 2px rgba(35,30,25,.06),0 10px 28px -12px rgba(35,30,25,.22);
  --f-ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210;--surface:#1D1A17;--surface-2:#191613;--surface-3:#26221D;--border:#332E28;--border-strong:#443D35;
  --text:#ECE6DB;--text-muted:#A69C8F;--text-faint:#7C7368;
  --accent:#6CC08C;--accent-2:#58B07C;--accent-strong:#8AD3A6;--accent-soft:#1C2E23;--on-accent:#0E1A12;
  --info:#8DB6E0;--info-soft:#1B2633;--warn:#E8B06A;--warn-soft:#3A2C1C;--danger:#E58B7C;--danger-soft:#3A1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210;--surface:#1D1A17;--surface-2:#191613;--surface-3:#26221D;--border:#332E28;--border-strong:#443D35;
  --text:#ECE6DB;--text-muted:#A69C8F;--text-faint:#7C7368;
  --accent:#6CC08C;--accent-2:#58B07C;--accent-strong:#8AD3A6;--accent-soft:#1C2E23;--on-accent:#0E1A12;
  --info:#8DB6E0;--info-soft:#1B2633;--warn:#E8B06A;--warn-soft:#3A2C1C;--danger:#E58B7C;--danger-soft:#3A1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{margin:0;font-weight:650;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1080px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top img{width:34px;height:34px;border-radius:9px}
.top .t1{font-weight:650;font-size:16px;line-height:1.2}
.top .t2{font-size:12.5px;color:var(--text-muted)}
.top .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--text-muted)}.faint{color:var(--text-faint)}.small{font-size:13px}
.lbl{display:block;font-size:13px;color:var(--text-muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=tel],select{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2);font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:14px;min-height:42px}
.btn:hover{background:var(--surface-3)}
a.btn{text-decoration:none;color:var(--text)}
.btn{white-space:nowrap}
.top .btn{margin-left:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-strong)}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.big{width:100%;min-height:120px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);font-size:26px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow)}
.big small{font-size:14px;font-weight:500;opacity:.9}
.big.ra{background:var(--info)}
.big:active{transform:scale(.99)}
.alt{margin-top:10px;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--accent-strong)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--danger-soft);color:var(--danger)}
.pill.inf{background:var(--info-soft);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.msg{padding:12px 14px;border-radius:12px;margin:12px 0 0;font-size:14.5px}
.msg.ok{background:var(--accent-soft);color:var(--accent-strong)}
.msg.err{background:var(--danger-soft);color:var(--danger)}
/* 0.3.1 */
textarea,input[type=date]{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2);font:inherit;font-size:16px;color:inherit}
.card.hl{border:2px solid var(--accent)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.kv div{background:var(--surface-2);border-radius:10px;padding:7px 8px}.kv span{display:block;font-size:11.5px;color:var(--text-muted)}.kv b{font-size:17px}
.days{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.dk{display:inline-flex;flex-direction:column;align-items:center;min-width:34px;padding:3px 2px;border-radius:7px;background:var(--accent-soft);font-size:12px;font-weight:700;color:var(--accent-strong)}.dk i{font-style:normal;font-weight:500;font-size:10px;color:var(--text-muted)}.dk.bad{background:var(--danger-soft);color:var(--danger)}
.sub{font-size:13px;font-weight:600;margin-top:12px;color:var(--text-muted)}
.keybox{font-family:ui-monospace,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent-strong);border-radius:10px;padding:12px;margin:10px 0;word-break:break-all;user-select:all}
.msg.inf{background:var(--info-soft);color:var(--info)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--text-muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblw table{min-width:640px}
.tblw th{white-space:nowrap}
td.ipbox,td.num{white-space:nowrap;word-break:normal}
.hint{font-size:13px;color:var(--text-muted);margin-top:10px}
.ipbox{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all;color:var(--text-muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent-strong);border-bottom-color:var(--accent)}
.badge{display:inline-block;white-space:nowrap;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-muted);font-weight:600}
.badge.ok{background:var(--accent-soft);color:var(--accent-strong)}
.badge.no{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--danger-soft);color:var(--danger)}
.strike{text-decoration:line-through;color:var(--text-faint)}
.alert{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.tab.warn{color:var(--danger)}
.tab.warn.on{border-bottom-color:var(--danger)}
.card.mc{border-left:4px solid var(--danger)}
.card.mc.ok{border-left-color:var(--accent)}
@media (max-width:620px){.wide .top{flex-wrap:wrap}.wide .top .sp{flex-basis:100%;height:0}.wide .top .btn{margin-left:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
/* trang Mã QR chấm công */
.tram{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;padding:24px;max-width:1300px;margin:0 auto}
@media (max-width:820px),(orientation:portrait){.tram{grid-template-columns:1fr;padding:16px}}
.clock{font-size:clamp(44px,8vw,84px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.qrbox{background:#fff;border-radius:18px;padding:14px;width:min(100%,380px);aspect-ratio:1;margin:16px 0 8px;box-shadow:var(--shadow)}
.qrbox svg{width:100%;height:100%;display:block}
.qrbox svg rect[fill="#ffffff"],.qrbox svg path{shape-rendering:crispEdges}
.bar{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;width:min(100%,380px)}
.bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.who{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.who:last-child{border-bottom:0}
.who{align-items:flex-start;flex-wrap:wrap}
.luot{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.vao{background:var(--accent-soft);color:var(--accent-strong)}
.chip.ra{background:var(--info-soft);color:var(--info)}
.vuabox{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.vua{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:17px}
.vua span{font-variant-numeric:tabular-nums}
.empty{padding:20px 0;color:var(--text-faint);text-align:center}
/* bản thử – hướng dẫn trải nghiệm */
.demo{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:13px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.demo b{font-weight:700}.demo a{color:inherit;font-weight:600}.demo .sp{flex:1}
.demo a.on{text-decoration:none;background:var(--surface);border-radius:999px;padding:1px 9px}
.gd{border:2px solid var(--info);background:var(--surface)}
.gd .gh{display:flex;align-items:flex-start;gap:10px}.gd .gh h3{font-size:16px;flex:1}
.gd p.ds{margin:4px 0 10px;color:var(--text-muted);font-size:14px}
.gd ol{margin:0;padding:0;list-style:none;counter-reset:g}
.gd li{counter-increment:g;position:relative;padding:8px 0 8px 36px;border-top:1px dashed var(--border);font-size:14.5px}
.gd li:first-child{border-top:0}
.gd li::before{content:counter(g);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--info);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.gd li small{display:block;color:var(--text-muted);font-size:13px;margin-top:2px}
.gd.min ol,.gd.min p.ds{display:none}
.qrsm{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.qrsm img{width:132px;height:132px;background:#fff;border-radius:10px;padding:6px}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:6px}.kv2 dt{color:var(--text-muted)}.kv2 dd{margin:0;font-weight:600}
.soon{border-style:dashed;background:var(--surface-2)}
.pick{display:grid;grid-template-columns:1fr;gap:6px;max-height:300px;overflow:auto;margin-top:6px}
.pick button{text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.gd a,.card a:not(.btn){color:var(--info)}
.pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.pick b{font-size:14px}.pick small{color:var(--text-muted);font-size:12px}
.pick .h{font-size:12px;font-weight:700;color:var(--text-muted);margin:6px 0 0}
.tram .gd{margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--text)}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.cal .h{font-size:11px;color:var(--text-muted);text-align:center;font-weight:600}
.cal .cd{border:1px solid var(--border);border-radius:8px;min-height:44px;padding:3px 4px;display:flex;flex-direction:column;align-items:center;background:var(--surface)}
.cal .cd i{font-style:normal;font-size:10.5px;color:var(--text-faint);align-self:flex-start}.cal .cd b{font-size:13px}
.cal .cd.we{background:var(--surface-2)}.cal .cd.oth b{color:var(--info)}.cal .cd.bad{border-color:var(--warn);background:var(--warn-soft)}.cal .cd.bad b{color:var(--warn)}.cal .cd.now{border-color:var(--accent)}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px}.lnav b{font-size:14px}.lnav .btn{min-height:34px;padding:4px 14px}
.lweek{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--border)}.lrow:first-child{border-top:0}.lrow.now{background:var(--accent-soft)}.lrow.su .ld b{color:var(--warn)}
.ld{display:flex;flex-direction:column;min-width:46px;font-size:12px;color:var(--text-muted);line-height:1.2}.ld b{font-size:14px;color:var(--text)}
.lc{display:flex;flex-wrap:wrap;gap:6px}
.lp{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 9px 4px 4px;font-size:13px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--text)}
.lp b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;background:var(--c);color:#fff;font-size:12px}
.lreg{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.lrr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-top:1px dashed var(--border)}.lrr:first-child{border-top:0}.lrr.cf{background:var(--danger-soft);border-radius:8px;padding:7px 6px}
.lopts{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.lo{min-width:40px;height:36px;padding:0 10px;border-radius:9px;border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--border));background:var(--surface);color:var(--c);font-weight:700;font-size:13px}
.lo.on{background:var(--c);border-color:var(--c);color:#fff}.lo.kh{font-weight:600}
.lcf{flex-basis:100%;font-size:12.5px;color:var(--danger);font-weight:600;padding-left:56px}
.lleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--text-muted)}.lleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}

/* ===== 11/11 app nhân viên (anh duyệt 14:57, góp ý vòng 2 15:32): khung điện thoại trên máy tính, lời chào có cảnh nền ===== */
.nvx{--m:#3F6B35;--m2:#5C8A4A;--mbg:#F4F2EA;--mcard:#fff;--mline:#EAE6DA;--mtx:#1F2A1C;--mmut:#5F6B5A;--mws:#E3EFD9;--mwt:#2F6B2A;--mwarn:#FFF8EB;--mwarnb:#F0C98A;--mwarnt:#A35F0F;--mwarns:#FCEFD9;--minf:#E1ECF6;--minft:#235E91;--merr:#FDE7E7;--merrt:#B42318;--mhol:#F3E8FB;--mholt:#7A3E9D;--mbh:#E2F2F1;--mbht:#1F6F6A;--moff:#F1EFE8;--shadow:0 1px 2px rgba(31,42,28,.06),0 6px 18px rgba(31,42,28,.06);
  position:relative;min-height:100vh;background:var(--mbg);color:var(--mtx);font-family:"Be Vietnam Pro",var(--f-ui);font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nvx{--m:#8BC17A;--m2:#4E7A40;--mbg:#121410;--mcard:#1C1F19;--mline:#2C3027;--mtx:#E8EBE2;--mmut:#A3AC9C;--mws:#21321B;--mwt:#9BD38A;--mwarn:#2B2416;--mwarnb:#6B5226;--mwarnt:#E8B06A;--mwarns:#3A2C1C;--minf:#1A2532;--minft:#8DB6E0;--merr:#3A1F1A;--merrt:#E58B7C;--mhol:#2C2136;--mholt:#CFA6EA;--mbh:#15302E;--mbht:#7FD1C9;--moff:#22251F;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"] .nvx{--m:#8BC17A;--m2:#4E7A40;--mbg:#121410;--mcard:#1C1F19;--mline:#2C3027;--mtx:#E8EBE2;--mmut:#A3AC9C;--mws:#21321B;--mwt:#9BD38A;--mwarn:#2B2416;--mwarnb:#6B5226;--mwarnt:#E8B06A;--mwarns:#3A2C1C;--minf:#1A2532;--minft:#8DB6E0;--merr:#3A1F1A;--merrt:#E58B7C;--mhol:#2C2136;--mholt:#CFA6EA;--mbh:#15302E;--mbht:#7FD1C9;--moff:#22251F;--shadow:0 1px 2px rgba(0,0,0,.4)}
.nvx a{color:var(--m)}
.nvx-scr{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.nvx-sb{display:none}
/* máy tính, máy tính bảng ngang: hiện trong khung điện thoại */
@media (min-width:700px){
  body:has(.nvx-wrap){background:radial-gradient(1200px 600px at 20% 0%,#E7EEDD,transparent 60%),radial-gradient(900px 500px at 100% 100%,#EFE6D2,transparent 60%),#ECEBE4}
  .nvx-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:24px}
  .nvx-wrap>.demo{align-self:stretch}
  .nvx{transform:translateZ(0);width:392px;height:min(844px,calc(100vh - 96px));min-height:620px;margin-top:24px;border-radius:48px;border:11px solid #1C1E1A;box-shadow:0 30px 70px -20px rgba(30,40,25,.45),0 0 0 1px #3a3d36;overflow:hidden}
  .nvx-scr{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.nvx-scr::-webkit-scrollbar{display:none}
  .nvx-sb{display:flex;justify-content:space-between;align-items:center;position:absolute;top:0;left:0;right:0;z-index:30;height:34px;padding:0 26px;font:600 13px "Be Vietnam Pro",sans-serif;color:var(--mtx);pointer-events:none}
  .nvx-sb span{display:flex;align-items:flex-end;gap:2px}.nvx-sb i{width:3px;background:currentColor;border-radius:1px}.nvx-sb i:nth-child(1){height:4px}.nvx-sb i:nth-child(2){height:6px}.nvx-sb i:nth-child(3){height:8px}.nvx-sb i:nth-child(4){height:10px}.nvx-sb em{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;margin-left:5px;box-shadow:inset 13px 0 0 currentColor}
  .nvx-sb:before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:#1C1E1A}
  .nvx:has(.nvx-hero) .nvx-sb{color:#fff}
  .nvx-hero,.nvx-hd{padding-top:44px!important}
}
/* lời chào */

    (d.tu_choi.length ? d.tu_choi.map(function (r) { return '<tr><td class="num small">' + fTimeS(r.t) + ' ' + fDate(r.t) + '</td><td>' + esc(r.ma ? (nvMap[r.ma] || r.ma) : '') + '</td><td class="ipbox">' + esc(r.ip) + '</td><td class="small">' + esc(r.tb) + '</td><td class="small">' + esc(r.ly_do) + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="empty">Chưa có lượt bị từ chối</td></tr>') + '</tbody></table></div></div>';
}
function tabCd() {
  var c = QL.d.cfg;
  $('#body').innerHTML = (DEMO ? '<div class="msg inf" style="margin:0 0 12px">Bản thử dùng chung cho mọi người nên các nút ở trang này bị khóa (đổi chế độ, mã PIN, mã QR, mã kết nối, xóa dữ liệu). Khi triển khai riêng cho công ty thì dùng được đầy đủ.</div>' : '') + '<div class="card"><h3 style="font-size:16px">Cách chấm công</h3>' +
    '<label class="lbl">Chế độ</label><select id="c-mode"><option value="wifi_hoac_qr">Wi-Fi văn phòng, hoặc quét QR khi không có Wi-Fi (khuyến nghị)</option><option value="chi_wifi">Chỉ Wi-Fi văn phòng</option><option value="chi_qr">Chỉ quét QR trên trang Mã QR chấm công</option></select>' +
    '<label class="lbl">IP do trang Mã QR chấm công báo còn hiệu lực (giờ)</label><input id="c-gio" type="tel" inputmode="numeric" value="' + esc(c.ip_gio) + '" style="max-width:120px">' +
    '<label class="row" style="margin-top:12px;gap:8px"><input type="checkbox" id="c-ip"' + (c.hien_ip === '1' ? ' checked' : '') + '> Hiện IP cho nhân viên (bật khi test)</label>' +
    '<label class="lbl">Tên đơn vị</label><input id="c-ten" type="text" value="' + esc(c.ten_cty) + '">' +
    '<div style="margin-top:12px"><button class="btn pri" id="c-go">Lưu</button></div></div>' +
    '<div class="card"><h3 style="font-size:16px">Kết nối Phần mềm quản lý nhân sự</h3><p class="muted small">Phần mềm nhân sự dùng mã kết nối để đẩy danh sách nhân viên, mã PIN và lấy lượt chấm, đơn nghỉ về bảng công. ' + (c.ket_noi ? '<b>Đã có mã kết nối</b>' + (c.sync_at ? ' (tạo ' + fDate(+c.sync_at) + ')' : '') + '. Tạo mã mới thì mã cũ hết hiệu lực.' : 'Chưa có mã kết nối.') + '</p><button class="btn pri" id="c-key">' + (c.ket_noi ? 'Tạo mã kết nối mới' : 'Tạo mã kết nối') + '</button><div id="c-keyo"></div></div>' +
    '<div class="card"><h3 style="font-size:16px">Bảo mật</h3><label class="lbl">Đổi mã PIN quản lý (6–12 chữ số)</label><div class="row"><input id="c-pin" type="password" inputmode="numeric" style="max-width:220px"><button class="btn" id="c-pgo">Đổi PIN</button></div>' +
    '<p class="hint">Đổi mã QR bí mật: mọi mã QR cũ (kể cả ảnh chụp) hết hiệu lực ngay.</p><button class="btn" id="c-qr">Đổi mã QR bí mật</button></div>' +
    '<div class="card"><h3 style="font-size:16px">Dữ liệu thử</h3><p class="muted small">Xóa toàn bộ lượt chấm và lượt bị từ chối (giữ nhân viên, IP, cài đặt). Dùng khi test xong muốn làm lại từ đầu.</p><div class="row"><input id="c-xoa" type="text" placeholder="Gõ XOA" style="max-width:140px"><button class="btn dan" id="c-xgo">Xóa dữ liệu chấm công</button></div></div>';
  $('#c-mode').value = c.che_do;
  $('#c-go').onclick = function () { api('/api/ql/cfg', { che_do: $('#c-mode').value, ip_gio: $('#c-gio').value, hien_ip: $('#c-ip').checked, ten_cty: $('#c-ten').value }).then(function (j) { after(j, 'Đã lưu cài đặt.'); }); };
  $('#c-pgo').onclick = function () { api('/api/ql/cfg', { pin_moi: $('#c-pin').value }).then(function (j) { if (j.ok) qlLogin(); else say(esc(j.loi), 'err'); }); };
  $('#c-key').onclick = function () { if (QL.d.cfg.ket_noi && !confirmBox('Tạo mã mới thì Phần mềm nhân sự đang kết nối phải nhập lại mã. Tiếp tục?')) return; api('/api/ql/cfg', { tao_ma_ket_noi: true }).then(function (j) { if (!j.ok) return say(esc(j.loi), 'err'); $('#c-keyo').innerHTML = '<p class="small" style="margin-top:12px">Mở <b>Phần mềm quản lý nhân sự → Chấm công → Chấm công Wi‑Fi</b>, dán 2 thông tin sau. <b>Mã chỉ hiện một lần</b> – chép ngay.</p><div class="small muted">Địa chỉ máy chủ</div><div class="keybox">' + esc(location.origin) + '</div><div class="small muted">Mã kết nối</div><div class="keybox">' + esc(j.ma_ket_noi) + '</div>'; QL.d.cfg.ket_noi = true; }); };
  $('#c-qr').onclick = function () { api('/api/ql/cfg', { doi_qr: true }).then(function (j) { after(j, 'Đã đổi mã QR bí mật.'); }); };
  $('#c-xgo').onclick = function () { api('/api/ql/xoa-du-lieu', { xac_nhan: $('#c-xoa').value.trim() }).then(function (j) { after(j, 'Đã xóa dữ liệu chấm công.'); }); };
}

/* ================= KHỞI ĐỘNG ================= */
if (ROUTE === 'tram') {
  api('/api/trang-thai').then(function (st) { if (st.ok && !st.setup) { location.href = '/quan-ly'; return; } tramBoot(); });
} else if (ROUTE === 'ql') qlLoad();
else boot();
</script>
</body>
</html>
