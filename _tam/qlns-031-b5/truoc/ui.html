<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phần mềm quản lý nhân sự</title>
<meta name="description" content="Đọc thẳng thư mục Excel nhân sự: hồ sơ, hợp đồng, chấm công, nghỉ phép, bảng lương. Tự đối chiếu nhiều file, báo việc cần xử lý. Xử lý ngay trên máy, dữ liệu không gửi đi đâu.">
<link rel="icon" href="{{DOM}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ==========================================================================
   GIAO DIỆN 0.5 – "Bàn làm việc của người kiêm nhiệm"
   Nền trắng mát · chữ mực · xanh rêu cho thao tác · vàng Đốm chỉ để đánh dấu chỗ đang đứng
   ========================================================================== */
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --surface-2:#F0F3F1; --surface-3:#E6EBE8;
  --line:#E2E7E4; --line-2:#CDD5D0;
  --ink:#16212B; --ink-2:#3A4651; --muted:#5E6A74; --faint:#8D979F;
  --pri:#1D6A50; --pri-2:#23805F; --pri-ink:#134A38; --pri-soft:#E3F1EB; --pri-soft-2:#C9E5D8;
  --dom:#F2A93B; --dom-soft:#FDF1DC; --dom-ink:#8A5300;
  --info:#2C5E96; --info-soft:#E5EEF8;
  --warn:#A76300; --warn-soft:#FBEFD9;
  --danger:#B93A2A; --danger-soft:#FAE5E1;
  --rail:#16212B; --rail-2:#22303C; --rail-text:#C7D0D8; --rail-muted:#7E8B96;
  --s1:#1D6A50; --s2:#E0A040;
  --shadow-pop:0 1px 2px rgba(22,33,43,.06),0 18px 48px -18px rgba(22,33,43,.32);
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-lg:14px; --r:10px; --r-sm:7px;
  /* tên cũ dùng trong mã trang – trỏ về hệ mới */
  --bg:var(--paper); --border:var(--line); --border-strong:var(--line-2); --text:var(--ink); --text-muted:var(--muted); --text-faint:var(--faint);
  --accent:var(--pri); --accent-2:var(--pri-2); --accent-strong:var(--pri-ink); --accent-soft:var(--pri-soft); --accent-soft-strong:var(--pri-soft-2);
  --f-wall:var(--font); --font-ui:var(--font); --radius:var(--r-lg); --radius-sm:var(--r);
  --shadow-sm:none; --shadow-md:var(--shadow-pop);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1318; --surface:#151C23; --surface-2:#1A222B; --surface-3:#222C36; --line:#25303A; --line-2:#34414D;
  --ink:#E7ECEF; --ink-2:#C3CCD3; --muted:#98A4AE; --faint:#6E7A85;
  --pri:#4DBB93; --pri-2:#3FA67F; --pri-ink:#7DD3B1; --pri-soft:#16302A; --pri-soft-2:#1E4135;
  --dom:#F6B955; --dom-soft:#3A2C14; --dom-ink:#F6C878;
  --info:#8DB7E6; --info-soft:#1A2838; --warn:#E9B160; --warn-soft:#382A14; --danger:#EE8E7F; --danger-soft:#3A1E1A;
  --rail:#0A0E12; --rail-2:#18212A; --rail-text:#C7D0D8; --rail-muted:#6E7A85; --s1:#3FA67F; --s2:#D69A3F;
  --shadow-pop:0 1px 2px rgba(0,0,0,.5),0 18px 48px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1318; --surface:#151C23; --surface-2:#1A222B; --surface-3:#222C36; --line:#25303A; --line-2:#34414D;
  --ink:#E7ECEF; --ink-2:#C3CCD3; --muted:#98A4AE; --faint:#6E7A85;
  --pri:#4DBB93; --pri-2:#3FA67F; --pri-ink:#7DD3B1; --pri-soft:#16302A; --pri-soft-2:#1E4135;
  --dom:#F6B955; --dom-soft:#3A2C14; --dom-ink:#F6C878;
  --info:#8DB7E6; --info-soft:#1A2838; --warn:#E9B160; --warn-soft:#382A14; --danger:#EE8E7F; --danger-soft:#3A1E1A;
  --rail:#0A0E12; --rail-2:#18212A; --rail-text:#C7D0D8; --rail-muted:#6E7A85; --s1:#3FA67F; --s2:#D69A3F;
  --shadow-pop:0 1px 2px rgba(0,0,0,.5),0 18px 48px -18px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
::selection{background:var(--pri-soft-2)}
[hidden]{display:none!important}
a{color:var(--pri-ink)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-size:.94em}
.num,.r{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.up{color:var(--pri-ink)} .down{color:var(--danger)}
.nowrap{white-space:nowrap}

/* ---------------- Khung: thanh nhóm (rail) · cột module (panel) · nội dung ---------------- */
.shell{display:grid;grid-template-columns:72px 236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:4px;z-index:30}
.rail-brand{width:46px;height:46px;border-radius:99px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:#FBF3E4;border:none;position:relative;box-shadow:0 0 0 4px rgba(242,169,59,.16),0 0 22px rgba(242,169,59,.35)}
.rail-brand img{width:36px;height:36px;object-fit:contain}
.rail-g{width:60px;padding:8px 0 7px;border:none;background:none;border-radius:12px;color:var(--rail-muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;position:relative;line-height:1.15}
.rail-g svg{width:21px;height:21px}
.rail-g:hover{color:var(--rail-text);background:var(--rail-2)}
.rail-g.on{color:#fff;background:var(--rail-2)}
.rail-g.on::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--dom);box-shadow:0 0 10px var(--dom)}
.rail-g .dot{position:absolute;top:3px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--rail)}
.rail-sp{flex:1}
.rail-mini{width:40px;height:40px;border:none;background:none;border-radius:11px;color:var(--rail-muted);display:flex;align-items:center;justify-content:center}
.rail-mini:hover{background:var(--rail-2);color:var(--rail-text)}
.rail-mini svg{width:19px;height:19px}

.panel{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.panel-head{padding:22px 20px 10px}
.panel-head h2{font-size:17px}
.panel-head p{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.nav{padding:4px 10px 12px;display:flex;flex-direction:column;gap:1px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:none;border:none;color:var(--ink-2);font-size:13.5px;text-align:left;width:100%;position:relative;min-height:38px}
.nav-item svg{width:18px;height:18px;flex-shrink:0;color:var(--faint)}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--pri-soft);color:var(--pri-ink);font-weight:600}
.nav-item.active svg{color:var(--pri)}
.nav-item.soon{color:var(--faint)}
.nav-item.soon svg{opacity:.6}
.nav-item .nv-meta{margin-left:auto;font-size:11px;color:var(--faint);font-weight:500;white-space:nowrap}
.nav-item .nv-live{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--dom-ink);background:var(--dom-soft);border-radius:99px;padding:1px 7px}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.nav-sep{height:1px;background:var(--line);margin:8px 10px}
.panel-foot{padding:14px 20px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;line-height:1.45}
.panel-foot a{color:var(--ink-2);text-decoration:none;font-weight:500}
.panel-foot a:hover{color:var(--pri-ink)}
.ver{font-size:11.5px;color:var(--faint)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar-inner{display:flex;align-items:center;gap:8px 10px;padding:12px 32px;flex-wrap:wrap;max-width:1440px}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;width:38px;height:38px;align-items:center;justify-content:center}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-right:6px}
.crumb b{color:var(--ink);font-weight:600}
.crumb i{font-style:normal;color:var(--faint)}
.find{display:flex;align-items:center;gap:9px;flex:1;max-width:420px;min-width:180px;height:38px;padding:0 8px 0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--faint);font-size:13.5px;text-align:left}
.find svg{width:17px;height:17px;flex-shrink:0}
.find span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.find kbd,.kbd{font-family:var(--font);font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.find:hover{border-color:var(--pri);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:13px;color:var(--ink);height:38px;white-space:nowrap}
.chip svg{color:var(--muted)}
.chip b{font-weight:600}
.chip select{border:none;background:transparent;font-size:13px;font-weight:600;color:var(--ink);padding:0;outline:none;max-width:240px}
button.chip:hover{border-color:var(--pri)}
.top-status{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.top-tools{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--pri);color:var(--pri-ink)}
.icon-btn svg{width:18px;height:18px}
.scan-line{max-width:1440px;padding:0 32px;font-size:12px;color:var(--faint);margin-top:-4px}
.container{padding:18px 32px 110px;max-width:1440px;width:100%}

/* ---------------- Thành phần chung ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-primary:hover{background:var(--pri-ink);border-color:var(--pri-ink)}
:root[data-theme="dark"] .btn-primary{color:#07130E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#07130E}}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-pad{padding:20px 22px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3{font-size:15px}
.card-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 20px}
.page-head h1{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.page-head p{color:var(--muted);margin-top:5px;font-size:14px;max-width:72ch}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{padding:0 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:13.5px;height:38px}
textarea.input{height:auto;padding:9px 11px}
.input:focus{outline:2px solid var(--pri);outline-offset:0;border-color:transparent}
.input.bad{border-color:var(--danger);outline-color:var(--danger)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap;line-height:1.5}
.tag-ok{background:var(--pri-soft);color:var(--pri-ink)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-bad{background:var(--danger-soft);color:var(--danger)}
.tag-info{background:var(--info-soft);color:var(--info)}
.tag-mute{background:var(--surface-2);color:var(--muted)}
.tag-dom{background:var(--dom-soft);color:var(--dom-ink)}
.grid{display:grid;gap:16px}
.row2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);font-size:13px;background:var(--info-soft);color:var(--ink)}
.notice.warn{background:var(--warn-soft)}
.notice svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--info)}
.notice.warn svg{color:var(--warn)}

/* ---------------- Bảng điều hành: câu tóm tắt + dải số ---------------- */
.brief{padding:6px 0 26px;max-width:980px}
.brief-date{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.brief-date .lamp{width:9px;height:9px;border-radius:99px;background:var(--dom);box-shadow:0 0 0 4px var(--dom-soft),0 0 14px var(--dom)}
.brief h1{font-size:clamp(22px,2.4vw,31px);font-weight:500;line-height:1.38;letter-spacing:-.015em;margin-top:10px;color:var(--ink-2)}
.brief h1 a,.brief h1 button{font:inherit;font-weight:700;color:var(--ink);background:none;border:none;padding:0;text-decoration:none;border-bottom:2px solid var(--line-2);cursor:pointer}
.brief h1 a:hover,.brief h1 button:hover{border-bottom-color:var(--pri);color:var(--pri-ink)}
.brief h1 .hot{border-bottom-color:var(--dom)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:3px;text-align:left;border:none;border-left:1px solid var(--line);background:none;font:inherit;color:inherit;min-width:0;position:relative}
.kpi:first-child{border-left:none}
button.kpi:hover{background:var(--surface-2)}
.kpi.alert::after{content:"";position:absolute;left:20px;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--dom)}
.kpi-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:500}
.kpi-value{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.kpi-value small{font-size:13.5px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi-sub{font-size:12.5px;color:var(--muted)}
.kpi-sub b{color:var(--ink);font-weight:600}
.kpi-more{font-size:12.5px;color:var(--pri-ink);font-weight:600;margin-top:4px}
.kpi select{font-size:12px;height:26px;padding:0 6px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}

/* Biểu đồ phòng ban */
.dept{display:grid;grid-template-columns:minmax(120px,190px) 1fr 64px;align-items:center;gap:12px;padding:6px 4px;border-radius:7px}
.dept:hover{background:var(--surface-2)}
.dept-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.dept-bar{position:relative;height:10px;background:var(--surface-3);border-radius:99px}
.dept-fill{position:absolute;inset:0;display:flex;gap:2px}
.dept-fill i{display:block;height:100%;background:var(--s1);border-radius:99px}
.dept-fill i.mat{background:repeating-linear-gradient(135deg,var(--s1) 0 3px,transparent 3px 6px);border:1px solid var(--s1)}
.dept-plan{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.dept-num{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.dept-num.over{color:var(--warn);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.mat{background:repeating-linear-gradient(135deg,var(--s1) 0 3px,transparent 3px 6px);border:1px solid var(--s1)}
.sw.plan{width:2px;height:13px;background:var(--ink);border-radius:1px}

/* Biểu đồ quỹ lương */
.pay-chart{position:relative}
.pay-chart svg{width:100%;height:auto;display:block;overflow:visible}
.pay-chart .ax{font-size:11px;fill:var(--faint);font-family:var(--font)}
.pay-chart .lbl{font-size:11px;fill:var(--muted);font-family:var(--font);font-variant-numeric:tabular-nums}
.pay-chart .grid-l{stroke:var(--line);stroke-width:1}
.pay-chart .bar1{fill:var(--s1)} .pay-chart .bar2{fill:var(--s2)}
.pay-chart .hit{fill:transparent}
.pay-chart .hit:hover{fill:color-mix(in srgb,var(--ink) 4%,transparent)}
.pay-chart .sel{fill:color-mix(in srgb,var(--dom) 12%,transparent)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);border-radius:10px;padding:9px 12px;font-size:12.5px;min-width:170px;z-index:5}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:14px}

/* Bảng */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:64vh;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;z-index:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:240px;max-width:420px}
.tbl tr:last-child td{border-bottom:none}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover td{background:var(--surface-2)}

/* ---------------- Trang bắt đầu ---------------- */
.start{max-width:1080px;margin:8px 0 0;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:28px;align-items:center;padding:8px 0 4px;border:none;background:none}
.hero img{width:130px;height:130px;object-fit:contain;justify-self:center;filter:drop-shadow(0 0 28px rgba(242,169,59,.45));order:2}
.hero h1{font-size:clamp(26px,3vw,36px);font-weight:600;letter-spacing:-.025em;line-height:1.22;max-width:22ch}
.hero p{color:var(--muted);margin-top:12px;font-size:15px;max-width:66ch;line-height:1.6}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.choice{padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);transition:border-color .15s}
.choice:hover{border-color:var(--pri)}
.choice .ic{width:38px;height:38px;border-radius:10px;background:var(--pri-soft);color:var(--pri-ink);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.choice .ic svg{width:20px;height:20px}
.choice h3{font-size:15.5px}
.choice p{font-size:13px;color:var(--muted)}
.choice .meta{font-size:12px;color:var(--faint);margin-top:auto;padding-top:6px}
.choice[disabled]{opacity:.55;cursor:not-allowed}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:18px;text-align:center;color:var(--muted);font-size:13.5px;background:transparent}
.drop.drag{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-ink)}
.how{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.how div{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--muted)}
.how b{display:block;font-size:13px;color:var(--ink);margin-bottom:2px}

/* Trang trống */
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty img{width:72px;height:72px;object-fit:contain}
.empty h2{font-size:19px}
.empty p{color:var(--muted);max-width:560px}

/* ---------------- Trang module sắp có ---------------- */
.soon-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start;max-width:1180px}
.soon-main{padding:26px 28px}
.soon-part{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--dom-ink);background:var(--dom-soft);border-radius:99px;padding:4px 12px 4px 8px}
.soon-part i{width:8px;height:8px;border-radius:99px;background:var(--dom);box-shadow:0 0 8px var(--dom)}
.soon-main h2{font-size:22px;margin:14px 0 8px;letter-spacing:-.015em}
.soon-main>p{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:62ch}
.soon-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.soon-list li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;line-height:1.5}
.soon-list li svg{width:18px;height:18px;color:var(--pri);margin-top:2px}
.soon-side{display:flex;flex-direction:column;gap:14px}
.soon-side .card{padding:18px 20px}
.soon-side h3{font-size:14px;margin-bottom:8px}
.soon-side p{font-size:13px;color:var(--muted)}
.link-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.road{display:flex;flex-direction:column;gap:0;margin-top:4px}
.road div{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.road div:first-child{border-top:none}
.road b{color:var(--ink);font-weight:600}
.road .me b,.road .me{color:var(--dom-ink)}

/* ---------------- Hộp thoại, ngăn kéo, tiến trình ---------------- */
.modal-bg{position:fixed;inset:0;background:rgba(14,19,24,.42);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-pop);width:min(1040px,100%);display:flex;flex-direction:column;max-height:88vh;border:1px solid var(--line)}
.modal.sm{width:min(520px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 10px}
.modal-head h2{font-size:18px}
.modal-head p{font-size:13px;color:var(--muted);margin-top:3px}
.modal-body{padding:6px 22px 22px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.x-btn{background:none;border:1px solid var(--line-2);border-radius:8px;height:32px;padding:0 11px;font-weight:600;font-size:12.5px}
.x-btn:hover{border-color:var(--ink-2)}
.busy{position:fixed;inset:0;background:rgba(14,19,24,.35);z-index:150;display:flex;align-items:center;justify-content:center}
.busy-box{background:var(--surface);border-radius:14px;padding:20px 24px;box-shadow:var(--shadow-pop);width:min(440px,90vw)}
.busy-box b{font-size:15px}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
.busy-box small{display:block;margin-top:8px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-wrap{position:fixed;bottom:92px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 32px))}
.toast{padding:12px 15px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-pop);animation:tin .2s ease;line-height:1.4;background:var(--ink);color:var(--paper);border-left:4px solid var(--pri)}
.toast small{display:block;font-weight:400;opacity:.85;margin-top:3px;font-size:12.5px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.toast-err{border-left-color:var(--danger)} .toast-info{border-left-color:var(--dom)}

/* Ô tìm nhanh (Ctrl K) */
.cmd-bg{position:fixed;inset:0;background:rgba(14,19,24,.42);z-index:160;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;backdrop-filter:blur(2px)}
.cmd{width:min(620px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-pop);border:1px solid var(--line);overflow:hidden;animation:cmdin .14s ease}
@keyframes cmdin{from{opacity:0;transform:translateY(-6px) scale(.99)}to{opacity:1}}
.cmd-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.cmd-in img{width:26px;height:26px;object-fit:contain}
.cmd-in input{flex:1;border:none;outline:none;background:none;font-size:16px;height:56px;color:var(--ink)}
.cmd-list{max-height:min(420px,55vh);overflow-y:auto;padding:8px}
.cmd-g{font-size:11.5px;font-weight:600;color:var(--faint);padding:10px 10px 4px}
.cmd-it{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:none;background:none;border-radius:9px;text-align:left;font-size:14px;color:var(--ink)}
.cmd-it svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.cmd-it small{color:var(--faint);font-size:12px;margin-left:auto;white-space:nowrap}
.cmd-it .av{width:26px;height:26px;border-radius:99px;background:var(--pri-soft);color:var(--pri-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmd-it.on{background:var(--pri-soft)}
.cmd-it.on svg{color:var(--pri)}
.cmd-empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
.cmd-foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);background:var(--surface-2)}

/* Ô ngày */
.datebox{display:inline-flex;align-items:center;gap:6px;position:relative}
.dmask{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--faint);white-space:pre;display:none;font-variant-numeric:tabular-nums}.dmask i{font-style:normal;visibility:hidden}
.datebox:focus-within .dmask{display:block}.datebox:focus-within .input::placeholder{color:transparent}
.datebox .input{width:128px;font-variant-numeric:tabular-nums}

/* Cài đặt */
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.unit-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.unit-row:last-child{border-bottom:none}
.unit-row .grow{flex:1;min-width:220px}
.unit-row .input{width:100%}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.set-grid>*{min-width:0}
.kv-set select.input{max-width:100%}
.log{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);border-radius:var(--r);padding:10px 12px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.radio{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.radio input{accent-color:var(--pri);width:16px;height:16px}

/* ---------------- Trang dữ liệu ---------------- */
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:14px}
.filters.card{padding:14px 16px}
.seg{display:inline-flex;border-radius:10px;background:var(--surface-2);padding:3px;gap:2px}
.seg button{border:none;background:none;padding:0 12px;height:32px;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(22,33,43,.12)}
.tb-foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:12.5px;flex-wrap:wrap}
.tb-foot .muted{margin-right:auto}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.plink{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line-2)}
.plink:hover{color:var(--pri-ink);border-bottom-color:var(--pri)}
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:0;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mini-kpis div{padding:12px 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);margin-left:-1px}
.mini-kpis span{font-size:12px;color:var(--muted)}
.mini-kpis b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.mini-kpis.big b{font-size:17px}
.filters select.input{max-width:100%}
.lv-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lvc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:0 14px 0 6px;height:36px;font-size:13px;font-weight:600;color:var(--muted)}
.lvc b{display:inline-flex;min-width:26px;height:24px;padding:0 7px;align-items:center;justify-content:center;border-radius:99px;background:var(--surface-2);color:var(--ink);font-size:12.5px}
.lvc-gap b{background:var(--danger-soft);color:var(--danger)} .lvc-canh b{background:var(--warn-soft);color:var(--warn)} .lvc-nhac b{background:var(--info-soft);color:var(--info)}
.lvc.on{border-color:var(--ink);color:var(--ink)}
.al-list{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.card .al-list{border:none;border-radius:0;background:none}
.al{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);background:none}
.al:first-child{border-top:none}
.al::before{content:"";width:8px;height:8px;border-radius:99px;margin-top:7px;background:var(--info)}
.al-gap::before{background:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)} .al-canh::before{background:var(--warn)}
.al.done{opacity:.55}
.al-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.al-kind{font-weight:600;color:var(--ink-2)}
.al-title{font-weight:600;font-size:14px;margin-top:3px}
.al-detail{font-size:13px;color:var(--muted);margin-top:3px}
.al-src{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.al-src .src{font-size:11.5px;background:var(--surface-2);border-radius:6px;padding:1px 7px;color:var(--muted)}
.al-src .law{font-size:11.5px;color:var(--info);font-weight:600}
.al-done{font-size:12.5px;color:var(--pri-ink);margin-top:5px}
.al-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px;text-align:right;min-width:110px}
.code{display:inline-block;min-width:22px;padding:1px 4px;border-radius:5px;font-size:11.5px;font-weight:700;text-align:center;background:var(--surface-2);color:var(--muted)}
.code.c-x{background:var(--pri-soft);color:var(--pri-ink)} .code.c-p{background:var(--info-soft);color:var(--info)} .code.c-l{background:#EEEBFB;color:#5643B0}
.code.c-o,.code.c-ts{background:var(--warn-soft);color:var(--warn)} .code.c-kl,.code.c-kp{background:var(--danger-soft);color:var(--danger)}
.grid-tbl td.gc,.grid-tbl th{padding:6px 3px;text-align:center}
.grid-tbl td.sun,.grid-tbl th .sun{background:color-mix(in srgb,var(--surface-3) 60%,transparent)}
.grid-tbl td:nth-child(-n+3),.grid-tbl th:nth-child(-n+3){text-align:left;padding:6px 10px}

.drawer-bg{position:fixed;inset:0;background:rgba(14,19,24,.38);z-index:90;display:flex;justify-content:flex-end}
.drawer{width:min(980px,100%);height:100%;background:var(--paper);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;animation:dr .18s ease}
@keyframes dr{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dr-head{display:flex;gap:14px;align-items:center;padding:22px 26px 14px;background:var(--surface)}
.dr-head h2{font-size:21px;letter-spacing:-.015em}
.dr-head .x-btn{margin-left:auto}
.avatar{width:52px;height:52px;border-radius:99px;background:var(--pri-soft);color:var(--pri-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.dr-tabs{display:flex;gap:4px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.dr-tabs button{border:none;background:none;padding:11px 10px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.dr-tabs button.on{color:var(--ink);border-bottom-color:var(--dom)}
.dr-body{padding:20px 26px 40px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.dr-body .tbl td{white-space:normal}
.dr-sec h4{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 8px;display:flex;align-items:center}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(120px,170px) minmax(0,1fr));gap:8px 14px;font-size:13px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kv2 dt{color:var(--muted)} .kv2 dd{margin:0;word-break:break-word}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line-2);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative;padding-left:12px;display:flex;flex-direction:column;gap:1px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:99px;background:var(--info);border:2px solid var(--paper)}
.timeline .tl-ok::before{background:var(--pri)} .timeline .tl-bad::before{background:var(--danger)} .timeline .tl-mute::before{background:var(--faint)}
.timeline .tl-future{opacity:.65}
.tl-d{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.imp-box{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.imp-file{display:flex;align-items:center;gap:8px}
.imp-item h4{font-size:14px;margin-bottom:6px}
.chk{font-size:13px;padding:3px 0}
.chk.ok{color:var(--pri-ink)} .chk.bad{color:var(--danger);font-weight:600} .chk.warn{color:var(--warn)}
.imp-act{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:13px}
.imp-act span{margin-right:auto}
.kv-set{grid-template-columns:minmax(150px,220px) 1fr;align-items:center}
.kv-set .input.rnum{width:96px}
.kv-set .input.rtxt{width:100%}
.kind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px 16px}
.xcard{display:flex;flex-direction:column;gap:8px}
.xcard .btn{align-self:flex-start;margin-top:auto}
.guide-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.guide-steps>li{display:flex;gap:12px}
.guide-steps .gn{width:28px;height:28px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:13px}
.guide-steps h4{font-size:15px;margin-bottom:4px}
.guide-steps ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.video-wrap{position:relative;padding-top:56.25%}.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
.fb-form{display:flex;flex-direction:column;gap:12px}
.fb-form textarea{resize:vertical;min-height:110px}
.dom-fab{position:fixed;right:20px;bottom:20px;z-index:80;width:56px;height:56px;border-radius:99px;background:#FBF3E4;border:1px solid var(--line-2);box-shadow:var(--shadow-pop);display:flex;align-items:center;justify-content:center;padding:0}
.dom-fab img{width:42px;height:42px;object-fit:contain}
.dom-fab .fab-bubble{position:absolute;right:64px;white-space:nowrap;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:9px;opacity:0;transform:translateX(6px);transition:.15s;pointer-events:none}
.dom-fab:hover .fab-bubble,.dom-fab:focus-visible .fab-bubble{opacity:1;transform:none}
.dom-fab .fab-img{display:contents}

/* Thanh dưới cho điện thoại */
.mbar{display:none}

/* ---------------- Màn hình nhỏ ---------------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:none}.kpi:nth-child(n+3){border-top:1px solid var(--line)}.row2{grid-template-columns:1fr}.set-grid{grid-template-columns:1fr}.soon-wrap{grid-template-columns:1fr}}
@media (max-width:980px){
  .shell{grid-template-columns:72px minmax(0,1fr)}
  .panel{position:fixed;left:72px;top:0;bottom:0;width:260px;z-index:120;transform:translateX(calc(-100% - 72px));transition:transform .2s;box-shadow:var(--shadow-pop)}
  body.nav-open .panel{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(14,19,24,.35);z-index:110}
  .menu-btn{display:inline-flex}
  .crumb{display:none}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .panel{left:0;width:min(300px,86vw);transform:translateX(-100%)}
  .topbar-inner,.container,.scan-line{padding-left:16px;padding-right:16px}
  .topbar-inner{padding-top:10px;padding-bottom:10px}
  .find{flex:1 1 0;max-width:none;min-width:0}
  .find kbd{display:none}
  .top-status{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .top-status::-webkit-scrollbar{display:none}
  #unitChip .muted{display:none}
  .chip select{max-width:170px}
  .scan-line{margin-top:2px}
  .top-tools .lbl{display:none}
  .choices{grid-template-columns:1fr}
  .how{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}.hero img{order:0;width:90px;height:90px;justify-self:start}
  .filters .field{flex:1 1 100%;min-width:0!important}.filters select.input{min-width:0!important;width:100%}
  .kv2{grid-template-columns:110px 1fr}.al{grid-template-columns:auto 1fr}.al-side{grid-column:2;align-items:flex-start;text-align:left}
  .kpis{grid-template-columns:1fr}.kpi{border-left:none;border-top:1px solid var(--line)}.kpi:first-child{border-top:none}
  .dept{grid-template-columns:100px 1fr 54px}.kv{grid-template-columns:1fr}
  .page-head h1{font-size:23px}
  .container{padding-bottom:120px}
  .mbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;position:relative}

.pal-sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);position:relative}
.pal-opt.on .pal-sw::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--dom)}

.bc-tag{color:var(--pri-ink);font-weight:600}
.bc-d{min-width:34px;padding:4px 0!important}.bc-d b{display:block;font-size:12px}.bc-d small{display:block;font-size:10px;color:var(--faint);font-weight:500}
.bc-d.k-rest,.bc-c.k-rest{background:var(--surface-2)!important}.bc-d.k-hol{background:#EEEBFB!important;color:#5643B0}.bc-c.k-hol{background:color-mix(in srgb,#EEEBFB 60%,var(--surface))!important}
:root[data-theme="dark"] .bc-d.k-hol{background:#2A2450!important;color:#C9C0FF}:root[data-theme="dark"] .bc-c.k-hol{background:#1E1A38!important}
.bc-c button{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:34px;height:36px;border:0;background:none;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink-2);cursor:pointer;position:relative;padding:0}
.bc-c button:hover{outline:2px solid var(--pri);outline-offset:-2px}
.bc-c button i{font-style:normal;font-size:9.5px;font-weight:600;color:var(--warn);line-height:1}
.bc-c.t-work button{color:var(--pri-ink)}.bc-c.t-paid button{color:var(--info)}.bc-c.t-hol button{color:#5643B0}.bc-c.t-bh button{color:#B5651D}.bc-c.t-unpaid button{color:var(--danger)}
.bc-c.iss button{background:var(--danger-soft);color:var(--danger)}
.bc-c.wait button{box-shadow:inset 0 0 0 2px var(--warn)}
.bc-c.man button::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--pri) transparent transparent}
.bc-c.aft button::before{content:"";position:absolute;left:2px;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.bc-c.out{background:repeating-linear-gradient(135deg,var(--surface) 0 4px,var(--surface-2) 4px 8px)!important}
.bc-t{min-width:64px;padding:4px 8px!important;font-size:12.5px;text-align:right!important;white-space:nowrap}.bc-t small{color:var(--faint);font-size:11px}.bc-t small.w{display:block;color:var(--warn);font-weight:600}
thead .bc-t{text-align:center!important;font-size:11.5px;line-height:1.25}
.bc-kv dd{margin-bottom:4px}
.bc-okbox{align-items:center;margin:10px 0}.bc-okbox>div{flex:1}
.bc-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.bc-form h4{margin:0 0 10px;font-size:14.5px}
.bc-fg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}.bc-fg2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.bc-hint{font-size:12.5px;margin:4px 0 10px}
.bc-otbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.bc-chk{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}.bc-chk li{padding:8px 12px;border-radius:10px;font-size:13.5px;background:var(--surface-2)}
.bc-chk li.bad{background:var(--danger-soft)}.bc-chk li.warn{background:var(--warn-soft)}.bc-chk li.ok{background:var(--pri-soft)}
@media (max-width:760px){.bc-fg{grid-template-columns:1fr 1fr}.bc-fg2{grid-template-columns:1fr}table.bc .bc-nm{min-width:120px;max-width:130px}}
/* 0.3.1 bước 2 – góp ý 15:15: cột ngày tính đến, người thực hiện, chế độ tăng ca */
table.bc th.today{background:var(--dom,#F2A93B)!important;color:#3A2600;box-shadow:inset 3px 0 0 #C9861C,inset -3px 0 0 #C9861C,inset 0 3px 0 #C9861C}
table.bc th.today small{color:#5A3D00}table.bc th.today em{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
table.bc td.today{box-shadow:inset 3px 0 0 var(--dom,#F2A93B),inset -3px 0 0 var(--dom,#F2A93B)}table.bc tbody tr:last-child td.today{box-shadow:inset 3px 0 0 var(--dom,#F2A93B),inset -3px 0 0 var(--dom,#F2A93B),inset 0 -3px 0 var(--dom,#F2A93B)}
table.bc td.today button{background:color-mix(in srgb,var(--dom,#F2A93B) 12%,transparent)}
.bc-who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin:6px 0 0}.bc-who svg{color:var(--pri)}
.bc-otm{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;margin:0 6px 0 2px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-decoration:none}.bc-otm.cf{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
/* 0.3.1 – bước 3: Nghỉ phép */
.np-soon{margin:0 0 14px}.np-sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.np-si{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:10px;background:var(--info-soft);font-size:13px}.np-si span{color:var(--ink-2);font-size:12.5px}
.np-si.wait{background:var(--warn-soft)}.np-si em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--warn)}
.np-btns{display:inline-flex;gap:6px}.np-base{height:30px;width:64px;padding:0 6px}.np-low{color:var(--warn)}
.tl-tabs+.filters{margin-top:0}
/* 0.3.1 – bước 4: Chấm công Wi‑Fi */
.wf-demo{margin:0 0 14px;background:linear-gradient(120deg,var(--pri-soft),var(--surface))}.wf-demo-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}.wf-demo-h svg{color:var(--pri);flex:none;margin-top:2px}.wf-demo h3{margin:0 0 4px}.wf-demo p{margin:0;color:var(--ink-2);font-size:13.5px}
.wf-card{margin:0 0 14px}.wf-card.on{border-color:color-mix(in srgb,var(--pri) 35%,var(--line))}
.wf-f{grid-template-columns:2fr 1fr;gap:10px}
.wf-k{grid-template-columns:repeat(4,minmax(0,1fr));margin:12px 0}
.wf-cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:14px}.wf-cols h4{margin:0 0 8px;font-size:14px}
.wf-t{font-size:12.5px}.wf-t td,.wf-t th{padding:6px 8px}
.wf-log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px;max-height:220px;overflow:auto}.wf-log li{padding:5px 8px;border-radius:8px;background:var(--surface-2)}.wf-log li.bad{background:var(--danger-soft)}
.wf-guide h3{margin:0 0 10px}.wf-guide .guide-steps p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
@media (max-width:760px){.wf-f,.wf-cols{grid-template-columns:1fr}.wf-k{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script src="/qtt-track.js" defer></script>
</head>

      <span class="sb-note">Dữ liệu xử lý ngay trên máy anh/chị, không gửi đi đâu.</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="topbar-inner">
      <button class="menu-btn" id="menuBtn" aria-label="Mở danh sách chức năng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>

      <button class="find" data-act="cmd" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>Tìm nhân viên, chức năng…</span><kbd>Ctrl K</kbd></button>
      <div class="top-status">
        <label class="chip" id="unitChip" hidden><span class="muted">Đơn vị</span><select id="unitSel" aria-label="Chọn đơn vị"></select></label><button class="chip" id="pickBtn" type="button" hidden title="Chọn các công ty gộp dữ liệu"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m8 12 3 3 5-6"/></svg><span><b id="pickN">2/2</b> công ty</span></button>
        <button class="chip" id="refChip" type="button" title="Đổi ngày tham chiếu"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Tính đến <b id="refTxt"></b></span></button>
        <span class="top-tools">
          <button class="icon-btn" id="rescanBtn" hidden title="Quét lại thư mục"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
          <button class="icon-btn" data-act="palette" title="Đổi màu giao diện" aria-label="Đổi màu giao diện"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-4-4-7.2-9-7.2Z"/><circle cx="7.5" cy="11.5" r="1.1"/><circle cx="10.5" cy="7.5" r="1.1"/><circle cx="15" cy="7.8" r="1.1"/></svg></button>
          <button class="icon-btn" data-act="guide" title="Hướng dẫn sử dụng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.01"/></svg></button>
          <button class="icon-btn" data-act="video" title="Video demo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg></button>
        </span>
      </div>
    </div><div class="scan-line" id="scanTxt"></div></header>
    <main class="container" id="page"></main>
  </div>
</div>
<nav class="mbar" id="mbar" aria-label="Nhóm chức năng"></nav>
