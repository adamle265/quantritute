<!doctype html>
<html lang="vi" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:"BVP";font-weight:400;src:url(assets/fonts/be-vietnam-pro-vietnamese-400-normal.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"BVP";font-weight:400;src:url(assets/fonts/be-vietnam-pro-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"BVP";font-weight:700;src:url(assets/fonts/be-vietnam-pro-vietnamese-700-normal.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"BVP";font-weight:700;src:url(assets/fonts/be-vietnam-pro-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"BVP";font-weight:800;src:url(assets/fonts/be-vietnam-pro-vietnamese-800-normal.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"BVP";font-weight:800;src:url(assets/fonts/be-vietnam-pro-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"LoraI";font-style:italic;src:url(assets/fonts/lora-vietnamese-500-italic.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:"LoraI";font-style:italic;src:url(assets/fonts/lora-latin-500-italic.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#120d09}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"BVP",sans-serif;color:#f7efe3}
.layer{position:absolute;inset:0}
.glowbg{background:radial-gradient(ellipse 70% 45% at 50% -4%,rgba(255,198,120,.55) 0%,rgba(240,160,80,.18) 45%,rgba(0,0,0,0) 75%)}
.vign{background:radial-gradient(ellipse 120% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.lamp-cord{position:absolute;left:538px;top:0;width:4px;height:34px;background:#3a2c1e}
.lamp{position:absolute;left:470px;top:30px;width:140px;height:46px;border-radius:70px 70px 10px 10px;background:linear-gradient(#4a3826,#2a1f15)}
.lamp-light{position:absolute;left:490px;top:70px;width:100px;height:14px;border-radius:10px;background:rgba(255,224,170,.95);box-shadow:0 0 6px rgba(255,224,170,.9)}
.dust{position:absolute;border-radius:10px;background:rgba(255,210,150,.3);box-shadow:0 0 4px rgba(255,210,150,.4)}
.header{position:absolute;top:120px;left:70px;right:70px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.header img{width:330px}
.pill{font-weight:700;font-size:30px;color:#2a1d10;background:#f2b866;padding:10px 24px;border-radius:40px;box-shadow:0 6px 24px rgba(242,184,102,.35)}
.scene{position:absolute;inset:0}
.title{position:absolute;left:60px;right:60px;text-align:center;font-weight:800;font-size:50px;line-height:1.2;color:#fbeedb;text-shadow:0 4px 30px rgba(0,0,0,.6)}

.scroll{position:absolute;left:0;top:0;width:800px}
.scroll img{width:800px;display:block}
.scroll img.sw{position:absolute;left:0;top:0;opacity:0}
.hl{position:absolute;border:5px solid #d9923c;border-radius:18px;box-shadow:0 0 0 6px rgba(242,184,102,.35);opacity:0}
.dom{position:absolute;z-index:3}
.dom .glow{position:absolute;inset:30%;border-radius:50%;background:rgba(255,190,110,.25);box-shadow:0 0 70px 50px rgba(255,190,110,.3)}
.dom img{position:absolute;inset:0;width:100%;height:100%}
.hook{position:absolute;left:60px;right:60px;top:520px;text-align:center}
.hook-t{font-weight:800;font-size:92px;line-height:1.12;letter-spacing:-1.5px;color:#fbeedb;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.hook-t span{color:#f2b866}
.hook-s{margin-top:40px;font-family:"LoraI",serif;font-style:italic;font-size:46px;color:#c9b79f;line-height:1.35}
.ket{position:absolute;left:60px;right:60px;top:380px;text-align:center}
.ket .mark{width:300px;border-radius:40px;filter:drop-shadow(0 0 60px rgba(255,190,110,.5))}
.ket-t{margin-top:40px;font-weight:800;font-size:64px;color:#fbeedb}
.ket-s{margin-top:20px;font-family:"LoraI",serif;font-style:italic;font-size:44px;color:#f2b866}
.sub{position:absolute;left:290px;right:130px;top:1450px;display:flex;justify-content:center;z-index:6}
.sub.wide{left:70px;top:1520px}
.sub span{font-weight:700;font-size:48px;line-height:1.3;color:#fff;text-align:center;background:rgba(18,13,9,.72);padding:16px 30px;border-radius:24px;border:1px solid rgba(242,184,102,.25)}

#shake{position:absolute;inset:0}
.paper{position:absolute;left:170px;top:560px;width:740px;height:560px;background:#f6efe2;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:50px 60px;color:#2a2018}
.p-org{font-weight:700;font-size:28px;letter-spacing:2px;text-align:center}
.p-no{margin-top:22px;font-weight:800;font-size:36px;text-align:center;white-space:nowrap}
.p-tt{margin-top:10px;font-size:30px;text-align:center;font-style:italic;margin-bottom:30px}
.paper i{display:block;height:14px;background:#d9cfbf;border-radius:7px;margin:18px 0}
.stamp{position:absolute;left:40px;top:250px;padding:14px 34px;border:10px solid #d2232a;border-radius:18px;color:#d2232a;font-weight:800;font-size:70px;letter-spacing:1px;white-space:nowrap;background:rgba(246,239,226,.4);opacity:0;box-shadow:0 0 0 4px rgba(210,35,42,.25) inset}
.hook{position:absolute;left:40px;right:40px;top:300px;text-align:center;font-weight:800;font-size:84px;line-height:1.1;color:#fbeedb;text-shadow:0 6px 40px rgba(0,0,0,.7)}
.hook span{display:inline-block}
#h1{color:#f2b866}
.q2{position:absolute;left:60px;right:60px;top:430px;text-align:center;font-weight:800;font-size:96px;line-height:1.12;color:#fbeedb;text-shadow:0 6px 40px rgba(0,0,0,.7)}
b.k{color:#f2b866;font-weight:800}
.title{top:255px !important;font-size:48px !important}
.card{position:absolute;{{CARD}};border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 10px rgba(255,214,160,.14),0 0 90px rgba(255,190,110,.2)}
.zoom{position:absolute;inset:0}
.zoom video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sub{top:1475px !important;left:300px !important;right:120px !important}
.sub span{font-size:50px !important}
.sub.wide{left:70px !important;top:1520px !important}
.ket .mark{display:block;margin:0 auto}
.free{display:inline-block;margin-top:40px;font-weight:800;font-size:72px;color:#2a1d10;background:#f2b866;padding:10px 46px;border-radius:60px;box-shadow:0 10px 40px rgba(242,184,102,.45)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
 <div id="shake">
  <div class="layer" style="background:#120d09"></div>
  <div class="layer glowbg lamp-on"></div>
  <div class="layer vign"></div>
  {{DUST}}
  <div class="lamp-cord"></div><div class="lamp"></div><div class="lamp-light lamp-on"></div>
  <div class="header"><img src="assets/brand/logo-ngang-nen-toi-2000.png"><div class="pill">{{LABEL}}</div></div>
{{BODY}}
 </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
{{JS}}
tl.set({}, {}, {{TOTAL}});
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
