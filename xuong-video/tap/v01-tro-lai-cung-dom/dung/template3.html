*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#120d09}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"BVP",sans-serif;color:#f7efe3;background:#120d09}
.scene{position:absolute;inset:0;overflow:hidden}
.desk{position:absolute;left:50%;top:0;height:1920px;width:auto;transform-origin:50% 40%;margin-left:-1720px}
.ilogo{position:absolute;left:0;right:0;top:330px;text-align:center}
.ilogo img{width:560px}
.zw{position:absolute;inset:0}
#dOn{opacity:0}
video.full{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.lt{position:absolute;left:60px;top:1110px;padding:18px 30px 18px 26px;border-left:8px solid #f2b866;background:rgba(18,13,9,.78);border-radius:0 18px 18px 0}
.lt-n{font-weight:800;font-size:46px;letter-spacing:2px;color:#fbeedb}
.lt-s{font-family:"LoraI",serif;font-style:italic;font-size:34px;color:#f2b866;margin-top:2px}
.sub{position:absolute;left:70px;right:130px;top:1330px;display:flex;justify-content:center;z-index:20}
.sub span{font-weight:700;font-size:50px;line-height:1.3;color:#fff;text-align:center;background:rgba(18,13,9,.74);padding:14px 30px;border-radius:22px;border:1px solid rgba(242,184,102,.25)}
.dsub{top:1430px;left:330px;right:110px}
.psub{top:1330px}
.sub.big span{font-size:58px}
.orb{position:absolute;left:820px;top:300px;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#ffe2a8;box-shadow:0 0 60px 30px rgba(255,200,120,.8),0 0 160px 80px rgba(255,180,90,.45);z-index:30}
.flash{position:absolute;inset:0;background:#fff3dc;z-index:31}
.scene{transform-origin:50% 50%}
#p1 ~ .dsub{}
b.k{color:#f2b866;font-weight:800}
.dom{position:absolute;z-index:10}
.dom .glow{position:absolute;inset:32%;border-radius:50%;background:rgba(255,190,110,.25);box-shadow:0 0 80px 50px rgba(255,190,110,.32)}
.dom img{position:absolute;inset:0;width:100%;height:100%}
.dom.big{left:690px;top:230px;width:360px;height:360px}
.dom.small{left:30px;top:1360px;width:290px;height:290px}
.dom.out{left:640px;top:1180px;width:360px;height:360px}
.tag{position:absolute;left:470px;top:560px;white-space:nowrap;font-weight:700;font-size:34px;color:#2a1d10;background:#f2b866;padding:10px 26px;border-radius:40px;box-shadow:0 8px 30px rgba(242,184,102,.35)}
.glowbg{position:absolute;inset:0;background:radial-gradient(ellipse 75% 40% at 50% -5%,rgba(255,198,120,.5) 0%,rgba(240,160,80,.15) 45%,rgba(0,0,0,0) 75%)}
.hlogo{position:absolute;left:50%;top:120px;width:360px;margin-left:-180px}
.title{position:absolute;left:50px;right:50px;top:265px;text-align:center;font-weight:800;font-size:56px;color:#fbeedb;white-space:nowrap}
.card{position:absolute;left:40px;top:150px;width:1000px;height:1180px;border-radius:28px;overflow:hidden;background:#efe9df;box-shadow:0 40px 110px rgba(0,0,0,.6),0 0 0 8px rgba(255,214,160,.14)}
.bar{position:absolute;left:0;right:0;top:0;height:46px;background:#2a221b;display:flex;align-items:center;padding-left:22px;gap:10px;z-index:2}
.bar i{width:14px;height:14px;border-radius:50%;background:#6b5a48}
.bar span{margin-left:24px;font-size:22px;color:#cbb89f;background:#3a3027;padding:4px 22px;border-radius:12px}
.zw2{position:absolute;left:0;right:0;top:46px;bottom:0;overflow:hidden}
.sv{position:absolute;inset:0}
.zw2 video{position:absolute;left:0;top:0;width:1000px;height:1134px}
.ket{position:absolute;left:0;right:0;top:640px;text-align:center}
.ket .mark{width:260px;display:block;margin:0 auto}
.ket .name{width:820px;display:block;margin:0 auto}
.tagl{margin-top:34px;font-family:"LoraI",serif;font-style:italic;font-size:46px;color:#f2b866}

</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
{{BODY}}
</div>
<script>
const tl = gsap.timeline({ paused: true });
{{JS}}
tl.set({}, {}, {{TOTAL}});
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
